<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes toastIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }

.cb-page {
  display: flex; flex-direction: column;
  height: calc(100vh - 64px - 30px);
  font-family: 'Inter', system-ui, sans-serif; color: #0f172a;
  overflow: hidden;
}

  /* ── FIXED HEADER ── */
  .cb-header {
    flex-shrink: 0;
    position: sticky; top: -15px; z-index: 100;
    background: #fff; margin: -15px -15px 0 -15px;
    padding: 14px 15px 12px; border-bottom: 1px solid #e2e8f0;
    box-shadow: 0 1px 6px rgba(0,0,0,.06);
  }
  @media (max-width: 480px) {
    .cb-header { margin: -10px -10px 0 -10px; padding: 12px 10px 10px; }
  }

  /* ── TABS ── */
  .cb-tabs { display: flex; gap: 4px; margin-bottom: 12px; }
  .cb-tab {
    padding: 6px 16px; border-radius: 8px; font-size: 12.5px; font-weight: 600;
    font-family: inherit; cursor: pointer; border: 1.5px solid #e2e8f0;
    background: #fff; color: #64748b; transition: all .15s;
  }
  .cb-tab:hover { border-color: #94a3b8; color: #334155; }
  .cb-tab.active-to-buy { background: #0f172a; color: #fff; border-color: #0f172a; }
  .cb-tab.active-purchased { background: #15803d; color: #fff; border-color: #15803d; }

  /* ── TOOLBAR ── */
  .cb-toolbar-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .cb-chip {
    display: flex; align-items: center; gap: 5px; padding: 4px 10px;
    border-radius: 100px; background: #f8fafc; border: 1px solid #e2e8f0;
    color: #64748b; font-size: 11.5px; font-weight: 600; white-space: nowrap; flex-shrink: 0;
  }

  /* ── TYPE DROPDOWN ── */
  .cb-type-wrap { position: relative; flex-shrink: 0; }
  .cb-type-btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 11px; border-radius: 8px; font-size: 12px; font-weight: 600;
    font-family: inherit; cursor: pointer; border: 1.5px solid #e2e8f0;
    background: #fff; color: #0f172a; transition: all .15s; white-space: nowrap;
  }
  .cb-type-btn:hover { border-color: #94a3b8; }
  .cb-type-btn svg { width: 12px; height: 12px; flex-shrink: 0; }
  .cb-type-menu {
    position: absolute; top: calc(100% + 5px); left: 0; z-index: 300;
    background: #fff; border: 1.5px solid #e2e8f0; border-radius: 10px;
    box-shadow: 0 8px 24px rgba(0,0,0,.1); padding: 5px; min-width: 170px;
    opacity: 0; pointer-events: none; transform: translateY(-4px);
    transition: opacity .15s, transform .15s;
  }
  .cb-type-menu.open { opacity: 1; pointer-events: all; transform: translateY(0); }
  .cb-type-opt {
    display: flex; align-items: center; gap: 8px; padding: 8px 10px;
    border-radius: 7px; font-size: 12.5px; font-weight: 600; cursor: pointer;
    color: #0f172a; transition: background .12s;
  }
  .cb-type-opt:hover { background: #f1f5f9; }
  .cb-type-opt.selected { background: #f1f5f9; }
  .cb-type-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

  .cb-search-wrap { position: relative; flex: 1; min-width: 160px; }
  .cb-search-wrap svg {
    position: absolute; left: 9px; top: 50%; transform: translateY(-50%);
    color: #94a3b8; width: 13px; height: 13px; pointer-events: none;
  }
  .cb-search {
    width: 100%; padding: 6px 9px 6px 30px; border: 1.5px solid #e2e8f0;
    border-radius: 8px; font-size: 12px; font-family: inherit;
    background: #fff; color: #0f172a; outline: none; transition: border-color .15s;
  }
  .cb-search:focus { border-color: #2563eb; }
  .cb-supplier-select {
    padding: 6px 9px; border: 1.5px solid #e2e8f0; border-radius: 8px;
    font-size: 12px; font-family: inherit; background: #fff;
    color: #0f172a; outline: none; cursor: pointer; max-width: 200px;
  }
  .cb-moq-bar {
    display: none; padding: 8px 12px; background: #f8fafc;
    border: 1px solid #e2e8f0; border-radius: 8px; margin-top: 8px;
  }

  /* ── BODY (fills remaining height) ── */
  .cb-body {
    flex: 1; min-height: 0; overflow: hidden;
    padding: padding: 5px 10px 15px 10px; display: flex; flex-direction: column;
  }

 
  /* ── KANBAN LAYOUT (fixed height, cols scroll independently) ── */
  .cb-kanban {
    display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
    flex: 1; min-height: 0; overflow: hidden;
  }
  @media (max-width: 600px) {
    .cb-kanban { grid-template-columns: 1fr; overflow-y: auto; }
  }
  .cb-kanban-col {
    display: flex; flex-direction: column; min-height: 0; overflow: hidden;
    border-radius: 12px; border: 1px solid #e2e8f0; background: #fff;
  }
  .cb-kanban-header {
    padding: 9px 12px; font-size: 11px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .6px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid #e2e8f0;
  }
  .cb-kanban-header.nl { background: #eff6ff; color: #1d4ed8; }
  .cb-kanban-header.repl { background: #f5f3ff; color: #7c3aed; }
  .cb-kanban-body {
    flex: 1; min-height: 0; overflow-y: auto;
    padding: 8px; display: flex; flex-direction: column; gap: 6px;
    background: #fafafa;
  }
  .cb-kanban-body::-webkit-scrollbar { width: 4px; }
  .cb-kanban-body::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 4px; }

  /* ── KANBAN CARD (clickable, compact, no actions) ── */
  .cb-card {
    background: #fff; border: 1px solid #e2e8f0; border-radius: 10px;
    padding: 11px 13px; cursor: pointer; transition: box-shadow .12s, border-color .12s;
    user-select: none;
  }
  .cb-card:hover { box-shadow: 0 3px 10px rgba(0,0,0,.08); border-color: #bfdbfe; }
  .cb-card-name {
    font-size: 12.5px; font-weight: 600; color: #0f172a;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 5px;
  }
  .cb-card-meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .cb-card-tag {
    font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 4px;
    white-space: nowrap;
  }
  .cb-card-tag.nl   { background: #eff6ff; color: #1d4ed8; border: 1px solid #bfdbfe; }
  .cb-card-tag.repl { background: #f5f3ff; color: #7c3aed; border: 1px solid #c4b5fd; }
  .cb-card-tag.purchased { background: #dcfce7; color: #15803d; border: 1px solid #bbf7d0; }
  .cb-card-sup {
    font-size: 11px; color: #64748b; background: #f1f5f9;
    border: 1px solid #e2e8f0; border-radius: 4px; padding: 1px 6px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 120px;
  }
  .cb-card-val { font-size: 11px; font-weight: 700; color: #15803d; margin-left: auto; flex-shrink: 0; }

  /* ── LIST VIEW (paginated) ── */
  .cb-list-body { flex: 1; min-height: 0; overflow-y: auto; }
  .cb-list-body::-webkit-scrollbar { width: 4px; }
  .cb-list-body::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 4px; }
  .cb-list-card {
    background: #fff; border: 1px solid #e2e8f0; border-radius: 10px;
    padding: 12px 14px; margin-bottom: 6px; cursor: pointer;
    transition: box-shadow .12s, border-color .12s;
  }
  .cb-list-card:hover { box-shadow: 0 3px 10px rgba(0,0,0,.08); border-color: #bfdbfe; }
  .cb-list-card-name {
    font-size: 13px; font-weight: 600; color: #0f172a;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 5px;
  }
  .cb-list-card-meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }

  /* ── PAGINATION ── */
  .cb-pagination {
    display: flex; align-items: center; justify-content: center;
    gap: 6px; padding: 10px 0 4px; flex-shrink: 0;
  }
  .cb-page-btn {
    padding: 5px 12px; border-radius: 7px; border: 1.5px solid #e2e8f0;
    background: #fff; color: #64748b; font-size: 12px; font-weight: 600;
    font-family: inherit; cursor: pointer; transition: all .15s;
  }
  .cb-page-btn:hover:not(:disabled) { border-color: #94a3b8; color: #334155; }
  .cb-page-btn:disabled { opacity: .4; cursor: not-allowed; }
  .cb-page-btn.active { background: #0f172a; color: #fff; border-color: #0f172a; }

  /* ── FOOTER ── */
  .cb-footer {
    padding: 8px 0; border-top: 1px solid #e2e8f0; flex-shrink: 0;
    display: flex; align-items: center; justify-content: space-between;
    font-size: 11.5px; color: #64748b;
  }

  /* ── DRAWER OVERLAY ── */
  .cb-drawer-overlay {
    position: fixed; inset: 0; background: rgba(15,23,42,.3);
    z-index: 900; opacity: 0; pointer-events: none;
    transition: opacity .25s; backdrop-filter: blur(2px);
  }
  .cb-drawer-overlay.open { opacity: 1; pointer-events: all; }

  /* ── DRAWER ── */
  .cb-drawer {
    position: fixed; top: 0; right: 0; width: 480px; max-width: 97vw; height: 100vh;
    background: #fff; box-shadow: -8px 0 40px rgba(0,0,0,.13); z-index: 1000;
    display: flex; flex-direction: column;
    transform: translateX(100%); transition: transform .28s cubic-bezier(.4,0,.2,1);
  }
  .cb-drawer.open { transform: translateX(0); }
  .cb-drawer-hero {
    padding: 18px 20px 16px;
    background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
    position: relative; overflow: hidden; flex-shrink: 0;
  }
  .cb-drawer-hero::before {
    content: ''; position: absolute; top: -40px; right: -40px;
    width: 140px; height: 140px; border-radius: 50%; background: rgba(255,255,255,.04);
  }
  .cb-drawer-close {
    position: absolute; top: 12px; right: 12px; width: 28px; height: 28px;
    border: none; border-radius: 7px; background: rgba(255,255,255,.1);
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    color: rgba(255,255,255,.65); transition: background .15s; z-index: 1;
  }
  .cb-drawer-close:hover { background: rgba(255,255,255,.2); color: #fff; }
  .cb-drawer-type {
    display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px;
    border-radius: 100px; font-size: 10px; font-weight: 700; margin-bottom: 6px;
    position: relative; z-index: 1;
  }
  .cb-drawer-type.nl   { background: rgba(59,130,246,.18); border: 1px solid rgba(59,130,246,.3); color: #60a5fa; }
  .cb-drawer-type.repl { background: rgba(124,58,237,.18); border: 1px solid rgba(124,58,237,.3); color: #a78bfa; }
  .cb-drawer-type.pur  { background: rgba(34,197,94,.18);  border: 1px solid rgba(34,197,94,.3);  color: #4ade80; }
  .cb-drawer-name { font-size: 16px; font-weight: 700; color: #fff; padding-right: 36px; line-height: 1.3; margin-bottom: 4px; position: relative; z-index: 1; }
  .cb-drawer-sub  { font-size: 11px; color: rgba(255,255,255,.45); position: relative; z-index: 1; }
  .cb-drawer-kpis {
    display: grid; grid-template-columns: repeat(3,1fr); gap: 6px;
    margin-top: 12px; position: relative; z-index: 1;
  }
  .cb-drawer-kpi {
    background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.1);
    border-radius: 9px; padding: 8px 10px;
  }
  .cb-drawer-kpi-label { font-size: 9px; font-weight: 600; text-transform: uppercase; letter-spacing: .5px; color: rgba(255,255,255,.4); margin-bottom: 3px; }
  .cb-drawer-kpi-val   { font-size: 15px; font-weight: 700; color: #fff; line-height: 1; }
  .cb-drawer-body { flex: 1; overflow-y: auto; padding: 18px 20px; }
  .cb-drawer-body::-webkit-scrollbar { width: 4px; }
  .cb-drawer-body::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 4px; }
  .cb-sec-label {
    font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .8px;
    color: #94a3b8; margin-bottom: 10px; display: flex; align-items: center; gap: 8px;
  }
  .cb-sec-label::after { content: ''; flex: 1; height: 1px; background: #f1f5f9; }
  .cb-info-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 0; border-bottom: 1px solid #f1f5f9; font-size: 12.5px;
  }
  .cb-info-row:last-child { border-bottom: none; }
  .cb-info-label { color: #64748b; font-weight: 500; }
  .cb-info-val   { color: #0f172a; font-weight: 600; text-align: right; }

  /* Action area */
  .cb-drawer-actions { padding: 14px 20px; border-top: 1px solid #e2e8f0; flex-shrink: 0; background: #fafafa; }
  .cb-action-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .cb-action-label { font-size: 11px; font-weight: 600; color: #64748b; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 8px; }
  .cb-select {
    flex: 1; padding: 7px 10px; border: 1.5px solid #e2e8f0; border-radius: 8px;
    font-size: 12.5px; font-family: inherit; background: #fff; color: #0f172a;
    outline: none; cursor: pointer; min-width: 140px;
  }
  .cb-qty-input {
    width: 120px; padding: 7px 10px; border: 1.5px solid #e2e8f0; border-radius: 8px;
    font-size: 12.5px; font-family: inherit; background: #fff; color: #0f172a; outline: none;
  }
  .cb-btn {
    display: inline-flex; align-items: center; gap: 6px; padding: 7px 13px;
    border-radius: 8px; font-size: 12px; font-weight: 600; font-family: inherit;
    cursor: pointer; border: 1.5px solid; transition: all .15s; white-space: nowrap;
  }
  .cb-btn svg { width: 11px; height: 11px; }
  .cb-btn-green  { background: #f0fdf4; color: #15803d; border-color: #bbf7d0; }
  .cb-btn-green:hover { background: #dcfce7; }
  .cb-btn-amber  { background: #fef3c7; color: #92400e; border-color: #fde68a; }
  .cb-btn-amber:hover { background: #fde68a; }
  .cb-btn-slate  { background: #f8fafc; color: #64748b; border-color: #e2e8f0; }
  .cb-btn-slate:hover { background: #f1f5f9; }

  /* ── TOAST ── */
  .cb-toasts {
    position: fixed; bottom: 20px; right: 20px;
    z-index: 9999; display: flex; flex-direction: column; gap: 7px;
  }
</style>

<div class="cb-page">
  <!-- Fixed Header -->
  <div class="cb-header">
    <div class="cb-tabs">
      <button class="cb-tab active-to-buy" id="cbTabToBuy" onclick="window.setCbTab('tobuy')">To Purchase</button>
      <button class="cb-tab" id="cbTabPurchased" onclick="window.setCbTab('purchased')">Purchased</button>
    </div>
    <div class="cb-toolbar-row">
      <span id="cbCount" class="cb-chip">0 items</span>
      <span id="cbSuppliers" class="cb-chip" style="display:none;"></span>
      <span id="cbUnits" class="cb-chip" style="display:none;flex-direction:column;line-height:1.3;"></span>
      <div class="cb-type-wrap">
        <button class="cb-type-btn" id="cbTypeBtn" onclick="window.toggleCbTypeMenu(event)">
          <span id="cbTypeBtnLabel">All</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
        <div class="cb-type-menu" id="cbTypeMenu">
          <div class="cb-type-opt selected" id="cbTypeOptAll"     onclick="window.setCbFilter('all')"><span class="cb-type-dot" style="background:#0f172a;"></span>All</div>
          <div class="cb-type-opt"          id="cbTypeOptNewline" onclick="window.setCbFilter('newline')"><span class="cb-type-dot" style="background:#2563eb;"></span>New Lines</div>
          <div class="cb-type-opt"          id="cbTypeOptReplens" onclick="window.setCbFilter('replens')"><span class="cb-type-dot" style="background:#7c3aed;"></span>Replenishments</div>
        </div>
      </div>
      <div class="cb-search-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="cbSearch" class="cb-search" placeholder="Search product, EAN, supplier…" oninput="window.renderCentralBasket()">
      </div>
      <select id="cbSupplierFilter" class="cb-supplier-select" onchange="window.renderCentralBasket()">
        <option value="">All Suppliers</option>
      </select>
    </div>
    <div id="cbMoqBar" class="cb-moq-bar"></div>
  </div>

  <!-- Body -->
  <div id="cbBody" class="cb-body">
    <div style="display:flex;align-items:center;justify-content:center;height:100%;color:#94a3b8;font-size:13px;gap:8px;">
      <div style="width:16px;height:16px;border:2.5px solid #e2e8f0;border-top-color:#2563eb;border-radius:50%;animation:spin .65s linear infinite;"></div>
      Loading…
    </div>
  </div>

  <!-- Footer -->
  <div class="cb-footer">
    <span id="cbFtrCount">0 items</span>
  </div>
</div>

<!-- Drawer overlay -->
<div class="cb-drawer-overlay" id="cbDrawerOverlay" onclick="window.closeCbDrawer()"></div>

<!-- Drawer -->
<div class="cb-drawer" id="cbDrawer">
  <div id="cbDrawerHero"></div>
  <div class="cb-drawer-body" id="cbDrawerBody"></div>
  <div class="cb-drawer-actions" id="cbDrawerActions"></div>
</div>

<div class="cb-toasts" id="cbToastContainer"></div>

<script>
(function () {
  'use strict';
  const sb = window.sb;

  let _cbFilter  = 'all';
  let _cbTab     = 'tobuy';
  let _cbPage    = 1;
  const PAGE_SIZE = 25;
  let _cbSupplierList = [];
  let _drawerItem = null; // { type: 'nl'|'repl', data: {...} }

  function escH(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function escA(s) { return String(s||'').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
  function fmtVal(v) { const n = parseFloat(v); return isNaN(n) ? '—' : n.toLocaleString('en-GB'); }
  function fmtGBP(v) { const n = parseFloat(v); return isNaN(n) ? '—' : '£' + n.toLocaleString('en-GB',{minimumFractionDigits:2,maximumFractionDigits:2}); }

  async function _loadCbSuppliers() {
    if (_cbSupplierList.length) return _cbSupplierList;
    try {
      const { data } = await sb.from('suppliers').select('name,moq').order('name');
      _cbSupplierList = (data || []).map(s => ({ name: s.name, moq: parseFloat(s.moq) || 0 }));
    } catch(e) { _cbSupplierList = []; }
    return _cbSupplierList;
  }

  // ── TABS ──
  window.setCbTab = function(tab) {
    _cbTab = tab; _cbPage = 1;
    document.getElementById('cbTabToBuy').className    = 'cb-tab' + (tab==='tobuy'     ? ' active-to-buy'   : '');
    document.getElementById('cbTabPurchased').className = 'cb-tab' + (tab==='purchased' ? ' active-purchased' : '');
    window.renderCentralBasket();
  };

  // ── TYPE DROPDOWN ──
  window.toggleCbTypeMenu = function(e) {
    e.stopPropagation();
    document.getElementById('cbTypeMenu').classList.toggle('open');
  };
  document.addEventListener('click', function() {
    document.getElementById('cbTypeMenu')?.classList.remove('open');
  });
  function _updateTypeDropdown() {
    const labels = { all:'All', newline:'New Lines', replens:'Replenishments' };
    const btn = document.getElementById('cbTypeBtn');
    if (btn) {
      btn.style.borderColor = _cbFilter==='all' ? '#e2e8f0' : _cbFilter==='newline' ? '#bfdbfe' : '#c4b5fd';
      btn.style.color       = _cbFilter==='all' ? '#0f172a' : _cbFilter==='newline' ? '#1d4ed8' : '#7c3aed';
      btn.style.background  = _cbFilter==='all' ? '#fff'    : _cbFilter==='newline' ? '#eff6ff' : '#f5f3ff';
      document.getElementById('cbTypeBtnLabel').textContent = labels[_cbFilter];
    }
    ['all','newline','replens'].forEach(k => {
      const el = document.getElementById('cbTypeOpt' + k.charAt(0).toUpperCase() + k.slice(1));
      if (el) el.classList.toggle('selected', k === _cbFilter);
    });
    document.getElementById('cbTypeMenu')?.classList.remove('open');
  }
  window.setCbFilter = function(f) {
    _cbFilter = f; _cbPage = 1; _updateTypeDropdown(); window.renderCentralBasket();
  };

  // ── DRAWER ──
  window.openCbDrawer = function(type, data) {
    _drawerItem = { type, data };
    _renderCbDrawer();
    document.getElementById('cbDrawer').classList.add('open');
    document.getElementById('cbDrawerOverlay').classList.add('open');
  };
  window.closeCbDrawer = function() {
    document.getElementById('cbDrawer').classList.remove('open');
    document.getElementById('cbDrawerOverlay').classList.remove('open');
    _drawerItem = null;
  };

  function _renderCbDrawer() {
    if (!_drawerItem) return;
    const { type, data: p } = _drawerItem;
    const isPurchased = _cbTab === 'purchased';
    const supplierList = _cbSupplierList;

    // ── Hero ──
    const typeLabel = type === 'nl' ? 'New Line' : 'Replenishment';
    const typeCls   = isPurchased ? 'pur' : type === 'nl' ? 'nl' : 'repl';
    const heroLabel = isPurchased ? 'Purchased' : typeLabel;
    const name = type === 'nl' ? (p.product_name || '—') : (p.name || '—');

  // ── MAIN RENDER ──
  window.renderCentralBasket = async function() {
    const body = document.getElementById('cbBody');
    if (!body) return;
    body.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#94a3b8;font-size:13px;gap:8px;"><div style="width:16px;height:16px;border:2.5px solid #e2e8f0;border-top-color:#2563eb;border-radius:50%;animation:spin .65s linear infinite;"></div>Loading…</div>';

    const supplierList = await _loadCbSuppliers();
    let newlines = [], replens = [];

    if (_cbTab === 'tobuy') {
      try {
        const { data } = await sb.from('sourcing')
          .select('opportunity_id,product_name,supplier_name,code,cost_of_unit,unit_quantity,approved,purchased,sourcing_approvals(status)')
          .eq('approved', true).eq('purchased', false);
        newlines = (data||[]).filter(p=>!(p.sourcing_approvals||[]).some(a=>a.status==='rejected'));
      } catch(e) { console.warn('CB sourcing:', e); }
      try {
        const { data } = await sb.from('replenishment_skus')
          .select('sku,name,ean,order_qty,cost_price,days_left,urgency,image_url,supplier_name,action,actioned_at')
          .eq('action','basket');
        replens = data || [];
      } catch(e) { console.warn('CB replens:', e); }
    } else {
      try {
        const { data } = await sb.from('sourcing')
          .select('opportunity_id,product_name,supplier_name,code,cost_of_unit,unit_quantity,qty_purchased,last_updated,approved,purchased,sourcing_approvals(status)')
          .eq('approved', true).eq('purchased', true);
        newlines = (data||[]).filter(p=>!(p.sourcing_approvals||[]).some(a=>a.status==='rejected'));
      } catch(e) { console.warn('CB sourcing pur:', e); }
      try {
        const { data } = await sb.from('replenishment_skus')
          .select('sku,name,ean,order_qty,cost_price,days_left,urgency,image_url,supplier_name,action,actioned_at')
          .eq('action','pur');
        replens = data || [];
      } catch(e) { console.warn('CB replens pur:', e); }
    }

    // Populate supplier filter
    const allSupplierNames = [...new Set([
      ...newlines.map(p=>p.supplier_name).filter(Boolean),
      ...replens.map(p=>p.supplier_name).filter(Boolean),
    ])].sort();
    const sfEl = document.getElementById('cbSupplierFilter');
    if (sfEl) {
      const cv = sfEl.value;
      sfEl.innerHTML = '<option value="">All Suppliers</option>'
        + allSupplierNames.map(n=>`<option value="${escA(n)}"${n===cv?' selected':''}>${escH(n)}</option>`).join('');
    }

    // Apply filters
    let filteredNL   = _cbFilter==='replens' ? [] : newlines;
    let filteredRepl = _cbFilter==='newline'  ? [] : replens;
    const q = (document.getElementById('cbSearch')?.value||'').toLowerCase().trim();
    if (q) {
      filteredNL   = filteredNL.filter(p=>(p.product_name||'').toLowerCase().includes(q)||(p.supplier_name||'').toLowerCase().includes(q)||(p.code||'').toLowerCase().includes(q));
      filteredRepl = filteredRepl.filter(p=>(p.name||'').toLowerCase().includes(q)||(p.supplier_name||'').toLowerCase().includes(q)||(p.ean||'').toLowerCase().includes(q));
    }
    const supplierQ = sfEl?.value||'';
    if (supplierQ) {
      filteredNL   = filteredNL.filter(p=>p.supplier_name===supplierQ);
      filteredRepl = filteredRepl.filter(p=>p.supplier_name===supplierQ);
    }

    // Counters
    const visibleItems = [
      ...filteredNL.map(p=>({ units:parseFloat(p.unit_quantity)||0, cost:parseFloat(p.cost_of_unit)||0, supplier:p.supplier_name||'' })),
      ...filteredRepl.map(p=>({ units:parseFloat(p.order_qty)||0, cost:parseFloat(p.cost_price)||0, supplier:p.supplier_name||'' })),
    ];
    const totalItems      = visibleItems.length;
    const uniqueSuppliers = new Set(visibleItems.map(i=>i.supplier).filter(Boolean)).size;
    const totalUnits      = visibleItems.reduce((s,i)=>s+i.units,0);
    const totalValue      = visibleItems.reduce((s,i)=>s+(i.units*i.cost),0);

    document.getElementById('cbCount').textContent = totalItems+' item'+(totalItems!==1?'s':'');
    const suppEl = document.getElementById('cbSuppliers');
    if (suppEl) { suppEl.textContent = uniqueSuppliers+' supplier'+(uniqueSuppliers!==1?'s':''); suppEl.style.display=uniqueSuppliers>0?'flex':'none'; }
    const unitsEl = document.getElementById('cbUnits');
    if (unitsEl) {
      unitsEl.innerHTML = totalUnits>0?`${totalUnits.toLocaleString()} units<br><span style="font-size:10.5px;font-weight:600;color:#15803d;">${fmtGBP(totalValue)}</span>`:'';
      unitsEl.style.display = totalUnits>0?'flex':'none';
    }

    // MOQ bar
    const moqBar = document.getElementById('cbMoqBar');
    if (moqBar) {
      if (_cbTab==='tobuy' && uniqueSuppliers===1 && totalValue>0) {
        const sName = visibleItems.find(i=>i.supplier)?.supplier||'';
        const sup = supplierList.find(s=>s.name===sName);
        const moq = sup?.moq||0;
        if (moq>0) {
          const met=totalValue>=moq; const pct=Math.min(100,Math.round((totalValue/moq)*100));
          moqBar.style.display='flex';
          moqBar.innerHTML=`<div style="flex:1;min-width:0;">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;">
              <span style="font-size:11px;font-weight:700;color:#475569;">MOQ — ${escH(sName)}</span>
              <span style="font-size:11px;font-weight:700;color:${met?'#15803d':'#92400e'};">${met?'✓ Met':`${pct}% — ${fmtGBP(moq-totalValue)} to go`}</span>
            </div>
            <div style="height:5px;background:#e2e8f0;border-radius:99px;overflow:hidden;">
              <div style="height:100%;width:${pct}%;background:${met?'#22c55e':'#f59e0b'};border-radius:99px;transition:width .3s;"></div>
            </div>
            <div style="font-size:10.5px;color:#94a3b8;margin-top:3px;">MOQ ${fmtGBP(moq)} · Basket ${fmtGBP(totalValue)}</div>
          </div>`;
        } else { moqBar.style.display='none'; }
      } else { moqBar.style.display='none'; }
    }

    document.getElementById('cbFtrCount').textContent = totalItems+' item'+(totalItems!==1?'s':'');

    if (totalItems===0) {
      body.innerHTML=`<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:10px;text-align:center;padding:40px 20px;color:#94a3b8;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="width:28px;height:28px;opacity:.4;"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
        <div style="font-size:13px;font-weight:600;color:#475569;">${_cbTab==='purchased'?'No purchased items':'Basket is empty'}</div>
        <div style="font-size:12px;">${_cbTab==='purchased'?'Purchased items appear here once marked.':'Approved sourcing products and replenishment basket items appear here.'}</div>
      </div>`;
      return;
    }

    const isPurchased = _cbTab==='purchased';

    // ── KANBAN (All) ──
    if (_cbFilter==='all') {
      body.innerHTML=`<div class="cb-kanban">
        <div class="cb-kanban-col">
          <div class="cb-kanban-header nl">
            <span>New Lines</span>
            <span style="font-size:10px;opacity:.7;">${filteredNL.length}</span>
          </div>
          <div class="cb-kanban-body">
            ${filteredNL.length===0
              ? '<div style="font-size:12px;color:#94a3b8;text-align:center;padding:20px 0;">No new lines</div>'
              : filteredNL.map(p=>_nlKanbanCard(p,isPurchased)).join('')}
          </div>
        </div>
        <div class="cb-kanban-col">
          <div class="cb-kanban-header repl">
            <span>Replenishments</span>
            <span style="font-size:10px;opacity:.7;">${filteredRepl.length}</span>
          </div>
          <div class="cb-kanban-body">
            ${filteredRepl.length===0
              ? '<div style="font-size:12px;color:#94a3b8;text-align:center;padding:20px 0;">No replenishments</div>'
              : filteredRepl.map(p=>_replKanbanCard(p,isPurchased)).join('')}
          </div>
        </div>
      </div>`;
      return;
    }

    // ── LIST (single type, paginated) ──
    const listItems = _cbFilter==='newline'
      ? filteredNL.map(p=>({ _type:'nl', data:p }))
      : filteredRepl.map(p=>({ _type:'repl', data:p }));
    if (_cbFilter==='replens') {
      listItems.sort((a,b)=>{
        const ta=a.data.actioned_at||''; const tb=b.data.actioned_at||'';
        if(ta&&tb) return tb.localeCompare(ta); if(ta) return -1; if(tb) return 1; return 0;
      });
    }
    const totalPages = Math.ceil(listItems.length/PAGE_SIZE);
    if (_cbPage>totalPages) _cbPage=Math.max(1,totalPages);
    const pageItems = listItems.slice((_cbPage-1)*PAGE_SIZE, _cbPage*PAGE_SIZE);

    let listHtml = '<div class="cb-list-body">';
    listHtml += pageItems.map(item=>
      item._type==='nl' ? _nlListCard(item.data,isPurchased) : _replListCard(item.data,isPurchased)
    ).join('');
    listHtml += '</div>';

    if (totalPages>1) {
      listHtml += '<div class="cb-pagination">';
      listHtml += `<button class="cb-page-btn" onclick="window.cbGoPage(${_cbPage-1})" ${_cbPage===1?'disabled':''}>← Prev</button>`;
      for (let i=1;i<=totalPages;i++) listHtml+=`<button class="cb-page-btn${i===_cbPage?' active':''}" onclick="window.cbGoPage(${i})">${i}</button>`;
      listHtml += `<button class="cb-page-btn" onclick="window.cbGoPage(${_cbPage+1})" ${_cbPage===totalPages?'disabled':''}>Next →</button>`;
      listHtml += '</div>';
    }
    body.innerHTML = listHtml;
  };

  window.cbGoPage = function(p) { _cbPage=p; window.renderCentralBasket(); };

  // ── CARD RENDERERS ──
  function _nlKanbanCard(p, isPurchased) {
    const cost=parseFloat(p.cost_of_unit); const qty=parseFloat(p.unit_quantity)||0;
    const total=!isNaN(cost)?cost*qty:0;
    const ini=(p.product_name||'?').split(' ').filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join('');
    return `<div class="cb-card" onclick="window.openCbDrawer('nl',${JSON.stringify(p).replace(/"/g,'&quot;')})">
      <div class="cb-card-name" title="${escH(p.product_name||'')}">${escH(p.product_name||'—')}</div>
      <div class="cb-card-meta">
        <span class="cb-card-tag ${isPurchased?'purchased':'nl'}">${isPurchased?'Purchased':'New Line'}</span>
        <span class="cb-card-sup">${escH(p.supplier_name||'—')}</span>
        ${total>0?`<span class="cb-card-val">${fmtGBP(total)}</span>`:''}
      </div>
    </div>`;
  }

  function _replKanbanCard(p, isPurchased) {
    const cost=parseFloat(p.cost_price)||0; const qty=parseInt(p.order_qty)||0;
    const total=cost*qty;
    return `<div class="cb-card" onclick="window.openCbDrawer('repl',${JSON.stringify(p).replace(/"/g,'&quot;')})">
      <div class="cb-card-name" title="${escH(p.name||'')}">${escH(p.name||'—')}</div>
      <div class="cb-card-meta">
        <span class="cb-card-tag ${isPurchased?'purchased':'repl'}">${isPurchased?'Purchased':'Replenishment'}</span>
        <span class="cb-card-sup">${escH(p.supplier_name||'—')}</span>
        ${total>0?`<span class="cb-card-val">${fmtGBP(total)}</span>`:''}
      </div>
    </div>`;
  }

  function _nlListCard(p, isPurchased) {
    const cost=parseFloat(p.cost_of_unit); const qty=parseFloat(p.unit_quantity)||0;
    const total=!isNaN(cost)?cost*qty:0;
    return `<div class="cb-list-card" onclick="window.openCbDrawer('nl',${JSON.stringify(p).replace(/"/g,'&quot;')})">
      <div class="cb-list-card-name" title="${escH(p.product_name||'')}">${escH(p.product_name||'—')}</div>
      <div class="cb-list-card-meta">
        <span class="cb-card-tag ${isPurchased?'purchased':'nl'}">${isPurchased?'Purchased':'New Line'}</span>
        <span class="cb-card-sup">${escH(p.supplier_name||'—')}</span>
        ${!isNaN(cost)?`<span style="font-size:11px;font-weight:600;color:#374151;">£${cost.toFixed(2)}/unit</span>`:''}
        ${total>0?`<span class="cb-card-val" style="margin-left:auto;">${fmtGBP(total)}</span>`:''}
      </div>
    </div>`;
  }

  function _replListCard(p, isPurchased) {
    const cost=parseFloat(p.cost_price)||0; const qty=parseInt(p.order_qty)||0;
    const total=cost*qty;
    const dl=parseFloat(p.days_left)||0;
    const daysCls=dl<=0?'#dc2626':dl<7?'#dc2626':dl<20?'#92400e':'#15803d';
    const daysTxt=dl<=0?'Out of stock':dl+'d left';
    return `<div class="cb-list-card" onclick="window.openCbDrawer('repl',${JSON.stringify(p).replace(/"/g,'&quot;')})">
      <div class="cb-list-card-name" title="${escH(p.name||'')}">${escH(p.name||'—')}</div>
      <div class="cb-list-card-meta">
        <span class="cb-card-tag ${isPurchased?'purchased':'repl'}">${isPurchased?'Purchased':'Replenishment'}</span>
        <span class="cb-card-sup">${escH(p.supplier_name||'—')}</span>
        <span style="font-size:11px;font-weight:700;color:${daysCls};">${daysTxt}</span>
        ${total>0?`<span class="cb-card-val" style="margin-left:auto;">${fmtGBP(total)}</span>`:''}
      </div>
    </div>`;
  }

  // ── ACTIONS ──
  window.cbUpdateNLSupplier = async function(id, supplierName) {
    try {
      await sb.from('sourcing').update({ supplier_name: supplierName||null, last_updated: new Date().toISOString() }).eq('opportunity_id', id);
      if (_drawerItem) { _drawerItem.data.supplier_name = supplierName; _renderCbDrawer(); }
      if (window.renderTable) window.renderTable();
      _cbToast('Supplier updated', 'success');
    } catch(e) { _cbToast('Failed to update supplier', 'error'); }
  };

  window.cbUpdateReplSupplier = async function(sku, supplierName) {
    try {
      await sb.from('replenishment_skus').update({ supplier_name: supplierName||null }).eq('sku', sku);
      if (_drawerItem) { _drawerItem.data.supplier_name = supplierName; _renderCbDrawer(); }
      if (window.render) window.render();
      _cbToast('Supplier updated', 'success');
      // Update MOQ bar
      const sfEl=document.getElementById('cbSupplierFilter');
      const supplierQ=sfEl?.value||'';
      const moqBar=document.getElementById('cbMoqBar');
      if (!moqBar) return;
      const targetSupplier=supplierQ||supplierName;
      if (!targetSupplier){moqBar.style.display='none';return;}
      const sl=await _loadCbSuppliers();
      const sup=sl.find(s=>s.name===targetSupplier);
      const moq=sup?.moq||0;
      if (!moq){moqBar.style.display='none';return;}
      const unitsEl=document.getElementById('cbUnits');
      const vt=unitsEl?.querySelector('span')?.textContent||'';
      const tv=parseFloat(vt.replace(/[^0-9.]/g,''))||0;
      if (!tv){moqBar.style.display='none';return;}
      const met=tv>=moq; const pct=Math.min(100,Math.round((tv/moq)*100));
      moqBar.style.display='flex';
      moqBar.innerHTML=`<div style="flex:1;min-width:0;">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;">
          <span style="font-size:11px;font-weight:700;color:#475569;">MOQ — ${escH(targetSupplier)}</span>
          <span style="font-size:11px;font-weight:700;color:${met?'#15803d':'#92400e'};">${met?'✓ Met':`${pct}% — ${fmtGBP(moq-tv)} to go`}</span>
        </div>
        <div style="height:5px;background:#e2e8f0;border-radius:99px;overflow:hidden;">
          <div style="height:100%;width:${pct}%;background:${met?'#22c55e':'#f59e0b'};border-radius:99px;transition:width .3s;"></div>
        </div>
        <div style="font-size:10.5px;color:#94a3b8;margin-top:3px;">MOQ ${fmtGBP(moq)} · Basket ${fmtGBP(tv)}</div>
      </div>`;
    } catch(e) { _cbToast('Failed to update supplier', 'error'); }
  };

  window.cbMarkNewLinePurchased = async function(id) {
    const qtyInput = document.getElementById('cbDrawerNLQty');
    const qty = parseFloat(qtyInput?.value||'');
    if (!qty||qty<=0) { _cbToast('Enter a quantity', 'error'); return; }
    try {
      await sb.from('sourcing').update({ purchased:true, qty_purchased:qty, last_updated:new Date().toISOString() }).eq('opportunity_id', id);
      _cbToast('Moved to Purchased ✓', 'success');
      window.closeCbDrawer();
      window.renderCentralBasket();
      if (window.renderTable) window.renderTable();
      if (window.updateStats) window.updateStats();
    } catch(e) { _cbToast('Failed to save', 'error'); }
  };

  window.cbUndoNLPurchased = async function(id) {
    try {
      await sb.from('sourcing').update({ purchased:false, qty_purchased:null, last_updated:new Date().toISOString() }).eq('opportunity_id', id);
      _cbToast('Moved back to To Purchase', 'success');
      window.closeCbDrawer();
      window.renderCentralBasket();
      if (window.renderTable) window.renderTable();
      if (window.updateStats) window.updateStats();
    } catch(e) { _cbToast('Failed to undo', 'error'); }
  };

  window.cbMarkReplPurchased = async function(sku) {
    try {
      await sb.from('replenishment_skus').update({ action:'pur', actioned_at:new Date().toISOString() }).eq('sku', sku);
      _cbToast('Moved to Purchased ✓', 'success');
      window.closeCbDrawer();
      window.renderCentralBasket();
      if (window.render) window.render();
    } catch(e) { _cbToast('Failed to save', 'error'); }
  };

  window.cbUndoReplPurchased = async function(sku) {
    try {
      await sb.from('replenishment_skus').update({ action:'basket', actioned_at:new Date().toISOString() }).eq('sku', sku);
      _cbToast('Moved back to To Purchase', 'success');
      window.closeCbDrawer();
      window.renderCentralBasket();
      if (window.render) window.render();
    } catch(e) { _cbToast('Failed to undo', 'error'); }
  };

  window.cbRemoveRepl = async function(sku) {
    try {
      await sb.from('replenishment_skus').update({ action:null, actioned_at:null }).eq('sku', sku);
      _cbToast('Removed from basket', 'success');
      window.closeCbDrawer();
      window.renderCentralBasket();
      if (window.render) window.render();
    } catch(e) { _cbToast('Failed to remove', 'error'); }
  };

  function _cbToast(msg, type) {
    if (window.showToast) { window.showToast(msg, type); return; }
    const c = document.getElementById('cbToastContainer');
    if (!c) return;
    const t = document.createElement('div');
    t.style.cssText=`display:flex;align-items:center;gap:9px;padding:11px 16px;border-radius:10px;font-size:13px;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.18);animation:toastIn .2s ease;max-width:320px;color:#fff;background:${type==='success'?'#15803d':type==='error'?'#dc2626':'#1e40af'};`;
    t.textContent = msg;
    c.appendChild(t);
    setTimeout(()=>t.remove(), 3000);
  }

  // ── INIT ──
  _updateTypeDropdown();
  window.renderCentralBasket();
})();
</script>
