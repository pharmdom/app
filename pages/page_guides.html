lick any row to open their full breakdown.", "f": ".page-scroll"}, {"s": ".emp-row", "t": "Employee Row", "d": "Click any employee to open their detail drawer — showing all their weeks grouped by paid and pending status, with total hours and pay per week.", "f": ".emp-list"}], "name": "Payroll", "section": "Payroll", "pages": ["payroll", "paycheck"]}, "sourcing": {"summary": "This is where every lead opportunity lives - from the moment it's sourced, all the way to being bought. Here's a quick look at how it works.", "actions": [{"t": "Add a Product", "d": "Found a good product? Add it here with all its details — supplier, price, profit and more.", "c": "blue", "run": "const el=document.querySelector('.btn-primary[onclick=\\'openAddModal()\\']'); if(el){el.style.transition='box-shadow .2s,transform .2s';el.style.boxShadow='0 0 0 4px rgba(37,99,235,.4)';el.style.transform='scale(1.06)';setTimeout(()=>{el.style.boxShadow='';el.style.transform='';openAddModal();},500)}"}, {"t": "Search Products", "d": "Type anything — a product name, supplier, or agent — to instantly find what you're looking for.", "c": "purple", "run": "const el=document.querySelector('.search-input'); if(el){el.focus();el.style.boxShadow='0 0 0 4px rgba(37,99,235,.3)';setTimeout(()=>el.style.boxShadow='',1000)}"}, {"t": "Review Pending Approvals", "d": "See all products waiting for a decision. Open one to approve or reject it.", "c": "amber", "run": "const el=document.getElementById('statApproval'); if(el){el.style.transition='transform .2s,box-shadow .2s';el.style.transform='scale(1.08)';el.style.boxShadow='0 0 0 4px rgba(194,65,12,.3)';setTimeout(()=>{el.style.transform='';el.style.boxShadow='';filterByStatus('needApproval');},500)}"}, {"t": "See What's Ready to Buy", "d": "These products are approved and waiting to be purchased. Mark them bought when done.", "c": "green", "run": "const el=document.getElementById('statPurchase'); if(el){el.style.transition='transform .2s,box-shadow .2s';el.style.transform='scale(1.08)';el.style.boxShadow='0 0 0 4px rgba(29,78,216,.3)';setTimeout(()=>{el.style.transform='';el.style.boxShadow='';filterByStatus('toPurchase');},500)}"}], "steps": [{"t": "Add a product", "d": "When you find something worth buying, click <strong>Add Product</strong> and fill in the details — what it is, where it’s from, costs, profit, VAT rate and <strong>MAP Recommended</strong> (both required)."}, {"t": "Get it approved", "d": "Click on any product row to open it. Go to the <strong>Approvals</strong> tab and a team member can approve or reject it. Products need at least one approval before they can be bought."}, {"t": "Mark it purchased", "d": "Once approved, open the product and set <strong>Purchased</strong> to Yes in the Overview tab. You'll also enter how many units were bought."}, {"t": "Leave notes along the way", "d": "The <strong>Notes</strong> tab inside each product lets you leave comments, questions, or updates — so everyone stays in the loop."}], "tips": ["The <strong>coloured chips at the top</strong> are shortcuts — click one to instantly filter the list. Click it again to clear the filter.", "Use <strong>Filters</strong> to narrow down by supplier, date, whether it's been purchased, and more — all at the same time.", "<strong>Click any row</strong> in the table to open the full product detail panel on the right. Everything can be edited and managed directly from there.", "When adding a product, a <strong>timer starts automatically</strong> — this helps track how long sourcing research takes on a single lead sourced.", "Use the <strong>Pages menu</strong> (top left) to jump to the Sourcing Calendar — where you can see assigned hours and which suppliers to focus on each week."], "tour": [{"s": ".stats-row", "t": "At a Glance Summary", "d": "These coloured chips show live counts for products needing approval, ready to buy, rejected, and the total. <strong>Click any chip</strong> to instantly filter the list to just those products.", "f": null}, {"s": ".btn-primary[onclick=\"openAddModal()\"]", "t": "Add a New Product", "d": "Found something worth buying? Click here to log it. You'll fill in the product name, supplier, pricing, and profit — the form walks you through it step by step.", "f": null}, {"s": ".search-wrap", "t": "Search Anything", "d": "Type a product name, supplier, or agent name and the list filters instantly as you type. No need to press Enter.", "f": null}, {"s": ".filter-toggle-btn", "t": "More Ways to Filter", "d": "Click <strong>Filters</strong> to reveal extra options — filter by date, whether something's been purchased, approved, packing type, and more. You can combine as many as you need.", "f": null}, {"s": ".table-card", "t": "The Product List", "d": "Every product the team has logged shows up here. You can see the profit figures, who added it, and whether it's been approved or bought — all at a glance. <strong>Click any row</strong> to open the full details.", "f": null}, {"s": ".pagination", "t": "Moving Through Pages", "d": "If there are more products than fit on screen, use the Prev and Next buttons here to move through them. The count shows exactly where you are.", "f": null}], "name": "Sourcing", "section": "Products", "pages": ["sourcing"]}, "test": {"name": "Test (new Sourcing)", "section": "Products", "pages": ["test"], "summary": "The new Sourcing page. Every lead lives here from the moment it is sourced until it is bought — with a cleaner 4-step Add Product form and per-ASIN product details.", "actions": [{"t": "Add a product", "d": "Open the 4-step <strong>Add New Product</strong> form — Product, Supplier, Financials, Attributes.", "c": "blue", "run": "pgCall('openAddModal')"}, {"t": "Search products", "d": "Find a lead by product name, supplier or agent.", "c": "purple", "run": "pgFocus('.search-input, #searchInput')"}, {"t": "Open a product", "d": "Click any row to open its detail drawer — overview, financials, attributes, notes, approvals and the Analyzer.", "c": "green", "run": "pgClick('tbody tr')"}], "steps": [{"t": "Add a product in 4 steps", "d": "Click the step numbers to move freely between <strong>Product</strong>, <strong>Supplier</strong>, <strong>Financials</strong> and <strong>Attributes</strong> — no Next/Back needed. A step shows ✓ once its required fields are filled."}, {"t": "Save checks everything", "d": "<strong>Save Product</strong> appears on step 4. It checks every step and jumps you to the first one with missing fields."}, {"t": "Fill in per-ASIN details", "d": "In the drawer, each ASIN has its own <strong>Pack of</strong>, <strong>Parcel size</strong> and <strong>Sales volume</strong>."}, {"t": "Unit Quantity is automatic", "d": "<strong>Unit Quantity (Recommended)</strong> is the total of all ASINs’ sales volumes — it updates whenever a sales volume changes (and becomes 0 if they are all cleared). Click ℹ to see the breakdown."}, {"t": "Approve and buy", "d": "Use the Approvals tab to approve or reject, then mark purchased once bought."}], "tips": ["VAT Rate and MAP Recommended are required and flow through to Listing, Basket and FBA Opportunities.", "Sales volume edited in Listing or Basket updates Unit Quantity here too — one source of truth.", "The Analyzer tab pulls live Keepa data for an ASIN — it is for reference only and never changes your fields.", "A timer starts when you open Add Product to track research time per lead."], "tour": []}, "listing": {"summary": "This is where purchased products move from raw purchase through listing, Veeqo setup, and finally delivery — tracked as a Kanban board with three columns.", "actions": [{"t": "Search Products", "d": "Type a product name or ASIN to instantly filter the board down to matching cards.", "c": "purple", "run": "var el=document.getElementById('searchInput');if(el){el.focus();el.style.boxShadow='0 0 0 4px rgba(37,99,235,.3)';setTimeout(function(){el.style.boxShadow=''},1000)}"}, {"t": "Filter the Board", "d": "Use Filters to narrow by warehouse status, arrival, merged, or bundled — combine as many as you need.", "c": "amber", "run": "toggleFilters()"}, {"t": "View Fully Listed", "d": "Click the purple \"Fully Listed\" chip at the top to open a full table of all products that have completed warehouse and delivery steps.", "c": "green", "run": "showListedTable()"}, {"t": "Open a Product", "d": "Click any card on the board to open its full detail panel — edit fields, update checklist items, and move it to the next stage.", "c": "blue", "run": "var cards=document.querySelectorAll('.kanban-card');if(cards.length){cards[0].click()}"}], "steps": [{"t": "Needs Listing", "d": "A product starts here when it's been purchased but hasn't been set up yet. Open it and go to the <strong>Platforms</strong> tab to activate Amazon advertising campaigns and — if quantity exceeds sales — eBay and TikTok listings. Once all platforms are active, click <strong>Start Veeqo &amp; Marketing</strong> to move it forward."}, {"t": "Veeqo & Marketing", "d": "Here you complete the Veeqo checklist — title, weight, dimensions, merged, bundled — and the Marketing checklist — multi-buy offers, B2B pricing, ads, and seller toolkit. A product moves to the next column automatically once all checklist items are ticked."}, {"t": "Awaiting Delivery", "d": "All listings and checklists are complete. When the physical stock arrives at the warehouse, open the product and tick <strong>Warehouse Notified</strong> and <strong>Delivery Received</strong> in the Overview tab. Once both are done the product moves to Fully Listed."}, {"t": "Fully Listed", "d": "The product has completed all steps. It no longer appears on the Kanban board but shows up in the <strong>Fully Listed</strong> table accessible from the purple chip at the top of the page."}], "tips": ["The drawer’s <strong>Product Details</strong> (VAT, MAP, and per-ASIN Pack of / Parcel / Sales volume) are shared with Sourcing, Basket and FBA Opportunities — edit once, it updates everywhere.", "Each ASIN has its own <strong>Check</strong> tick so you can confirm listings one by one. Changing a sales volume also updates the product’s Unit Quantity.", "You can <strong>drag any card</strong> between columns to manually move it to a different stage. Just grab and drop — the change saves automatically.", "The <strong>eBay and TikTok listing prices</strong> in the KPI bar are calculated automatically from the unit cost and pack size — they update live as you type.", "eBay and TikTok are <strong>auto-managed</strong> — they only appear as required when the quantity purchased exceeds the sales figure. If qty ≤ sales, they show as N/a automatically.", "You <strong>can't tick Warehouse Notified or Delivery Received</strong> until the full Veeqo checklist is complete — this prevents products skipping the setup steps."], "tour": [{"s": ".stats-row", "t": "At a Glance", "d": "The chips at the top show the total number of products on the board and how many are fully listed. Click the <strong>Fully Listed</strong> chip to open a detailed table of completed products.", "f": null}, {"s": ".search-wrap", "t": "Search Products", "d": "Type a product name or ASIN here to instantly filter the board. The three columns update in real time as you type — no need to press Enter.", "f": null}, {"s": ".filter-toggle-btn", "t": "Filters", "d": "Click <strong>Filters</strong> to reveal extra filter options — narrow down by warehouse status, arrival, merged, or bundled. You can combine multiple filters at once.", "f": null}, {"s": ".kanban-wrapper", "t": "The Kanban Board", "d": "Products move left to right across three columns: <strong>Needs Listing</strong>, <strong>Veeqo &amp; Marketing</strong>, and <strong>Awaiting Delivery</strong>. Each column shows how many products are in that stage. You can drag cards between columns to move them manually.", "f": null}, {"s": ".kanban-column:first-child", "t": "Needs Listing", "d": "Products start here. Open a card and go to the <strong>Platforms</strong> tab to activate Amazon, eBay, and TikTok as required. Once all platforms are active, click <strong>Start Veeqo &amp; Marketing</strong> to move the product forward.", "f": null}, {"s": ".kanban-column:nth-child(2)", "t": "Veeqo &amp; Marketing", "d": "Complete the Veeqo checklist (title, weight, dimensions, merged, bundled) and the Marketing checklist (multi-buy, B2B pricing, ads, seller toolkit). The product moves to the next column automatically once everything is ticked.", "f": null}, {"s": ".kanban-column:last-child", "t": "Awaiting Delivery", "d": "All listings and checklists are complete. Open the product and tick <strong>Warehouse Notified</strong> and <strong>Delivery Received</strong> when the stock arrives. Once both are done, the product becomes Fully Listed.", "f": null}, {"s": ".kanban-card", "t": "Product Cards", "d": "Each card shows the product name, ASIN, date added, unit cost, sales, and quantity. The platform icons at the bottom show which marketplaces are active. <strong>Click any card</strong> to open the full detail panel.", "f": ".kanban-col-body"}], "name": "Listing & Veeqo", "section": "Products", "pages": ["listing"]}, "fbaopportunities": {"summary": "This page shows every product that qualifies as an FBA opportunity. You can assess each one using the FBA Form, and the system will automatically calculate whether it passes or fails.", "actions": [{"t": "Search Products", "d": "Type a product name, ASIN, or supplier to instantly filter the list down to matching products.", "c": "purple", "run": "var el=document.getElementById('searchInput');if(el){el.focus();el.style.boxShadow='0 0 0 4px rgba(24,71,212,.3)';setTimeout(function(){el.style.boxShadow=''},1000)}"}, {"t": "View Approved Only", "d": "Click the green Approved chip at the top to filter down to only the products that have passed all FBA criteria.", "c": "green", "run": "filterByStatus('approved')"}, {"t": "View Rejected Only", "d": "Click the red Rejected chip to see which products didn't pass — you can still open them and update the FBA Form if conditions change.", "c": "amber", "run": "filterByStatus('rejected')"}, {"t": "Assess a Product", "d": "Click any card to open the detail panel, then go to the <strong>FBA Form</strong> tab to fill in the assessment fields and get an instant pass/fail result.", "c": "blue", "run": "var cards=document.querySelectorAll('.fba-card,.fba-list-item');if(cards.length)cards[0].click()"}], "steps": [{"t": "Products appear here automatically", "d": "Any product in the Listing & Veeqo page that has been flagged as an FBA opportunity shows up here. You don't add them manually — the flag is set automatically when the right conditions are met."}, {"t": "Open a product and fill in the FBA Form", "d": "Click any card to open the detail drawer, then switch to the <strong>FBA Form</strong> tab. Fill in the assessment fields — DG status, FBA fees, competition, parcel weight, standard pack size, ASIN sales, and profit ROI."}, {"t": "The result is calculated live", "d": "As you fill in the fields, the system walks you through each condition step by step. Once all required fields are filled, a green <strong>Approved</strong> or red <strong>Rejected</strong> result appears at the bottom — along with the specific reason if it fails."}, {"t": "Everything saves automatically", "d": "There's no Save button on the FBA Form — every field saves 300ms after you stop typing. The \"Saved ✓\" indicator in the footer confirms it. The assessment result is also saved, so it persists across sessions."}], "tips": ["The drawer shows <strong>Product Details</strong> (VAT, MAP, Pack of, Parcel, Sales volume) read-only — edit them in Listing or Basket.", "Use the <strong>← → arrow keys</strong> to navigate between products while the detail drawer is open — no need to close and reopen it each time.", "Switch between <strong>Grid and List view</strong> using the toggle buttons in the top right of the toolbar — list view is more compact when you have a lot of products to scan through.", "The <strong>DG (Dangerous Goods)</strong> field changes the profit threshold — DG products need ≥45% ROI, non-DG products need ≥35%. Make sure this is set correctly before reading the result.", "The <strong>FBA Form reveals fields progressively</strong> — each field only appears once the previous condition is met. This guides you through the assessment in the correct order and prevents confusion."], "tour": [{"s": ".tnav-chips", "t": "Status Chips", "d": "These three chips show live counts — all FBA products, approved ones, and rejected ones. <strong>Click any chip</strong> to filter the list to just that status. Click it again to clear the filter.", "f": null}, {"s": ".search-box", "t": "Search Products", "d": "Type a product name, ASIN, or supplier to instantly filter the list. Results update as you type — no need to press Enter.", "f": null}, {"s": ".view-toggle", "t": "Grid or List View", "d": "Toggle between <strong>Grid view</strong> (card layout, more detail) and <strong>List view</strong> (compact rows, easier to scan when you have many products).", "f": null}, {"s": ".fba-content", "t": "The Product List", "d": "Every product flagged as an FBA opportunity appears here. Each card shows the name, ASIN, date, quantity, sales, FBA fees, and whether it has DG status. The left border colour indicates the assessment result.", "f": null}, {"s": ".fba-card,.fba-list-item", "t": "Product Cards", "d": "Click any card to open the detail drawer. The left border is <strong>green</strong> for approved, <strong>red</strong> for rejected, and grey for pending assessment. The status badge in the top right confirms the result.", "f": ".fba-content"}], "name": "FBA Opportunities", "section": "Products", "pages": ["fbaopportunities"]}, "calendar": {"summary": "This is where the team plans and tracks supplier sourcing week by week — who's going where, how many hours are assigned, and how the budget is holding up.", "actions": [{"t": "Schedule a Block", "d": "Assign an agent to visit a supplier on a specific day with a set number of hours. You can also add categories and must-do notes.", "c": "blue", "run": "var el=document.querySelector('.nav-btn.primary');if(el){el.style.transition='box-shadow .2s,transform .2s';el.style.boxShadow='0 0 0 4px rgba(24,71,212,.4)';el.style.transform='scale(1.06)';setTimeout(function(){el.style.boxShadow='';el.style.transform='';openBlockModal();},500)}"}, {"t": "Set the Weekly Budget", "d": "Set how much is available to spend on sourcing this week. The budget bar at the top tracks how much has been used and what's left.", "c": "amber", "run": "var el=document.querySelector('.nav-btn[onclick=\\'openBudgetModal()\\']');if(el){el.style.transition='box-shadow .2s,transform .2s';el.style.boxShadow='0 0 0 4px rgba(24,71,212,.4)';el.style.transform='scale(1.06)';setTimeout(function(){el.style.boxShadow='';el.style.transform='';openBudgetModal();},500)}"}, {"t": "View Insights", "d": "Open the Insights panel to see hours by agent and supplier, a daily load heatmap, catalog approval rates, and which suppliers haven't been visited recently.", "c": "purple", "run": "openInsightsModal();"}], "steps": [{"t": "Set the week's budget", "d": "Click <strong>Budget</strong> in the top right to enter how much is available for sourcing this week."}, {"t": "Schedule sourcing blocks", "d": "Click <strong>Add Block</strong> or hover over any day cell and click <strong>+ Add</strong>. Choose the agent, date, supplier, how many hours to allocate, and any categories or notes for sourcing"}, {"t": "Track progress during the week", "d": "Click any block to open its detail panel. Use the status button in the bottom right to move it from <strong>Not started</strong> → <strong>In progress</strong> → <strong>Done</strong>. You can add a completion note when marking it done."}, {"t": "Review with Insights", "d": "Click <strong>Insights</strong> at the end of the week or at any time to review how hours were distributed across agents and suppliers, check catalog approval rates, and identify suppliers that haven't been visited recently."}], "tips": ["The <strong>blue hours badge</strong> on each agent's photo updates live as you add or remove blocks — use it to spot if someone is overloaded or has capacity to spare.", "You can <strong>drag any sourcing block</strong> from one cell to another to reschedule it. Drop it on a different day or a different agent's row and it saves automatically.", "The budget bar turns <strong>amber</strong> when 70% is used and <strong>red</strong> at 90% — a heads-up before you overspend.", "Use the <strong>left and right arrows</strong> to navigate between weeks. Each week has its own blocks, budget, and replenishments — everything updates when you switch.", "The <strong>Agents</strong> button lets you hide agents from the calendar view — useful when you only want to focus on one or two people's schedule for the week."], "tour": [{"s": ".budget-bar", "t": "The Budget Bar", "d": "This strip tracks the week's money at a glance — the <strong>budget set</strong>, how much has been <strong>spent</strong> from purchases, and what's still <strong>outstanding</strong>. The progress bar fills as you spend, turning amber at 70% and red at 90%.", "f": null}, {"s": "#bgtTotal", "t": "Weekly Budget", "d": "This is the budget you set for this week — the amount available for sourcing before purchases and replenishments are deducted.", "f": null}, {"s": ".tnav-actions", "t": "The Action Buttons", "d": "<strong>Budget</strong> sets or updates this week's budget. <strong>Add Block</strong> creates a new sourcing visit.", "f": null}, {"s": ".week-nav", "t": "Moving Between Weeks", "d": "Use the left and right arrows to jump between weeks. Each week has its own blocks, budget, and replenishments — everything updates when you switch. The label shows the current week's date range.", "f": null}, {"s": ".cal-grid", "t": "The Sourcing Calendar", "d": "This is the main grid. Each <strong>row</strong> is an agent, each <strong>column</strong> is a day of the week. Today's column is highlighted in blue. Weekend columns have a subtle striped background.", "f": null}, {"s": ".cal-agent-hdr", "t": "Agent Rows", "d": "Each agent has their own row. The <strong>blue badge</strong> at the top of their photo shows total hours scheduled this week. Use the <strong>Agents</strong> button at the top to show or hide specific agents.", "f": null}, {"s": ".day-block", "t": "Sourcing Blocks", "d": "Each card is a planned supplier visit. It shows the <strong>supplier name</strong>, <strong>product categories</strong>, and <strong>hours</strong> allocated. The coloured strip on the left edge shows the block's status.", "f": ".cal-cell"}, {"s": ".day-block", "t": "Block Status", "d": "The left edge colour tells you the status at a glance: <strong>no colour</strong> = not started, <strong>amber</strong> = in progress, <strong>green</strong> = done. Open a block and use the button in the bottom right of the panel to update it.", "f": ".cal-cell"}, {"s": ".tnav-chips", "t": "Quick Stats", "d": "The chips at the top left show live totals for the current week — <strong>total hours</strong> scheduled across all agents and the <strong>number of sourcing blocks</strong> on the calendar.", "f": null}, {"s": ".insights-pill-btn:first-child", "t": "Insights", "d": "Click <strong>Insights</strong> to open a full breakdown of the week — hours per agent, supplier visit distribution, a daily load heatmap, catalog approval rates, and which suppliers haven't been sourced in over 7 days.", "f": null}, {"s": ".insights-pill-btn:last-of-type", "t": "Managing Agents", "d": "The <strong>Agents</strong> button lets you control who appears on the calendar. Toggle agents on or off to focus the view without removing their blocks permanently.", "f": null}], "name": "Calendar", "section": "Products", "pages": ["calendar"]}, "suppliers": {"summary": "This page is the central hub for all supplier relationships and their product catalogs. The left panel shows supplier details; the right panel shows that supplier's catalog — which you can upload, review, approve, and send to sourcing.", "actions": [{"t": "Switch Supplier", "d": "Click the supplier selector at the top left to switch between suppliers and view their individual catalog and details.", "c": "blue", "run": "toggleSupDropdown()"}, {"t": "Add a Supplier", "d": "Add a new supplier with their contact details, MOQ, cash back, account limit, card status, website, and login credentials.", "c": "green", "run": "openAddDrawer()"}, {"t": "Upload a Catalog", "d": "Upload a CSV or XLSX pricelist for the selected supplier (pick a supplier first). New lines and price changes are detected and shown before you confirm.", "c": "amber", "run": "if(document.querySelector('#scCatContent tr[data-kid]')){openImportDrawer()}else{pgPulse('#scSupFilter')}"}, {"t": "View All Catalog", "d": "Open a full-screen view of every product across all suppliers — searchable, filterable, and downloadable as CSV. EANs with multiple suppliers are grouped together.", "c": "purple", "run": "openAllCatalog()"}], "steps": [{"t": "Select a supplier from the dropdown", "d": "Click the supplier selector at the top of the left panel. This loads their profile — MOQ, cash back, contact details, website and login credentials, notes, and sourcing stats — alongside their full catalog on the right."}, {"t": "Upload or update their catalog", "d": "Click <strong>Upload</strong> in the top right, drop in a CSV or XLSX file, pick the header row, map columns (EAN, product name, cost), and click Confirm. The system compares against existing data and highlights <strong>New Lines</strong> and <strong>Price Changes</strong> before importing."}, {"t": "Review and approve catalog products", "d": "Use the status dropdown on each row, or the keyboard: <strong>↑ ↓</strong> to move, <strong>L</strong> to approve (opens the 4-step approve form), <strong>X</strong> to reject. Use <strong>Select</strong> to bulk-approve, reject or delete."}, {"t": "View price changes and new lines in Insight", "d": "Click the three-dot menu on any supplier card and select <strong>Insight</strong> to see a focused view of price changes and new lines from the latest import — with a PDF download option for each section."}], "tips": ["Keyboard shortcuts work in each supplier view and in All Catalog: <strong>↑ ↓</strong> move · <strong>A</strong> Amazon search · <strong>G</strong> Google image search · <strong>L</strong> approve · <strong>X</strong> reject. Click ⓘ in the toolbar for a reminder.", "Click any <strong>EAN</strong> to copy it.", "The count pill shows <strong>Total · Rejected · Approved</strong>; picking a status filter shows that status’s count inside the dropdown.", "Status changes appear instantly and save in the background — if a save fails it switches back and tells you.", "In <strong>All Catalog</strong>, rows with the same EAN from different suppliers are grouped together — easy to spot the best price. <strong>Download</strong> exports to CSV.", "The three-dot menu on a supplier card gives access to Edit, Insight, Add Supplier and Delete."], "tour": [{"s": ".sc-left", "t": "Supplier Panel", "d": "The left panel shows your supplier list and — once a supplier is selected — their profile: MOQ, cash back, contact details, website, login credentials, notes, and sourcing stats.", "f": null}, {"s": "#scSupFilter", "t": "Supplier Selector", "d": "Click here to open the supplier dropdown. Search by name and select a supplier to load their catalog and profile. The currently active supplier is highlighted.", "f": null}, {"s": ".sc-right-top", "t": "Catalog Header", "d": "This toolbar gives you quick access to <strong>All Catalog</strong> (full cross-supplier view), and <strong>Upload</strong> (import a new pricelist CSV or XLSX for the current supplier).", "f": null}, {"s": ".sc-cat-toolbar", "t": "Search &amp; Filter", "d": "Search the catalog by EAN or product name. Filter by status (Approved, Rejected, Price Changes, New Lines). Use <strong>Select</strong> to enter bulk mode — approve, reject, or delete multiple rows at once.", "f": null}, {"s": ".sc-cat-content", "t": "The Catalog Table", "d": "Every product from the selected supplier appears here. Each row shows the EAN, product name, cost, and status. The ▲/▼ cost indicator shows price changes from the last import; ★ marks brand new lines. Click any EAN to search for product images on Google.", "f": ".sc-right"}], "name": "Suppliers", "section": "Procurement", "pages": ["suppliers"]}, "offers": {"summary": "This page is where supplier offer sheets land — imported from CSV, XLSX, or PDF. Review each offer, compare it against catalog prices, and approve or reject it to move products into the sourcing pipeline.", "actions": [{"t": "Upload a Pricelist", "d": "Import offers from a CSV, XLSX, or PDF file. You'll map columns to fields and pick a supplier before the data lands on the board.", "c": "blue", "run": "openImportOffersDrawer()"}, {"t": "Search Offers", "d": "Type a product name, EAN, or supplier to instantly filter all offers across the board in real time.", "c": "purple", "run": "var el=document.getElementById('searchInput');if(el){el.focus();el.style.boxShadow='0 0 0 4px rgba(24,71,212,.3)';setTimeout(function(){el.style.boxShadow=''},1000)}"}, {"t": "Smart Filters", "d": "Filter by catalog status, price vs catalog, number of competing suppliers, price range, or cheapest-per-EAN — combine any of them at once.", "c": "amber", "run": "toggleSmartFilters()"}, {"t": "View Rejected Offers", "d": "Click the red Rejected chip to see all offers that were rejected, along with the reason and who rejected them.", "c": "green", "run": "openRejectedModal()"}], "steps": [{"t": "Upload a supplier pricelist", "d": "Click <strong>Upload</strong> and drop in a CSV, XLSX, or PDF. Select the header row, map the Product Name column (and optionally EAN and cost), pick the supplier, then confirm. All rows land on the board instantly."}, {"t": "Review offers on the Kanban board", "d": "Each supplier gets its own column. Cards show the product name, EAN, cost, and — when available — how the price compares to what's already in the catalog. Green badges mean cheaper than catalog; red means more expensive."}, {"t": "Approve or reject each offer", "d": "Click the price pill on any card to open the detail panel. Use the <strong>Approve</strong> button to fill in sourcing details and move it to the Sourcing page, or <strong>Reject</strong> to log a reason and move it to the rejected list. You can also use the quick action buttons directly on the card."}, {"t": "Approve with the 4-step form", "d": "Approving opens a form split into <strong>Product</strong>, <strong>Supplier</strong>, <strong>Financials</strong> and <strong>Attributes</strong>. Click any step to move around; <strong>Approve</strong> on step 4 checks every required field (incl. VAT, MAP and Pack of per ASIN) and creates the sourcing entry."}], "tips": ["Switch between <strong>Kanban, Card, and Table views</strong> using the toggle in the toolbar. Kanban groups offers by supplier; Card view shows everything in a flat grid; Table is the most compact for scanning large batches.", "Use <strong>Merge</strong> to combine two supplier columns that represent the same supplier with slightly different names. Select two or more — the first selected name is used as the target.", "The <strong>Cheapest for EAN</strong> smart filter highlights only the best-priced offer for each EAN across all suppliers — ideal when the same product appears from multiple sources.", "When a detail drawer is open in Kanban view, use the <strong>← → arrow keys</strong> to navigate between offers from the same supplier — no need to close and reopen."], "tour": [{"s": ".tnav-chips", "t": "Status Chips", "d": "These chips show live counts — total active offers, number of unique suppliers, and how many offers have been rejected. Click the <strong>red Rejected chip</strong> to see rejected offers with their reasons.", "f": null}, {"s": ".search-box", "t": "Search Offers", "d": "Type a product name, EAN, or supplier name to instantly filter across the entire board. Results update in real time as you type.", "f": null}, {"s": ".toolbar .tb-left", "t": "Toolbar Actions", "d": "<strong>Upload</strong> imports a new pricelist (CSV, XLSX, or PDF). <strong>Merge</strong> combines two supplier columns that represent the same supplier. The three view buttons switch between Kanban, Card, and Table layouts.", "f": null}, {"s": "#sfToggleBtn", "t": "Smart Filters", "d": "Open the filter bar to narrow offers by catalog status, price vs catalog, number of competing suppliers, price range, or cheapest-per-EAN. Combine any filters at once.", "f": null}, {"s": ".offers-content", "t": "The Offers Board", "d": "All active offers appear here grouped by supplier. Each card shows the product, EAN, cost, and catalog price comparison. Cards with a <strong>green savings badge</strong> are cheaper than what's already in the catalog.", "f": null}, {"s": ".k-col,.c-card,.data-tbl", "t": "Reviewing Offers", "d": "Click the <strong>price pill</strong> on any card to open the full detail panel — where you can Approve or Reject the offer. Quick action buttons (✓ reject delete) also appear on hover for faster triage.", "f": ".offers-content"}], "name": "Offers", "section": "Procurement", "pages": ["offers"]}, "replenishments": {"summary": "Your weekly tool for reviewing what needs restocking — upload three Veeqo files, work through the review queue one product at a time, and keep a clear record of what's been purchased, rejected, or unavailable.", "actions": [{"t": "Upload Files", "d": "Upload the three weekly Veeqo exports to generate this week's replenishment list. Clearance lines are stripped and SKUs are mapped automatically.", "c": "blue", "run": "showUpload()"}, {"t": "Search SKUs", "d": "Type a product name, SKU code, or EAN to instantly filter both the review queue and the actioned bucket at the same time.", "c": "purple", "run": "var el=document.getElementById('searchInput');if(el){el.focus();el.style.boxShadow='0 0 0 4px rgba(24,71,212,.3)';setTimeout(function(){el.style.boxShadow=''},1000)}"}, {"t": "View Insights", "d": "Open the weekly Insights modal to see action breakdowns, purchase totals, estimated spend, critical SKU tracking, and week-by-week history navigation.", "c": "amber", "run": "openRepInsights()"}, {"t": "Reset the Week", "d": "Clear all actions and notes for the current list so you can start the review session over. Rejected SKUs are preserved unless you explicitly choose to delete them too.", "c": "red", "run": "confirmReset()"}], "steps": [{"t": "Upload three Veeqo files", "d": "Click <strong>Upload</strong> and drop in the three weekly exports — <strong>File 1</strong> is the full forecast, <strong>File 2</strong> is the clearance forecast (used to strip clearance lines automatically), and <strong>File 3</strong> is the full SKU catalog for code and image mapping. Click <strong>Generate List</strong> to process."}, {"t": "Work through the Review Queue", "d": "Products appear sorted by urgency — most critical first. You see one product at a time on the left. Each card shows the product image or initials avatar, urgency badge, days of stock remaining, daily sell rate, and a full quantity breakdown showing the recommended order quantity."}, {"t": "Action each SKU", "d": "Choose one of three actions — <strong>Purchased</strong> if you've placed the order, <strong>Not available</strong> if the product can't be sourced right now (it will reappear next week), or <strong>Reject</strong> to permanently skip this SKU in all future uploads. Add a note for context. After any action the next product loads automatically."}, {"t": "Track progress in the Actioned Bucket", "d": "Everything you action moves to the right panel instantly. Filter by status tab (Purchased, Not available, Deferred, In Basket, Rejected) — each shows a live count. Use the ↩ undo button on any card to send it back to the review queue. Your session auto-saves to the database — closing the tab never loses progress."}], "tips": ["The <strong>Catalog &amp; Offer Prices</strong> panel on each review card shows the cheapest catalog price (green) and live offer prices (blue) for that EAN. Expand it before deciding whether to purchase — it tells you who to buy from and at what cost.", "Purchased SKUs come back into the review queue on the next upload if they need restocking again — every purchase is still kept in the Basket’s <strong>Purchased</strong> history.", "<strong>Not available</strong> clears on the next upload so the product reappears for review if still needed. <strong>Reject</strong> is permanent — use it only for products that should never be replenished again (discontinued lines). You can undo a Reject from the bucket before closing the tab.", "The <strong>EAN barcode link</strong> on each card opens a Google Image Search for that barcode — a quick way to visually verify you're looking at the right product without leaving the page.", "The <strong>Insights button</strong> at the top left shows a full weekly summary — action breakdown with a donut chart, estimated spend, critical SKUs, top purchased by order quantity, and week-by-week history you can navigate with the arrow buttons."], "tour": [{"s": ".topnav", "t": "Status Chips", "d": "The chips here give you a live count of total SKUs, how many are purchased, how many are still pending, and how many are critical. They update every time you action a product.", "f": null}, {"s": ".search-box", "t": "Search", "d": "Type a product name, SKU code, or EAN barcode to instantly filter both the review queue and the actioned bucket simultaneously. Clearing the search restores everything automatically.", "f": null}, {"s": "#uploadZone", "t": "Upload Files", "d": "Each week you upload three Veeqo CSV exports here. <strong>File 1</strong> is the full forecast, <strong>File 2</strong> is the clearance forecast (used to strip clearance lines automatically), and <strong>File 3</strong> is the SKU catalog for image and code mapping.", "f": ".upload-card"}, {"s": ".queue-panel", "t": "The Review Queue", "d": "After uploading, products appear here sorted by urgency — most critical first. Work through them one at a time. The progress bar fills as you action each product.", "f": null}, {"s": ".focus-card", "t": "The Review Card", "d": "Each card shows the product image (or initials avatar), urgency badge, days of stock left, and daily sell rate. Below that is a quantity breakdown and — when available — catalog and offer prices.", "f": ".queue-body"}, {"s": ".focus-card-actions", "t": "Action Buttons", "d": "<strong>Purchased</strong> — order placed. <strong>Not available</strong> — can't source right now, reappears next week. <strong>Reject</strong> — permanently skips this SKU across all future uploads. After any action the next product loads automatically.", "f": ".focus-card"}, {"s": ".queue-nav", "t": "Queue Navigation", "d": "Use Prev and Next to browse the queue without actioning products — useful for previewing what's coming up. The counter shows your position.", "f": null}, {"s": ".bucket-panel", "t": "The Actioned Bucket", "d": "Everything you action moves here instantly. Filter by status tab, sort by recency, days, or name. The ↩ undo button on any card sends it back to the review queue and navigates directly to it.", "f": null}, {"s": ".bucket-header", "t": "Status Tabs", "d": "Filter the bucket by <strong>Purchased</strong>, <strong>Not available</strong>, <strong>Deferred</strong>, <strong>In Basket</strong>, or <strong>Rejected</strong>. Each tab shows a live count of how many items currently sit in that status.", "f": null}, {"s": ".ri-pill-btn", "t": "Insights", "d": "Click here to open the weekly Insights modal — action breakdown with a donut chart, estimated spend, top purchased SKUs, critical SKU tracking, and week-by-week history navigation.", "f": null}], "name": "Replenishments", "section": "Procurement", "pages": ["replenishments"]}, "basket": {"name": "Basket", "section": "Procurement", "pages": ["basket"], "summary": "Everything approved for purchase — New Lines from Sourcing and Replenishment reorders — grouped by supplier, with budget tracking and a full purchase history.", "actions": [{"t": "Add to Basket", "d": "Manually add a New Line or a Replenishment. Start with the EAN — the form recognises known products and reorders.", "c": "blue", "run": "pgCall('openCbAddModal')"}, {"t": "Open Insights", "d": "See weekly spend by supplier and how it tracks against the budget.", "c": "purple", "run": "pgCall('openCbInsightsModal')"}, {"t": "Set the weekly budget", "d": "Set how much can be spent this week — the budget bar tracks it live.", "c": "green", "run": "pgCall('openCbBudgetModal')"}, {"t": "Download a purchase summary", "d": "Generate a PDF of purchases for a supplier and period.", "c": "amber", "run": "pgCall('openCbPdfModal')"}], "steps": [{"t": "Products land here automatically", "d": "Approved Sourcing products (New Lines) and Replenishment items marked for purchase appear in <strong>To Purchase</strong>, grouped by supplier."}, {"t": "Check and adjust each line", "d": "Click a line to open its drawer — supplier, cost, quantity, cases, notes and <strong>Product Details</strong> (VAT, MAP, per-ASIN Pack of, Parcel, Sales volume)."}, {"t": "Move to Inquire if needed", "d": "Use <strong>Inquire</strong> for lines you need to check with the supplier first."}, {"t": "Mark purchased", "d": "Mark a line purchased once ordered. It moves to <strong>Purchased</strong>, which keeps every purchase — including repeat reorders of the same SKU."}], "tips": ["Adding manually: a product already in the basket can’t be added twice — you’ll see “Already in the basket” with an <strong>Open it</strong> button instead.", "Changing a sales volume in Product Details updates the line’s Unit Quantity (the total of all ASINs’ sales volumes).", "Use the date range button to look at a specific week or custom period — totals and the PDF follow it.", "Search works across product, EAN and supplier."], "tour": [{"s": "#cbTabBar", "t": "Basket tabs", "d": "<strong>To Purchase</strong>, <strong>Inquire</strong> and <strong>Purchased</strong> — the counts update live.", "f": null}, {"s": "#cbBudgetWidget", "t": "Weekly budget", "d": "Shows this week’s budget and how much is used. Click to set or change it.", "f": null}, {"s": ".cb-toolbar-row", "t": "Search and dates", "d": "Search by product, EAN or supplier and choose the period to view.", "f": null}, {"s": "#cbBody", "t": "The basket", "d": "Lines grouped by supplier with totals. Click any line to open its details.", "f": null}]}, "fba": {"summary": "This page tracks Amazon FBA preparation from start to finish. Products move through a Kanban board — from Warehouse prep, through Digital Ops, to Completed — giving the whole team a clear view of every shipment's status.", "actions": [{"t": "Add Work", "d": "Create a new work item by entering one or more label codes. The system auto-fills prep details from the FBA Products and groups multiple codes into a single batch record.", "c": "amber", "run": "openAddWorkModal()"}, {"t": "View Products", "d": "Open the FBA Products — the master list of all products with their prep instructions, packaging requirements, ASIN, barcode image, and product image.", "c": "blue", "run": "openProductsModal()"}, {"t": "Work Table", "d": "See all work items in a flat table view — searchable, with status badges. Click any row to open its full detail drawer for editing.", "c": "amber", "run": "openWorkTableModal()"}, {"t": "View Completed", "d": "See all records that have completed the full pipeline — units completed, UPS collected, and Veeqo stock adjusted.", "c": "green", "run": "showCompletedModal()"}], "steps": [{"t": "Add a product to FBA", "d": "Click <strong>Products → Add Product</strong> to create an FBA product record. Set the label code, brand, ASIN, all prep options (poly bag, warning label, barcode, box, bundle, DG label), and upload the product image and barcode image. This becomes the prep reference for all future work items."}, {"t": "Create a work item", "d": "Click <strong>Work → Add Work</strong> and enter one or more label codes with their unit quantities. The system auto-matches each code to the FBA Products and shows the full prep brief. Multiple label codes become a single batch work item. Add a grouping link, collection date, and grouping images if needed."}, {"t": "Work through the Kanban board", "d": "New work items land in <strong>Warehouse</strong>. Click any card to open the detail drawer. The Warehouse tab lets you mark units completed and toggle UPS Collected. Once units are completed and UPS is collected, the card moves to <strong>Digital Ops</strong> — where Veeqo Stock Adjusted is toggled. After that, the record is Completed."}, {"t": "Track completion", "d": "The green <strong>Completed</strong> chip in the header shows how many records have finished the full pipeline. Click it to see the full completed list. All data syncs in real time — changes made on any device are reflected immediately."}], "tips": ["A work item's <strong>Kanban column is determined automatically</strong> by its data — not by dragging. Units Completed + UPS Collected → Digital Ops. Then Veeqo Stock Adjusted → Completed. You can never move a card to the wrong stage.", "When adding work with <strong>multiple label codes</strong>, all codes are grouped into a single batch work item. The drawer shows each product's image, prep options, and barcode in a numbered list — so the warehouse team sees everything they need in one place.", "The <strong>Delete button</strong> requires two clicks — the first click turns it red and says \"Confirm?\", and you have 3 seconds to click again to confirm. This prevents accidental deletions. The button resets automatically if you don't confirm.", "You can upload <strong>PDF files</strong> for both product images and barcode images — they are automatically converted to PNG on upload."], "tour": [{"s": ".page-header", "t": "Status Chips &amp; Search", "d": "The chips show total work items and how many are completed. The green chip is clickable — it opens the completed records list. Use the search box to filter cards by label code, brand, or ASIN.", "f": null}, {"s": ".header-actions", "t": "Work &amp; Products Buttons", "d": "<strong>Work</strong> opens the work table and lets you add new work items. <strong>Products</strong> opens the FBA Products — the master list of all products and their prep instructions.", "f": null}, {"s": ".kanban-wrapper", "t": "The Kanban Board", "d": "Work items flow left to right: <strong>Warehouse</strong> (prep in progress) → <strong>Digital Ops</strong> (units complete, UPS collected, awaiting Veeqo adjustment). The column a card sits in is determined automatically by its data.", "f": ".page-wrapper"}, {"s": ".kanban-column:first-child", "t": "Warehouse Column", "d": "Cards here need physical prep — poly bagging, labelling, boxing. Click any card to open the detail drawer, where you can see the full prep brief, mark units completed, and toggle UPS Collected.", "f": ".kanban-wrapper"}, {"s": ".kanban-column:nth-child(2)", "t": "Digital Ops Column", "d": "Cards here have been physically prepped and collected by UPS. The final step is toggling <strong>Veeqo Stock Adjusted</strong> in the detail drawer — after that, the record moves to Completed.", "f": ".kanban-wrapper"}, {"s": ".kanban-card", "t": "A Work Item Card", "d": "Each card shows the label code, brand, ASIN, units required, and all prep option chips (Poly, Barcode, Box, DG, etc.). Click the card to open the full detail drawer with tabs for Product Info, Prep, and Warehouse.", "f": ".kanban-wrapper"}], "name": "FBA", "section": "Warehouse", "pages": ["fba"]}, "taskmanager": {"name": "Task Manager", "section": "Warehouse", "pages": ["taskmanager"], "summary": "Plan and track warehouse tasks — create tasks with owners, priority and deadlines, and move them through to Done on a Kanban board or list.", "actions": [{"t": "Create a task", "d": "Add a task with title, description, owners, priority, status and deadline.", "c": "blue", "run": "pgCall('tmOpenCreate')"}, {"t": "Switch to List view", "d": "See every task in a sortable list instead of the board.", "c": "purple", "run": "pgCall('tmSetView','list')"}, {"t": "Filter by priority", "d": "Narrow the board to the priorities you care about.", "c": "amber", "run": "pgPulse('#tmToolbar')"}], "steps": [{"t": "Create the task", "d": "Click <strong>Create Task</strong>, give it a clear title, choose one or more owners, a priority and a deadline."}, {"t": "Work it through the board", "d": "Tasks move across status columns as work progresses — open a task to change its status."}, {"t": "Discuss in comments", "d": "Each task has <strong>Comments</strong> and an <strong>Activity</strong> log so everyone sees what changed."}, {"t": "Finish and review", "d": "Mark tasks Done; use the To-do / Done toggle to switch between open and finished work."}], "tips": ["Use Sort and Group by in the toolbar to organise the board your way.", "Deleting a task also removes its comments — you’ll be asked to confirm."], "tour": [{"s": "#tmHeader", "t": "Header", "d": "Switch between Kanban and List and create new tasks.", "f": null}, {"s": "#tmToolbar", "t": "Toolbar", "d": "Filter, sort, group and toggle To-do / Done.", "f": null}, {"s": "#tmBoard", "t": "The board", "d": "Click any task to open its details, comments and activity.", "f": null}]}, "inventory": {"name": "Inventory Analysis", "section": "Warehouse", "pages": ["inventory"], "summary": "See how fast stock is selling — sell-through, weeks of cover and stock value per SKU — so you can spot slow lines and act before capital gets stuck.", "actions": [{"t": "Sync from Seller Snap", "d": "Pull the latest sales and stock figures.", "c": "blue", "run": "pgPulse('#syncBtn')"}, {"t": "Search SKUs", "d": "Find a product by name or SKU.", "c": "purple", "run": "pgFocus('#searchInput')"}, {"t": "Show slow movers", "d": "Use the status tabs to focus on Slow, Offload or No sales lines.", "c": "amber", "run": "pgPulse('#tabsRow')"}], "steps": [{"t": "Sync the latest data", "d": "Click <strong>Sync from Seller Snap</strong> to load units sold and stock on hand."}, {"t": "Read the banner", "d": "Overall sell-through, the share of strong + moderate lines, slow/offload counts and the capital tied up in them."}, {"t": "Filter by status", "d": "Tabs group SKUs into Strong, Moderate, Slow, Offload and No sales. Combine with the FBA/FBM filter and sort."}, {"t": "Action slow lines", "d": "Use <strong>Price drop</strong> on a row to mark it actioned; <strong>Clear Actions</strong> resets them."}], "tips": ["Sort by Weeks of cover to find lines that will take longest to sell through.", "Stock value helps prioritise — a slow line with high value matters more than a cheap one."], "tour": [{"s": "#syncBtn", "t": "Load the data", "d": "Click <strong>Sync from Seller Snap</strong> to pull the latest stock and sales for every SKU.", "f": null}, {"s": "#invStatsBanner", "t": "Sell-through summary", "d": "The key numbers for the current filter.", "f": null}, {"s": "#tabsRow", "t": "Status tabs", "d": "Strong, Moderate, Slow, Offload, No sales — with counts.", "f": null}, {"s": ".ia-table-scroll", "t": "SKU table", "d": "Units sold, stock, weeks of cover, status and action per SKU.", "f": null}]}, "deliverychecks": {"summary": "This page tracks post-arrival tasks for warehouse deliveries. Once a sourcing order is marked as arrived, it appears here — and you work through two tasks for each product: sharing images and printing the SKU label.", "actions": [{"t": "Show Action Needed", "d": "Switch to the Action Needed filter to see only deliveries that still have outstanding tasks — images not yet shared, or SKU label not yet printed.", "c": "amber", "run": "setFilter('pending')"}, {"t": "Show Fully Complete", "d": "Switch to the Fully Complete filter to see all deliveries where both images have been shared and the SKU label has been printed.", "c": "green", "run": "setFilter('done')"}, {"t": "Show All Arrivals", "d": "View every warehouse arrival in one list regardless of task status — useful for a full overview or when searching across all records.", "c": "blue", "run": "setFilter('all')"}, {"t": "Search Products", "d": "Type a product name, supplier name, code, ASIN, or opportunity ID to instantly filter the table in real time. Works within the active filter.", "c": "purple", "run": "var el=document.getElementById('searchInput');if(el){el.focus();el.style.borderColor='var(--accent)';setTimeout(function(){el.style.borderColor=''},1000)}"}], "steps": [{"t": "Delivery arrives — record appears here", "d": "When a sourcing opportunity is marked as <strong>Warehouse = Yes</strong> and <strong>Arrived = Yes</strong> in the sourcing page, it automatically shows up in this list, sorted by arrival date (most recent first). You don't need to add anything manually."}, {"t": "Enter the Bin Location", "d": "Click the Bin Location field on any row and type where the stock has been placed in the warehouse (e.g. A1-03). The value is saved automatically when you click away — no save button needed."}, {"t": "Toggle Images Shared", "d": "Click the <strong>Images Shared</strong> toggle to mark whether product images have been shared with the relevant team. The toggle switches between Yes (green) and No (red) and saves instantly."}, {"t": "Toggle SKU Label Printed", "d": "Click the <strong>SKU Label Printed</strong> toggle once the label has been printed for the product. When both toggles are green, the status dots turn fully green and the row moves off the Action Needed list automatically."}], "tips": ["The page loads with <strong>Action Needed</strong> selected by default — so you always open on what still needs doing, not on already-completed records.", "When you mark both tasks complete on a row while in <strong>Action Needed</strong> view, the row fades out smoothly and disappears — keeping the list clean without a manual refresh.", "The two <strong>status dots</strong> on the right of each row give an at-a-glance summary: left dot = Images Shared, right dot = SKU Label Printed. Both green means fully complete.", "All changes — bin location and both toggles — save <strong>directly</strong> without any save button. A brief \"Saving…\" indicator appears and is replaced by a success or error."], "tour": [{"s": ".topba-left", "t": "Filter Pills", "d": "Switch between <strong>All</strong>, <strong>Fully Complete</strong>, and <strong>Action Needed</strong> to focus on what matters. The count badge on each pill updates live as you toggle tasks.", "f": null}, {"s": ".search-box", "t": "Search", "d": "Type a product name, supplier, code, ASIN, or opportunity ID to filter the table instantly. Search works within whatever filter pill is currently active.", "f": null}, {"s": ".table-card", "t": "The Delivery Table", "d": "Each row is one warehouse arrival. The table shows the arrival date, product name, supplier, code, bin location, and two task toggles. Rows are sorted by date — most recent first.", "f": ".dc-content"}, {"s": ".data-tbl td:nth-child(4)", "t": "Bin Location", "d": "Click the Bin Location field on any row and type the warehouse location (e.g. A1-03). It saves automatically when you click away — no button needed.", "f": ".table-card"}, {"s": ".yn.yes,.yn.no", "t": "Yes / No Toggles", "d": "Click <strong>Images Shared</strong> or <strong>SKU Label Printed</strong> to toggle between Yes (green) and No (red). Each click saves immediately and shows a brief saving indicator.", "f": ".table-card"}, {"s": ".dots", "t": "Status Dots", "d": "The two dots on the right give a quick visual summary for each row. Left dot = Images Shared, right dot = SKU Label Printed. Both green means the delivery is fully complete and will disappear from Action Needed view.", "f": ".table-card"}], "name": "Delivery Checks", "section": "Warehouse", "pages": ["deliverychecks"]}, "packagingfault": {"summary": "This page is the central log for all packaging faults — Warehouse and Digital. Log a fault when an order is affected, track who was responsible, and mark it resolved once the issue is addressed.", "actions": [{"t": "Log a Fault", "d": "Record a new packaging fault — enter the tracking ID, order number, order date, value, fault type (Warehouse or Digital), and the responsible person.", "c": "red", "run": "openNewFaultModal()"}, {"t": "View Unresolved", "d": "Filter to show only faults that haven't been marked as resolved yet — the most important view for active follow-up.", "c": "amber", "run": "setFilter('unresolved')"}, {"t": "View Metrics", "d": "Unlock the 30-day metrics dashboard — total fault value, warehouse vs digital split, and resolution rate. Requires your account password to access.", "c": "blue", "run": "requestMetrics()"}, {"t": "Search Faults", "d": "Search by tracking ID, order number, person, or fault type to find a specific record quickly. Works within whichever filter is currently active.", "c": "purple", "run": "var el=document.getElementById('searchInput');if(el){el.focus();el.style.borderColor='#2563eb';setTimeout(function(){el.style.borderColor=''},1000)}"}], "steps": [{"t": "Log a fault when an issue occurs", "d": "Click <strong>Log Fault</strong> and fill in the tracking ID, order number, order date, order value, fault type (Warehouse or Digital), and the responsible person. The fault is assigned a unique PF-XXXX ID automatically and saved immediately."}, {"t": "Filter and search the fault log", "d": "Use the filter pills at the top to narrow by fault type — <strong>All</strong>, <strong>Warehouse</strong>, <strong>Digital</strong>, or <strong>Unresolved</strong>. Each pill shows a live count. Combine with the search box to find a specific record by tracking ID, order number, or person."}, {"t": "Mark faults as resolved", "d": "Click the <strong>Resolved</strong> badge on any row to toggle it between Yes (green) and No (red). Changes save instantly — no save button needed. When viewing Unresolved, resolved rows fade out automatically."}, {"t": "Edit or delete existing faults", "d": "Click <strong>Edit</strong> on any row to update any field, change the fault type or person, or delete the record entirely. Deletions require a two-step confirmation to prevent accidents."}, {"t": "Unlock the 30-day Metrics dashboard", "d": "Click <strong>View Metrics</strong> to open the metrics bar showing total fault value, warehouse vs digital breakdown with individual values, and overall resolution rate — all scoped to the last 30 days. Access is protected by your account password and stays unlocked for the session."}], "tips": ["The <strong>Unresolved filter</strong> is the most useful daily view — it shows only open faults and cleans itself up as you mark things resolved, so you always see exactly what still needs action.", "The <strong>Metrics bar</strong> stays unlocked for your entire browser session once you enter your password — you won't be asked again until you close and reopen the browser.", "Clicking <strong>Resolved</strong> on a row updates the badge colour and saves immediately — no save button, no page reload. If saving fails, the change is automatically reverted and you'll see an error toast.", "The Metrics password is your <strong>account login password</strong> — the same one you use to sign in to the portal. Only authorised users can view the financial breakdown and resolution stats."], "tour": [{"s": ".page-header", "t": "Filter Pills &amp; Search", "d": "Switch between <strong>All</strong>, <strong>Warehouse</strong>, <strong>Digital</strong>, and <strong>Unresolved</strong> to focus on what matters. Each pill shows a live count. The search box filters by tracking ID, order number, person, or fault type.", "f": null}, {"s": "#metricsToggleBtn", "t": "View Metrics", "d": "Click here to unlock the 30-day metrics bar — total fault value, warehouse vs digital breakdown, and resolution rate. Requires your account password and stays unlocked for the session.", "f": null}, {"s": ".btn-primary", "t": "Log Fault", "d": "Click here to record a new packaging fault. Fill in the tracking ID, order number, date, value, fault type, and the responsible person. The record is saved and assigned a PF-XXXX ID automatically.", "f": ".page-header"}, {"s": ".table-wrap", "t": "The Fault Log", "d": "Every logged fault appears here, sorted newest first. Columns show tracking ID, order number, date, fault type badge, person, order value, resolved status, and an Edit button.", "f": ".main-content"}, {"s": ".fault-badge", "t": "Fault Type Badges", "d": "Orange badges are <strong>Warehouse</strong> faults; blue badges are <strong>Digital</strong> faults. Use the filter pills above the table to show only one type at a time.", "f": ".table-wrap"}, {"s": ".resolved-badge", "t": "Resolved Toggle", "d": "Click the Resolved badge on any row to toggle it between <strong>Yes</strong> (green) and <strong>No</strong> (red). Saves instantly — no button needed. When filtering by Unresolved, resolved rows fade out automatically.", "f": ".table-wrap"}], "name": "Packaging Faults", "section": "Warehouse", "pages": ["packagingfault"]}, "buybox85": {"name": "Buy-box @ 85%", "section": "Repricer", "pages": ["buybox85"], "summary": "Listings winning 85% or more of the Buy Box, with their price, MAP, min/max and repricing settings — edit in place and send changes to Seller Snap.", "actions": [{"t": "Sync from Seller Snap", "d": "Load the latest listings and Buy Box data.", "c": "blue", "run": "pgPulse('#bbSyncBtn')"}, {"t": "Search a product", "d": "Find a listing by product name or SKU.", "c": "purple", "run": "pgFocus('#bbSearch')"}, {"t": "Change the sort", "d": "Sort by profit margin, revenue, Buy Box % or orders.", "c": "amber", "run": "pgFocus('#bbSort')"}], "steps": [{"t": "Sync the data", "d": "Click <strong>Sync from Seller Snap</strong> to load listings for this Buy Box band."}, {"t": "Edit prices in place", "d": "Hover a Price, MAP, Min or Max cell and click the pencil to edit. Edited rows turn amber as <strong>pending</strong>."}, {"t": "Process the page", "d": "Click <strong>Process (n)</strong> to send this page’s pending changes. Price changes go instantly; MAP changes are queued and confirmed."}, {"t": "Move to the next page", "d": "Process pending changes before moving on — the status column shows Sent, Failed or MAP progress."}], "tips": ["Use the FBA ⇄ FBM filter to work one channel at a time.", "Click a product or SKU to copy it.", "A failed row stays amber so you can retry it."], "tour": [{"s": "#bbSyncBtn", "t": "Load the listings", "d": "Click <strong>Sync from Seller Snap</strong> to load listings for this Buy Box band.", "f": null}, {"s": "#bbTotals", "t": "Totals", "d": "Listings, revenue, stock value and average margin for this band.", "f": null}, {"s": ".bb-controls", "t": "Controls", "d": "Search, channel filter, sort, Process and Sync.", "f": null}, {"s": ".bb-table-scroll", "t": "Listings", "d": "Edit prices in place — pending rows turn amber.", "f": null}]}, "buybox40": {"name": "Buy-box @ 40%", "section": "Repricer", "pages": ["buybox40"], "summary": "Listings winning around 40% of the Buy Box, with their price, MAP, min/max and repricing settings — edit in place and send changes to Seller Snap.", "actions": [{"t": "Sync from Seller Snap", "d": "Load the latest listings and Buy Box data.", "c": "blue", "run": "pgPulse('#bbSyncBtn')"}, {"t": "Search a product", "d": "Find a listing by product name or SKU.", "c": "purple", "run": "pgFocus('#bbSearch')"}, {"t": "Change the sort", "d": "Sort by revenue, Buy Box % (worst first), profit margin (worst first) or orders.", "c": "amber", "run": "pgFocus('#bbSort')"}], "steps": [{"t": "Sync the data", "d": "Click <strong>Sync from Seller Snap</strong> to load listings for this Buy Box band."}, {"t": "Edit prices in place", "d": "Hover a Price, MAP, Min or Max cell and click the pencil to edit. Edited rows turn amber as <strong>pending</strong>."}, {"t": "Process the page", "d": "Click <strong>Process (n)</strong> to send this page’s pending changes. Price changes go instantly; MAP changes are queued and confirmed."}, {"t": "Move to the next page", "d": "Process pending changes before moving on — the status column shows Sent, Failed or MAP progress."}], "tips": ["Use the FBA ⇄ FBM filter to work one channel at a time.", "Click a product or SKU to copy it.", "A failed row stays amber so you can retry it."], "tour": [{"s": "#bbSyncBtn", "t": "Load the listings", "d": "Click <strong>Sync from Seller Snap</strong> to load listings for this Buy Box band.", "f": null}, {"s": "#bbTotals", "t": "Totals", "d": "Listings, revenue, stock value and average margin for this band.", "f": null}, {"s": ".bb-controls", "t": "Controls", "d": "Search, channel filter, sort, Process and Sync.", "f": null}, {"s": ".bb-table-scroll", "t": "Listings", "d": "Edit prices in place — pending rows turn amber.", "f": null}]}, "invoices": {"summary": "Create, edit, and send professional invoices on behalf of Pharm & Domestic — TOUSIF LTD. Every invoice is fully editable inline, auto-calculates VAT and totals, and can be downloaded as a PDF or sent directly by email.", "actions": [{"t": "New Invoice", "d": "Create a blank invoice with the next sequential INV-XXXX number pre-assigned. Fill in the client details, add line items, and save when ready.", "c": "blue", "run": "newInvoice()"}, {"t": "Search Invoices", "d": "Search by invoice number, client name, or date to quickly find an existing invoice in the left panel list.", "c": "purple", "run": "document.getElementById('searchInput').focus()"}, {"t": "Download PDF", "d": "Open an invoice, then use <strong>Share → Download PDF</strong> for a print-ready copy that matches the on-screen layout.", "c": "green", "run": "pgPulse('.right-panel-actions')"}, {"t": "Email Invoice", "d": "Open an invoice, then use <strong>Share → Email</strong> — the PDF is attached and the message pre-filled; just add the recipient.", "c": "amber", "run": "pgPulse('.right-panel-actions')"}], "steps": [{"t": "Create or select an invoice", "d": "Click <strong>New Invoice</strong> to start a blank invoice, or click any existing invoice in the left panel to open it. The right panel shows the editable invoice immediately."}, {"t": "Fill in the invoice details", "d": "All fields are editable inline — click directly on the client name, address fields, or date to edit them. Add line items with <strong>Add Line Item</strong>, entering a description, quantity, and the <strong>Line Item Price (£)</strong>. Pre-VAT and VAT amounts are calculated automatically based on the VAT rate you select per line."}, {"t": "Save the invoice", "d": "Click <strong>Save</strong> in the top right of the preview panel. New invoices are instantly saved; existing ones are updated. The left panel list refreshes automatically and the total value chip in the header updates."}, {"t": "Download or send", "d": "Use the <strong>Share</strong> dropdown to either download a PDF or open the email modal. The email modal pre-fills the subject, a professional message body with payment details, and attaches the invoice as a PDF automatically before sending."}], "tips": ["Enter the <strong>Line Item Price (£)</strong> — the highlighted amber field — as the final price the client pays. Pre-VAT and VAT are back-calculated automatically from the VAT rate you choose per line (0%, 5%, or 20%).", "Invoice numbers are assigned automatically in sequence (INV-0001, INV-0002…). You never need to manually number an invoice — the system picks up from the highest existing number.", "The <strong>Delete</strong> button requires a two-step confirmation dialog before permanently removing an invoice — so accidental clicks are safe.", "The email modal sends the invoice with the PDF already attached — you don't need to download and attach it manually. Just enter the recipient email and click Send."], "tour": [{"s": ".page-header", "t": "Header &amp; Stats", "d": "The chips show the total number of invoices and the combined value of all invoices. The search box filters the left panel list in real time by invoice number, client name, or date.", "f": null}, {"s": ".left-panel", "t": "Invoice List", "d": "All your invoices are listed here, most recent first. Each item shows the client name, invoice number, date, and grand total. Click any row to open and edit it in the right panel.", "f": null}, {"s": ".right-panel", "t": "Invoice Preview &amp; Editor", "d": "The right panel shows a live, editable preview of the selected invoice. Every field — client name, address, date, line items, notes — is editable by clicking directly on it. Changes are reflected in the totals instantly.", "f": ".main-split"}, {"s": ".right-panel-actions", "t": "Save, Share &amp; Delete", "d": "<strong>Save</strong> commits changes to the database. <strong>Share</strong> opens a dropdown to download a PDF or send by email. <strong>Delete</strong> removes the invoice with a confirmation step.", "f": ".right-panel-header"}, {"s": ".kanban-card,.inv-list-item", "t": "Select an Invoice", "d": "Click any invoice in the left panel to load it. The active invoice is highlighted in blue. You can switch invoices at any time — unsaved changes are in memory until you click Save.", "f": ".left-panel-body"}], "name": "Invoices", "section": "Finance", "pages": ["invoices"]}, "refunds": {"name": "Refunds", "section": "Finance", "pages": ["refunds"], "summary": "Log and track refund requests for Amazon and eBay orders — what is outstanding, what has been processed, and a downloadable summary.", "actions": [{"t": "Submit a refund request", "d": "Log the order number, marketplace, date, amount and reason.", "c": "blue", "run": "pgCall('rfOpenModal')"}, {"t": "Download a summary", "d": "Generate a PDF for the last 7, 14 or 30 days or the current month.", "c": "purple", "run": "pgCall('rfDownloadPDF')"}], "steps": [{"t": "Submit the request", "d": "Click <strong>+ Submit Request</strong>, enter the order number, marketplace, date and reason. Add notes for partial refunds (which/how many units)."}, {"t": "Track by month", "d": "Use ‹ › to move between months; the table lists every request with person, amount and status."}, {"t": "Watch the totals", "d": "The pills show <strong>Outstanding</strong>, <strong>Processed</strong> and <strong>Total Requested</strong>."}], "tips": ["Pick the closest reason — “Others” asks you to describe it.", "The PDF compares the period with the previous one."], "tour": [{"s": "#rfSummary", "t": "Totals", "d": "Outstanding, processed and total requested.", "f": null}, {"s": ".rf-requests-row", "t": "Month picker", "d": "Switch months and submit new requests.", "f": null}, {"s": ".rf-table-card", "t": "Requests", "d": "Every request for the month with its status.", "f": null}]}, "rota": {"summary": "The Rota is the team's weekly scheduling hub. Add shifts for each employee, switch between day and week views, mark closures, and copy entire periods forward in seconds.", "actions": [{"t": "Add a Shift", "d": "Open the shift modal to schedule a task or break for any employee. Select the employee, task type, date, start time, and end time. Conflicts are detected automatically.", "c": "blue", "run": "openShiftModal()"}, {"t": "Manage Team", "d": "Show or hide individual employees from the rota grid. Useful for focusing on a single department without deleting anyone's data.", "c": "blue", "run": "openTeamModal()"}, {"t": "Copy Schedule", "d": "Duplicate nute slot — click any slot to pre-fill the start time in the shift modal. In <strong>Week</strong> or <strong>2 Weeks</strong> view, clicking an empty cell opens the modal with that employee and date pre-selected.", "When a new shift <strong>overlaps</strong> an existing one, a conflict banner appears in the modal. Click <strong>Replace</strong> to overwrite the conflicting shift, or adjust the times to avoid it.", "Use <strong>Team</strong> to hide employees you're not scheduling right now. Hidden employees disappear from the grid but their shifts are never deleted — just re-show them to bring everything back.", "The <strong>Copy</strong> feature is the fastest way to repeat a standard week. Set up one good week, then copy it forward as many times as needed — removing any exceptions in the preview before confirming."], "tour": [{"s": ".planner-header", "t": "Navigation &amp; Controls", "d": "Use the arrows to move between periods, click the date label to jump to any date via the calendar picker, and use the view selector to switch between Day, Week, and 2 Weeks.", "f": null}, {"s": ".planner-nav", "t": "Period Navigation", "d": "◀ and ▶ move back and forward by one period at a time. The date label in the middle is also clickable — it opens a mini calendar so you can jump to any date directly.", "f": null}, {"s": ".planner-add-btn", "t": "Add Shift", "d": "Opens the shift modal to schedule a task or break. Select the employee, task type, date, and times. Conflict detection warns you of overlapping shifts before you save.", "f": null}, {"s": ".planner-grid-card", "t": "The Rota Grid", "d": "Each row is an employee, each column is a day or time slot. In Day view the grid shows 15-minute slots from 07:00–20:00. In Week view each cell shows all shifts for that day as colour-coded pills.", "f": ".planner-page"}, {"s": ".planner-td-emp", "t": "Employee Column", "d": "Click any employee name or avatar to open their detail drawer — a full list of their shifts for the curren   function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

  function canSee(k){ var g = GUIDES[k]; if(!g) return false; if(g.panel) return true; return g.pages.some(function(p){ return ctx.accessible.indexOf(p) >= 0; }); }
  function guideForPage(page){ for (var k in GUIDES){ if (GUIDES[k].pages.indexOf(page) >= 0) return k; } return null; }

  var videos = window.__pgxVideos || null;
  function loadVideos(){
    if (!window.sb) return Promise.resolve({});
    return window.sb.from('page_guide_videos').select('page_key,url,kind,storage_path').then(function(r){
      var m = {}; (r.data||[]).forEach(function(v){ m[v.page_key] = v; });
      videos = window.__pgxVideos = m; return m;
    }, function(){ return {}; });
  }
  function embedFor(url){
    var u = String(url||'').trim(), m;
    if ((m = u.match(/(?:youtube\.com\/(?:watch\?v=|shorts\/|embed\/)|youtu\.be\/)([\w-]{6,})/))) return { type:'iframe', src:'https://www.youtube.com/embed/'+m[1] };
    if ((m = u.match(/loom\.com\/(?:share|embed)\/([\w-]+)/))) return { type:'iframe', src:'https://www.loom.com/embed/'+m[1] };
    if ((m = u.match(/vimeo\.com\/(?:video\/)?(\d+)/))) return { type:'iframe', src:'https://player.vimeo.com/video/'+m[1] };
    if ((m = u.match(/drive\.google\.com\/file\/d\/([\w-]+)/))) return { type:'iframe', src:'https://drive.google.com/file/d/'+m[1]+'/preview' };
    if (/\.(mp4|webm|mov|m4v|ogg)(\?|$)/i.test(u) || /\/storage\/v1\/object\/public\//.test(u)) return { type:'video', src:u };
    return { type:'iframe', src:u };
  }
  function videoHtml(k){
    var v = videos && videos[k];
    var h = '<div class="pgx-video" id="pgxVideo">';
    if (v && v.url){
      var e = embedFor(v.url);
      h += e.type === 'video' ? '<video src="'+esc(e.src)+'" controls playsinline preload="metadata"></video>'
                              : '<iframe src="'+esc(e.src)+'" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>';
    } else {
      h += '<div class="pgx-vph"><div class="pgx-play">'+svg('<polygon points="5 3 19 12 5 21 5 3" fill="currentColor"/>')+'</div><b>Watch: '+esc(GUIDES[k].name)+' walkthrough</b><span>'+(videos?'Video coming soon':'Loading…')+'</span></div>';
    }
    h += '</div>';
    if (ctx.isAdmin){
      h += '<div class="pgx-vadmin">'
        + '<button class="pgx-vbtn" onclick="pgxPickVideo()">'+svg('<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>')+(v?'Replace video':'Upload video')+'</button>'
        + '<button class="pgx-vbtn" onclick="pgxToggleLink()">'+svg('<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>')+'Paste a link</button>'

        + '<div class="pgx-vnote" id="pgxVNote">Only admins see these buttons. Uploaded videos are stored in Supabase.</div>'
        + '<input type="file" id="pgxVFile" accept="video/*" style="display:none" onchange="pgxUploadVideo(this)">';
    }
    return h;
  }

  function saveVideoRow(row){
    row.updated_by = ctx.email || null; row.updated_at = new Date().toISOString();

  }
  function removeStored(v){
    if (v && v.kind === 'upload' && v.storage_path) return window.sb.storage.from('page-guides').remove([v.storage_path]).then(function(){},function(){});

  }
