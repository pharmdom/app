<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f5f6fa;--surface:#fff;--border:#e5e7eb;
  --text:#0d0f14;--text2:#374151;--text3:#6b7280;--text4:#9ca3af;
  --accent:#3b6ef8;--accent-bg:#eef2fd;--accent-bd:#c4d3f9;
  --r:10px;--r-sm:7px;--r-lg:14px;
  --font:'Inter',system-ui,sans-serif;
  --sh-sm:0 1px 3px rgba(0,0,0,.06);
  --navy:#0b0f1e;--navy2:#060912;
}

.pkg-wrap{
  display:flex;flex-direction:column;
  height:calc(100vh - 94px);
  min-height:0;font-family:var(--font);color:var(--text);
  overflow:hidden;
}

/* ── TOP ROW ── */
.pkg-toprow{
  display:flex;align-items:center;justify-content:space-between;
  gap:12px;margin-bottom:14px;flex-shrink:0;flex-wrap:wrap;
}
.pkg-toprow-left{display:flex;align-items:center;gap:10px;}
.pkg-brand{display:flex;align-items:center;gap:8px;}
.pkg-logo{height:26px;width:auto;object-fit:contain;}
.pkg-logo-fallback{
  width:26px;height:26px;border-radius:6px;
  background:linear-gradient(135deg,var(--accent),#7c3aed);
  display:flex;align-items:center;justify-content:center;
  font-size:9px;font-weight:800;color:#fff;flex-shrink:0;
}
.pkg-sep{width:1px;height:18px;background:var(--border);flex-shrink:0;}
.pkg-title-block{}
.pkg-title{font-size:14px;font-weight:600;color:var(--text2);line-height:1.2;}
.pkg-sub{font-size:11px;color:var(--text4);margin-top:2px;}

/* ── ACTIONS ── */
.pkg-actions{display:flex;align-items:center;gap:6px;}
.pkg-btn{
  display:flex;align-items:center;gap:5px;padding:7px 12px;
  border-radius:var(--r-sm);border:1px solid var(--border);
  background:var(--surface);color:var(--text2);font-size:12px;
  font-weight:500;font-family:var(--font);cursor:pointer;transition:all .15s;
  white-space:nowrap;
}
.pkg-btn:hover{border-color:#d1d5db;background:var(--bg);color:var(--text);}
.pkg-btn svg{width:13px;height:13px;flex-shrink:0;}
.pkg-btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
.pkg-btn.primary:hover{background:#2a5eed;border-color:#2a5eed;}

/* ── IFRAME SHELL ── */
.pkg-iframe-shell{
  flex:1;min-height:0;display:flex;flex-direction:column;
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r-lg);overflow:hidden;
  box-shadow:var(--sh-sm);position:relative;
}
.pkg-iframe-shell iframe{
  width:100%;height:100%;border:0;display:block;flex:1;
}
.pkg-iframe-loading{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:12px;
  background:var(--surface);z-index:2;transition:opacity .4s ease;
}
.pkg-iframe-loading.hidden{opacity:0;pointer-events:none;}
.pkg-loader-ring{
  width:32px;height:32px;border:2.5px solid var(--border);
  border-top-color:var(--accent);border-radius:50%;
  animation:pkgSpin .7s linear infinite;
}
@keyframes pkgSpin{to{transform:rotate(360deg)}}
.pkg-loading-text{font-size:12px;color:var(--text4);font-weight:500;}

/* ── FULLSCREEN OVERLAY ── */
.pkg-fs-overlay{
  position:fixed;inset:0;z-index:99999;
  background:var(--navy);
  display:none;flex-direction:column;overflow:hidden;
}
.pkg-fs-overlay.open{display:flex;}

.pkg-fs-hdr{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 24px;flex-shrink:0;
  background:rgba(255,255,255,.03);
  border-bottom:1px solid rgba(255,255,255,.06);
}
.pkg-fs-brand{display:flex;align-items:center;gap:12px;}
.pkg-fs-logo{
  height:30px;width:auto;object-fit:contain;
  filter:brightness(0) invert(1);opacity:.88;
}
.pkg-fs-logo-fallback{
  display:none;align-items:center;gap:7px;
}
.pkg-fs-logo-mark{
  width:30px;height:30px;border-radius:8px;
  background:linear-gradient(135deg,var(--accent),#7c3aed);
  display:flex;align-items:center;justify-content:center;
  font-size:10px;font-weight:800;color:#fff;
}
.pkg-fs-logo-text{font-size:14px;font-weight:700;color:#fff;}
.pkg-fs-sep{width:1px;height:18px;background:rgba(255,255,255,.12);}
.pkg-fs-lbl{font-size:11px;font-weight:700;color:rgba(255,255,255,.35);letter-spacing:.3px;}
.pkg-fs-close{
  display:flex;align-items:center;gap:6px;padding:7px 12px;
  border-radius:var(--r-sm);background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.12);color:rgba(255,255,255,.6);
  font-size:12px;font-weight:500;font-family:var(--font);
  cursor:pointer;transition:all .15s;white-space:nowrap;
}
.pkg-fs-close:hover{background:rgba(239,68,68,.2);border-color:rgba(239,68,68,.4);color:#fca5a5;}
.pkg-fs-close svg{width:13px;height:13px;flex-shrink:0;}

.pkg-fs-body{flex:1;min-height:0;display:flex;flex-direction:column;}
.pkg-fs-body iframe{width:100%;height:100%;border:0;display:block;flex:1;}
</style>

<!-- FULLSCREEN OVERLAY -->
<div class="pkg-fs-overlay" id="pkgFsOverlay">
  <div class="pkg-fs-hdr">
    <div class="pkg-fs-brand">
      <img class="pkg-fs-logo" id="pkgFsLogo"
        src="https://raw.githubusercontent.com/pharmdom/app/refs/heads/main/assets/logo_pharm_and_domestic.png"
        alt="Pharm & Dom"
        onerror="this.style.display='none';document.getElementById('pkgFsLogoFallback').style.display='flex'">
      <div class="pkg-fs-logo-fallback" id="pkgFsLogoFallback">
        <div class="pkg-fs-logo-mark">P&D</div>
        <span class="pkg-fs-logo-text">Pharm &amp; Dom</span>
      </div>
      <div class="pkg-fs-sep"></div>
      <span class="pkg-fs-lbl">Packaging Tracker</span>
    </div>
    <button class="pkg-fs-close" onclick="pkgCloseFs()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      Exit fullscreen
    </button>
  </div>
  <div class="pkg-fs-body">
    <iframe
      id="pkgFsFrame"
      src=""
      allow="fullscreen"
      sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox allow-downloads allow-modals"
    ></iframe>
  </div>
</div>

<!-- MAIN PANEL -->
<div class="pkg-wrap">

  <div class="pkg-toprow">
    <div class="pkg-toprow-left">
      <div class="pkg-title-block">
        <div class="pkg-title">Packaging Tracker</div>
        <div class="pkg-sub">packtracker dashboard</div>
      </div>
    </div>
    <div class="pkg-actions">

      <button class="pkg-btn primary" onclick="pkgOpenFs()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
        Fullscreen
      </button>
    </div>
  </div>

  <div class="pkg-iframe-shell">
    <div class="pkg-iframe-loading" id="pkgLoading">
      <div class="pkg-loader-ring"></div>
      <div class="pkg-loading-text">Loading Packaging Tracker…</div>
    </div>
    <iframe
      id="pkgFrame"
      src="https://packtracker-jmb7p8cb.manus.space/dashboard"
      allow="fullscreen"
      sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox allow-downloads allow-modals"
      onload="pkgFrameLoaded()"
    ></iframe>
  </div>

</div>

<script>
(function(){

  var PKG_URL = 'https://packtracker-jmb7p8cb.manus.space/dashboard';

  function pkgFrameLoaded() {
    var el = document.getElementById('pkgLoading');
    if (el) el.classList.add('hidden');
  }
  window.pkgFrameLoaded = pkgFrameLoaded;

  function pkgReload() {
    var f = document.getElementById('pkgFrame');
    var loading = document.getElementById('pkgLoading');
    if (loading) loading.classList.remove('hidden');
    if (f) { f.src = ''; f.src = PKG_URL; }
  }
  window.pkgReload = pkgReload;

  function pkgOpenFs() {
    var overlay = document.getElementById('pkgFsOverlay');
    var fsFrame = document.getElementById('pkgFsFrame');
    if (!overlay || !fsFrame) return;
    fsFrame.src = PKG_URL;
    overlay.classList.add('open');
    document.body.style.overflow = 'hidden';
    /* Request native fullscreen on the overlay element */
    var el = overlay;
    if (el.requestFullscreen) el.requestFullscreen();
    else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
  }
  window.pkgOpenFs = pkgOpenFs;

  function pkgCloseFs() {
    var overlay = document.getElementById('pkgFsOverlay');
    var fsFrame = document.getElementById('pkgFsFrame');
    if (!overlay) return;
    overlay.classList.remove('open');
    document.body.style.overflow = '';
    if (fsFrame) { fsFrame.src = ''; }
    if (document.exitFullscreen) document.exitFullscreen();
    else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
  }
  window.pkgCloseFs = pkgCloseFs;

  /* Esc key exits fullscreen */
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && document.getElementById('pkgFsOverlay').classList.contains('open')) {
      pkgCloseFs();
    }
  });

})();
</script>
