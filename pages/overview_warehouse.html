<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#eef1f8;--surface:#ffffff;--surface2:#f5f7fc;--surface3:#e8edf7;
  --border:#e2e8f5;--border2:#ecf0f9;
  --text:#0c1526;--text2:#2a3a54;--text3:#64748b;--text4:#98a7bc;
  --accent:#1847d4;--accent-l:#2a5eed;--accent-bg:#eef2fd;--accent-bd:#c4d3f9;
  --green:#0c7a42;--green-bg:#ecfdf5;--green-bd:#86efac;
  --red:#b91c1c;--red-bg:#fef2f2;--red-bd:#fecaca;
  --amber:#92400e;--amber-bg:#fffbeb;--amber-bd:#fde68a;
  --cyan:#0369a1;--cyan-bg:#eff6ff;--cyan-bd:#bfdbfe;
  --purple:#6d28d9;--purple-bg:#f3f0ff;--purple-bd:#c4b5fd;
  --navy:#0c1526;--navy2:#141d2e;
  --r:10px;--r-sm:7px;--r-lg:14px;--r-xl:18px;
  --font:'Plus Jakarta Sans',system-ui,sans-serif;
  --mono:'JetBrains Mono',monospace;
  --sh-sm:0 1px 3px rgba(12,21,38,.06),0 1px 2px rgba(12,21,38,.04);
  --sh:0 4px 16px rgba(12,21,38,.08),0 2px 6px rgba(12,21,38,.04);
  --sh-lg:0 20px 50px rgba(12,21,38,.14),0 6px 16px rgba(12,21,38,.07);
}
html,body{font-family:var(--font);font-size:14px;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden;}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:6px}
::-webkit-scrollbar-thumb:hover{background:var(--text4)}
.pbar{position:fixed;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--amber),#f59e0b);z-index:9999;transform:scaleX(0);transform-origin:left;transition:transform .3s ease;opacity:0;}
.pbar.active{opacity:1;}
.ov-page{background:radial-gradient(ellipse at 20% 0%,rgba(146,64,14,.03) 0%,transparent 60%),radial-gradient(ellipse at 80% 100%,rgba(24,71,212,.03) 0%,transparent 60%),var(--bg);min-height:100vh;}
.ov-topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 20px;min-height:50px;flex-wrap:wrap;background:rgba(255,255,255,.94);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:5;}
.ov-topbar-left{display:flex;align-items:center;gap:10px;}
.ov-greeting{font-size:13px;font-weight:800;color:var(--text);}
.ov-date{font-size:11px;color:var(--text3);font-weight:500;}
.ov-topbar-right{display:flex;align-items:center;gap:8px;}
.live-pill{display:flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;background:var(--amber-bg);border:1px solid var(--amber-bd);font-size:11px;font-weight:700;color:var(--amber);}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--amber);animation:livePulse 2s ease infinite;}
@keyframes livePulse{0%,100%{opacity:1}50%{opacity:.4}}
.ov-clock{font-family:var(--mono);font-size:11.5px;color:var(--text4);}
.ov-main{padding:18px 20px 40px;}
.ov-sec{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--text4);margin-bottom:12px;display:flex;align-items:center;gap:10px;}
.ov-sec::after{content:'';flex:1;height:1px;background:var(--border);}
.ov-hero{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:24px;}
.ov-sc{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:14px 16px 13px;position:relative;overflow:hidden;box-shadow:var(--sh-sm);cursor:pointer;transition:transform .18s,box-shadow .18s,border-color .18s;animation:ovFadeUp .3s ease both;}
.ov-sc:hover{transform:translateY(-2px);box-shadow:var(--sh);}
.ov-sc::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;border-radius:var(--r-lg) var(--r-lg) 0 0;background:var(--sc-accent,var(--amber));}
@keyframes ovFadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.ov-sc-icon{position:absolute;top:12px;right:12px;width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:var(--sc-icon-bg,var(--amber-bg));}
.ov-sc-icon svg{width:14px;height:14px;color:var(--sc-icon-col,var(--amber));}
.ov-sc-lbl{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-bottom:7px;}
.ov-sc-val{font-size:26px;font-weight:800;letter-spacing:-1px;color:var(--text);line-height:1;font-family:var(--mono);margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ov-sc-val.in{animation:ovNumIn .4s cubic-bezier(.34,1.56,.64,1) both;}
@keyframes ovNumIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.ov-sc-footer{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:6px;}
.ov-sc-footer .ov-sc-sub{margin:0;flex:1;font-size:10.5px;color:var(--text3);}
.ov-sc-badge{display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:20px;font-size:9.5px;font-weight:700;flex-shrink:0;}
.sc-green{--sc-accent:var(--green);--sc-icon-bg:var(--green-bg);--sc-icon-col:var(--green);}
.sc-blue{--sc-accent:var(--accent);--sc-icon-bg:var(--accent-bg);--sc-icon-col:var(--accent-l);}
.sc-amber{--sc-accent:var(--amber);--sc-icon-bg:var(--amber-bg);--sc-icon-col:var(--amber);}
.sc-red{--sc-accent:var(--red);--sc-icon-bg:var(--red-bg);--sc-icon-col:var(--red);}
.sc-purple{--sc-accent:var(--purple);--sc-icon-bg:var(--purple-bg);--sc-icon-col:var(--purple);}
.sc-cyan{--sc-accent:var(--cyan);--sc-icon-bg:var(--cyan-bg);--sc-icon-col:var(--cyan);}
.bg-good{background:var(--green-bg);color:var(--green);border:1px solid var(--green-bd);}
.bg-warn{background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber-bd);}
.bg-crit{background:var(--red-bg);color:var(--red);border:1px solid var(--red-bd);}
.bg-neutral{background:var(--surface2);color:var(--text3);border:1px solid var(--border);}
.wh-grid{display:grid;grid-template-columns:360px 1fr;gap:14px;margin-bottom:24px;}
.queue-panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--sh-sm);display:flex;flex-direction:column;overflow:hidden;animation:ovFadeUp .35s .05s ease both;}
.queue-hdr{padding:13px 16px 11px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.queue-title{font-size:13px;font-weight:800;color:var(--text);}
.queue-badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;}
.queue-scroll{flex:1;overflow-y:auto;max-height:480px;}
.queue-scroll::-webkit-scrollbar{width:3px}
.queue-scroll::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
.queue-item{display:flex;align-items:flex-start;gap:10px;padding:11px 16px;border-bottom:1px solid var(--border2);cursor:pointer;transition:background .12s;}
.queue-item:last-child{border-bottom:none;}
.queue-item:hover{background:var(--amber-bg);}
.queue-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:4px;}
.dot-crit{background:var(--red);}
.dot-warn{background:var(--amber);}
.dot-info{background:var(--accent);}
.queue-body{flex:1;min-width:0;}
.queue-t{font-size:12.5px;font-weight:700;color:var(--text);margin-bottom:2px;line-height:1.3;}
.queue-s{font-size:11px;color:var(--text3);line-height:1.45;}
.queue-meta{font-size:10px;color:var(--text4);margin-top:3px;}
.queue-right{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0;}
.queue-tag{font-size:9.5px;font-weight:700;padding:2px 7px;border-radius:20px;}
.queue-chev svg{width:11px;height:11px;color:var(--text4);}
.queue-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;gap:8px;text-align:center;}
.queue-empty p{font-size:13px;font-weight:700;color:var(--green);}
.queue-empty span{font-size:11px;color:var(--text4);}
.hol-strip{display:flex;gap:8px;padding:10px 16px;border-bottom:1px solid var(--border);background:var(--surface2);}
.hol-strip-item{flex:1;min-width:0;}
.hol-strip-lbl{font-size:8.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text4);margin-bottom:2px;}
.hol-strip-val{font-size:13px;font-weight:800;color:var(--text);font-family:var(--mono);}
.work-col{display:flex;flex-direction:column;gap:12px;}
.work-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:14px 16px;box-shadow:var(--sh-sm);animation:ovFadeUp .35s .08s ease both;cursor:pointer;transition:box-shadow .18s,border-color .18s;}
.work-card:hover{box-shadow:var(--sh);border-color:var(--amber-bd);}
.work-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.work-title{font-size:12.5px;font-weight:700;color:var(--text);}
.work-sub{font-size:11px;color:var(--text3);margin-top:1px;}
.work-link{font-size:11px;font-weight:700;color:var(--text4);display:flex;align-items:center;gap:3px;transition:color .12s;flex-shrink:0;}
.work-card:hover .work-link{color:var(--amber);}
.work-link svg{width:10px;height:10px;}
.mkpi-row{display:flex;gap:8px;}
.mkpi{flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:var(--r);padding:9px 11px;min-width:0;}
.mkpi-lbl{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text4);margin-bottom:4px;}
.mkpi-val{font-size:17px;font-weight:800;color:var(--text);font-family:var(--mono);line-height:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.mkpi-val.green{color:var(--green);}
.mkpi-val.amber{color:var(--amber);}
.mkpi-val.red{color:var(--red);}
.mkpi-val.blue{color:var(--accent);}
.spark-wrap{height:80px;margin-top:10px;}
.rota-week{display:flex;flex-direction:column;gap:6px;}
.rota-wrow{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r-sm);background:var(--surface2);border:1px solid var(--border2);}
.rota-wrow.today{background:var(--amber-bg);border-color:var(--amber-bd);}
.rota-wday{font-size:11px;font-weight:800;color:var(--text3);width:34px;flex-shrink:0;}
.rota-wrow.today .rota-wday{color:var(--amber);}
.rota-wtime{flex:1;font-size:12px;font-weight:600;color:var(--text2);}
.rota-woff{color:var(--text4);font-weight:500;}
.bar-chart{display:flex;align-items:flex-end;gap:4px;height:56px;}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;}
.bar-fill{width:100%;border-radius:3px 3px 0 0;min-height:2px;}
.bar-lbl{font-size:8px;color:var(--text4);font-family:var(--mono);}
.pay-week-row{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border-radius:var(--r-sm);background:var(--surface2);border:1px solid var(--border2);margin-bottom:6px;}
.pay-week-lbl{font-size:11.5px;font-weight:700;color:var(--text2);}
.pay-week-sub{font-size:10px;color:var(--text4);margin-top:1px;}
.pay-week-val{font-family:var(--mono);font-size:13px;font-weight:800;color:var(--text);}
.bottom-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:24px;}
.bottom-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:14px 16px;box-shadow:var(--sh-sm);animation:ovFadeUp .4s .1s ease both;cursor:pointer;transition:box-shadow .18s,border-color .18s;}
.bottom-card:hover{box-shadow:var(--sh);border-color:var(--amber-bd);}
.bottom-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.bottom-title{font-size:12.5px;font-weight:700;color:var(--text);}
.shimmer{position:relative;overflow:hidden;background:var(--surface2);border-radius:var(--r);}
.shimmer::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.7),transparent);animation:shim 1.5s infinite;transform:translateX(-100%);}
@keyframes shim{to{transform:translateX(100%)}}
.ov-drw-overlay{position:fixed;inset:0;background:rgba(12,21,38,.35);z-index:1250;opacity:0;pointer-events:none;transition:opacity .25s;backdrop-filter:blur(2px);}
.ov-drw-overlay.open{opacity:1;pointer-events:all;}
.ov-drw{position:fixed;top:0;right:0;width:520px;max-width:97vw;height:100vh;background:var(--surface);box-shadow:var(--sh-lg);z-index:1300;display:flex;flex-direction:column;transform:translateX(110%);transition:transform .3s cubic-bezier(.4,0,.2,1);overflow:hidden;}
.ov-drw.open{transform:translateX(0);}
.ov-drw-hero{padding:18px 20px 16px;background:linear-gradient(140deg,var(--navy2) 0%,#0d1631 100%);position:relative;overflow:hidden;flex-shrink:0;}
.ov-drw-hero::before{content:'';position:absolute;top:-50px;right:-50px;width:160px;height:160px;border-radius:50%;background:rgba(146,64,14,.12);}
.ov-drw-hero::after{content:'';position:absolute;bottom:-30px;left:30px;width:90px;height:90px;border-radius:50%;background:rgba(255,255,255,.03);}
.ov-drw-close{position:absolute;top:13px;right:13px;width:28px;height:28px;border:none;border-radius:7px;background:rgba(255,255,255,.1);cursor:pointer;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.6);transition:all .15s;z-index:2;}
.ov-drw-close:hover{background:rgba(255,255,255,.2);color:#fff;}
.ov-drw-close svg{width:12px;height:12px;}
.ov-drw-eyebrow{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:rgba(255,255,255,.35);margin-bottom:5px;position:relative;z-index:1;}
.ov-drw-title{font-size:16px;font-weight:800;color:#fff;margin-bottom:3px;padding-right:40px;position:relative;z-index:1;line-height:1.25;}
.ov-drw-sub{font-size:12px;color:rgba(255,255,255,.4);position:relative;z-index:1;}
.ov-drw-body{flex:1;overflow-y:auto;padding:18px 20px;}
.ov-drw-body::-webkit-scrollbar{width:4px;}
.ov-drw-body::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}
.drw-sec-lbl{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--text4);margin-bottom:10px;margin-top:18px;display:flex;align-items:center;gap:8px;}
.drw-sec-lbl:first-child{margin-top:0;}
.drw-sec-lbl::after{content:'';flex:1;height:1px;background:var(--border2);}
.drw-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border2);font-size:12.5px;}
.drw-row:last-child{border-bottom:none;}
.drw-row-k{color:var(--text3);}
.drw-row-v{font-weight:700;color:var(--text2);}
.drw-card{background:var(--surface2);border:1px solid var(--border);border-radius:var(--r);padding:10px 13px;margin-bottom:7px;transition:border-color .12s,background .12s;}
.drw-card:hover{border-color:var(--amber-bd);background:var(--amber-bg);}
.drw-card-t{font-size:12.5px;font-weight:700;color:var(--text);margin-bottom:3px;}
.drw-card-s{font-size:11px;color:var(--text3);}
.drw-nav{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:9px;border:1.5px solid var(--amber-bd);border-radius:var(--r-sm);background:var(--amber-bg);color:var(--amber);font-size:12px;font-weight:700;font-family:var(--font);cursor:pointer;transition:all .15s;margin-top:14px;}
.drw-nav:hover{background:var(--amber);color:#fff;}
.drw-nav svg{width:12px;height:12px;}
.ov-toasts{position:fixed;top:16px;right:18px;z-index:9999;display:flex;flex-direction:column;gap:7px;pointer-events:none;}
.ov-toast{display:flex;align-items:center;gap:9px;padding:10px 14px;color:#fff;border-radius:var(--r);font-size:12.5px;font-weight:600;box-shadow:var(--sh-lg);animation:ovToastIn .22s ease;max-width:300px;border-left:3px solid rgba(255,255,255,.15);}
.ov-toast.success{background:#14532d;border-left-color:var(--green);}
.ov-toast.error{background:#7f1d1d;border-left-color:var(--red);}
.ov-toast.info{background:var(--navy2);border-left-color:var(--amber);}
@keyframes ovToastIn{from{opacity:0;transform:translateY(-8px) scale(.95)}to{opacity:1;transform:none}}
.sbadge{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:20px;font-size:10.5px;font-weight:700;white-space:nowrap;}
.sb-green{background:var(--green-bg);color:var(--green);border:1px solid var(--green-bd);}
.sb-amber{background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber-bd);}
.sb-red{background:var(--red-bg);color:var(--red);border:1px solid var(--red-bd);}
@media(max-width:1200px){.ov-hero{grid-template-columns:repeat(2,1fr);}.bottom-grid{grid-template-columns:1fr 1fr;}}
@media(max-width:960px){.wh-grid{grid-template-columns:1fr;}.bottom-grid{grid-template-columns:1fr;}}
@media(max-width:600px){.ov-main{padding:12px 12px 32px;}.ov-topbar{padding:0 14px;}.ov-hero{grid-template-columns:1fr 1fr;gap:8px;}.mkpi-row{flex-wrap:wrap;}.mkpi{min-width:80px;}.ov-drw{width:100%;}}
@media(max-width:420px){.ov-hero{grid-template-columns:1fr;}.ov-sc-val{font-size:22px;}.live-pill span,.live-pill{font-size:10px;}.ov-topbar-right{gap:5px;}.ov-clock{display:none;}}
</style>

<script>
(function(){
'use strict';
const sb=window.sb;
const D={};
/* ── CURRENT USER (from the shell's sessionStorage) ── */
function getCurrentUser(){
  try{
    const raw=sessionStorage.getItem('user');
    if(!raw)return null;
    return JSON.parse(raw);
  }catch(e){return null;}
}
const ME=getCurrentUser();
const ME_ID=ME?ME.userId:null;
const ME_FIRST=ME?(ME.firstName||'').trim():'';
const ME_LAST=ME?(ME.lastName||'').trim():'';
/* ── UTILS ── */
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const fmtGBP=v=>'£'+(parseFloat(v)||0).toLocaleString('en-GB',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtDate=s=>{if(!s)return'—';return new Date(s).toLocaleDateString('en-GB',{day:'numeric',month:'short'});};
function ukMidnight(){
  const now=new Date();
  const fmt=new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/London',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
  const parts=fmt.formatToParts(now);const p={};parts.forEach(x=>{p[x.type]=x.value;});
  const str=p.year+'-'+p.month+'-'+p.day+'T00:00:00';
  const naiveUTC=new Date(str+'Z');
  const testFmt=new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/London',hour:'2-digit',minute:'2-digit',hour12:false});
  const tp={};testFmt.formatToParts(naiveUTC).forEach(x=>{tp[x.type]=x.value;});
  return new Date(naiveUTC.getTime()-parseInt(tp.hour)*3600000);
}
function ukHourNow(){
  const parts=new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/London',hour:'2-digit',hour12:false}).formatToParts(new Date());
  return parseInt(parts.find(p=>p.type==='hour').value,10);
}
function ukTodayStr(){
  const p={};new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/London',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date()).forEach(x=>p[x.type]=x.value);
  return `${p.year}-${p.month}-${p.day}`;
}
function addDaysUK(dateStr,days){
  const[y,m,d]=dateStr.split('-').map(Number);
  const dt=new Date(Date.UTC(y,m-1,d));
  dt.setUTCDate(dt.getUTCDate()+days);
  return `${dt.getUTCFullYear()}-${String(dt.getUTCMonth()+1).padStart(2,'0')}-${String(dt.getUTCDate()).padStart(2,'0')}`;
}
function twoMonthCutoffUK(){
  const[y,m]=ukTodayStr().split('-').map(Number);
  let py=y,pm=m-1;
  if(pm===0){pm=12;py=y-1;}
  return `${py}-${String(pm).padStart(2,'0')}-01`;
}
function dowOfDateStr(dateStr){
  const[y,m,d]=dateStr.split('-').map(Number);
  return new Date(Date.UTC(y,m-1,d)).getUTCDay();
}
function utcDateStr(d){return (d||new Date()).toISOString().slice(0,10);}
function timeToMins(t){if(!t)return 0;const[h,m]=String(t).slice(0,5).split(':').map(Number);return h*60+m;}
function computeTodayPacksStats(counts){
  if(!counts||!counts.length)return{packsToday:0,pph:0,lastSlot:null,hasData:false};
  const sorted=counts.slice().sort((a,b)=>a.time_slot.localeCompare(b.time_slot));
  const packsToday=Math.max(...sorted.map(c=>parseInt(c.count)||0));
  const firstMins=timeToMins(sorted[0].time_slot);
  const lastMins=timeToMins(sorted[sorted.length-1].time_slot);
  const elapsedHours=(lastMins-firstMins)/60;
  const pph=elapsedHours>0?packsToday/elapsedHours:0;
  return{packsToday,pph,lastSlot:sorted[sorted.length-1].time_slot,hasData:true};
}
  function getWeekKey(dateStr){
  const dow=dowOfDateStr(dateStr);
  const diffToMon=dow===0?6:dow-1;
  return addDaysUK(dateStr,-diffToMon);
}
function weekBounds(offsetWeeks){
  offsetWeeks=offsetWeeks||0;
  const todayStr=ukTodayStr();
  const dow=dowOfDateStr(todayStr);
  const off=(dow===0?-6:1-dow)+offsetWeeks*7;
  const startStr=addDaysUK(todayStr,off);
  const endStr=addDaysUK(startStr,7);
  return{startStr,endStr};
}
/* ── PAGINATED FETCH — no caps ── */
async function fetchAll(table,cols,build,orderCol,pageSize){
  pageSize=pageSize||1000;
  let all=[],lastVal=null;
  while(true){
    let data=null,error=null;
    for(let attempt=0;attempt<3;attempt++){
      let q=sb.from(table).select(cols);
      if(build)q=build(q);
      if(lastVal!==null)q=q.gt(orderCol,lastVal);
      q=q.order(orderCol,{ascending:true}).limit(pageSize);
      const res=await q;
      data=res.data;error=res.error;
      if(!error)break;
      if(error.code!=='57014'||attempt===2)break;
      await new Promise(r=>setTimeout(r,500*(attempt+1)));
    }
    if(error){console.error('[fetchAll '+table+']',error);throw new Error('fetchAll:'+table);}
    if(!data||!data.length)break;
    all=all.concat(data);
    lastVal=data[data.length-1][orderCol];
    if(data.length<pageSize)break;
  }
  return all;
}
let _pv=0,_pt=null;
function pStart(){const b=document.getElementById('whPbar');clearInterval(_pt);_pv=.1;b.style.transform='scaleX(.1)';b.classList.add('active');_pt=setInterval(()=>{_pv=Math.min(_pv+(1-_pv)*.07,.92);b.style.transform=`scaleX(${_pv})`;},250);}
function pDone(){clearInterval(_pt);const b=document.getElementById('whPbar');b.style.transform='scaleX(1)';setTimeout(()=>{b.classList.remove('active');b.style.transform='scaleX(0)';},380);}
let _tn=0;
function toast(msg,type='info'){
  const c=document.getElementById('whToasts');const id='wt'+(++_tn);
  const t=document.createElement('div');t.className='ov-toast '+type;t.id=id;
  t.textContent=msg;c.appendChild(t);
  setTimeout(()=>{t.style.opacity='0';t.style.transform='scale(.94)';t.style.transition='all .2s';setTimeout(()=>t.remove(),200);},3000);
}
function updateClock(){
  const now=new Date();
  const ukTime=now.toLocaleTimeString('en-GB',{timeZone:'Europe/London',hour:'2-digit',minute:'2-digit',second:'2-digit'});
  const h=parseInt(ukTime);
  const greeting=h<12?'Good morning':h<17?'Good afternoon':'Good evening';
  const gEl=document.getElementById('whGreeting');if(gEl)gEl.textContent=greeting;
  const dEl=document.getElementById('whDate');if(dEl)dEl.textContent=now.toLocaleDateString('en-GB',{timeZone:'Europe/London',weekday:'long',day:'numeric',month:'long',year:'numeric'});
}
setInterval(updateClock,1000);updateClock();
/* ── LOADERS — all scoped to ME only ── */
async function loadMyRota(){
  if(!ME_ID)return;
  D.myRotaAll=await fetchAll('rota_schedule','id,date,start_time,end_time,type',
    q=>q.eq('employee_id',ME_ID).gte('date',twoMonthCutoffUK()),'id');
}
function myRotaThisWeek(){
  const{startStr,endStr}=weekBounds(0);
  return(D.myRotaAll||[]).filter(r=>r.date>=startStr&&r.date<endStr);
}
function myRotaNextWeek(){
  const{startStr,endStr}=weekBounds(1);
  return(D.myRotaAll||[]).filter(r=>r.date>=startStr&&r.date<endStr);
}
/* ── NAME MATCHING — tiered, most precise first ──
 * Tier 1: full name ("James Smith") — exact person, no ambiguity.
 * Tier 2: first name + last initial ("James S"), or first initial + last name ("J Smith")
 *         — disambiguates when two staff share a first OR last name.
 * Tier 3: bare first name or last name alone — last resort, broadest match.
 * Each tier is only used if the previous tier returned nothing.
 */
function nameFilterTier1(col){
  if(ME_FIRST&&ME_LAST)return `${col}.ilike.%${ME_FIRST}% ${ME_LAST}%`;
  return null;
}
function nameFilterTier2(col){
  const parts=[];
  if(ME_FIRST&&ME_LAST){
    parts.push(`${col}.ilike.%${ME_FIRST}% ${ME_LAST[0]}%`); // "James S..."
    parts.push(`${col}.ilike.%${ME_FIRST[0]}% ${ME_LAST}%`); // "J Smith"
  }
  return parts.length?parts.join(','):null;
}
function nameFilterTier3(col){
  const parts=[];
  if(ME_FIRST)parts.push(`${col}.ilike.%${ME_FIRST}%`);
  if(ME_LAST)parts.push(`${col}.ilike.%${ME_LAST}%`);
  return parts.length?parts.join(','):null;
}
async function fetchByNameTiered(table,cols,dateCol,dateVal,nameCol,orderCol){
  const tiers=[nameFilterTier1(nameCol),nameFilterTier2(nameCol),nameFilterTier3(nameCol)];
  for(const filter of tiers){
    if(!filter)continue;
    const rows=await fetchAll(table,cols,q=>q.eq(dateCol,dateVal).or(filter),orderCol);
    if(rows.length)return rows;
  }
  return [];
}
async function fetchByNameTieredRange(table,cols,dateCol,dateFrom,nameCol,orderCol){
  const tiers=[nameFilterTier1(nameCol),nameFilterTier2(nameCol),nameFilterTier3(nameCol)];
  for(const filter of tiers){
    if(!filter)continue;
    const rows=await fetchAll(table,cols,q=>q.gte(dateCol,dateFrom).or(filter),orderCol);
    if(rows.length)return rows;
  }
  return [];
}
async function loadMyPacking(){
  if(!ME_FIRST&&!ME_LAST)return;
  const todayStr=ukTodayStr();
  D.myPackingToday=await fetchByNameTiered('manus_packing_counts','date,time_slot,count,packer_name',
    'date',todayStr,'packer_name','time_slot');
  const ago7=new Date();ago7.setDate(ago7.getDate()-6);
  const ago7Str=utcDateStr(ago7);
  D.myPacking7d=await fetchByNameTieredRange('manus_packing_week_stats','date,total_packs,packs_per_hour,name',
    'date',ago7Str,'name','date');
}
async function loadMyClosures(){
  const rows=await fetchAll('rota_closures','id,date,label,hours,scope,employee_ids',null,'id');
  D.myClosures=rows.filter(r=>{
    const ids=Array.isArray(r.employee_ids)?r.employee_ids.map(String):[];
    return ids.length===0||ids.includes(String(ME_ID));
  }).map(r=>({
    id:r.id,date:String(r.date),label:r.label||'Closure',
    hours:parseFloat(r.hours)||0,
    isCompany:!Array.isArray(r.employee_ids)||r.employee_ids.length===0,
  }));
}
async function loadMyPay(){
  if(!ME_ID){D.myPay=[];return;}
  const rows=await fetchAll('rota_schedule','id,date,start_time,end_time,type,paid,hourly_rate,bonus',
    q=>q.eq('employee_id',ME_ID).gte('date',twoMonthCutoffUK()),'id');
  D.myPay=rows
    .filter(r=>r.type!=='break')
    .map(r=>{
      const hours=Math.max(0,(timeToMins(r.end_time)-timeToMins(r.start_time))/60);
      const rate=parseFloat(r.hourly_rate||0);
      const bonus=parseFloat(r.bonus||0);
      return{
        date:String(r.date),
        weekKey:getWeekKey(r.date),
        hours:parseFloat(hours.toFixed(4)),
        pay:parseFloat((hours*rate+bonus).toFixed(2)),
        paid:!!r.paid,
      };
    });
}
async function init(){
  if(!sb)return;
  pStart();
  const results=await Promise.allSettled([loadMyRota(),loadMyPacking(),loadMyPay(),loadMyClosures()]);
  const failed=results.filter(r=>r.status==='rejected');
  if(failed.length){failed.forEach(f=>console.error('WH load error:',f.reason));toast('Some data failed to load','error');}
  renderAll();
  pDone();
}
function renderAll(){
  renderHero();renderQueue();renderRota();renderPacking();renderPay();renderTrend();renderUpcoming();renderHolidayStrip();
}
function renderHolidayStrip(){
  const el=document.getElementById('whHolidayStrip');
  if(!el)return;
  const closures=D.myClosures||[];
  const todayStr=ukTodayStr();
  const yearStart=todayStr.slice(0,4)+'-01-01';
  const yearEnd=todayStr.slice(0,4)+'-12-31';
  const thisYear=closures.filter(c=>c.date>=yearStart&&c.date<=yearEnd);
  const totalHours=thisYear.reduce((s,c)=>s+c.hours,0);
  const upcoming=closures.filter(c=>c.date>=todayStr).sort((a,b)=>a.date.localeCompare(b.date));
  const next=upcoming[0];
  if(!closures.length){el.innerHTML='';return;}
  el.innerHTML=`
    <div class="hol-strip">
      <div class="hol-strip-item"><div class="hol-strip-lbl">Hours Off This Year</div><div class="hol-strip-val">${totalHours.toFixed(1)}</div></div>
      <div class="hol-strip-item"><div class="hol-strip-lbl">Next Closure</div><div class="hol-strip-val" style="font-size:11.5px">${next?fmtDate(next.date):'—'}</div></div>
    </div>`;
}
/* ── HERO ── */
function renderHero(){
  const todayStr=ukTodayStr();
  const rota=myRotaThisWeek();
  const shiftsThisWeek=new Set(rota.filter(r=>r.type!=='break').map(r=>r.date)).size;
  const stats=computeTodayPacksStats(D.myPackingToday);
  const packsToday=stats.packsToday;
  const pph=stats.pph;
  const currentWeekKey=getWeekKey(todayStr);
  const payThisWeek=(D.myPay||[]).filter(r=>r.weekKey===currentWeekKey);
  const payAmt=payThisWeek.reduce((s,r)=>s+r.pay,0);
  const payPaid=payThisWeek.length>0&&payThisWeek.every(r=>r.paid);
  const hero=document.getElementById('whHero');
  const isRerender=hero.dataset.rendered==='1';
    const cards=[
    {cls:'sc-blue',label:'Shifts This Week',val:shiftsThisWeek,sub:'',badge:{cls:'bg-neutral',txt:shiftsThisWeek+' scheduled'},
     icon:'<rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>',onclick:'whOpenRotaDrawer()'},
    {cls:'sc-purple',label:'Packs Today',val:packsToday,sub:'',badge:packsToday>0?{cls:'bg-good',txt:'Logged'}:{cls:'bg-neutral',txt:'None yet'},
      icon:'<path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>',onclick:'whOpenPackingDrawer()'},
    {cls:'sc-cyan',label:'Packs / Hour',val:pph?pph.toFixed(1):'—',sub:'',badge:{cls:'bg-neutral',txt:'Today'},
      icon:'<polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>',onclick:'whOpenPackingDrawer()'},
    {cls:'sc-green',label:'Pay This Week',val:fmtGBP(payAmt),sub:'',badge:payThisWeek.length?(payPaid?{cls:'bg-good',txt:'Paid'}:{cls:'bg-warn',txt:'Pending'}):{cls:'bg-neutral',txt:'No hours yet'},
      icon:'<line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>',onclick:'whOpenPayDrawer()'},
  ];
  if(isRerender){
    const existing=hero.querySelectorAll('.ov-sc');
    cards.forEach((c,i)=>{
      if(!existing[i])return;
      existing[i].querySelector('.ov-sc-val').textContent=typeof c.val==='number'?c.val.toLocaleString():String(c.val);
      existing[i].querySelector('.ov-sc-badge').textContent=c.badge.txt;
      existing[i].querySelector('.ov-sc-badge').className='ov-sc-badge '+c.badge.cls;
    });
    return;
  }
  hero.dataset.rendered='1';
  hero.innerHTML=cards.map((c,i)=>`
  <div class="ov-sc ${c.cls}" style="animation-delay:${i*.05}s" onclick="${c.onclick}">
    <div class="ov-sc-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${c.icon}</svg></div>
    <div class="ov-sc-lbl">${esc(c.label)}</div>
    <div class="ov-sc-val in">${typeof c.val==='number'?c.val.toLocaleString():esc(String(c.val))}</div>
    <div class="ov-sc-footer">
      <div class="ov-sc-sub">${esc(c.sub)}</div>
      <div class="ov-sc-badge ${c.badge.cls}">${esc(c.badge.txt)}</div>
    </div>
  </div>`).join('');
}
/* ── QUEUE — personal only ── */
function buildQueueItems(){
  const items=[];
  const todayStr=ukTodayStr();
  const hr=ukHourNow();
  const rota=myRotaThisWeek();
  const todayShift=rota.find(r=>r.date===todayStr&&r.type!=='break');
  const counts=D.myPackingToday||[];
  const packsToday=counts.length?Math.max(...counts.map(c=>parseInt(c.count)||0)):0;
  if(todayShift){
    const startH=Math.floor(timeToMins(todayShift.start_time)/60);
    if(hr>=startH+1&&hr<22&&packsToday===0){
      items.push({sev:'warn',t:'No packing activity logged yet today',s:'You have a shift today but no packs recorded so far',meta:'Today',tag:{cls:'sb-amber',txt:'Packing'},fn:'whOpenPackingDrawer()'});
    }
  }else{
    items.push({sev:'info',t:'No shift scheduled today',s:'Check your rota for upcoming shifts',meta:'Rota',tag:{cls:'sb-amber',txt:'Rota'},fn:'whOpenRotaDrawer()'});
  }
  const unpaidWeeks={};
  (D.myPay||[]).forEach(r=>{if(!r.paid){if(!unpaidWeeks[r.weekKey])unpaidWeeks[r.weekKey]=0;unpaidWeeks[r.weekKey]+=r.pay;}});
  const currentWeekKey=getWeekKey(todayStr);
  const pastUnpaidWeeks=Object.keys(unpaidWeeks).filter(k=>k<currentWeekKey);
  if(pastUnpaidWeeks.length){
    const total=pastUnpaidWeeks.reduce((s,k)=>s+unpaidWeeks[k],0);
    items.push({sev:'warn',t:`Pay pending for ${pastUnpaidWeeks.length} past week${pastUnpaidWeeks.length!==1?'s':''}`,s:`${fmtGBP(total)} outstanding from previous week${pastUnpaidWeeks.length!==1?'s':''}`,meta:'Pay',tag:{cls:'sb-amber',txt:'Pay'},fn:'whOpenPayDrawer()'});
  }
const nextWeek=myRotaNextWeek();
  if(nextWeek.filter(r=>r.type!=='break').length===0&&hr>=16){
    items.push({sev:'info',t:'No shifts scheduled for next week yet',s:'Check with your manager if this looks wrong',meta:'Rota',tag:{cls:'sb-amber',txt:'Rota'},fn:'whOpenRotaDrawer()'});
  }
  const upcomingClosures=(D.myClosures||[]).filter(c=>c.date>=todayStr).sort((a,b)=>a.date.localeCompare(b.date));
  if(upcomingClosures.length){
    const next=upcomingClosures[0];
    const daysAway=Math.round((new Date(next.date+'T00:00:00Z')-new Date(todayStr+'T00:00:00Z'))/86400000);
    items.push({
      sev:'info',
      t:next.isCompany?`Upcoming closure: ${next.label}`:`Your holiday: ${next.label}`,
      s:daysAway===0?'Today':daysAway===1?'Tomorrow':`${fmtDate(next.date)} · in ${daysAway} days`,
      meta:'Holiday',
      tag:next.isCompany?{cls:'sb-green',txt:'Company'}:{cls:'sb-amber',txt:'Personal'},
      fn:'whOpenHolidaysDrawer()'
    });
  }
  const order={crit:0,warn:1,info:2};
  return items.sort((a,b)=>order[a.sev]-order[b.sev]);
}
function renderQueue(){
  const items=buildQueueItems();
  const badge=document.getElementById('whQueueBadge');
  const body=document.getElementById('whQueueBody');
  const crit=items.filter(i=>i.sev==='crit').length;
  if(!items.length){
    badge.textContent='All clear';badge.className='queue-badge bg-good';
    body.innerHTML=`<div class="queue-empty">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="var(--green)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="opacity:.5"><polyline points="20 6 9 17 4 12"/></svg>
      <p>All clear</p><span>Nothing needs your attention</span></div>`;
    return;
  }
  badge.textContent=crit?`${crit} Critical, ${items.length} Total`:`${items.length} Items`;
  badge.className='queue-badge '+(crit?'bg-crit':'bg-warn');
  body.innerHTML=items.map(item=>`
    <div class="queue-item" onclick="${item.fn}">
      <div class="queue-dot dot-${item.sev}"></div>
      <div class="queue-body">
        <div class="queue-t">${esc(item.t)}</div>
        <div class="queue-s">${esc(item.s)}</div>
        <div class="queue-meta">${esc(item.meta)}</div>
      </div>
      <div class="queue-right">
        <span class="queue-tag ${item.tag.cls}">${esc(item.tag.txt)}</span>

/* ── ROTA WIDGET ── */

/* ── PACKING WIDGET ── */
function drawSparkline(id,vals,keys,color,unit){
  const svg=document.getElementById(id);if(!svg)return;
  const W=svg.parentElement.getBoundingClientRect().width||svg.parentElement.offsetWidth||500,H=80,pL=30,pR=8,pT=8,pB=18;
  const cW=W-pL-pR,cH=H-pT-pB,n=vals.length;
  const maxV=Math.max(...vals,1);
  const pts=vals.map((v,i)=>[pL+(n>1?i*cW/(n-1):0),pT+cH-(v/maxV*cH)]);
  const pathD=pts.length?'M '+pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' L '):`M ${pL},${pT+cH}`;
  const areaD=pathD+` L ${(pL+cW).toFixed(1)},${pT+cH} L ${pL},${pT+cH} Z`;
  const gid='sg'+Math.random().toString(36).slice(2);
  let grid='';
  [0,1].forEach(f=>{
    const y=pT+cH-(cH*f);const rawVal=maxV*f;
    const label=unit==='count'?(maxV>=1000?(rawVal/1000).toFixed(1)+'k':rawVal.toFixed(0)):rawVal.toFixed(0);
    grid+=`<line x1="${pL}" y1="${y.toFixed(1)}" x2="${(pL+cW).toFixed(1)}" y2="${y.toFixed(1)}" stroke="var(--border2)" stroke-width="1" stroke-dasharray="3,3"/>`;
    grid+=`<text x="${(pL-4).toFixed(1)}" y="${(y+3).toFixed(1)}" text-anchor="end" font-size="8.5" fill="var(--text4)" font-family="var(--mono)">${label}</text>`;
  });
  let xLabels='';
  (keys||[]).forEach((k,i)=>{
    const x=pL+(n>1?i*cW/(n-1):0);
    xLabels+=`<text x="${x.toFixed(1)}" y="${H-3}" text-anchor="middle" font-size="8.5" fill="var(--text4)" font-family="var(--mono)">${esc(k)}</text>`;
  });
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  svg.innerHTML=`<defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${color}" stop-opacity=".18"/><stop offset="100%" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
  ${grid}<path d="${areaD}" fill="url(#${gid})"/><path d="${pathD}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>${xLabels}`;
}
function renderPacking(){
  const counts=D.myPackingToday||[];
  const stats=computeTodayPacksStats(counts);
  const slots=[...new Set(counts.map(c=>c.time_slot))].sort();
  document.getElementById('whPackSub').textContent=stats.hasData?'Updated on the hour & half-hour':'No activity yet';
  document.getElementById('whPackTotal').textContent=stats.packsToday.toLocaleString();
  document.getElementById('whPackPph').textContent=stats.hasData&&stats.pph?stats.pph.toFixed(1):'—';
  document.getElementById('whPackLast').textContent=stats.lastSlot||'—';
  const vals=slots.map(sl=>{const row=counts.find(c=>c.time_slot===sl);return row?parseInt(row.count)||0:0;});
  requestAnimationFrame(()=>drawSparkline('whPackSparkline',vals,slots,'var(--purple)','count'));
}
/* ── PAY WIDGET ── */
function renderPay(){
  const rows=D.myPay||[];
  const todayStr=ukTodayStr();
  const currentWeekKey=getWeekKey(todayStr);
  const thisWeek=rows.filter(r=>r.weekKey===currentWeekKey);
  const payAmt=thisWeek.reduce((s,r)=>s+r.pay,0);
  const hoursAmt=thisWeek.reduce((s,r)=>s+r.hours,0);
  const paid=thisWeek.length>0&&thisWeek.every(r=>r.paid);
  const weekKeys=[...new Set(rows.map(r=>r.weekKey))].sort().reverse().slice(0,4);
  document.getElementById('whPayWidget').innerHTML=`
    <div class="mkpi-row" style="margin-bottom:10px">
      <div class="mkpi"><div class="mkpi-lbl">This Week</div><div class="mkpi-val" style="font-size:14px">${fmtGBP(payAmt)}</div></div>
      <div class="mkpi"><div class="mkpi-lbl">Hours</div><div class="mkpi-val">${hoursAmt.toFixed(1)}</div></div>
      <div class="mkpi"><div class="mkpi-lbl">Status</div><div class="mkpi-val ${paid?'green':'amber'}" style="font-size:13px">${thisWeek.length?(paid?'Paid':'Pending'):'—'}</div></div>
    </div>
    ${weekKeys.slice(0,2).map(wk=>{
      const wkRows=rows.filter(r=>r.weekKey===wk);
      const amt=wkRows.reduce((s,r)=>s+r.pay,0);
      const isPaid=wkRows.every(r=>r.paid);
      return `<div style="display:flex;justify-content:space-between;font-size:11px;padding:3px 0;border-bottom:1px solid var(--border2)"><span style="color:var(--text2);font-weight:600">Week of ${fmtDate(wk)}</span><span style="font-family:var(--mono);font-weight:700;color:${isPaid?'var(--green)':'var(--amber)'}">${fmtGBP(amt)}</span></div>`;
    }).join('')}`;
}
function renderTrend(){
  const rows=D.myPacking7d||[];
  const todayStr=ukTodayStr();
  const{startStr}=weekBounds(0);
  const days=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const dayData=days.map((lbl,i)=>{
    const ds=addDaysUK(startStr,i);
    const row=rows.find(r=>r.date===ds);
    return{lbl,ds,isToday:ds===todayStr,packs:row?parseInt(row.total_packs)||0:0,pph:row?parseFloat(row.packs_per_hour)||0:0};
  });
  const daysWithData=dayData.filter(d=>d.packs>0);
  const weekTotal=daysWithData.length?Math.max(...daysWithData.map(d=>d.packs)):0;
  const avgPph=daysWithData.length?(daysWithData.reduce((s,d)=>s+d.pph,0)/daysWithData.length):0;
  const maxV=Math.max(...dayData.map(d=>d.packs),1);
  document.getElementById('whTrendWidget').innerHTML=`
    <div class="mkpi-row" style="margin-bottom:8px">
      <div class="mkpi"><div class="mkpi-lbl">Total This Week</div><div class="mkpi-val purple" style="color:var(--purple)">${weekTotal.toLocaleString()}</div></div>
      <div class="mkpi"><div class="mkpi-lbl">Avg / Hour</div><div class="mkpi-val">${avgPph?avgPph.toFixed(1):'—'}</div></div>
    </div>
    <div class="bar-chart">
      ${dayData.map(d=>`<div class="bar-col"><div class="bar-fill" style="height:${Math.max(2,d.packs/maxV*44)}px;background:${d.isToday?'var(--amber)':'var(--purple)'}"></div><div class="bar-lbl" style="${d.isToday?'color:var(--amber);font-weight:700':''}">${d.lbl[0]}</div></div>`).join('')}
    </div>`;
}
function renderUpcoming(){
  const rota=myRotaNextWeek().filter(r=>r.type!=='break').sort((a,b)=>a.date.localeCompare(b.date));
  document.getElementById('whUpcomingWidget').innerHTML=rota.length?
    rota.slice(0,4).map(r=>{

      return `<div style="display:flex;justify-content:space-between;font-size:11.5px;padding:5px 0;border-bottom:1px solid var(--border2)"><span style="color:var(--text2);font-weight:600">${esc(lbl)}</span><span style="font-family:var(--mono);font-weight:700;color:var(--text)">${(r.start_time||'').slice(0,5)}–${(r.end_time||'').slice(0,5)}</span></div>`;
    }).join('')
    :`<div style="font-size:12px;color:var(--text4);padding:8px 0">No shifts scheduled next week yet</div>`;
}

function whOpenHolidaysDrawer(){

  const todayStr=ukTodayStr();
  const upcoming=closures.filter(c=>c.date>=todayStr);
  const past=closures.filter(c=>c.date<todayStr).reverse();

function whOpenPayDrawer(){
  const rows=D.myPay||[];
  const byWeek={};
  rows.forEach(r=>{if(!byWeek[r.weekKey])byWeek[r.weekKey]={hours:0,pay:0,paid:true};byWeek[r.weekKey].hours+=r.hours;byWeek[r.weekKey].pay+=r.pay;if(!r.paid)byWeek[r.weekKey].paid=false;});

  const items=weekKeys.map(wk=>{
