<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; color: #0f172a; background: #f8fafc; line-height: 1.5; -webkit-font-smoothing: antialiased; }

.rf-page { padding: 20px 24px 40px; max-width: 1280px; margin: 0 auto; }
.rf-summary-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
.rf-requests-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
  
.rf-month-picker { display: flex; align-items: center; gap: 8px; }
.rf-month-picker button { width: 30px; height: 30px; border: 1.5px solid #e2e8f0; border-radius: 8px; background: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; color: #475569; transition: all .15s; }
.rf-month-picker button:hover { border-color: #2563eb; color: #2563eb; }
.rf-month-label { font-size: 13px; font-weight: 700; min-width: 110px; text-align: center; }

.rf-summary { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; }
.rf-pill { display: flex; align-items: center; gap: 6px; padding: 6px 13px; border-radius: 100px; font-size: 12.5px; font-weight: 600; border: 1px solid transparent; white-space: nowrap; cursor: pointer; transition: all .15s; }
.rf-pill:hover { transform: translateY(-1px); box-shadow: 0 3px 10px rgba(0,0,0,.1); }
.rf-pill.active-filter { box-shadow: 0 0 0 3px rgba(0,0,0,.15); }
.rf-pill svg { width: 13px; height: 13px; flex-shrink: 0; }
.rf-pill b { font-weight: 800; font-family: ui-monospace, monospace; }
.rf-pill.orange { background: #fff7ed; color: #c2410c; border-color: #fed7aa; }
.rf-pill.green  { background: #f0fdf4; color: #15803d; border-color: #bbf7d0; }
.rf-pill.blue   { background: #eff6ff; color: #1d4ed8; border-color: #bfdbfe; }
.rf-pill.gray   { background: #f8fafc; color: #475569; border-color: #e2e8f0; }

.rf-card { background: #fff; border: 1.5px solid #e2e8f0; border-radius: 14px; padding: 18px 20px; margin-bottom: 20px; }
.rf-card-title { font-size: 14px; font-weight: 700; margin-bottom: 14px; }

.rf-form-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-bottom: 12px; }
.rf-field label { display: block; font-size: 11px; font-weight: 700; color: #64748b; margin-bottom: 5px; }
.rf-field input, .rf-field select, .rf-field textarea { width: 100%; padding: 9px 11px; border: 1.5px solid #e2e8f0; border-radius: 9px; font-size: 13px; font-family: inherit; color: #0f172a; background: #fff; outline: none; transition: border-color .15s; }
.rf-field input:focus, .rf-field select:focus, .rf-field textarea:focus { border-color: #2563eb; }
.rf-field input[disabled] { background: #f8fafc; color: #94a3b8; cursor: not-allowed; }
.rf-field textarea { resize: vertical; min-height: 60px; }
.rf-submit-btn { padding: 10px 20px; background: #0f172a; color: #fff; border: none; border-radius: 10px; font-size: 13px; font-weight: 700; font-family: inherit; cursor: pointer; transition: background .15s; }
.rf-submit-btn:hover { background: #1e293b; }
.rf-submit-btn:disabled { background: #cbd5e1; cursor: not-allowed; }

.rf-add-btn { padding: 8px 16px; background: #2563eb; color: #fff; border: none; border-radius: 9px; font-size: 12.5px; font-weight: 700; font-family: inherit; cursor: pointer; transition: background .15s; white-space: nowrap; }
.rf-add-btn:hover { background: #1d4ed8; }

.rf-modal-overlay { position: fixed; inset: 0; background: rgba(15,23,42,.5); backdrop-filter: blur(2px); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
.rf-modal-overlay.open { display: flex; }
.rf-modal { background: #fff; border-radius: 16px; width: 100%; max-width: 620px; max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,.25); }
.rf-modal-hdr { display: flex; align-items: center; justify-content: space-between; padding: 18px 20px; border-bottom: 1.5px solid #e2e8f0; position: sticky; top: 0; background: #fff; z-index: 1; }
.rf-modal-close { width: 28px; height: 28px; border: none; background: #f1f5f9; border-radius: 8px; font-size: 13px; color: #64748b; cursor: pointer; transition: all .15s; }
.rf-modal-close:hover { background: #e2e8f0; color: #0f172a; }
.rf-modal-body { padding: 20px; }

@media(max-width:600px){ .rf-modal{max-width:100%;border-radius:14px 14px 0 0;position:fixed;bottom:0;left:0;right:0;max-height:85vh;} .rf-modal-overlay{align-items:flex-end;padding:0;} }

.rf-toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 2000; display: flex; flex-direction: column; gap: 8px; }
.rf-toast { background: #0f172a; color: #fff; padding: 11px 16px; border-radius: 10px; font-size: 12.5px; font-weight: 600; box-shadow: 0 8px 24px rgba(0,0,0,.2); animation: rfToastIn .2s ease; max-width: 320px; }
.rf-toast.success { background: #15803d; }
.rf-toast.error { background: #be123c; }
.rf-toast.warn { background: #b45309; }
@keyframes rfToastIn { from{opacity:0;transform:translateY(8px);} to{opacity:1;transform:translateY(0);} }
@keyframes rfToastOut { to{opacity:0;transform:translateY(8px);} }
  

.rf-table-card { background: #fff; border-radius: 14px; border: 1px solid #e2e8f0; overflow: hidden; box-shadow: 0 1px 6px rgba(0,0,0,.05); display: flex; flex-direction: column; height: calc(100vh - 240px); min-height: 280px; }
.rf-table-wrap { flex: 1; overflow-y: auto; overflow-x: hidden; }
.rf-table { width: 100%; border-collapse: collapse; table-layout: fixed; font-size: 12.5px; }
.rf-table thead tr { background: #f8fafc; border-bottom: 2px solid #e2e8f0; position: sticky; top: 0; z-index: 2; }
.rf-table th { text-align: left; padding: 11px 10px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .4px; color: #94a3b8; white-space: nowrap; }
.rf-table tbody tr { border-bottom: 1px solid #f1f5f9; cursor: pointer; transition: background .1s; }
.rf-table tbody tr:hover td { background: #f8fafc; }
.rf-table tbody tr:last-child { border-bottom: none; }
.rf-table td { padding: 11px 10px; border-bottom: inherit; vertical-align: middle; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rf-days-old { font-size: 10.5px; color: #94a3b8; margin-top: 1px; }
.rf-order-num { font-weight: 700; font-family: ui-monospace, monospace; }
.rf-notes-cell { max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #64748b; font-size: 11.5px; }
.rf-table td { white-space: normal; }
.rf-table td.rf-notes-cell, .rf-table td.rf-order-num { white-space: nowrap; }
@media(max-width:900px){ .rf-table-card{height:calc(100vh - 300px);} }
.rf-mkt-badge { display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 10.5px; font-weight: 700; }
.rf-mkt-badge.ebay { background: #fef3c7; color: #92400e; }
.rf-mkt-badge.amazon { background: #fef3c7; color: #d97706; background: #fff7ed; color: #c2410c; }
.rf-status-pill { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 99px; font-size: 10.5px; font-weight: 700; }
.rf-status-pill.pending { background: #fef3c7; color: #b45309; }
.rf-status-pill.processed { background: #dcfce7; color: #15803d; }
.rf-status-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.rf-amt-input { width: 90px; padding: 5px 8px; border: 1.5px solid #e2e8f0; border-radius: 7px; font-size: 12.5px; font-family: ui-monospace, monospace; }
.rf-empty { text-align: center; padding: 40px 20px; color: #94a3b8; font-size: 13px; }
.rf-expand-btn { width: 22px; height: 22px; border: none; background: #f1f5f9; border-radius: 6px; color: #64748b; cursor: pointer; font-size: 10px; display: flex; align-items: center; justify-content: center; transition: all .15s; }
.rf-expand-btn:hover { background: #e2e8f0; color: #0f172a; }
.rf-expand-btn svg { width: 11px; height: 11px; transition: transform .15s; }
.rf-expand-btn.open svg { transform: rotate(90deg); }
.rf-detail-row td { background: #f8fafc; padding: 0 !important; border-bottom: 1px solid #f1f5f9; white-space: normal !important; }
.rf-detail-inner { padding: 12px 16px; display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
.rf-detail-text { display: flex; flex-direction: column; gap: 8px; flex: 1; min-width: 0; }
.rf-detail-item { font-size: 12.5px; color: #334155; line-height: 1.5; }
.rf-detail-item b { color: #64748b; font-weight: 700; margin-right: 5px; }
.rf-detail-actions { display: flex; gap: 8px; flex-shrink: 0; }
.rf-detail-btn { padding: 7px 16px; border: none; border-radius: 8px; background: #2563eb; font-size: 12px; font-weight: 700; font-family: inherit; color: #fff; cursor: pointer; transition: background .15s; }
.rf-detail-btn:hover { background: #1d4ed8; }
.rf-detail-btn.danger { background: #dc2626; }
.rf-detail-btn.danger:hover { background: #b91c1c; }  
  
@media(max-width:900px){ .rf-form-grid{grid-template-columns:1fr 1fr;} .rf-summary{grid-template-columns:1fr 1fr;} }
@media(max-width:600px){ .rf-page{padding:14px 14px 32px;} .rf-form-grid{grid-template-columns:1fr;} .rf-summary{grid-template-columns:1fr 1fr;gap:8px;} .rf-header{flex-direction:column;align-items:flex-start;} }
</style>

<div class="rf-page">
<div class="rf-summary-row">
  <div class="rf-summary" id="rfSummary">
  <div class="rf-pill orange" id="rfPillOutstanding" onclick="rfSetFilter('outstanding')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg><span>Outstanding: <b id="rfOutCount">—</b> · <b id="rfOutAmt">—</b></span></div>
    <div class="rf-pill green" id="rfPillProcessed" onclick="rfSetFilter('processed')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg><span>Processed: <b id="rfProcCount">—</b> · <b id="rfProcAmt">—</b></span></div>
    <div class="rf-pill blue" style="cursor:default"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg><span>Total Requested: <b id="rfReqAmt">—</b></span></div>
  
  </div>
  <button class="rf-add-btn" onclick="rfOpenModal()">+ Submitt Request</button>
</div>

<div class="rf-requests-row">
  <div class="rf-card-title" style="margin-bottom:0">Requests — <span id="rfListMonthLabel"></span></div>
  <div class="rf-month-picker">
    <button onclick="rfShiftMonth(-1)" title="Previous month">‹</button>
    <div class="rf-month-label" id="rfMonthLabel">—</div>
    <button onclick="rfShiftMonth(1)" title="Next month">›</button>
  </div>
</div>

  
<div class="rf-table-card">
    <div class="rf-table-wrap">
      <table class="rf-table">
        <colgroup>
          <col style="width:4%"><col style="width:13%"><col style="width:11%"><col style="width:12%"><col style="width:15%"><col style="width:12%"><col style="width:11%"><col style="width:12%"><col style="width:10%">
        </colgroup>
        <thead><tr>
          <th></th><th>Order #</th><th>Marketplace</th><th>Submitted</th><th>Person</th><th>Requested</th><th>Status</th><th>Amount</th><th>Processed</th>
        </tr></thead>
        <tbody id="rfTableBody"></tbody>
      </table>
      <div class="rf-empty" id="rfEmptyState" style="display:none">No refund requests for this month yet.</div>
    </div>
  </div>
</div>

<div class="rf-modal-overlay" id="rfModalOverlay" onclick="if(event.target===this)rfCloseModal()">
  <div class="rf-modal">
    <div class="rf-modal-hdr">
      <div class="rf-card-title" style="margin:0">New Refund Request</div>
      <button class="rf-modal-close" onclick="rfCloseModal()">✕</button>
    </div>
    <div class="rf-modal-body">
      <div class="rf-form-grid">
        <div class="rf-field"><label>Order Number</label><input type="text" id="rfOrderNumber" placeholder="e.g. 203-1234567-8901234"></div>
        <div class="rf-field"><label>Marketplace</label>
          <select id="rfMarketplace"><option value="">Select…</option><option value="eBay">eBay</option><option value="Amazon">Amazon</option></select>
        </div>
        <div class="rf-field"><label>Date</label><input type="text" id="rfDateDisplay" disabled></div>
        <div class="rf-field"><label>Person</label><input type="text" id="rfPersonDisplay" disabled></div>
        <div class="rf-field" style="grid-column:span 2"><label>Reason</label>
          <select id="rfReason" onchange="rfToggleNotes()">
            <option value="">Select…</option>
            <option value="Shipping claim (Lost/Damaged)">Shipping claim to be processed (Lost/Damaged)</option>
            <option value="Shipping claim (Not received, but delivered)">Shipping claim to be processed (Not received, but delivered)</option>
            <option value="Incorrect item sent - full refund">Incorrect item sent — full refund</option>
            <option value="Out of stock - full refund">Out of stock — full refund</option>
            <option value="Missing items - partial refund">Missing items — partial refund</option>
          </select>
        </div>
        <div class="rf-field"><label>Amount Requested (£) <span style="font-weight:400;color:#94a3b8">— optional</span></label><input type="number" id="rfAmountRequested" min="0" step="0.01" placeholder="0.00"></div>
        <div class="rf-field" id="rfNotesWrap" style="grid-column:span 3;display:none"><label>Notes — which/how many units are missing</label><textarea id="rfNotes" placeholder="e.g. 2 of 5 units missing from order"></textarea></div>
      </div>
      <button class="rf-submit-btn" onclick="rfSubmit()">Submit Refund Request</button>
    </div>
  </div>

</div>


<script>
(function(){
'use strict';

const CURRENT_USER = JSON.parse(sessionStorage.getItem('user') || '{}');
const IS_ADMIN = ['admin','administrator'].includes((CURRENT_USER.role||'').toLowerCase());
const CAN_WRITE_REFUNDS = IS_ADMIN || (CURRENT_USER.permissions || []).includes('refund_write');
const ME_NAME = ((CURRENT_USER.firstName||'')+' '+(CURRENT_USER.lastName||'')).trim() || 'Unknown';
const ME_ID = CURRENT_USER.userId || null;


function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function showToast(msg,type){
  let c=document.getElementById('rfToastContainer');
  if(!c){ c=document.createElement('div'); c.id='rfToastContainer'; c.className='rf-toast-container'; document.body.appendChild(c); }
  const el=document.createElement('div');
  el.className='rf-toast '+(type||'');
  el.textContent=msg;
  c.appendChild(el);
  setTimeout(()=>{ el.style.animation='rfToastOut .2s ease forwards'; setTimeout(()=>el.remove(),220); },3200);
}
function fmtGBP(n){ return '£'+(parseFloat(n)||0).toLocaleString('en-GB',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function fmtDateShort(d){ return d?new Date(d+'T00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short'}):'—'; }
function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

let RF_MONTH = new Date(); RF_MONTH.setDate(1);
let RF_ROWS = [];
let RF_FILTER = 'all';
let RF_EXPANDED_ID = null;

function rfCollapseRow(id){
  const btn=document.getElementById('rfExpandBtn'+id);
  const row=document.getElementById('rfDetailRow'+id);
  if(btn) btn.classList.remove('open');
  if(row) row.style.display='none';
}

function rfToggleRow(id){
  const wasOpen = RF_EXPANDED_ID===id;
  if(RF_EXPANDED_ID!==null) rfCollapseRow(RF_EXPANDED_ID);
  RF_EXPANDED_ID = wasOpen ? null : id;
  if(RF_EXPANDED_ID!==null){
    const btn=document.getElementById('rfExpandBtn'+RF_EXPANDED_ID);
    const row=document.getElementById('rfDetailRow'+RF_EXPANDED_ID);
    if(btn) btn.classList.add('open');
    if(row) row.style.display='table-row';
  }
}

function rfSetFilter(filter){
  RF_FILTER = RF_FILTER===filter ? 'all' : filter;
  document.querySelectorAll('.rf-pill[id^="rfPill"]').forEach(p=>p.classList.remove('active-filter'));
  if(RF_FILTER==='outstanding') document.getElementById('rfPillOutstanding')?.classList.add('active-filter');
  else if(RF_FILTER==='processed') document.getElementById('rfPillProcessed')?.classList.add('active-filter');
  rfRenderTable();
}

function rfMonthBounds(d){
  const y=d.getFullYear(), m=d.getMonth();
  const start=y+'-'+String(m+1).padStart(2,'0')+'-01';
  const nm=m===11?0:m+1, ny=m===11?y+1:y;
  const end=ny+'-'+String(nm+1).padStart(2,'0')+'-01';
  return{start,end};
}

async function rfLoad(){
  const{start,end}=rfMonthBounds(RF_MONTH);
  document.getElementById('rfMonthLabel').textContent=RF_MONTH.toLocaleDateString('en-GB',{month:'long',year:'numeric'});
  document.getElementById('rfListMonthLabel').textContent=RF_MONTH.toLocaleDateString('en-GB',{month:'long',year:'numeric'});
  const{data,error}=await sb.from('refunds').select('*')
    .gte('date_submitted',start).lt('date_submitted',end)
    .order('date_submitted',{ascending:false})
    .order('id',{ascending:true});
  if(error){ showToast('Failed to load refunds','error'); console.error(error); return; }
  RF_ROWS=data||[];
  rfRenderSummary();
  rfRenderTable();
}

function rfRenderSummary(){
  const outstanding=RF_ROWS.filter(r=>!r.refunded);
  const processed=RF_ROWS.filter(r=>r.refunded);
  const outAmt=outstanding.reduce((s,r)=>s+(parseFloat(r.amount_requested)||0),0);
  const procAmt=processed.reduce((s,r)=>s+(parseFloat(r.amount_processed)||0),0);
  const reqAmt=RF_ROWS.reduce((s,r)=>s+(parseFloat(r.amount_requested)||0),0);
  document.getElementById('rfOutCount').textContent=outstanding.length;
  document.getElementById('rfOutAmt').textContent=fmtGBP(outAmt);
  document.getElementById('rfProcCount').textContent=processed.length;
  document.getElementById('rfProcAmt').textContent=fmtGBP(procAmt);
  document.getElementById('rfReqAmt').textContent=fmtGBP(reqAmt);
}
function rfDaysOld(dateStr){
  if(!dateStr)return '';
  const d=new Date(dateStr+'T00:00');
  const t=new Date();t.setHours(0,0,0,0);
  const days=Math.round((t-d)/86400000);
  if(days===0)return 'Today';
  if(days===1)return '1 day ago';
  return days+' days ago';
}

function rfStatusPill(r){
  if(r.refunded) return `<span class="rf-status-pill processed"><span class="rf-status-dot"></span>Processed</span>`;
  return `<span class="rf-status-pill pending"><span class="rf-status-dot"></span>Pending</span>`;
}

function rfRenderTable(){
  const body=document.getElementById('rfTableBody');
  const empty=document.getElementById('rfEmptyState');
  const rows=RF_FILTER==='outstanding'?RF_ROWS.filter(r=>!r.refunded)
    :RF_FILTER==='processed'?RF_ROWS.filter(r=>r.refunded)
    :RF_ROWS;
  if(!rows.length){ body.innerHTML=''; empty.style.display='block'; empty.textContent=RF_FILTER==='all'?'No refund requests for this month yet.':'No requests match this filter.'; return; }
  empty.style.display='none';
  body.innerHTML=rows.map(r=>{
const amountCell=CAN_WRITE_REFUNDS
      ? `<input type="number" class="rf-amt-input" min="0" step="0.01" value="${r.amount_processed!=null?r.amount_processed:''}" placeholder="0.00" onchange="rfUpdateAmount(${r.id},this.value)">`
      : (r.amount_processed!=null?fmtGBP(r.amount_processed):'—');
    const refundedCell=CAN_WRITE_REFUNDS
      ? `<input type="checkbox" ${r.refunded?'checked':''} onchange="rfToggleRefunded(${r.id},this.checked)">`
      : rfStatusPill(r);
    const isOpen=RF_EXPANDED_ID===r.id;
    return `<tr>
      <td><button class="rf-expand-btn${isOpen?' open':''}" id="rfExpandBtn${r.id}" onclick="rfToggleRow(${r.id})"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></button></td>
      <td class="rf-order-num">${esc(r.order_number)}</td>
      <td><span class="rf-mkt-badge ${r.marketplace==='eBay'?'ebay':'amazon'}">${esc(r.marketplace)}</span></td>
      <td>${fmtDateShort(r.date_submitted)}<div class="rf-days-old">${rfDaysOld(r.date_submitted)}</div></td>
      <td>${esc(r.submitted_by)}</td>
      <td>${r.amount_requested!=null?fmtGBP(r.amount_requested):'—'}</td>
      <td>${CAN_WRITE_REFUNDS?refundedCell:rfStatusPill(r)}</td>
      <td>${amountCell}</td>
      <td>${fmtDateShort(r.date_processed)}</td>
    </tr>
<tr class="rf-detail-row" id="rfDetailRow${r.id}" style="display:${isOpen?'table-row':'none'}">
      <td colspan="9">
        <div class="rf-detail-inner">
          <div class="rf-detail-text">
            <div class="rf-detail-item"><b>Reason:</b>${esc(r.reason)}</div>
            ${r.notes?`<div class="rf-detail-item"><b>Notes:</b>${esc(r.notes)}</div>`:''}
          </div>
          ${CAN_WRITE_REFUNDS?`<div class="rf-detail-actions">
            <button class="rf-detail-btn" onclick="rfEditRefund(${r.id})">Edit</button>
            <button class="rf-detail-btn danger" onclick="rfDeleteRefund(${r.id})">Delete</button>
          </div>`:''}
        </div>
      </td>
    </tr>`;
  }).join('');
}

function rfToggleNotes(){
  const reason=document.getElementById('rfReason').value;
  document.getElementById('rfNotesWrap').style.display=reason==='Missing items - partial refund'?'block':'none';
}

let RF_EDIT_ID = null;

function rfOpenModal(){
  RF_EDIT_ID=null;
  document.getElementById('rfDateDisplay').value=new Date().toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'});
  document.getElementById('rfPersonDisplay').value=ME_NAME;
  document.getElementById('rfOrderNumber').value='';
  document.getElementById('rfMarketplace').value='';
  document.getElementById('rfReason').value='';
  document.getElementById('rfNotes').value='';
  document.getElementById('rfAmountRequested').value='';
  rfToggleNotes();
  document.querySelector('#rfModalOverlay .rf-card-title').textContent='New Refund Request';
  document.querySelector('.rf-submit-btn').textContent='Submit Refund Request';
  document.getElementById('rfModalOverlay').classList.add('open');
}
function rfCloseModal(){
  document.getElementById('rfModalOverlay').classList.remove('open');
}

function rfEditRefund(id){
  if(!CAN_WRITE_REFUNDS){ showToast('You do not have permission to edit refunds','warn'); return; }
  const r=RF_ROWS.find(x=>x.id===id);
  if(!r)return;
  RF_EDIT_ID=id;
  document.getElementById('rfDateDisplay').value=fmtDateShort(r.date_submitted);
  document.getElementById('rfPersonDisplay').value=r.submitted_by;
  document.getElementById('rfOrderNumber').value=r.order_number;
  document.getElementById('rfMarketplace').value=r.marketplace;
  document.getElementById('rfReason').value=r.reason;
  document.getElementById('rfNotes').value=r.notes||'';
  document.getElementById('rfAmountRequested').value=r.amount_requested!=null?r.amount_requested:'';
  rfToggleNotes();
  document.querySelector('#rfModalOverlay .rf-card-title').textContent='Edit Refund Request';
  document.querySelector('.rf-submit-btn').textContent='Save Changes';
  document.getElementById('rfModalOverlay').classList.add('open');
}

async function rfDeleteRefund(id){
  if(!CAN_WRITE_REFUNDS){ showToast('You do not have permission to delete refunds','warn'); return; }
  if(!confirm('Delete this refund request? This cannot be undone.'))return;
  const{error}=await sb.from('refunds').delete().eq('id',id);
  if(error){ showToast('Failed to delete','error'); console.error(error); return; }
  RF_ROWS=RF_ROWS.filter(r=>r.id!==id);
  showToast('Refund request deleted','success');
  rfRenderTable(); rfRenderSummary();
}

async function rfSubmit(){
  const orderNumber=document.getElementById('rfOrderNumber').value.trim();
  const marketplace=document.getElementById('rfMarketplace').value;
  const reason=document.getElementById('rfReason').value;
  const notes=document.getElementById('rfNotes').value.trim();
  const amountRequested=document.getElementById('rfAmountRequested').value;
  if(!orderNumber||!marketplace||!reason){ showToast('Please fill in Order Number, Marketplace and Reason','error'); return; }
  const payload={
    order_number:orderNumber, marketplace, reason,
    notes:reason==='Missing items - partial refund'?(notes||null):null,
    amount_requested:amountRequested?parseFloat(amountRequested):null,
  };
  if(RF_EDIT_ID){
    const{error}=await sb.from('refunds').update(payload).eq('id',RF_EDIT_ID);
    if(error){ showToast('Failed to save changes','error'); console.error(error); return; }
    showToast('Refund request updated ✓','success');
  }else{
    payload.date_submitted=todayStr();
    payload.submitted_by=ME_NAME; payload.submitted_by_id=ME_ID;
    const{error}=await sb.from('refunds').insert(payload);
    if(error){ showToast('Failed to submit refund request','error'); console.error(error); return; }
    showToast('Refund request submitted ✓','success');
  }
  rfCloseModal();
  rfLoad();
}

async function rfToggleRefunded(id,checked){
  if(!CAN_WRITE_REFUNDS){ showToast('You do not have permission to update refunds','warn'); return; }
  const r=RF_ROWS.find(x=>x.id===id);
  if(!r)return;
  if(checked&&!(parseFloat(r.amount_processed)>0)){
    showToast('Enter an amount processed before marking as refunded','warn');
    rfRenderTable();
    return;
  }
  const patch=checked
    ? {refunded:true, date_processed:todayStr(), processed_by:ME_NAME, updated_at:new Date().toISOString()}
    : {refunded:false, date_processed:null, processed_by:null, updated_at:new Date().toISOString()};
  r.refunded=patch.refunded; r.date_processed=patch.date_processed; r.processed_by=patch.processed_by;
  rfRenderTable(); rfRenderSummary();
  const{error}=await sb.from('refunds').update(patch).eq('id',id);
  if(error){ showToast('Failed to update','error'); console.error(error); rfLoad(); return; }
  showToast(checked?'Marked as processed ✓':'Marked as outstanding','success');
}

async function rfUpdateAmount(id,val){
  if(!CAN_WRITE_REFUNDS){ showToast('You do not have permission to update refunds','warn'); return; }
  const amount=val?parseFloat(val):null;
  const r=RF_ROWS.find(x=>x.id===id);
  if(!r)return;
  const patch={amount_processed:amount,updated_at:new Date().toISOString()};
  const wasUnmarked = r.refunded && !(amount>0);
  if(wasUnmarked){ patch.refunded=false; patch.date_processed=null; patch.processed_by=null; }
  // Update local state immediately so any near-simultaneous checkbox click sees the fresh value.
  r.amount_processed=amount;
  if(wasUnmarked){ r.refunded=false; r.date_processed=null; r.processed_by=null; }
  rfRenderTable(); rfRenderSummary();
  const{error}=await sb.from('refunds').update(patch).eq('id',id);
  if(error){ showToast('Failed to save amount','error'); console.error(error); rfLoad(); return; }
  showToast(wasUnmarked?'Amount cleared — marked as outstanding':'Amount saved ✓','success');
}

function rfShiftMonth(delta){
  RF_MONTH=new Date(RF_MONTH.getFullYear(),RF_MONTH.getMonth()+delta,1);
  rfSetFilter('all');
  rfLoad();
}


function rfInit(){
  rfLoad();
}

window.rfShiftMonth=rfShiftMonth;
window.rfSubmit=rfSubmit;
window.rfToggleRefunded=rfToggleRefunded;
window.rfUpdateAmount=rfUpdateAmount;
window.rfToggleNotes=rfToggleNotes;
window.rfOpenModal=rfOpenModal;
window.rfCloseModal=rfCloseModal;
window.rfSetFilter=rfSetFilter;
window.rfToggleRow=rfToggleRow;
window.rfEditRefund=rfEditRefund;
window.rfDeleteRefund=rfDeleteRefund;
  
rfInit();
})();
</script>
