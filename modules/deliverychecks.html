<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f8fafc;
  --surface:#ffffff;
  --surface2:#f1f5f9;
  --border:#e2e8f0;
  --border2:#f1f5f9;
  --text:#0f172a;
  --text2:#334155;
  --text3:#64748b;
  --text4:#94a3b8;
  --accent:#2563eb;
  --accent-bg:#eff6ff;
  --accent-bd:#bfdbfe;
  --green:#15803d;
  --green-bg:#f0fdf4;
  --green-bd:#bbf7d0;
  --red:#dc2626;
  --red-bg:#fef2f2;
  --red-bd:#fecaca;
  --amber:#b45309;
  --amber-bg:#fffbeb;
  --amber-bd:#fde68a;
  --navy:#0f172a;
  --r:10px;--r-sm:8px;--r-lg:14px;
  --font:'Plus Jakarta Sans',system-ui,sans-serif;
  --mono:'JetBrains Mono',monospace;
  --sh-sm:0 1px 3px rgba(15,23,42,.06),0 1px 2px rgba(15,23,42,.04);
  --sh:0 4px 16px rgba(15,23,42,.08),0 2px 6px rgba(15,23,42,.04);
}
html,body{font-family:var(--font);font-size:14px;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased;height:100%;overflow:hidden}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:6px}
::-webkit-scrollbar-thumb:hover{background:var(--text4)}

.dc-app{display:flex;flex-direction:column;height:100vh;overflow:hidden}

/* TOPBAR */
.topbar{display:flex;align-items:center;gap:8px;padding:8px 16px;background:rgba(255,255,255,.92);border-bottom:1px solid var(--border);flex-shrink:0;flex-wrap:wrap;position:relative;}
.topbar-left{display:flex;align-items:center;gap:7px;flex:1;min-width:0;flex-wrap:wrap}
.topbar-right{display:flex;align-items:center;gap:6px;flex-shrink:0}

/* FILTER PILLS */
.pill{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:100px;font-size:11px;font-weight:700;border:1.5px solid var(--border);background:var(--surface);color:var(--text3);cursor:pointer;transition:all .15s;user-select:none;white-space:nowrap}
.pill:hover{border-color:var(--text4);color:var(--text2)}
.pill svg{width:10px;height:10px;flex-shrink:0}
.pill .ct{display:inline-flex;align-items:center;justify-content:center;min-width:17px;height:17px;padding:0 4px;border-radius:100px;font-size:10px;font-weight:700;background:var(--border);color:var(--text3)}
.pill.p-all.active{background:var(--navy);border-color:var(--navy);color:#fff}
.pill.p-all.active .ct{background:rgba(255,255,255,.18);color:#fff}
.pill.p-done.active{background:var(--green-bg);border-color:var(--green-bd);color:var(--green)}
.pill.p-done.active .ct{background:var(--green-bd);color:var(--green)}
.pill.p-pending.active{background:var(--amber-bg);border-color:var(--amber-bd);color:var(--amber)}
.pill.p-pending.active .ct{background:var(--amber-bd);color:var(--amber)}

/* SEARCH */
.search-box{position:relative;min-width:140px;max-width:220px;flex:1}
.search-box svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--text4);width:13px;height:13px;pointer-events:none}
.search-box input{width:100%;padding:6px 9px 6px 28px;border:1.5px solid var(--border);border-radius:var(--r-sm);font-size:12.5px;font-family:var(--font);background:var(--surface2);color:var(--text);outline:none;transition:border-color .15s}
.search-box input:focus{border-color:var(--accent);background:#fff}

/* CONTENT */
.dc-content{flex:1;overflow:hidden;min-height:0;padding:0px;display:flex;flex-direction:column}

/* TABLE CARD */
.table-card{flex:1;min-height:0;background:var(--surface);border-radius:var(--r-lg);border:1px solid var(--border);overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--sh-sm)}
.table-scroll{flex:1;overflow:auto;min-height:0;isolation:isolate;}
.data-tbl{width:100%;border-collapse:collapse;font-size:13px}
.data-tbl thead th{background:var(--navy);padding:10px 14px;text-align:left;font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:rgba(255,255,255,.7);white-space:nowrap;position:sticky;top:0;}
.data-tbl thead th.center{text-align:center}
.data-tbl tbody tr{border-bottom:1px solid var(--border2);transition:background .1s;animation:rowIn .15s ease both}
@keyframes rowIn{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:translateY(0)}}
.data-tbl tbody tr:last-child{border-bottom:none}
.data-tbl tbody tr:hover td{background:#fafbff}
.data-tbl td{padding:10px 14px;color:var(--text2);vertical-align:middle}
.data-tbl td.center{text-align:center}

/* NAME CELL */
.name-cell{font-weight:600;color:var(--text);font-size:12.5px;line-height:1.35;max-width:260px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.sup-cell{font-size:11px;color:var(--text4);margin-top:2px;display:flex;align-items:center;gap:4px}

/* CODE BADGE */
.code-badge{font-family:var(--mono);font-size:10.5px;color:var(--text3);background:var(--surface2);border:1px solid var(--border);padding:2px 6px;border-radius:5px;display:inline-block;white-space:nowrap}

/* YN TOGGLE */
.yn{display:inline-flex;align-items:center;justify-content:center;gap:4px;width:62px;padding:4px 8px;border-radius:100px;font-size:11px;font-weight:700;cursor:pointer;border:1.5px solid;transition:all .16s;user-select:none;flex-shrink:0}
.yn svg{width:10px;height:10px;flex-shrink:0}
.yn.yes{background:var(--green-bg);color:var(--green);border-color:var(--green-bd)}
.yn.no{background:var(--red-bg);color:var(--red);border-color:var(--red-bd)}
.yn.yes:hover{background:#dcfce7;border-color:#86efac}
.yn.no:hover{background:#fee2e2;border-color:#fca5a5}
.yn.saving{opacity:.45;pointer-events:none}

/* STATUS DOTS */
.dots{display:flex;align-items:center;gap:4px;justify-content:center}
.dot{width:7px;height:7px;border-radius:50%;background:var(--border);flex-shrink:0;transition:background .2s}
.dot.done{background:#22c55e}

/* STATE */
.state-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;gap:10px;flex:1}
.state-wrap p{font-size:13px;font-weight:700;color:var(--text2)}
.state-wrap span{font-size:12px;color:var(--text4)}
.spinner{display:inline-block;border:2.5px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .65s linear infinite}
.spin-sm{width:14px;height:14px}
.spin-md{width:24px;height:24px;border-width:3px}
@keyframes spin{to{transform:rotate(360deg)}}

/* TOASTS */
.toasts{position:fixed;top:14px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.toast{display:flex;align-items:center;gap:8px;padding:9px 13px;background:var(--navy);color:#fff;border-radius:var(--r);font-size:12.5px;font-weight:600;box-shadow:var(--sh);animation:toastIn .2s ease;max-width:300px;pointer-events:auto;border-left:3px solid rgba(255,255,255,.15)}
.toast.success{background:#14532d;border-left-color:var(--green)}
.toast.error{background:#7f1d1d;border-left-color:var(--red)}
.toast.info{background:#1e3a8a;border-left-color:var(--accent)}
@keyframes toastIn{from{opacity:0;transform:translateY(-6px) scale(.96)}to{opacity:1;transform:none}}

/* PBAR */
.pbar{position:fixed;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--accent),#60a5fa);z-index:50;transform:scaleX(0);transform-origin:left;transition:transform .3s ease;opacity:0}
.pbar.active{opacity:1}

@media(max-width:700px){
  .dc-content{padding:8px}
  .name-cell{max-width:160px}
  .data-tbl td,.data-tbl th{padding:8px 10px}
}
</style>

<div class="pbar" id="pbar"></div>
<div class="toasts" id="toasts"></div>

<div class="dc-app">
  <div class="topbar">
    <div class="topbar-left">
      <button class="pill p-all" id="pill-all" onclick="setFilter('all')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></svg>
        All <span class="ct" id="ctAll">0</span>
      </button>
      <button class="pill p-done" id="pill-done" onclick="setFilter('done')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        Fully Complete <span class="ct" id="ctDone">0</span>
      </button>
     <button class="pill p-pending active" id="pill-pending" onclick="setFilter('pending')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        Action Needed <span class="ct" id="ctPending">0</span>
      </button>
      <div class="search-box" style="margin-left:auto">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="searchInput" placeholder="Search products…" oninput="clearTimeout(window._dcSt);window._dcSt=setTimeout(renderView,180)">
      </div>
    </div>
  </div>

  <div class="dc-content">
    <div class="table-card">
      <div class="table-scroll" id="tableScroll">
        <div class="state-wrap"><span class="spinner spin-md"></span><p>Loading records…</p></div>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
'use strict';

const sb = window.sb;

/* ── STATE ── */
let allData = [];
let activeFilter = 'pending';

/* ── PBAR ── */
let _pv=0,_pt=null;
function pStart(){const b=document.getElementById('pbar');clearInterval(_pt);_pv=0.1;b.style.transform='scaleX(0.1)';b.classList.add('active');_pt=setInterval(()=>{_pv=Math.min(_pv+(1-_pv)*0.07,0.92);b.style.transform=`scaleX(${_pv})`;},250);}
function pDone(){clearInterval(_pt);const b=document.getElementById('pbar');b.style.transform='scaleX(1)';setTimeout(()=>{b.classList.remove('active');b.style.transform='scaleX(0)';},380);}

/* ── TOAST ── */
let _tn=0;
function toast(msg,type,dur){
  const c=document.getElementById('toasts'),id='t'+(++_tn);
  const t=document.createElement('div');t.className='toast '+(type||'');t.id=id;
  const icons={success:'<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>',error:'<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>',info:'<span class="spinner spin-sm" style="border-color:rgba(255,255,255,.3);border-top-color:#fff;flex-shrink:0"></span>'};
  t.innerHTML=(icons[type]||'')+msg;
  c.appendChild(t);
  const ms=dur===undefined?3000:dur;
  if(ms>0)setTimeout(()=>t.remove(),ms);
  return id;
}
function removeToast(id){document.getElementById(id)?.remove();}

/* ── HELPERS ── */
function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function fmtDate(v){if(!v)return'—';try{const d=new Date(v);return isNaN(d)?String(v):d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});}catch(e){return String(v);}}

/* ── LOAD ── */
async function loadData(){
  pStart();
  try{
    const{data,error}=await sb
      .from('listing')
      .select('opportunity_id,date,listing_name,asins,supplier_name,code,bin_location,images_shared,sku_label_printed')
      .eq('warehouse',true)
      .eq('arrived',true)
      .not('date','is',null)
      .order('date',{ascending:false});
    if(error)throw error;
    allData=data||[];
    renderView();
    updateCounts();
  }catch(e){
    document.getElementById('tableScroll').innerHTML=`<div class="state-wrap"><p style="color:var(--red)">Failed to load</p><span>${esc(e.message)}</span></div>`;
    toast('Failed to load: '+e.message,'error');
  }
  pDone();
}

/* ── COUNTS ── */
function updateCounts(){
  const done=allData.filter(r=>r.images_shared&&r.sku_label_printed).length;
  document.getElementById('ctAll').textContent=allData.length;
  document.getElementById('ctDone').textContent=done;
  document.getElementById('ctPending').textContent=allData.length-done;
}

/* ── FILTER ── */
function setFilter(f){
  activeFilter=f;
  ['all','done','pending'].forEach(k=>{
    const el=document.getElementById('pill-'+k);
    el.className='pill p-'+k+(f===k?' active':'');
  });
  renderView();
}

function getFiltered(){
  const q=(document.getElementById('searchInput').value||'').toLowerCase().trim();
  return allData.filter(r=>{
    const imgDone=!!r.images_shared,skuDone=!!r.sku_label_printed,allDone=imgDone&&skuDone;
    if(activeFilter==='done'&&!allDone)return false;
    if(activeFilter==='pending'&&allDone)return false;
    if(q){
      const s=(String(r.listing_name||'')+' '+String(r.supplier_name||'')+' '+String(r.code||'')+' '+String(r.asins||'')+' '+String(r.opportunity_id||'')).toLowerCase();
      if(!s.includes(q))return false;
    }
    return true;
  });
}

/* ── RENDER ── */
function renderView(){
  const data=getFiltered();
  const scroll=document.getElementById('tableScroll');
  if(!data.length){
    scroll.innerHTML=`<div class="state-wrap"><p>No records found</p><span>${activeFilter!=='all'?'Try switching to "All"':'No warehouse arrivals yet'}</span></div>`;
    return;
  }
  let html=`<table class="data-tbl"><thead><tr>
    <th style="width:100px">Date</th>
    <th>Product Name</th>
    <th>Supplier & Code</th>
    <th style="width:110px">Bin Location</th>
    <th class="center" style="width:120px">Images Shared</th>
    <th class="center" style="width:140px">SKU Label Printed</th>
    <th class="center" style="width:70px">Status</th>
  </tr></thead><tbody>`;
  data.forEach((r,i)=>{
    const id=esc(String(r.opportunity_id||''));
    const imgDone=!!r.images_shared,skuDone=!!r.sku_label_printed;
    html+=`<tr style="animation-delay:${i*0.025}s">`;
    html+=`<td style="white-space:nowrap;color:var(--text4);font-size:11.5px">${fmtDate(r.date)}</td>`;
    html+=`<td><div class="name-cell">${esc(r.listing_name||'—')}</div>`;
    if(r.supplier_name)html+=`<div class="sup-cell">${esc(r.supplier_name)}</div>`;
    html+=`</td>`;
    html+=`<td>${r.code?`<span class="code-badge">${esc(r.code)}</span>`:'<span style="color:var(--text4)">—</span>'}</td>`;
    html+=`<td><input type="text" value="${esc(r.bin_location||'')}" placeholder="e.g. A1-03" style="width:100%;padding:5px 8px;border:1.5px solid var(--border);border-radius:var(--r-sm);font-size:12px;font-family:var(--font);color:var(--text);background:var(--surface2);outline:none;transition:border-color .15s" onfocus="this.style.borderColor='var(--accent)';this.style.background='#fff'" onblur="this.style.borderColor='var(--border)';this.style.background='var(--surface2)';saveBinLocation('${esc(String(r.opportunity_id||''))}',this.value)"></td>`;
    html+=`<td class="center">${ynToggle(id,'images_shared',imgDone)}</td>`;
    html+=`<td class="center">${ynToggle(id,'sku_label_printed',skuDone)}</td>`;
    html+=`<td class="center"><div class="dots"><div class="dot${imgDone?' done':''}" title="Images Shared"></div><div class="dot${skuDone?' done':''}" title="SKU Label Printed"></div></div></td>`;
    html+=`</tr>`;
  });
  html+='</tbody></table>';
  scroll.innerHTML=html;
}

/* ── YN TOGGLE ── */
function ynToggle(id,field,isYes){
  const cls=isYes?'yes':'no',lbl=isYes?'Yes':'No';
  const icon=isYes
    ?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>'
    :'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';
  const safeId=id.replace(/'/g,"\\'");
  return`<span class="yn ${cls}" onclick="toggleField('${safeId}','${field}',${!isYes})">${icon}${lbl}</span>`;
}

/* ── TOGGLE ── */
async function toggleField(opportunityId,field,newVal){
  const rec=allData.find(r=>String(r.opportunity_id)===String(opportunityId));
  if(!rec)return;
  const prev=rec[field];
  rec[field]=newVal;

  // Update just the clicked toggle in-place, no full re-render
  const safeId=opportunityId.replace(/'/g,"\\'");
  const allToggles=document.querySelectorAll(`[onclick*="toggleField('${safeId}','${field}'"]`);
  allToggles.forEach(el=>{
    el.className='yn '+(newVal?'yes':'no')+' saving';
    el.setAttribute('onclick',`toggleField('${safeId}','${field}',${!newVal})`);
    const icon=newVal
      ?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>'
      :'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';
    el.innerHTML=icon+(newVal?'Yes':'No');
  });

  // Update status dots for this row in-place
  const imgDone=field==='images_shared'?newVal:!!rec.images_shared;
  const skuDone=field==='sku_label_printed'?newVal:!!rec.sku_label_printed;
  const row=allToggles[0]?.closest('tr');
  if(row){
    const dots=row.querySelectorAll('.dot');
    if(dots[0])dots[0].className='dot'+(imgDone?' done':'');
    if(dots[1])dots[1].className='dot'+(skuDone?' done':'');
  }

  updateCounts();

  const tid=toast('Saving…','info',0);
  const{error}=await sb.from('listing').update({[field]:newVal}).eq('opportunity_id',opportunityId);
  removeToast(tid);

  if(error){
    // Revert on failure
    rec[field]=prev;
    allToggles.forEach(el=>{
      el.className='yn '+(prev?'yes':'no');
      el.setAttribute('onclick',`toggleField('${safeId}','${field}',${!prev})`);
      const icon=prev
        ?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>'
        :'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';
      el.innerHTML=icon+(prev?'Yes':'No');
    });
    updateCounts();
    toast('Failed to save','error');
  }else{
    // Remove saving state
    allToggles.forEach(el=>el.classList.remove('saving'));
    toast(newVal?'Marked Yes':'Marked No','success');

    // If filter is 'pending' and row is now fully done, fade it out cleanly
    if(activeFilter==='pending'&&imgDone&&skuDone&&row){
      row.style.transition='opacity .3s ease';
      row.style.opacity='0';
      setTimeout(()=>{
        allData=allData; // keep in memory for counts
        renderView();
      },320);
    }
  }
}



/* ── BIN LOCATION ── */
async function saveBinLocation(opportunityId, value) {
  const rec = allData.find(r => String(r.opportunity_id) === String(opportunityId));
  if (!rec || rec.bin_location === value) return;
  rec.bin_location = value;
  const tid = toast('Saving…', 'info', 0);
  const { error } = await sb.from('listing').update({ bin_location: value || null }).eq('opportunity_id', opportunityId);
  removeToast(tid);
  if (error) toast('Failed to save', 'error');
  else toast('Bin location saved', 'success');
}

  
/* ── GLOBALS ── */
window.saveBinLocation = saveBinLocation;
window.setFilter=setFilter;
window.toggleField=toggleField;

/* ── INIT ── */
loadData();

})();
</script>
