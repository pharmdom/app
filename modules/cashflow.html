<style>
:root{
  --bg:#eef1f8;--surface:#ffffff;--surface2:#f5f7fc;--surface3:#e8edf7;
  --border:#e2e8f5;--border2:#ecf0f9;
  --text:#0c1526;--text2:#2a3a54;--text3:#64748b;--text4:#98a7bc;
  --accent:#1847d4;--accent-l:#2a5eed;--accent-bg:#eef2fd;--accent-bd:#c4d3f9;
  --green:#0c7a42;--green-bg:#ecfdf5;--green-bd:#86efac;
  --red:#b91c1c;--red-bg:#fef2f2;--red-bd:#fecaca;
  --amber:#92400e;--amber-bg:#fffbeb;--amber-bd:#fde68a;
  --navy:#0c1526;--navy2:#141d2e;
  --r:10px;--r-lg:14px;--r-xl:18px;
  --font:'Plus Jakarta Sans',system-ui,sans-serif;
  --mono:'JetBrains Mono',monospace;
  --sh-sm:0 1px 3px rgba(12,21,38,.06),0 1px 2px rgba(12,21,38,.04);
  --sh:0 4px 16px rgba(12,21,38,.08),0 2px 6px rgba(12,21,38,.04);
  --sh-lg:0 20px 50px rgba(12,21,38,.14),0 6px 16px rgba(12,21,38,.07);
}
.cf-app{font-family:var(--font);font-size:14px;color:var(--text);background:var(--bg);height:calc(100vh - 0px);padding:20px;box-sizing:border-box;overflow:hidden;display:flex;flex-direction:column;gap:14px;}
.cf-summary-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;flex-shrink:0;}
.cf-pill{display:flex;align-items:center;gap:9px;padding:8px 14px;border-radius:100px;border:1px solid var(--border);background:var(--surface);cursor:pointer;transition:all .15s;}
  
.cf-pill.static{cursor:default;}
.cf-pill:hover:not(.static){border-color:var(--accent-bd);transform:translateY(-1px);}
.cf-pill.active{background:var(--accent);border-color:var(--accent);}
.cf-pill.active .cf-pill-lbl{color:rgba(255,255,255,.75);}
.cf-pill.active .cf-pill-val{color:#fff;}
.cf-pill-icon{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.cf-pill-icon svg{width:13px;height:13px;}
.cf-pill-text{display:flex;align-items:center;gap:6px;}
.cf-pill-lbl{font-size:10.5px;font-weight:700;color:var(--text3);white-space:nowrap;}
.cf-pill-val{font-size:12.5px;font-weight:800;color:var(--text);font-family:var(--mono);white-space:nowrap;}
.cf-month-switch{display:flex;align-items:center;gap:6px;margin-left:auto;background:var(--surface);border:1px solid var(--border);border-radius:100px;padding:4px 6px;}
.cf-month-label{font-size:12.5px;font-weight:700;color:var(--text);min-width:112px;text-align:center;}
.cf-month-btn{width:26px;height:26px;border-radius:50%;border:none;background:var(--surface2);color:var(--text3);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s;}
.cf-month-btn:hover{background:var(--accent-bg);color:var(--accent);}
.cf-grid{display:grid;grid-template-columns:340px 1fr;gap:18px;align-items:stretch;flex:1;min-height:0;}
  
/* LEFT PANEL — CARDS, fixed height */
.cf-panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-xl);display:flex;flex-direction:column;height:100%;overflow:hidden;}
.cf-panel-hdr{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--border);flex-shrink:0;}
.cf-panel-title{font-size:11px;font-weight:700;letter-spacing:.5px;color:#64748b}
.cf-panel-sub{font-size:11px;color:var(--text3);margin-top:2px;}
.cf-add-btn{width:32px;height:32px;border-radius:10px;border:none;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:transform .15s,box-shadow .15s;}
.cf-add-btn:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(24,71,212,.3);}
.cf-cards-scroll{flex:1;min-height:0;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:16px;}
.cf-cards-scroll::-webkit-scrollbar{width:4px;}
.cf-cards-scroll::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}
.cf-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:50px 20px;gap:8px;text-align:center;color:var(--text4);flex:1;}

/* THE VIRTUAL CARD */
.cc-card{width:100%;aspect-ratio:1.586/1;perspective:1200px;cursor:pointer;flex-shrink:0;}
.cc-card-inner{position:relative;width:100%;height:100%;transition:transform .6s cubic-bezier(.4,0,.2,1);transform-style:preserve-3d;}
.cc-card.flipped .cc-card-inner{transform:rotateY(180deg);}
.cc-face{position:absolute;inset:0;border-radius:16px;backface-visibility:hidden;padding:18px 20px;display:flex;flex-direction:column;justify-content:space-between;color:#fff;box-shadow:0 8px 24px rgba(0,0,0,.18),0 2px 6px rgba(0,0,0,.1);overflow:hidden;}
.cc-face::before{content:'';position:absolute;top:-40%;right:-20%;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.14) 0%,transparent 70%);}
.cc-face::after{content:'';position:absolute;bottom:-50%;left:-10%;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.08) 0%,transparent 70%);}
.cc-back{transform:rotateY(180deg);}
.cc-top-row{display:flex;justify-content:space-between;align-items:flex-start;position:relative;z-index:1;}
.cc-chip{width:34px;height:26px;border-radius:5px;background:linear-gradient(135deg,#f5d98b,#d4af5a);position:relative;cursor:pointer;transition:transform .15s;}
.cc-chip::before{content:'';position:absolute;inset:4px;border:1px solid rgba(0,0,0,.15);border-radius:3px;}
.cc-chip:hover{transform:scale(1.08);}
.cc-chip-edit{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .15s;background:rgba(0,0,0,.45);border-radius:5px;color:#fff;}
.cc-chip:hover .cc-chip-edit{opacity:1;}
.cc-flip-hint{font-size:9px;color:rgba(255,255,255,.55);display:flex;align-items:center;gap:3px;}
.cc-name{font-size:15px;font-weight:800;letter-spacing:.3px;position:relative;z-index:1;}
.cc-util-wrap{position:relative;z-index:1;}
.cc-util-bar{height:5px;border-radius:10px;background:rgba(255,255,255,.2);overflow:hidden;margin-bottom:4px;}
.cc-util-fill{height:100%;background:#fff;border-radius:10px;transition:width .5s ease;}
.cc-util-lbl{font-size:9.5px;color:rgba(255,255,255,.7);display:flex;justify-content:space-between;font-family:var(--mono);}
.cc-bottom-row{display:flex;justify-content:space-between;align-items:flex-end;position:relative;z-index:1;}
.cc-due-badge{display:inline-flex;flex-direction:column;background:rgba(255,255,255,.16);backdrop-filter:blur(4px);border-radius:8px;padding:5px 10px;}
.cc-due-lbl{font-size:8px;text-transform:uppercase;letter-spacing:.5px;color:rgba(255,255,255,.6);}
.cc-due-val{font-size:12px;font-weight:800;}
.cc-due-val.urgent{color:#fecaca;}
.cc-balance-mini{text-align:right;}
.cc-balance-mini .l{font-size:8px;text-transform:uppercase;letter-spacing:.5px;color:rgba(255,255,255,.6);}
.cc-balance-mini .v{font-size:14px;font-weight:800;font-family:var(--mono);}
.cc-back-title{font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:rgba(255,255,255,.55);position:relative;z-index:1;margin-bottom:2px;}
.cc-back-rows{position:relative;z-index:1;display:flex;flex-direction:column;gap:8px;}
.cc-back-row{display:flex;justify-content:space-between;align-items:center;font-size:12px;}
.cc-back-row .k{color:rgba(255,255,255,.6);}
.cc-back-row .v{font-weight:800;font-family:var(--mono);}
.cc-back-strip{position:absolute;top:16px;left:0;right:0;height:32px;background:#1a1a1a;z-index:1;}


/* RIGHT — SUPPLIER TABLE, fixed height, no horizontal scroll */
.cf-right{display:flex;flex-direction:column;height:100%;overflow:hidden;}
.cf-table-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-xl);box-shadow:none;overflow:hidden;display:flex;flex-direction:column;height:100%;}
.cf-table-hdr{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--border);flex-shrink:0;}
.cf-table-title{font-size:11px;font-weight:700;letter-spacing:.5px;color:#64748b}
.cf-table-sub{font-size:11px;color:var(--text3);margin-top:2px;}
.cf-add-account-btn{display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:var(--r);border:1px solid var(--accent-bd);background:var(--accent-bg);color:var(--accent);font-size:12.5px;font-weight:700;font-family:var(--font);cursor:pointer;transition:all .15s;flex-shrink:0;}
.cf-add-account-btn:hover{background:var(--accent);color:#fff;}
.cf-table-scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;}
.cf-table{width:100%;table-layout:auto;border-collapse:collapse;font-size:12.5px;}
.cf-table th,.cf-table td{white-space:nowrap;}
.cf-table th:first-child,.cf-table td:first-child{white-space:normal;width:100%;}
.cf-table th{position:sticky;top:0;text-align:left;padding:10px 14px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text4);background:var(--surface2);border-bottom:1px solid var(--border);z-index:1;}
.cf-table td{padding:11px 14px;border-bottom:1px solid var(--border2);vertical-align:middle;}
.cf-table tr:last-child td{border-bottom:none;}
.cf-table tr{cursor:pointer;transition:background .12s;}
.cf-table tr:hover td{background:var(--surface2);}
.cf-table tr.paid-row{opacity:.55;}
.cf-table tr.paid-row .cf-acct-name{text-decoration:line-through;}
.cf-acct-name{font-weight:700;color:var(--text);}
.cf-days-badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:100px;font-size:10.5px;font-weight:700;}
.cf-days-badge.d-ok{background:var(--green-bg);color:var(--green);border:1px solid var(--green-bd);}
.cf-days-badge.d-warn{background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber-bd);}
.cf-days-badge.d-urgent{background:var(--red-bg);color:var(--red);border:1px solid var(--red-bd);}
.cf-mark-paid-btn{padding:6px 12px;border-radius:var(--r);border:1px solid var(--accent-bd);background:var(--accent-bg);color:var(--accent);font-size:11.5px;font-weight:700;font-family:var(--font);cursor:pointer;transition:all .15s;}
.cf-mark-paid-btn:hover{background:var(--accent);color:#fff;}
.cf-paid-badge{display:flex;flex-direction:column;font-size:10.5px;color:var(--green);font-weight:700;}
.cf-paid-badge .amt{font-size:9.5px;color:var(--text3);font-weight:600;}
.cf-empty-table{text-align:center;padding:40px;color:var(--text4);font-size:12.5px;}

/* MODAL */
.cf-modal-overlay{position:fixed;inset:0;background:rgba(12,21,38,.5);z-index:9990;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .15s;}
.cf-modal-overlay.open{opacity:1;pointer-events:all;}
.cf-modal{background:var(--surface);border-radius:var(--r-xl);width:420px;max-width:92vw;max-height:88vh;overflow-y:auto;box-shadow:var(--sh-lg);transform:translateY(8px);transition:transform .15s;}
.cf-modal-overlay.open .cf-modal{transform:translateY(0);}
.cf-modal-hdr{padding:18px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.cf-modal-title{font-size:15px;font-weight:800;}
.cf-modal-close{width:26px;height:26px;border-radius:8px;border:none;background:var(--surface2);color:var(--text3);cursor:pointer;display:flex;align-items:center;justify-content:center;}
.cf-modal-body{padding:18px 20px;display:flex;flex-direction:column;gap:12px;}
.cf-field label{display:block;font-size:11px;font-weight:700;color:var(--text3);margin-bottom:5px;}
.cf-field input,.cf-field select{width:100%;padding:9px 11px;border-radius:var(--r);border:1px solid var(--border);font-size:13px;font-family:var(--font);background:var(--surface);}
.cf-field input:focus,.cf-field select:focus{outline:none;border-color:var(--accent);}
.cf-row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.cf-toggle-row{display:flex;align-items:center;justify-content:space-between;padding:9px 11px;border:1px solid var(--border);border-radius:var(--r);}
.cf-modal-footer{padding:14px 20px 20px;display:flex;gap:8px;justify-content:flex-end;}
.cf-btn{padding:9px 16px;border-radius:var(--r);border:none;font-size:13px;font-weight:700;font-family:var(--font);cursor:pointer;transition:all .15s;}
.cf-btn-secondary{background:var(--surface2);color:var(--text3);}
.cf-btn-primary{background:var(--accent);color:#fff;}
.cf-btn-primary:hover{background:var(--accent-l);}
.cf-btn-danger{background:var(--red-bg);color:var(--red);}
.cf-btn-danger:hover{background:var(--red);color:#fff;}

/* DRAWER — matching established pattern */
.cf-drawer-overlay{position:fixed;inset:0;background:rgba(6,10,20,.78);z-index:9985;opacity:0;pointer-events:none;transition:opacity .2s;}
.cf-drawer-overlay.open{opacity:1;pointer-events:all;}
.cf-drawer{position:fixed;top:0;right:0;bottom:0;width:440px;max-width:92vw;background:var(--surface);z-index:9986;transform:translateX(100%);transition:transform .25s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;box-shadow:var(--sh-lg);}
.cf-drawer.open{transform:translateX(0);}
.cf-drawer-hero{background:linear-gradient(160deg,var(--navy) 0%,var(--navy2) 100%);padding:20px;position:relative;flex-shrink:0;}
.cf-drawer-close{position:absolute;top:16px;right:16px;width:28px;height:28px;border-radius:8px;background:rgba(255,255,255,.1);border:none;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.cf-drawer-close:hover{background:rgba(255,255,255,.18);}
.cf-drawer-name{font-size:17px;font-weight:800;color:#fff;margin-top:4px;padding-right:36px;}
.cf-drawer-badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:100px;font-size:10.5px;font-weight:700;margin-top:8px;}
.cf-drawer-body{flex:1;overflow-y:auto;padding:18px 20px;}
.cf-drawer-sec{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--text4);display:flex;align-items:center;gap:8px;margin:16px 0 10px;}
.cf-drawer-sec:first-child{margin-top:0;}
.cf-drawer-sec::after{content:'';flex:1;height:1px;background:var(--border);}
.cf-drawer-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.cf-drawer-footer{padding:14px 20px;border-top:1px solid var(--border);display:flex;gap:8px;flex-shrink:0;}

.cf-toast{position:fixed;bottom:20px;right:20px;background:var(--navy);color:#fff;padding:11px 18px;border-radius:var(--r);font-size:13px;font-weight:600;box-shadow:var(--sh-lg);z-index:99999;opacity:0;transform:translateY(8px);transition:all .2s;}
.cf-toast.show{opacity:1;transform:translateY(0);}
.cf-toast.error{background:var(--red);}
.cf-toast.success{background:var(--green);}
</style>

<div class="cf-app">
  <div class="cf-summary-bar">
    <div class="cf-pill static">
      <div class="cf-pill-icon" style="background:var(--accent-bg);color:var(--accent-l)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="3"/><line x1="2" y1="10" x2="22" y2="10"/></svg></div>
      <div class="cf-pill-text"><span class="cf-pill-lbl">Total Available</span><span class="cf-pill-val" id="cfTotalAvailVal">£0.00</span></div>
    </div>
    <div class="cf-pill" id="cfPendingPill" onclick="cfSetTableFilter('pending')">
      <div class="cf-pill-icon" style="background:var(--amber-bg);color:var(--amber)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></div>
      <div class="cf-pill-text"><span class="cf-pill-lbl">Pending</span><span class="cf-pill-val">0 · £0.00</span></div>
    </div>
    <div class="cf-pill" id="cfPaidPill" onclick="cfSetTableFilter('paid')">
      <div class="cf-pill-icon" style="background:var(--green-bg);color:var(--green)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div>
      <div class="cf-pill-text"><span class="cf-pill-lbl">Paid</span><span class="cf-pill-val">0 · £0.00</span></div>
    </div>
    <div class="cf-month-switch">
      <button class="cf-month-btn" onclick="cfChangeMonth(-1)"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></button>
      <span class="cf-month-label" id="cfMonthLabel">—</span>
      <button class="cf-month-btn" onclick="cfChangeMonth(1)"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></button>
    </div>
  </div>
  <div class="cf-grid">
    <div class="cf-panel">
      <div class="cf-panel-hdr">
        <div>
          <div class="cf-panel-title">Credit Cards</div>
          <div class="cf-panel-sub" id="cfCardCount">0 cards</div>
        </div>
        <button class="cf-add-btn" onclick="cfOpenCardModal()" title="Add Card">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
      </div>
      <div class="cf-cards-scroll" id="cfCardsScroll"></div>
    </div>

    <div class="cf-right">
      <div class="cf-table-card">
        <div class="cf-table-hdr">
          <div>
            <div class="cf-table-title">Supplier Credit Accounts</div>
            <div class="cf-table-sub" id="cfAcctCount">0 accounts</div>
          </div>
          <button class="cf-add-account-btn" onclick="cfOpenAccountModal()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            Add Account
          </button>
        </div>
        <div class="cf-table-scroll">
          <table class="cf-table">
            <thead><tr>
              <th>Account</th><th>Balance</th><th>Days Remaining</th><th>Remaining</th><th>Status</th>
            </tr></thead>
            <tbody id="cfAcctTbody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ADD/EDIT CARD MODAL -->
<div class="cf-modal-overlay" id="cfCardModalOverlay">
  <div class="cf-modal">
    <div class="cf-modal-hdr"><div class="cf-modal-title" id="cfCardModalTitle">Add Credit Card</div><button class="cf-modal-close" onclick="cfCloseCardModal()">✕</button></div>
    <div class="cf-modal-body">
      <div class="cf-field"><label>Card Name</label><input type="text" id="cfCcName" placeholder="e.g. Amex Business Platinum"></div>
      <div class="cf-row2">
        <div class="cf-field"><label>Statement Date (day of month)</label><input type="number" id="cfStatementDay" min="1" max="31" placeholder="e.g. 3"></div>
        <div class="cf-field"><label>Due Date (day of month)</label><input type="number" id="cfDueDay" min="1" max="31" placeholder="e.g. 20"></div>
      </div>
      <div class="cf-row2">
        <div class="cf-field"><label>Statement Payment (£)</label><input type="number" id="cfStatementPayment" step="0.01" placeholder="0.00"></div>
        <div class="cf-field"><label>Cashback (%)</label><input type="number" id="cfCashback" step="0.01" placeholder="0.00"></div>
      </div>
      <div class="cf-row2">
        <div class="cf-field"><label>Account Balance (£)</label><input type="number" id="cfBalance" step="0.01" placeholder="0.00"></div>
        <div class="cf-field"><label>Limit (£)</label><input type="number" id="cfLimit" step="0.01" placeholder="0.00"></div>
      </div>
    </div>
    <div class="cf-modal-footer">
      <button class="cf-btn cf-btn-secondary" onclick="cfCloseCardModal()">Cancel</button>
      <button class="cf-btn cf-btn-primary" id="cfCardSubmitBtn" onclick="cfSubmitCard()">Add Card</button>
    </div>
  </div>
</div>

<!-- ADD ACCOUNT MODAL -->
<div class="cf-modal-overlay" id="cfAcctModalOverlay">
  <div class="cf-modal">
    <div class="cf-modal-hdr"><div class="cf-modal-title">Add Supplier Account</div><button class="cf-modal-close" onclick="cfCloseAccountModal()">✕</button></div>
    <div class="cf-modal-body">
      <div class="cf-field"><label>Supplier</label><select id="cfAcctName"><option value="">Loading suppliers…</option></select></div>
      <div class="cf-row2">
        <div class="cf-field"><label>Balance (£)</label><input type="number" id="cfAcctBalance" step="0.01" placeholder="0.00"></div>
        <div class="cf-field"><label>Limit (£)</label><input type="number" id="cfAcctLimit" step="0.01" placeholder="0.00"></div>
      </div>
      <div class="cf-field"><label>Due Date (day of month)</label><input type="number" id="cfAcctDueDay" min="1" max="31" placeholder="e.g. 15"></div>
      <div class="cf-field"><label>Payment Terms</label><input type="text" id="cfAcctTerms" placeholder="e.g. Net 30"></div>
      <div class="cf-toggle-row">
        <span style="font-size:12.5px;font-weight:600;">Accepts Credit</span>
        <select id="cfAcctAcceptsCredit" style="width:auto;padding:6px 10px;"><option value="yes">Yes</option><option value="no">No</option></select>
      </div>
    </div>
    <div class="cf-modal-footer">
      <button class="cf-btn cf-btn-secondary" onclick="cfCloseAccountModal()">Cancel</button>
      <button class="cf-btn cf-btn-primary" onclick="cfSubmitAccount()">Add Account</button>
    </div>
  </div>
</div>

<!-- MARK PAID MODAL -->
<div class="cf-modal-overlay" id="cfPaidModalOverlay">
  <div class="cf-modal">
    <div class="cf-modal-hdr"><div class="cf-modal-title">Mark as Paid</div><button class="cf-modal-close" onclick="cfClosePaidModal()">✕</button></div>
    <div class="cf-modal-body">
      <div class="cf-field"><label>Amount Paid (£)</label><input type="number" id="cfPaidAmount" step="0.01"></div>
      <div class="cf-field"><label>Date Paid</label><input type="date" id="cfPaidDate"></div>
    </div>
    <div class="cf-modal-footer">
      <button class="cf-btn cf-btn-secondary" onclick="cfClosePaidModal()">Cancel</button>
      <button class="cf-btn cf-btn-primary" onclick="cfConfirmPaid()">Confirm Paid</button>
    </div>
  </div>
</div>

<!-- ACCOUNT DRAWER — full detail, matching established drawer pattern -->
<div class="cf-drawer-overlay" id="cfDrawerOverlay" onclick="cfCloseDrawer()"></div>
<div class="cf-drawer" id="cfDrawer">
  <div class="cf-drawer-hero">
    <button class="cf-drawer-close" onclick="cfCloseDrawer()">✕</button>
    <div class="cf-drawer-name" id="cfDrawerName">—</div>
    <span class="cf-drawer-badge" id="cfDrawerBadge"></span>
  </div>
    <div class="cf-drawer-body" id="cfDrawerBody"></div>
  <div class="cf-drawer-footer" id="cfDrawerFooter"></div>
</div>

<script>
(function(){
  const sb = window.sb;
  let cards = [];
  let accounts = [];
  let cardIdSeq = 1;
  let acctIdSeq = 1;
    let payingAcctId = null;
  let editingCardId = null;
  let drawerAcctId = null;
  let tableFilter = 'all';
  const nowD = new Date();
  let viewMonth = nowD.getMonth();
  let viewYear = nowD.getFullYear();
  const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];

  function getAccountEffectiveDate(a){
    if(a.paid && a.paid.paid && a.paid.date){
      const d = new Date(a.paid.date);
      return { month: d.getMonth(), year: d.getFullYear() };
    }
    const now = new Date();
    let target = new Date(now.getFullYear(), now.getMonth(), a.dueDay);
    if(target < now) target = new Date(now.getFullYear(), now.getMonth()+1, a.dueDay);
    return { month: target.getMonth(), year: target.getFullYear() };
  }

  window.cfChangeMonth = function(delta){
    viewMonth += delta;
    if(viewMonth<0){ viewMonth=11; viewYear--; }
    if(viewMonth>11){ viewMonth=0; viewYear++; }
    renderAccounts();
  };

  window.cfSetTableFilter = function(f){
    tableFilter = tableFilter===f ? 'all' : f;
    renderAccounts();
  };

  function renderSummary(){
    const totalAvailable = cards.reduce((s,c)=>s+((parseFloat(c.limit)||0)-(parseFloat(c.balance)||0)),0);
    document.getElementById('cfTotalAvailVal').textContent = fmtGBP(totalAvailable);

    const monthAccounts = accounts.filter(a=>{
      const d = getAccountEffectiveDate(a);
      return d.month===viewMonth && d.year===viewYear;
    });
    const pending = monthAccounts.filter(a=>!(a.paid&&a.paid.paid));
    const paid = monthAccounts.filter(a=>a.paid&&a.paid.paid);
    const pendingTotal = pending.reduce((s,a)=>s+(parseFloat(a.balance)||0),0);
    const paidTotal = paid.reduce((s,a)=>s+(parseFloat(a.paid.amount)||0),0);

    document.getElementById('cfPendingPill').querySelector('.cf-pill-val').textContent = pending.length+' · '+fmtGBP(pendingTotal);
    document.getElementById('cfPaidPill').querySelector('.cf-pill-val').textContent = paid.length+' · '+fmtGBP(paidTotal);
    document.getElementById('cfPendingPill').classList.toggle('active', tableFilter==='pending');
    document.getElementById('cfPaidPill').classList.toggle('active', tableFilter==='paid');
    document.getElementById('cfMonthLabel').textContent = MONTH_NAMES[viewMonth]+' '+viewYear;
  }

  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function fmtGBP(v){ return '£'+(parseFloat(v)||0).toLocaleString('en-GB',{minimumFractionDigits:2,maximumFractionDigits:2}); }

  function toast(msg, type){
    const el = document.createElement('div');
    el.className = 'cf-toast' + (type ? ' '+type : '');
    el.textContent = msg;
    document.body.appendChild(el);
    requestAnimationFrame(()=>el.classList.add('show'));
    setTimeout(()=>{ el.classList.remove('show'); setTimeout(()=>el.remove(),200); }, 2800);
  }

  function daysUntilDay(day){
    if(!day) return null;
    const now = new Date();
    let target = new Date(now.getFullYear(), now.getMonth(), day, 23, 59, 59);
    if (target < now) target = new Date(now.getFullYear(), now.getMonth()+1, day, 23, 59, 59);
    return Math.max(0, Math.ceil((target - now) / 86400000));
  }
  function ordinal(n){
    const s=['th','st','nd','rd'], v=n%100;
    return n+(s[(v-20)%10]||s[v]||s[0]);
  }
  function daysBadgeClass(days){
    if(days===null) return 'd-ok';
    if(days<=3) return 'd-urgent';
    if(days<=7) return 'd-warn';
    return 'd-ok';
  }

  // Golden-angle hue rotation — guarantees strong visual distinction, never repeats in a visible pattern
  function cardTheme(index){
    const hue = (index * 137.508) % 360;
    const bg1 = `hsl(${hue}, 70%, 95%)`;
    const bg2 = `hsl(${(hue+12)%360}, 62%, 90%)`;
    return {
      gradient: `linear-gradient(135deg, ${bg1} 0%, ${bg2} 100%)`,
      text: `hsl(${hue}, 55%, 28%)`,
      muted: `hsl(${hue}, 35%, 42%)`,
      trackBg: `hsla(${hue}, 50%, 30%, 0.12)`,
    };
  }

  // ===== SUPPLIERS =====
  async function loadSuppliers(){
    const sel = document.getElementById('cfAcctName');
    try{
      const { data, error } = await sb.from('suppliers').select('name').order('name');
      if(error) throw error;
      const names = (data||[]).map(s=>s.name).filter(Boolean);
      sel.innerHTML = '<option value="">Select supplier…</option>' + names.map(n=>`<option value="${esc(n)}">${esc(n)}</option>`).join('');
    }catch(e){
      sel.innerHTML = '<option value="">Could not load suppliers</option>';
      console.warn('Failed to load suppliers', e);
    }
  }

  // ===== CARDS =====
  function renderCards(){
    const scroll = document.getElementById('cfCardsScroll');
    document.getElementById('cfCardCount').textContent = cards.length + (cards.length===1?' card':' cards');
    if(!cards.length){
      scroll.innerHTML = `<div class="cf-empty">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="3"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
        <div>No credit cards yet</div>
      </div>`;
      return;
    }
    scroll.innerHTML = cards.map((c)=>{
      const remaining = (parseFloat(c.limit)||0) - (parseFloat(c.balance)||0);
      const utilPct = c.limit>0 ? Math.min(100,Math.round((c.balance/c.limit)*100)) : 0;
      const days = daysUntilDay(c.dueDay);
      const urgent = days!==null && days<=5;
            const t = c.theme || cardTheme(0);
      return `<div class="cc-card" id="ccCard${c.id}">
        <div class="cc-card-inner" onclick="cfFlipCard(${c.id})">
          <div class="cc-face cc-front" style="background:${t.gradient};color:${t.text}">
            <div class="cc-top-row">
              <div class="cc-chip" onclick="event.stopPropagation();cfEditCard(${c.id})" title="Edit card">
                <div class="cc-chip-edit"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></div>
              </div>
              <div class="cc-flip-hint" style="color:${t.muted}">flip <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg></div>
            </div>
            <div>
              <div class="cc-name">${esc(c.name)}</div>
              <div class="cc-util-wrap" style="margin-top:8px">
                <div class="cc-util-bar" style="background:${t.trackBg}"><div class="cc-util-fill" style="width:${utilPct}%;background:${t.text}"></div></div>
                <div class="cc-util-lbl" style="color:${t.muted}"><span>${fmtGBP(c.balance)} used</span><span>${utilPct}%</span></div>
              </div>
            </div>
            <div class="cc-bottom-row">
              <div class="cc-due-badge" style="background:${t.trackBg}">
                <span class="cc-due-lbl" style="color:${t.muted}">Due</span>
                <span class="cc-due-val ${urgent?'urgent':''}">${ordinal(c.dueDay)} · ${days}d</span>
              </div>
              <div class="cc-balance-mini">
                <div class="l" style="color:${t.muted}">Available</div>
                <div class="v">${fmtGBP(remaining)}</div>
              </div>
            </div>
          </div>
          <div class="cc-face cc-back" style="background:${t.gradient};color:${t.text}">
            <div class="cc-back-strip"></div>
            <div style="margin-top:44px;position:relative;z-index:1">
              <div class="cc-back-title" style="color:${t.muted}">Card Details</div>
              <div class="cc-back-rows">
                <div class="cc-back-row"><span class="k" style="color:${t.muted}">Statement Date</span><span class="v">${ordinal(c.statementDay)}</span></div>
                <div class="cc-back-row"><span class="k" style="color:${t.muted}">Statement Payment</span><span class="v">${fmtGBP(c.statementPayment)}</span></div>
                <div class="cc-back-row"><span class="k" style="color:${t.muted}">Cashback</span><span class="v">${parseFloat(c.cashback||0).toFixed(2)}%</span></div>
                <div class="cc-back-row"><span class="k" style="color:${t.muted}">Remaining Credit</span><span class="v">${fmtGBP(remaining)}</span></div>
                <div class="cc-back-row"><span class="k" style="color:${t.muted}">Limit</span><span class="v">${fmtGBP(c.limit)}</span></div>
              </div>
            </div>
          </div>
        </div>
      </div>`;
    }).join('');
  }

  window.cfFlipCard = function(id){
    document.getElementById('ccCard'+id).classList.toggle('flipped');
  };

  window.cfOpenCardModal = function(){
    editingCardId = null;
    document.getElementById('cfCardModalTitle').textContent = 'Add Credit Card';
    document.getElementById('cfCardSubmitBtn').textContent = 'Add Card';
    ['cfCcName','cfStatementDay','cfDueDay','cfStatementPayment','cfCashback','cfBalance','cfLimit'].forEach(id=>document.getElementById(id).value='');
    document.getElementById('cfCardModalOverlay').classList.add('open');
  };
  window.cfCloseCardModal = function(){ document.getElementById('cfCardModalOverlay').classList.remove('open'); };

  window.cfEditCard = function(id){
    const c = cards.find(x=>x.id===id);
    if(!c) return;
    editingCardId = id;
    document.getElementById('cfCardModalTitle').textContent = 'Edit Credit Card';
    document.getElementById('cfCardSubmitBtn').textContent = 'Save Changes';
    document.getElementById('cfCcName').value = c.name;
    document.getElementById('cfStatementDay').value = c.statementDay;
    document.getElementById('cfDueDay').value = c.dueDay;
    document.getElementById('cfStatementPayment').value = c.statementPayment;
    document.getElementById('cfCashback').value = c.cashback;
    document.getElementById('cfBalance').value = c.balance;
    document.getElementById('cfLimit').value = c.limit;
    document.getElementById('cfCardModalOverlay').classList.add('open');
  };

  window.cfSubmitCard = function(){
    const name = document.getElementById('cfCcName').value.trim();
    const statementDay = parseInt(document.getElementById('cfStatementDay').value);
    const dueDay = parseInt(document.getElementById('cfDueDay').value);
    if(!name || !statementDay || !dueDay){ toast('Please fill in Card Name, Statement Date and Due Date','error'); return; }
    const fields = {
      name,
      statementDay,
      dueDay,
      statementPayment: parseFloat(document.getElementById('cfStatementPayment').value)||0,
      cashback: parseFloat(document.getElementById('cfCashback').value)||0,
      balance: parseFloat(document.getElementById('cfBalance').value)||0,
      limit: parseFloat(document.getElementById('cfLimit').value)||0,
    };
        if(editingCardId){
      const c = cards.find(x=>x.id===editingCardId);
      Object.assign(c, fields);
      toast('Card updated','success');
    } else {
      cards.push({ id: cardIdSeq++, theme: cardTheme(cards.length), ...fields });
      toast('Card added','success');
    }
    cfCloseCardModal();
    renderCards();
    renderSummary();
  };

  // ===== SUPPLIER ACCOUNTS =====
    function renderAccounts(){
    const tbody = document.getElementById('cfAcctTbody');
    const visible = accounts.filter(a=>{
      const d = getAccountEffectiveDate(a);
      if(d.month!==viewMonth || d.year!==viewYear) return false;
      const isPaid = a.paid && a.paid.paid;
      if(tableFilter==='pending' && isPaid) return false;
      if(tableFilter==='paid' && !isPaid) return false;
      return true;
    });
    document.getElementById('cfAcctCount').textContent = visible.length + (visible.length===1?' account':' accounts') + ' · '+MONTH_NAMES[viewMonth];
    if(!visible.length){
      tbody.innerHTML = `<tr><td colspan="5" class="cf-empty-table">No accounts match this view</td></tr>`;
      renderSummary();
      return;
    }
    tbody.innerHTML = visible.map(a=>{
      const remaining = (parseFloat(a.limit)||0) - (parseFloat(a.balance)||0);
      const days = daysUntilDay(a.dueDay);
      const cls = daysBadgeClass(days);
      const isPaid = a.paid && a.paid.paid;
      return `<tr class="${isPaid?'paid-row':''}" onclick="cfOpenDrawer(${a.id})">
        <td class="cf-acct-name">${esc(a.name)}</td>
        <td>${fmtGBP(a.balance)}</td>
        <td><span class="cf-days-badge ${cls}">${days}d</span></td>
        <td>${fmtGBP(remaining)}</td>
        <td onclick="event.stopPropagation()">${isPaid
          ? `<div class="cf-paid-badge" onclick="cfUnmarkPaid(${a.id})" style="cursor:pointer" title="Click to undo">✓ Paid ${a.paid.date}<span class="amt">${fmtGBP(a.paid.amount)}</span></div>`
                    : `<button class="cf-mark-paid-btn" onclick="cfOpenPaidModal(${a.id})">Mark Paid</button>`}</td>
      </tr>`;
    }).join('');
    renderSummary();
  }

  window.cfOpenAccountModal = function(){
    document.getElementById('cfAcctName').value='';
    ['cfAcctBalance','cfAcctLimit','cfAcctDueDay','cfAcctTerms'].forEach(id=>document.getElementById(id).value='');
    document.getElementById('cfAcctAcceptsCredit').value='yes';
    document.getElementById('cfAcctModalOverlay').classList.add('open');
  };
  window.cfCloseAccountModal = function(){ document.getElementById('cfAcctModalOverlay').classList.remove('open'); };

  window.cfSubmitAccount = function(){
    const name = document.getElementById('cfAcctName').value;
    const dueDay = parseInt(document.getElementById('cfAcctDueDay').value);
    if(!name || !dueDay){ toast('Please select a Supplier and set a Due Date','error'); return; }
        const newAcct = {
      id: acctIdSeq++,
      name,
      balance: parseFloat(document.getElementById('cfAcctBalance').value)||0,
      limit: parseFloat(document.getElementById('cfAcctLimit').value)||0,
      dueDay,
      paymentTerms: document.getElementById('cfAcctTerms').value.trim(),
      acceptsCredit: document.getElementById('cfAcctAcceptsCredit').value==='yes',
      paid: null,
    };
    accounts.push(newAcct);
    cfCloseAccountModal();

    const d = getAccountEffectiveDate(newAcct);
    tableFilter = 'all';
    viewMonth = d.month;
    viewYear = d.year;

    renderAccounts();
    toast('Account added — showing '+MONTH_NAMES[d.month],'success');
  };
  // ===== MARK PAID =====
  window.cfOpenPaidModal = function(id){
    payingAcctId = id;
    const acct = accounts.find(a=>a.id===id);
    document.getElementById('cfPaidAmount').value = acct ? acct.balance : '';
    document.getElementById('cfPaidDate').value = new Date().toISOString().slice(0,10);
    document.getElementById('cfPaidModalOverlay').classList.add('open');
  };
  window.cfClosePaidModal = function(){ document.getElementById('cfPaidModalOverlay').classList.remove('open'); payingAcctId=null; };

  window.cfConfirmPaid = function(){
    const acct = accounts.find(a=>a.id===payingAcctId);
    if(!acct) return;
    acct.paid = {
      paid: true,
      amount: parseFloat(document.getElementById('cfPaidAmount').value)||0,
      date: document.getElementById('cfPaidDate').value,
    };
    cfClosePaidModal();
    renderAccounts();
    if(drawerAcctId===acct.id) cfRenderDrawer(acct);
    toast('Marked as paid','success');
  };

  window.cfUnmarkPaid = function(id){
    const acct = accounts.find(a=>a.id===id);
    if(acct) acct.paid = null;
    renderAccounts();
    if(drawerAcctId===id) cfRenderDrawer(acct);
  };

  // ===== DRAWER =====
  window.cfOpenDrawer = function(id){
    const acct = accounts.find(a=>a.id===id);
    if(!acct) return;
    drawerAcctId = id;
    cfRenderDrawer(acct);
    document.getElementById('cfDrawerOverlay').classList.add('open');
    document.getElementById('cfDrawer').classList.add('open');
  };
  window.cfCloseDrawer = function(){
    document.getElementById('cfDrawerOverlay').classList.remove('open');
    document.getElementById('cfDrawer').classList.remove('open');
    drawerAcctId = null;
  };

  function cfDrawerField(label, value, onchange){
    return `<div class="cf-field"><label>${esc(label)}</label><input type="text" value="${esc(value)}" onchange="${onchange}"></div>`;
  }

  function cfRenderDrawer(acct){
    const remaining = (parseFloat(acct.limit)||0) - (parseFloat(acct.balance)||0);
    const days = daysUntilDay(acct.dueDay);
    const cls = daysBadgeClass(days);
    const isPaid = acct.paid && acct.paid.paid;

    document.getElementById('cfDrawerName').textContent = acct.name;
    document.getElementById('cfDrawerBadge').className = 'cf-drawer-badge cf-days-badge ' + cls;
    document.getElementById('cfDrawerBadge').textContent = isPaid ? 'Paid this cycle' : days+'d until due';

    document.getElementById('cfDrawerBody').innerHTML = `
            <div class="cf-drawer-sec">Account Overview</div>
      <div class="cf-field" style="margin-bottom:10px"><label>Supplier</label><select id="cfDrawerSupplierSelect" onchange="cfUpdateAcctField(${acct.id},'name',this.value)"><option value="">Loading suppliers…</option></select></div>
      <div class="cf-drawer-grid" style="margin-bottom:10px">
        <div class="cf-field"><label>Balance (£)</label><input type="number" step="0.01" value="${acct.balance}" onchange="cfUpdateAcctField(${acct.id},'balance',this.value)"></div>
        <div class="cf-field"><label>Limit (£)</label><input type="number" step="0.01" value="${acct.limit}" onchange="cfUpdateAcctField(${acct.id},'limit',this.value)"></div>
      </div>
      <div class="cf-drawer-grid">
        <div class="cf-field"><label>Remaining</label><input type="text" value="${fmtGBP(remaining)}" readonly style="background:var(--surface2);color:var(--text3)"></div>
        <div class="cf-field"><label>Due Date (day)</label><input type="number" min="1" max="31" value="${acct.dueDay}" onchange="cfUpdateAcctField(${acct.id},'dueDay',parseInt(this.value))"></div>
      </div>

      <div class="cf-drawer-sec">Terms</div>
      <div class="cf-drawer-grid">
        <div class="cf-field"><label>Payment Terms</label><input type="text" value="${esc(acct.paymentTerms||'')}" onchange="cfUpdateAcctField(${acct.id},'paymentTerms',this.value)"></div>
        <div class="cf-field"><label>Accepts Credit</label>
          <select onchange="cfUpdateAcctField(${acct.id},'acceptsCredit',this.value==='yes')">
            <option value="yes" ${acct.acceptsCredit?'selected':''}>Yes</option>
            <option value="no" ${!acct.acceptsCredit?'selected':''}>No</option>
          </select>
        </div>
      </div>

            <div class="cf-drawer-sec">Payment Status</div>
      ${isPaid
        ? `<div style="padding:12px;background:var(--green-bg);border:1px solid var(--green-bd);border-radius:var(--r);color:var(--green);font-size:12.5px;font-weight:600;">
             ✓ Paid ${esc(acct.paid.date)} · ${fmtGBP(acct.paid.amount)}
           </div>`
        : ''
      }
    `;

        (async()=>{
      try{
        const { data } = await sb.from('suppliers').select('name').order('name');
        const names = (data||[]).map(s=>s.name).filter(Boolean);
        const sel = document.getElementById('cfDrawerSupplierSelect');
        if(sel) sel.innerHTML = names.map(n=>`<option value="${esc(n)}" ${n===acct.name?'selected':''}>${esc(n)}</option>`).join('');
      }catch(e){}
    })();

    document.getElementById('cfDrawerFooter').innerHTML = isPaid
      ? `<button class="cf-btn cf-btn-secondary" style="flex:1" onclick="cfUnmarkPaid(${acct.id})">Undo Paid</button><button class="cf-btn cf-btn-danger" onclick="cfDeleteAccountFromDrawer()">Delete</button>`
      : `<button class="cf-btn cf-btn-primary" style="flex:1" onclick="cfOpenPaidModal(${acct.id})">Mark as Paid</button><button class="cf-btn cf-btn-danger" onclick="cfDeleteAccountFromDrawer()">Delete</button>`;
  }

  window.cfUpdateAcctField = function(id, field, value){
    const acct = accounts.find(a=>a.id===id);
    if(!acct) return;
    acct[field] = value;
    renderAccounts();
  };

  window.cfDeleteAccountFromDrawer = function(){
    if(!drawerAcctId) return;
    accounts = accounts.filter(a=>a.id!==drawerAcctId);
    cfCloseDrawer();
    renderAccounts();
    toast('Account deleted','success');
  };

    loadSuppliers();
  renderCards();
  renderAccounts();
  renderSummary();
})();
</script>
