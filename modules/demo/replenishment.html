<style>
  /* ─── Tokens ─────────────────────────────────────────── */
  :root {
    --bg:           #0f1117;
    --bg2:          #171b26;
    --bg3:          #1e2433;
    --bg4:          #252c3d;
    --border:       #2a3148;
    --border2:      #333d58;

    --text:         #e8eaf2;
    --text2:        #9aa3be;
    --text3:        #5d6a8a;

    --red:          #ff5252;
    --red-bg:       rgba(255,82,82,.10);
    --red-border:   rgba(255,82,82,.25);

    --amber:        #ffb74d;
    --amber-bg:     rgba(255,183,77,.10);
    --amber-border: rgba(255,183,77,.25);

    --green:        #4ade80;
    --green-bg:     rgba(74,222,128,.10);
    --green-border: rgba(74,222,128,.25);

    --blue:         #60a5fa;
    --blue-bg:      rgba(96,165,250,.10);
    --blue-border:  rgba(96,165,250,.25);

    --accent:       #7c6cfc;
    --accent-glow:  rgba(124,108,252,.20);

    --radius-sm:    6px;
    --radius-md:    10px;
    --radius-lg:    14px;

    --mono: 'SF Mono', 'Fira Code', 'Cascadia Code', ui-monospace, monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  }

  /* ─── Reset ──────────────────────────────────────────── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { font-size: 14px; }
  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.5;
  }

  /* ─── Layout ─────────────────────────────────────────── */
  .shell {
    max-width: 740px;
    margin: 0 auto;
    padding: 24px 16px 48px;
  }

  /* ─── Header ─────────────────────────────────────────── */
  .header {
    margin-bottom: 24px;
  }
  .header-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  .header-eyebrow {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 4px;
  }
  .header-title {
    font-size: 22px;
    font-weight: 600;
    color: var(--text);
    letter-spacing: -.3px;
  }
  .header-sub {
    font-size: 11.5px;
    color: var(--text3);
    margin-top: 4px;
  }
  .header-actions {
    display: flex;
    gap: 8px;
    align-items: center;
    flex-shrink: 0;
    margin-top: 2px;
  }
  .btn-ghost {
    padding: 7px 14px;
    border: 1px solid var(--border2);
    border-radius: var(--radius-sm);
    background: transparent;
    color: var(--text2);
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    font-family: var(--sans);
    transition: background .15s, border-color .15s, color .15s;
    white-space: nowrap;
  }
  .btn-ghost:hover { background: var(--bg3); border-color: var(--border2); color: var(--text); }
  .btn-danger {
    padding: 7px 14px;
    border: 1px solid var(--red-border);
    border-radius: var(--radius-sm);
    background: var(--red-bg);
    color: var(--red);
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    font-family: var(--sans);
    transition: background .15s;
    white-space: nowrap;
  }
  .btn-danger:hover { background: rgba(255,82,82,.18); }

  /* ─── Progress ───────────────────────────────────────── */
  .progress-wrap {
    margin-bottom: 18px;
  }
  .progress-meta {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 6px;
  }
  .progress-label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--text3);
  }
  .progress-count {
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 500;
    color: var(--accent);
  }
  .progress-bar {
    height: 5px;
    background: var(--bg3);
    border-radius: 99px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), #a78bfa);
    border-radius: 99px;
    transition: width .4s cubic-bezier(.4,0,.2,1);
    min-width: 0;
  }

  /* ─── Summary Panel ──────────────────────────────────── */
  .sum-panel {
    display: none;
    margin-bottom: 18px;
  }
  .sum-panel.open { display: block; }
  .sum-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }
  @media (max-width: 520px) { .sum-grid { grid-template-columns: 1fr 1fr; } }
  .sum-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 12px 14px;
  }
  .sum-n {
    font-family: var(--mono);
    font-size: 24px;
    font-weight: 600;
    line-height: 1;
    margin-bottom: 4px;
  }
  .sum-l { font-size: 11px; color: var(--text2); font-weight: 500; }
  .sum-s { font-size: 10px; color: var(--text3); margin-top: 2px; }

  /* ─── Search ─────────────────────────────────────────── */
  .search-wrap {
    position: relative;
    margin-bottom: 12px;
  }
  .search-icon {
    position: absolute;
    left: 11px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text3);
    pointer-events: none;
  }
  .search-input {
    width: 100%;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    color: var(--text);
    font-family: var(--sans);
    font-size: 13px;
    padding: 9px 12px 9px 34px;
    outline: none;
    transition: border-color .15s;
  }
  .search-input::placeholder { color: var(--text3); }
  .search-input:focus { border-color: var(--accent); }

  /* ─── Tabs ───────────────────────────────────────────── */
  .tabs {
    display: flex;
    gap: 5px;
    flex-wrap: wrap;
    margin-bottom: 10px;
  }
  .tab {
    padding: 5px 11px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 11.5px;
    font-weight: 500;
    cursor: pointer;
    background: transparent;
    color: var(--text3);
    font-family: var(--sans);
    white-space: nowrap;
    transition: all .15s;
  }
  .tab:hover { border-color: var(--border2); color: var(--text2); background: var(--bg2); }
  .tab.active         { border-color: var(--accent); color: var(--accent); background: var(--accent-glow); }
  .tab.active.t-crit  { border-color: var(--red-border); color: var(--red); background: var(--red-bg); }
  .tab.active.t-pur   { border-color: var(--green-border); color: var(--green); background: var(--green-bg); }
  .tab.active.t-na    { border-color: var(--amber-border); color: var(--amber); background: var(--amber-bg); }
  .tab.active.t-rej   { border-color: var(--red-border); color: var(--red); background: var(--red-bg); }

  /* ─── Sort Row ───────────────────────────────────────── */
  .sort-row {
    display: flex;
    gap: 4px;
    align-items: center;
    margin-bottom: 10px;
    flex-wrap: wrap;
  }
  .sort-label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--text3);
    margin-right: 4px;
  }
  .sort-opt {
    font-size: 11px;
    cursor: pointer;
    color: var(--text3);
    padding: 3px 8px;
    border-radius: var(--radius-sm);
    transition: all .15s;
    user-select: none;
  }
  .sort-opt:hover { color: var(--text2); background: var(--bg2); }
  .sort-opt.active { color: var(--accent); background: var(--accent-glow); font-weight: 600; }

  /* ─── Card List ──────────────────────────────────────── */
  .card-list {
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    overflow: hidden;
    background: var(--bg2);
  }
  .card-scroll {
    max-height: 600px;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--bg4) transparent;
  }
  .card-scroll::-webkit-scrollbar { width: 5px; }
  .card-scroll::-webkit-scrollbar-track { background: transparent; }
  .card-scroll::-webkit-scrollbar-thumb { background: var(--bg4); border-radius: 99px; }

  /* ─── SKU Card ───────────────────────────────────────── */
  .sku-card {
    padding: 13px 16px;
    border-bottom: 1px solid var(--border);
    transition: background .12s;
  }
  .sku-card:last-child { border-bottom: none; }
  .sku-card:hover { background: var(--bg3); }
  .sku-card.is-done { opacity: .55; }

  .card-name {
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
    line-height: 1.4;
    margin-bottom: 7px;
  }
  .sku-card.is-done .card-name { color: var(--text3); }
  .sku-card.is-rej   .card-name { text-decoration: line-through; color: var(--text3); }

  .card-meta {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 9px;
  }

  /* Pills / badges */
  .pill-sku {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text3);
    background: var(--bg4);
    padding: 2px 7px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    letter-spacing: .03em;
  }
  .badge {
    font-size: 9.5px;
    font-weight: 700;
    letter-spacing: .06em;
    text-transform: uppercase;
    padding: 2px 7px;
    border-radius: var(--radius-sm);
    border: 1px solid;
  }
  .badge-crit   { color: var(--red);   background: var(--red-bg);   border-color: var(--red-border); }
  .badge-order  { color: var(--amber); background: var(--amber-bg); border-color: var(--amber-border); }
  .badge-ok     { color: var(--green); background: var(--green-bg); border-color: var(--green-border); }

  .days-red  { font-family: var(--mono); font-size: 12px; font-weight: 600; color: var(--red); }
  .days-amb  { font-family: var(--mono); font-size: 12px; font-weight: 600; color: var(--amber); }
  .days-ok   { font-family: var(--mono); font-size: 12px; color: var(--text3); }

  .rate-chip  { font-family: var(--mono); font-size: 11px; color: var(--text3); }

  .order-qty {
    margin-left: auto;
    font-family: var(--mono);
    font-size: 14px;
    font-weight: 600;
    white-space: nowrap;

  .order-qty.q-crit { color: var(--red); }
  .order-qty.q-rep  { color: var(--blue); }
  .order-qty.q-done { color: var(--text3); }

  .action-row {
    display: flex;
    gap: 6px;
  }
  .abtn {
    flex: 1;
    padding: 6px 0;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 11.5px;
    font-weight: 500;
    cursor: pointer;
    background: transparent;
    color: var(--text3);
    font-family: var(--sans);
    transition: all .12s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
  }
  .abtn:hover { background: var(--bg3); border-color: var(--border2); color: var(--text2); }
  .abtn.on-pur { background: var(--green-bg); color: var(--green); border-color: var(--green-border); }
  .abtn.on-na  { background: var(--amber-bg); color: var(--amber); border-color: var(--amber-border); }
  .abtn.on-rej { background: var(--red-bg);   color: var(--red);   border-color: var(--red-border); }

  /* ─── Empty State ────────────────────────────────────── */
  .empty-state {
    padding: 52px 24px;
    text-align: center;
    color: var(--text3);
  }
  .empty-icon { font-size: 28px; margin-bottom: 10px; }
  .empty-title { font-size: 14px; font-weight: 600; color: var(--text2); margin-bottom: 4px; }
  .empty-desc  { font-size: 12px; }

  /* ─── Footer ─────────────────────────────────────────── */
  .footer {
    margin-top: 10px;
    font-size: 11px;
    color: var(--text3);
    text-align: center;
    font-family: var(--mono);
  }

  /* ─── Divider inside list ────────────────────────────── */
  .list-header {
    padding: 7px 16px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--text3);
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 1;
  }
</style>
</head>

      <line x1="10.5" y1="10.5" x2="14" y2="14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    </svg>
    <input class="search-input" type="text" id="search" placeholder="Search SKU or product name…" oninput="render()">
  </div>

  <!-- Tabs -->
  <div class="tabs" id="tabs"></div>

  <!-- Sort -->
  <div class="sort-row">
    <span class="sort-label">Sort</span>
    <span class="sort-opt active" id="sort-days" onclick="setSort('days')">Days of stock</span>
    <span class="sort-opt" id="sort-rate" onclick="setSort('rate')">Daily rate</span>
    <span class="sort-opt" id="sort-qty" onclick="setSort('qty')">Order qty</span>
  </div>

  <!-- Card List -->
  <div class="card-list">
    <div class="card-scroll" id="list"></div>
  </div>
  <div class="footer" id="footer"></div>

</div>

const acts = {};
let tab = 'pending', sortK = 'days', sortA = 1, showSum = false;

function toggleSum() {
  showSum = !showSum;
  document.getElementById('sum-panel').classList.toggle('open', showSum);
  document.getElementById('sum-toggle').textContent = showSum ? 'Hide Summary' : 'Summary';
}

function resetAll() {
  if (!confirm('Reset all actions for this week?')) return;
  Object.keys(acts).forEach(k => delete acts[k]);
  render();
}

function setSort(k) {
  if (sortK === k) { sortA = -sortA; } else { sortK = k; sortA = 1; }
  render();
}

function setTab(t) { tab = t; render(); }

function render() {
  const q    = document.getElementById('search').value.toLowerCase();
  const crit = ALL.filter(x => x.u === 'C').length;
  const pur  = ALL.filter(x => acts[x.s] === 'pur').length;
  const na   = ALL.filter(x => acts[x.s] === 'na').length;
  const rej  = ALL.filter(x => acts[x.s] === 'rej').length;
  const pend = ALL.filter(x => !acts[x.s]).length;
  const done = ALL.length - pend;
  const pct  = Math.round(done / ALL.length * 100);
  const purUnits = ALL.filter(x => acts[x.s] === 'pur').reduce((a, x) => a + x.q, 0);

  document.getElementById('prog-label').textContent = `${pct}% · ${done} / ${ALL.length}`;
  document.getElementById('prog-fill').style.width = pct + '%';
  document.getElementById('s-pur').textContent = pur;
  document.getElementById('s-units').textContent = purUnits.toLocaleString() + ' units';
  document.getElementById('s-na').textContent = na;
  document.getElementById('s-rej').textContent = rej;
  document.getElementById('s-pend').textContent = pend;

  // Tabs
  const tabDefs = [
    { k: 'pending',      l: `Pending`,      n: pend, cls: '' },
    { k: 'critical',     l: `Critical`,     n: crit, cls: 't-crit' },
    { k: 'purchased',    l: `Purchased`,    n: pur,  cls: 't-pur' },
    { k: 'not_available',l: `Not available`,n: na,   cls: 't-na' },
    { k: 'rejected',     l: `Rejected`,     n: rej,  cls: 't-rej' },
    { k: 'all',          l: `All`,          n: ALL.length, cls: '' },
  ];
  document.getElementById('tabs').innerHTML = tabDefs.map(td =>
    `<button class="tab${tab === td.k ? ' active ' + td.cls : ''}" onclick="setTab('${td.k}')">${td.l} <span style="opacity:.65">${td.n}</span></button>`
  ).join('');

  // Sort highlights
  ['days', 'rate', 'qty'].forEach(k => {
    const el = document.getElementById('sort-' + k);
    if (el) el.className = 'sort-opt' + (sortK === k ? ' active' : '');
  });

  // Filter
  let rows = [...ALL];
  if (tab === 'pending')       rows = rows.filter(x => !acts[x.s]);
  else if (tab === 'critical') rows = rows.filter(x => x.u === 'C');
  else if (tab === 'purchased')     rows = rows.filter(x => acts[x.s] === 'pur');
  else if (tab === 'not_available') rows = rows.filter(x => acts[x.s] === 'na');
  else if (tab === 'rejected')      rows = rows.filter(x => acts[x.s] === 'rej');
  if (q) rows = rows.filter(x => x.s.toLowerCase().includes(q) || x.t.toLowerCase().includes(q));

  rows.sort((a, b) => {
    const v = sortK === 'days' ? a.d - b.d : sortK === 'rate' ? b.r - a.r : b.q - a.q;
    return v * sortA;
  });

  const listEl = document.getElementById('list');

  if (rows.length === 0) {
    listEl.innerHTML = `<div class="empty-state">
      <div class="empty-icon">${tab === 'pending' && pend === 0 ? '✓' : '◌'}</div>
      <div class="empty-title">${tab === 'pending' && pend === 0 ? 'All lines reviewed!' : 'No matching SKUs'}</div>
      <div class="empty-desc">${tab === 'pending' && pend === 0 ? 'Every SKU has been actioned this week.' : 'Try a different search or filter.'}</div>
    </div>`;
  } else {
    listEl.innerHTML = rows.map(x => {
      const a       = acts[x.s];
      const isDone  = !!a;
      const badgeCls = x.u === 'C' ? 'badge-crit' : x.u === 'R' ? 'badge-order' : 'badge-ok';
      const badgeTxt = x.u === 'C' ? 'Critical' : x.u === 'R' ? 'Order' : 'OK';
      const dCls    = x.d <= 0 ? 'days-red' : x.d < 7 ? 'days-amb' : 'days-ok';
      const dTxt    = x.d <= 0 ? `${x.av} in stock` : `${x.d}d left`;
      const qCls    = isDone ? 'q-done' : x.u === 'C' ? 'q-crit' : 'q-rep';
      const cardCls = ['sku-card', isDone ? 'is-done' : '', a === 'rej' ? 'is-rej' : ''].filter(Boolean).join(' ');
      return `<div class="${cardCls}">
        <div class="card-name">${x.t}</div>
        <div class="card-meta">
          <span class="pill-sku">${x.s}</span>
          <span class="badge ${badgeCls}">${badgeTxt}</span>
          <span class="${dCls}">${dTxt}</span>
          <span class="rate-chip">${x.r.toFixed(1)}/day</span>
          ${x.q > 0 ? `<span class="order-qty ${qCls}">× ${x.q.toLocaleString()}</span>` : ''}
        </div>
        <div class="action-row">
          <button class="abtn${a === 'pur' ? ' on-pur' : ''}" onclick="act('${x.s}','pur')">
            <svg width="11" height="11" viewBox="0 0 12 12" fill="none"><polyline points="2,6 5,9 10,3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Purchased
          </button>
          <button class="abtn${a === 'na' ? ' on-na' : ''}" onclick="act('${x.s}','na')">
            <svg width="11" height="11" viewBox="0 0 12 12" fill="none"><circle cx="6" cy="6" r="4.5" stroke="currentColor" stroke-width="1.5"/><line x1="2.5" y1="9.5" x2="9.5" y2="2.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            Not available
          </button>
          <button class="abtn${a === 'rej' ? ' on-rej' : ''}" onclick="act('${x.s}','rej')">
            <svg width="11" height="11" viewBox="0 0 12 12" fill="none"><line x1="2.5" y1="2.5" x2="9.5" y2="9.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><line x1="9.5" y1="2.5" x2="2.5" y2="9.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            Rejected
          </button>
        </div>
      </div>`;
    }).join('');
  }
  document.getElementById('footer').textContent = `${rows.length} of ${ALL.length} SKUs shown`;
}

function act(sku, key) {
  if (acts[sku] === key) delete acts[sku]; else acts[sku] = key;
  render();
}

render();
