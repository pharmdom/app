<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#1e1f25;--navy2:#26272e;--navy3:#2f3038;
  --surface:#fff;--surface2:#f7f9fc;--surface3:#f0f4fa;
  --border:#e3eaf5;--border2:#edf1f9;
  --text:#0c1526;--text2:#2d3f5c;--text3:#5a6f8c;--text4:#96a8c0;
  --accent:#1847d4;--accent2:#2a5eed;--accent-bg:#eef2fd;--accent-bd:#c4d3f9;
  --green:#0b7a42;--green-bg:#eafaf1;--green-bd:#6ee7a8;
  --red:#c0192c;--red-bg:#fef1f2;--red-bd:#fca5a5;
  --amber:#b45309;--amber-bg:#fffbeb;--amber-bd:#fde68a;
  --r:10px;--r-sm:7px;--r-lg:14px;--r-xl:20px;
  --font:'DM Sans',system-ui,sans-serif;--mono:'DM Mono',monospace;
  --sh-xs:0 1px 3px rgba(12,21,38,.06);
  --sh-sm:0 2px 8px rgba(12,21,38,.08),0 1px 3px rgba(12,21,38,.04);
  --sh:0 6px 24px rgba(12,21,38,.1),0 2px 8px rgba(12,21,38,.05);
  --sh-lg:0 20px 56px rgba(12,21,38,.15),0 6px 18px rgba(12,21,38,.08);
  --left-w:280px;--tr:.22s cubic-bezier(.4,0,.2,1);
}
html,body{font-family:var(--font);font-size:14px;color:var(--text);background:var(--surface3);-webkit-font-smoothing:antialiased;height:100%;overflow:hidden;}

/* ROOT */
.sc-root{display:flex;height:100vh;max-height:100vh;overflow:hidden;background:var(--surface3);position:relative;}

/* LEFT */
.sc-left{width:var(--left-w);min-width:var(--left-w);flex-shrink:0;display:flex;flex-direction:column;background:var(--navy);overflow:hidden;position:relative;}
.sc-left::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 10% 0%,rgba(24,71,212,.18) 0%,transparent 55%),radial-gradient(ellipse at 90% 100%,rgba(24,71,212,.10) 0%,transparent 55%);pointer-events:none;z-index:0;}
.sc-left-inner{display:flex;flex-direction:column;height:100%;position:relative;z-index:1;overflow:hidden;}
.sc-left-top{padding:14px 16px 10px;flex-shrink:0;position:relative;z-index:10;}

/* Supplier dropdown trigger */
.sc-sup-filter{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);border-radius:var(--r);padding:9px 12px;cursor:pointer;transition:background var(--tr);position:relative;}
.sc-sup-filter:hover{background:rgba(255,255,255,.11)}
.sc-sup-filter-icon{width:28px;height:28px;border-radius:7px;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.sc-sup-filter-icon svg{width:14px;height:14px;color:rgba(255,255,255,.7)}
.sc-sup-filter-text{flex:1;min-width:0}
.sc-sup-filter-label{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:rgba(255,255,255,.4);margin-bottom:1px}
.sc-sup-filter-value{font-size:12.5px;font-weight:700;color:#fff;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.sc-sup-filter-caret{width:16px;height:16px;color:rgba(255,255,255,.35);flex-shrink:0;transition:transform .2s}
.sc-sup-filter.open .sc-sup-filter-caret{transform:rotate(180deg)}

/* Dropdown */
.sc-sup-dropdown{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--navy2);border:1px solid rgba(255,255,255,.12);border-radius:var(--r-lg);box-shadow:var(--sh-lg);z-index:200;overflow:hidden;opacity:0;pointer-events:none;transform:translateY(-6px);transition:opacity .18s,transform .18s;max-height:280px;display:flex;flex-direction:column;}
.sc-sup-dropdown.open{opacity:1;pointer-events:all;transform:translateY(0)}
.sc-sup-dropdown-search{padding:10px 12px 6px;border-bottom:1px solid rgba(255,255,255,.08);flex-shrink:0}
.sc-sup-dropdown-search input{width:100%;padding:6px 10px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);border-radius:var(--r-sm);font-size:12.5px;font-family:var(--font);color:#fff;outline:none;}
.sc-sup-dropdown-search input::placeholder{color:rgba(255,255,255,.3)}
.sc-sup-dropdown-search input:focus{border-color:rgba(99,130,249,.6)}
.sc-sup-dropdown-list{overflow-y:auto;flex:1;padding:6px}
.sc-sup-dropdown-list::-webkit-scrollbar{width:3px}
.sc-sup-dropdown-list::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:4px}
.sc-sup-opt{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:var(--r-sm);cursor:pointer;transition:background .12s;}
.sc-sup-opt:hover{background:rgba(255,255,255,.07)}
.sc-sup-opt.active{background:rgba(24,71,212,.35);border:1px solid rgba(99,130,249,.3)}
.sc-sup-opt-av{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;flex-shrink:0}
.sc-sup-opt-info{flex:1;min-width:0}
.sc-sup-opt-name{font-size:12.5px;font-weight:700;color:#fff;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.sc-sup-opt-meta{font-size:10.5px;color:rgba(255,255,255,.4);margin-top:1px}

/* Supplier card */
.sc-sup-card{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 16px 16px;min-height:0;}
.sc-sup-card::-webkit-scrollbar{width:3px}
.sc-sup-card::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:4px}

.sc-sup-hero{display:flex;align-items:center;gap:12px;margin-bottom:16px;animation:fadeSlideUp .3s ease both;}
@keyframes fadeSlideUp{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.sc-sup-av-lg{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex-shrink:0;box-shadow:0 4px 14px rgba(0,0,0,.25);}
.sc-sup-hero-info{flex:1;min-width:0}
.sc-sup-hero-name{font-size:13.5px;font-weight:800;color:#fff;line-height:1.25;margin-bottom:2px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.sc-sup-hero-id{font-size:10.5px;color:rgba(255,255,255,.35);font-family:var(--mono)}

/* Action menu */
.sc-sup-action-wrap{position:relative;flex-shrink:0}
.sc-sup-action-btn{width:30px;height:30px;border-radius:8px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);color:rgba(255,255,255,.5);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s;}
.sc-sup-action-btn:hover{background:rgba(24,71,212,.4);border-color:rgba(99,130,249,.4);color:#8fa8ff}
.sc-sup-action-btn svg{width:13px;height:13px}
.sc-sup-action-menu{position:fixed;background:var(--navy2);border:1px solid rgba(255,255,255,.12);border-radius:var(--r);box-shadow:var(--sh-lg);z-index:9500;min-width:140px;overflow:hidden;opacity:0;pointer-events:none;transform:translateY(-4px);transition:opacity .15s,transform .15s;}
.sc-sup-action-menu.open{opacity:1;pointer-events:all;transform:translateY(0)}
.sc-sup-action-item{display:flex;align-items:center;gap:8px;padding:9px 13px;font-size:12.5px;font-weight:600;color:rgba(255,255,255,.7);cursor:pointer;transition:background .12s;}
.sc-sup-action-item:hover{background:rgba(255,255,255,.07);color:#fff}
.sc-sup-action-item svg{width:12px;height:12px;flex-shrink:0;opacity:.7}
.sc-sup-action-item.danger{color:#f87171}
.sc-sup-action-item.danger:hover{background:rgba(239,68,68,.12)}

/* KPIs */
.sc-kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:14px;animation:fadeSlideUp .3s .05s ease both;}
.sc-kpi{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.09);border-radius:var(--r);padding:10px 12px;transition:background .15s;}
.sc-kpi:hover{background:rgba(255,255,255,.09)}
.sc-kpi-label{font-size:8.5px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:rgba(255,255,255,.35);margin-bottom:4px;display:flex;align-items:center;gap:4px}
.sc-kpi-label svg{width:9px;height:9px;flex-shrink:0}
.sc-kpi-val{font-size:14px;font-weight:700;color:#fff;line-height:1}
.sc-kpi-val.small{font-size:11.5px}

/* Details */
.sc-detail-section{margin-bottom:14px;animation:fadeSlideUp .3s .1s ease both}
.sc-detail-head{font-size:8.5px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:rgba(255,255,255,.25);margin-bottom:8px;display:flex;align-items:center;gap:8px;}
.sc-detail-head::after{content:'';flex:1;height:1px;background:rgba(255,255,255,.07)}
.sc-detail-row{display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.sc-detail-row:last-child{border-bottom:none}
.sc-detail-key{font-size:11.5px;color:rgba(255,255,255,.4);display:flex;align-items:center;gap:6px;flex-shrink:0}
.sc-detail-key svg{width:11px;height:11px;flex-shrink:0;opacity:.7}
.sc-detail-val{font-size:12px;font-weight:600;color:rgba(255,255,255,.85);text-align:right;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;max-width:160px}
.sc-detail-val a{color:#8fa8ff;text-decoration:none;font-weight:600}
.sc-detail-val a:hover{text-decoration:underline}

/* Badges */
.sc-badge{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:100px;font-size:10.5px;font-weight:700}
.sc-badge.green{background:rgba(16,185,129,.2);color:#34d399;border:1px solid rgba(16,185,129,.25)}
.sc-badge.red{background:rgba(239,68,68,.15);color:#f87171;border:1px solid rgba(239,68,68,.2)}
.sc-badge.blue{background:rgba(99,130,249,.2);color:#8fa8ff;border:1px solid rgba(99,130,249,.25)}
.sc-badge.neutral{background:rgba(255,255,255,.08);color:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.1)}

/* Left empty */
.sc-left-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px 20px;gap:10px;text-align:center}
.sc-left-empty svg{opacity:.2}
.sc-left-empty p{font-size:13px;font-weight:600;color:rgba(255,255,255,.35)}

/* DIVIDER */
.sc-divider{width:1px;background:var(--border);flex-shrink:0}

/* RIGHT */
.sc-right{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;background:var(--surface3)}
.sc-right-top{display:flex;align-items:center;gap:10px;padding:12px 18px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;flex-wrap:wrap;}
.sc-right-title{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.sc-right-title-icon{width:32px;height:32px;border-radius:9px;background:var(--accent-bg);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.sc-right-title-icon svg{width:15px;height:15px;color:var(--accent)}
.sc-right-title-text{font-size:13.5px;font-weight:800;color:var(--text);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.sc-right-title-count{font-size:11px;font-weight:700;background:var(--accent-bg);color:var(--accent);border:1px solid var(--accent-bd);padding:2px 9px;border-radius:100px;flex-shrink:0;}

.sc-hdr-btn{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:var(--r-sm);border:1.5px solid var(--border);background:var(--surface2);font-size:11.5px;font-weight:700;font-family:var(--font);color:var(--text3);cursor:pointer;transition:all .15s;flex-shrink:0;white-space:nowrap;}
.sc-hdr-btn:hover{border-color:var(--accent-bd);color:var(--accent);background:var(--accent-bg)}
.sc-hdr-btn svg{width:13px;height:13px}
.sc-hdr-btn.spinning svg{animation:spinIcon .6s ease}
@keyframes spinIcon{to{transform:rotate(360deg)}}

/* Toolbar */
.sc-cat-toolbar{display:flex;align-items:center;gap:8px;padding:8px 18px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;flex-wrap:wrap;}
.sc-search-wrap{position:relative;flex:1;min-width:140px;max-width:280px}
.sc-search-wrap svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:13px;height:13px;color:var(--text4);pointer-events:none}
.sc-search-input{width:100%;padding:6px 10px 6px 30px;border:1.5px solid var(--border);border-radius:var(--r-sm);font-size:12.5px;font-family:var(--font);background:var(--surface2);color:var(--text);outline:none;transition:all .15s;}
.sc-search-input:focus{border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px rgba(24,71,212,.07)}
.sc-cat-filter-wrap{position:relative;display:inline-flex;align-items:center}
.sc-cat-filter-wrap svg.arr{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:10px;height:10px;color:var(--text4);pointer-events:none}
.sc-cat-select{padding:6px 26px 6px 10px;border:1.5px solid var(--border);border-radius:var(--r-sm);font-size:12px;font-weight:600;font-family:var(--font);background:var(--surface2);color:var(--text2);outline:none;cursor:pointer;-webkit-appearance:none;appearance:none;transition:border-color .15s;max-width:160px;}
.sc-cat-select:focus{border-color:var(--accent)}

/* Bulk */
.sc-select-toggle{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:var(--r-sm);border:1.5px solid var(--border);background:var(--surface2);font-size:11.5px;font-weight:700;font-family:var(--font);color:var(--text3);cursor:pointer;transition:all .15s;flex-shrink:0;white-space:nowrap;}
.sc-select-toggle:hover,.sc-select-toggle.active{border-color:var(--accent-bd);color:var(--accent);background:var(--accent-bg)}
.sc-bulk-bar{display:flex;align-items:center;gap:8px;padding:8px 18px;background:#eef2fd;border-bottom:1px solid var(--accent-bd);flex-shrink:0;flex-wrap:wrap;}
.sc-bulk-bar-count{font-size:12px;font-weight:700;color:var(--accent);flex:1}
.sc-bulk-btn{display:flex;align-items:center;gap:5px;padding:5px 10px;border-radius:6px;border:1.5px solid;font-size:11px;font-weight:700;font-family:var(--font);cursor:pointer;transition:all .15s;white-space:nowrap;background:var(--surface)}
.sc-bulk-btn.approve{border-color:rgba(16,185,129,.4);color:#0b7a42}
.sc-bulk-btn.reject{border-color:rgba(192,25,44,.3);color:var(--red)}
.sc-bulk-btn.del{border-color:rgba(192,25,44,.25);color:var(--red)}
.sc-bulk-btn.cancel{border-color:var(--border);color:var(--text3)}
.sc-row-cb{width:14px;height:14px;cursor:pointer;accent-color:var(--accent);flex-shrink:0}

/* Content */
.sc-cat-content{flex:1;overflow:hidden;min-height:0;display:flex;flex-direction:column}
.sc-tbl-outer{flex:1;overflow:auto;min-height:0}
.sc-tbl-outer::-webkit-scrollbar{width:4px;height:4px}
.sc-tbl-outer::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
.sc-cat-table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:700px}
.sc-cat-table thead{position:sticky;top:0;z-index:2}
.sc-cat-table th{background:var(--surface);padding:9px 14px;text-align:left;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.55px;color:var(--text4);border-bottom:2px solid var(--border);white-space:nowrap;}
.sc-cat-table td{padding:9px 14px;border-bottom:1px solid var(--border2);color:var(--text2);vertical-align:middle}
.sc-cat-table tbody tr{transition:background .1s;animation:rowFadeIn .2s ease both}
@keyframes rowFadeIn{from{opacity:0;transform:translateX(-4px)}to{opacity:1;transform:translateX(0)}}
.sc-cat-table tbody tr:hover td{background:var(--accent-bg)}
.sc-cat-table tbody tr:last-child td{border-bottom:none}
.ean-link{font-family:var(--mono);font-size:10.5px;color:var(--text3);text-decoration:none;transition:color .12s}
.ean-link:hover{color:var(--accent);text-decoration:underline}
.cat-cost{display:inline-flex;font-size:12px;font-weight:800;color:var(--green);background:var(--green-bg);border:1px solid var(--green-bd);padding:2px 9px;border-radius:100px}
.cat-cost.empty{background:transparent;border-color:transparent;color:var(--text4);font-weight:500;font-size:11px}
.sc-status-sel{padding:3px 8px;border-radius:100px;font-size:10.5px;font-weight:700;font-family:var(--font);border:1.5px solid var(--border);background:var(--surface2);color:var(--text3);cursor:pointer;outline:none;-webkit-appearance:none;appearance:none;transition:all .15s;min-width:90px;}
.sc-status-sel:focus{border-color:var(--accent)}
.sc-status-sel.approved{background:rgba(16,185,129,.15);border-color:rgba(16,185,129,.3);color:#0b7a42}
.sc-status-sel.rejected{background:rgba(192,25,44,.1);border-color:rgba(192,25,44,.25);color:var(--red)}
.sc-del-btn{width:26px;height:26px;border-radius:6px;background:transparent;border:1px solid transparent;color:var(--text4);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;padding:0;}
.sc-del-btn:hover{background:var(--red-bg);border-color:var(--red-bd);color:var(--red)}
.sc-del-btn svg{width:11px;height:11px}

/* All Catalog Overlay */
.sc-allcat-overlay{position:fixed;inset:0;background:var(--surface3);z-index:9000;display:flex;flex-direction:column;opacity:0;pointer-events:none;transition:opacity .22s;}
.sc-allcat-overlay.open{opacity:1;pointer-events:all}
.sc-allcat-header{display:flex;align-items:center;gap:12px;padding:14px 20px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;flex-wrap:wrap;}
.sc-allcat-header-left{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.sc-allcat-back{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:var(--r-sm);border:1.5px solid var(--border);background:var(--surface2);font-size:11.5px;font-weight:700;font-family:var(--font);color:var(--text3);cursor:pointer;transition:all .15s;white-space:nowrap;}
.sc-allcat-back:hover{border-color:var(--accent-bd);color:var(--accent);background:var(--accent-bg)}
.sc-allcat-back svg{width:12px;height:12px}
.sc-allcat-title{font-size:14px;font-weight:800;color:var(--text)}
.sc-allcat-count{font-size:11px;font-weight:700;background:var(--accent-bg);color:var(--accent);border:1px solid var(--accent-bd);padding:2px 9px;border-radius:100px;}
.sc-allcat-search-wrap{position:relative;flex:1;min-width:200px;max-width:380px}
.sc-allcat-search-wrap svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:13px;height:13px;color:var(--text4);pointer-events:none}
.sc-allcat-search-input{width:100%;padding:7px 10px 7px 32px;border:1.5px solid var(--border);border-radius:var(--r-sm);font-size:12.5px;font-family:var(--font);background:var(--surface2);color:var(--text);outline:none;transition:all .15s;}
.sc-allcat-search-input:focus{border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px rgba(24,71,212,.07)}
.sc-allcat-body{flex:1;overflow:auto;min-height:0}
.sc-allcat-body::-webkit-scrollbar{width:4px;height:4px}
.sc-allcat-body::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
.sc-allcat-table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:800px}
.sc-allcat-table thead{position:sticky;top:0;z-index:2}
.sc-allcat-table th{background:var(--surface);padding:9px 14px;text-align:left;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.55px;color:var(--text4);border-bottom:2px solid var(--border);white-space:nowrap;}
.sc-allcat-table td{padding:9px 14px;border-bottom:1px solid var(--border2);color:var(--text2);vertical-align:middle}
.sc-allcat-table tbody tr:hover td{background:var(--accent-bg)}
.sc-allcat-table tbody tr:last-child td{border-bottom:none}
.sc-ean-group-row td{background:rgba(24,71,212,.03)!important}

/* ── DRAWER (shared for edit supplier + add items) ── */
.sc-drawer-overlay{position:fixed;inset:0;background:rgba(12,21,38,.4);z-index:1200;opacity:0;pointer-events:none;transition:opacity .22s;backdrop-filter:blur(3px);}
.sc-drawer-overlay.open{opacity:1;pointer-events:all}
.sc-drawer{position:fixed;top:0;right:0;height:100vh;background:var(--surface);box-shadow:var(--sh-lg);z-index:1300;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .28s cubic-bezier(.4,0,.2,1);overflow:hidden;}
.sc-drawer.open{transform:translateX(0)}
.sc-drawer-w-md{width:480px;max-width:100vw}
.sc-drawer-w-lg{width:600px;max-width:100vw}
.sc-drawer-head{display:flex;align-items:center;gap:12px;padding:18px 20px;border-bottom:1px solid var(--border);flex-shrink:0;}
.sc-drawer-head-icon{width:36px;height:36px;border-radius:10px;background:var(--accent-bg);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.sc-drawer-head-icon svg{width:16px;height:16px;color:var(--accent)}
.sc-drawer-head-title{font-size:15px;font-weight:800;flex:1}

<script>
(function(){
'use strict';

const sb = window.sb;

/* ── STATE ── */
let allSuppliers   = [];
let catalogData    = [];     // current supplier's products
let allCatalogData = [];     // all products
let catalogLoaded  = false;
let currentSupId   = null;
let dropdownOpen   = false;
let editingSupId   = null;   // null = adding new
let bulkSelectMode = false;
let selectedIds    = new Set();
let acBulkMode     = false;
let acSelectedIds  = new Set();
let importRows     = [];     // parsed rows ready to import
let importSupId    = null;   // supplier for import
let _parsedLines   = [];     // raw lines for header picker


/* ── AGENT ── */
function getAgent(){
  try{const u=JSON.parse(sessionStorage.getItem('user')||'{}');return(u.firstName||'').trim()||'';}catch(e){return'';}
}

/* ── AVATAR PALETTE ── */
const PAL=[['#dbeafe','#1d4ed8'],['#dcfce7','#166534'],['#fce7f3','#9d174d'],['#fef9c3','#854d0e'],['#ede9fe','#6d28d9'],['#ffedd5','#c2410c'],['#e0f2fe','#0369a1'],['#fdf4ff','#7e22ce'],['#f0fdf4','#15803d'],['#fff7ed','#9a3412']];
function palIdx(n){return(n||'?').split('').reduce((a,c)=>a+c.charCodeAt(0),0)%PAL.length}
function avColors(n){return PAL[palIdx(n)]}
function initials(n){const p=(n||'?').trim().split(/\s+/);return p.length>=2?(p[0][0]+p[p.length-1][0]).toUpperCase():(n||'?').slice(0,2).toUpperCase();}

/* ── PROGRESS BAR ── */
let _pv=0,_pt=null;
function pStart(){const b=document.getElementById('scPbar');clearInterval(_pt);_pv=.1;b.style.transform='scaleX(.1)';b.classList.add('active');_pt=setInterval(()=>{_pv=Math.min(_pv+(1-_pv)*.07,.92);b.style.transform=`scaleX(${_pv})`;},250);}
function pDone(){clearInterval(_pt);const b=document.getElementById('scPbar');b.style.transform='scaleX(1)';setTimeout(()=>{b.classList.remove('active');b.style.transform='scaleX(0)';},380);}

/* ── HELPERS ── */
function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function fmtCost(v){const n=parseFloat(v);return isNaN(n)?null:n.toFixed(2);}

/* ── INIT ── */
async function init(){
  pStart();
  try{
const [{data:sups,error:sErr},{data:src,error:srcErr}]=await Promise.all([
  sb.from('suppliers').select('*').order('name'),
  sb.from('sourcing').select('supplier_name,approved,purchased')
]);
if(sErr)throw sErr;
allSuppliers=sups||[];
allCatalogData=[];
catalogLoaded=false;
    // Build sourcing stats keyed by lowercase name
    _srcStats={};
    (src||[]).forEach(r=>{
      const k=(r.supplier_name||'').toLowerCase().trim();
      if(!k)return;
      if(!_srcStats[k])_srcStats[k]={total:0,approved:0,purchased:0};
      _srcStats[k].total++;
      if(r.approved)_srcStats[k].approved++;
      if(r.purchased)_srcStats[k].purchased++;
    });
    renderSupDropdown();
    // Auto-select first supplier
    if(allSuppliers.length){
      const first=allSuppliers[0];
      await selectSupplier(first.supplier_id);
    }
  }catch(e){
    toast('Failed to load: '+e.message,'error');
  }
  pDone();
}
let _srcStats={};

/* ── SUPPLIER DROPDOWN ── */
function renderSupDropdown(filter){
  const list=document.getElementById('scSupDdList');
  const q=(filter||'').toLowerCase();
  const visible=allSuppliers.filter(s=>(s.name||'').toLowerCase().includes(q));
  if(!visible.length){
    list.innerHTML='<div style="padding:16px;text-align:center;font-size:12px;color:rgba(255,255,255,.3)">No suppliers found</div>';
    return;
  }
  list.innerHTML=visible.map(s=>{
    const name=s.name||'?';
    const [bg,color]=avColors(name);
    const active=s.supplier_id===currentSupId;
    return `<div class="sc-sup-opt${active?' active':''}" onclick="selectSupplier('${esc(s.supplier_id)}')">
      <div class="sc-sup-opt-av" style="background:${bg};color:${color}">${esc(initials(name))}</div>
      <div class="sc-sup-opt-info">
        <div class="sc-sup-opt-name">${esc(name)}</div>
        <div class="sc-sup-opt-meta">${esc(s.supplier_id)}</div>
      </div>
      ${active?'<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="color:#8fa8ff;flex-shrink:0"><polyline points="20 6 9 17 4 12"/></svg>':''}
    </div>`;
  }).join('');
}

function toggleSupDropdown(){
  dropdownOpen=!dropdownOpen;
  document.getElementById('scSupDropdown').classList.toggle('open',dropdownOpen);
  document.getElementById('scSupFilter').classList.toggle('open',dropdownOpen);
  if(dropdownOpen){
    document.getElementById('scSupDdSearch').value='';
    renderSupDropdown();
    setTimeout(()=>document.getElementById('scSupDdSearch').focus(),80);
  }
}
function closeSupDropdown(){
  if(!dropdownOpen)return;
  dropdownOpen=false;
  document.getElementById('scSupDropdown').classList.remove('open');
  document.getElementById('scSupFilter').classList.remove('open');
}
function filterSupDropdown(){renderSupDropdown(document.getElementById('scSupDdSearch').value);}

async function selectSupplier(sid){
  closeSupDropdown();
  currentSupId=sid;
  const s=allSuppliers.find(x=>x.supplier_id===sid);
  if(!s)return;
  document.getElementById('scSupFilterVal').textContent=s.name||'Unknown';
  document.getElementById('scCatTitle').textContent=(s.name||'Supplier')+' — Catalog';
  renderSupplierCard(s);
  renderSupDropdown();

  // Show loading state 
  document.getElementById('scCatContent').innerHTML=`<div class="sc-state"><span class="sc-spin sc-spin-md dark"></span><p>Loading catalog…</p></div>`;
  document.getElementById('scCatCount').style.display='none';

  const{data:cats,error:cErr}=await sb.from('catalog').select('*').eq('supplier_id',sid).order('product_name').limit(10000);
  if(cErr){toast('Failed to load catalog: '+cErr.message,'error');return;}
  catalogData=cats||[];

  // Merge into allCatalogData (for All Catalog overlay)
  const ids=new Set(catalogData.map(c=>c.id));
  allCatalogData=allCatalogData.filter(c=>!ids.has(c.id));
  allCatalogData.push(...catalogData);

  populateCategoryFilter(catalogData);
  renderCatalog();
  const cnt=document.getElementById('scCatCount');
  cnt.style.display='';
  cnt.textContent=catalogData.length+' product'+(catalogData.length!==1?'s':'');
}

/* ── SUPPLIER CARD ── */
function renderSupplierCard(s){

  document.getElementById('scRoot').appendChild(menuEl);

  // KPIs

    +kpi('Cash Back',cashBackVal,'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>')
    +kpiRaw('Account',yesNoBadge(s.account_limit),'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>')
    +kpiRaw('Card',yesNoBadge(s.card),'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>');
  el.appendChild(kgrid);

  // Contact details
  const contact=s.contact||'';

    ?`<a href="https://mail.google.com/mail/?view=cm&to=${encodeURIComponent(contact)}" target="_blank" rel="noopener">${esc(contact)}</a>`
    :'—';
  const det=document.createElement('div');

    ${detRowRaw('Contact',contactHtml,'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>')}
    ${detRow('WhatsApp',s.whatsapp||'—','<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 13a19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 3.56 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>')}
    ${s.website?`
<div class="sc-detail-row" style="align-items:flex-start;flex-direction:column;gap:6px;padding-bottom:8px">

      <div style="font-size:9px;color:rgba(255,255,255,.3);margin-bottom:3px;text-transform:uppercase;letter-spacing:.5px;font-weight:700">Password</div>
      <div style="display:flex;align-items:center;gap:6px">
        <div id="supPwVal_${esc(s.supplier_id)}" style="font-size:12px;color:rgba(255,255,255,.75);font-weight:600;font-family:var(--mono);letter-spacing:2px">••••••••</div>
        <span onclick="togglePwVisibility('${esc(s.supplier_id)}','${esc(s.login_password||'')}')" style="cursor:pointer;color:rgba(255,255,255,.3);font-size:10px;font-weight:700;padding:2px 6px;border:1px solid rgba(255,255,255,.1);border-radius:4px;transition:all .12s" onmouseenter="this.style.color='rgba(255,255,255,.6)'" onmouseleave="this.style.color='rgba(255,255,255,.3)'">show</span>

function detRowRaw(label,valHtml,icon){return`<div class="sc-detail-row"><span class="sc-detail-key">${icon}${esc(label)}</span><span class="sc-detail-val">${valHtml}</span></div>`;}
function yesNoBadge(v){
  if(!v||v==='—'||v===false)return'<span style="color:rgba(255,255,255,.3);font-size:11px">—</span>';
  const yes=String(v).toLowerCase()==='yes'||v===true;
  return`<span class="sc-badge ${yes?'green':'red'}">${yes?'✓ Yes':'✗ No'}</span>`;
}


function toggleSupLogin(triggerEl){
  const row=triggerEl.closest('.sc-detail-row');
  if(!row)return;
  const panel=row.querySelector('[id^="supLoginPanel_"]');
  const caret=row.querySelector('[id^="supLoginCaret_"]');
  if(!panel)return;
  const open=panel.style.display==='block';
  panel.style.display=open?'none':'block';
  if(caret)caret.style.transform=open?'rotate(0deg)':'rotate(90deg)';
}

function togglePwVisibility(sid,pw){
  const el=document.getElementById('supPwVal_'+sid);

  const hidden=el.textContent==='••••••••';
  el.textContent=hidden?(pw||'—'):'••••••••';

/* ── ACTION MENU ── */
function toggleSupActionMenu(e){

  const isOpen=m.classList.contains('open');
  if(isOpen){m.classList.remove('open');return;}

  m.style.top=(r.bottom+6)+'px';

async function saveSupplierEdit(){
  const name=document.getElementById('efName').value.trim();
  if(!name){toast('Supplier name is required','error');return;}
  const btn=document.getElementById('scEditSaveBtn');
  btn.disabled=true;
  const payload={
    name,
    moq: document.getElementById('efMOQ').value.trim()||null,
    cash_back: document.getElementById('efCashBack').value.trim()||null,
    account_limit: document.getElementById('efAccountLimit').value||null,
    card: document.getElementById('efCard').value||null,
    contact: document.getElementById('efContact').value.trim()||null,
    whatsapp: document.getElementById('efWhatsApp').value.trim()||null,
    website: document.getElementById('efWebsite').value.trim()||null,
    login_username: document.getElementById('efLoginUsername').value.trim()||null,
    login_password: document.getElementById('efLoginPassword').value.trim()||null,
    notes: document.getElementById('efNotes').value.trim()||null,
    last_updated: new Date().toISOString(),
  };
  if(payload.moq) payload.moq=parseFloat(payload.moq)||null;
  if(payload.cash_back) payload.cash_back=parseFloat(payload.cash_back)||null;

  try{
    if(editingSupId){
      const{error}=await sb.from('suppliers').update(payload).eq('supplier_id',editingSupId);
      if(error)throw error;
      const idx=allSuppliers.findIndex(x=>x.supplier_id===editingSupId);
      if(idx>-1)allSuppliers[idx]={...allSuppliers[idx],...payload};
      if(currentSupId===editingSupId){
        const s=allSuppliers.find(x=>x.supplier_id===editingSupId);
        if(s){renderSupplierCard(s);document.getElementById('scSupFilterVal').textContent=s.name||'Unknown';document.getElementById('scCatTitle').textContent=(s.name||'Supplier')+' — Catalog';}
      }
    }else{
      // Generate new supplier_id
      const maxN=allSuppliers.reduce((mx,s)=>{const n=parseInt((s.supplier_id||'').replace('SUP-',''));return isNaN(n)?mx:Math.max(mx,n);},0);
      payload.supplier_id='SUP-'+String(maxN+1).padStart(4,'0');
      payload.created_at=new Date().toISOString();
      const{data:newS,error}=await sb.from('suppliers').insert(payload).select().single();
      if(error)throw error;
      allSuppliers.push(newS);
      allSuppliers.sort((a,b)=>(a.name||'').localeCompare(b.name||''));
    }
    renderSupDropdown();
    closeEditDrawer();
    toast('Supplier saved','success');
  }catch(e){
    toast('Save failed: '+e.message,'error');
  }
  btn.disabled=false;
}

function confirmDeleteSupplier(sid,name){

async function doDeleteSupplier(sid){
  closeConfirm();
  const tid=toast('Deleting supplier…','loading',0);
  try{
    // Cascade: delete catalog rows first, then supplier
    await sb.from('catalog').delete().eq('supplier_id',sid);
    const{error}=await sb.from('suppliers').delete().eq('supplier_id',sid);
    if(error)throw error;
    allSuppliers=allSuppliers.filter(x=>x.supplier_id!==sid);
    allCatalogData=allCatalogData.filter(x=>x.supplier_id!==sid);
    if(currentSupId===sid){
      currentSupId=null;

      document.getElementById('scSupFilterVal').textContent='Select a supplier…';

      document.getElementById('scSupCard').innerHTML='<div class="sc-left-empty"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg><p>Select a supplier</p></div>';
      document.getElementById('scCatContent').innerHTML='<div class="sc-state"><p>Select a supplier</p></div>';
      document.getElementById('scCatCount').style.display='none';
    }
    renderSupDropdown();
    removeToast(tid);toast('Supplier deleted','success');
  }catch(e){removeToast(tid);toast('Delete failed: '+e.message,'error');}
}

/* ── STATUS UPDATE ── */
async function updateStatus(id,status){
  const agent=status?getAgent():'';
  try{
    const{error}=await sb.from('catalog').update({status:status||null,agent:agent||null}).eq('id',id);
    if(error)throw error;
    [catalogData,allCatalogData,_acAllData].forEach(arr=>{
      const r=arr.find(x=>String(x.id||'')===id);
      if(r){r.status=status;r.agent=agent;}
    });
    const sel=document.getElementById('status_'+id);
    if(sel)sel.className='sc-status-sel'+(status==='Approved'?' approved':status==='Rejected'?' rejected':'');
    const agEl=document.getElementById('agent_'+id);
    if(agEl)agEl.textContent=agent||'—';
    const acSel=document.getElementById('ac_status_'+id);
    if(acSel)acSel.className='sc-status-sel'+(status==='Approved'?' approved':status==='Rejected'?' rejected':'');
    const acAgEl=document.getElementById('ac_agent_'+id);
    if(acAgEl)acAgEl.textContent=agent||'—';
    toast('Status updated','success');
  }catch(e){toast('Update failed: '+e.message,'error');}
}

function buildImportUI(){
  document.getElementById('scImportDrawerBody').innerHTML=`
    <p id="scImportZoneDesc" style="font-size:12.5px;color:var(--text3);margin-bottom:16px;line-height:1.55">Upload a CSV or Excel file. Required: <strong>EAN</strong> and <strong>Product Name</strong>. Optional: Code, Cost, Case, Category, Status, Agent, Barcode, Image URL.</p>
    <div class="sc-import-zone" id="scImportZone" onclick="document.getElementById('scFileInput').click()" ondragover="event.preventDefault();this.classList.add('dragover')" ondragleave="this.classList.remove('dragover')" ondrop="handleFileDrop(event)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>

function handleFileDrop(e){
  e.preventDefault();
  document.getElementById('scImportZone').classList.remove('dragover');

  if(f)handleFileSelect(f);
}

function handleFileSelect(file){
  if(!file)return;
  if(file.size>200*1024*1024){showImportError('File too large (max 200MB)');return;}
  const ext=file.name.split('.').pop().toLowerCase();
  if(ext==='csv'){
    const reader=new FileReader();
    reader.onload=e=>parseCSV(e.target.result);
    reader.readAsText(file);
  }else if(ext==='xlsx'||ext==='xls'){
    if(!window.XLSX){showImportError('XLSX library not loaded');return;}
    const reader=new FileReader();
    reader.onload=e=>{
      const wb=XLSX.read(e.target.result,{type:'array'});
      const ws=wb.Sheets[wb.SheetNames[0]];
      parseCSV(XLSX.utils.sheet_to_csv(ws));
    };
    reader.readAsArrayBuffer(file);
  }else{showImportError('Unsupported file type. Use CSV or XLSX.');}
}

function parseCSV(text){
  const lines=text.split(/\r?\n/).filter(l=>l.trim());
  if(lines.length<2){showImportError('File is empty or has no data rows.');return;}
  _parsedLines=lines;
  showHeaderPicker(lines);
}

function showHeaderPicker(lines){
  const preview=lines.slice(0,12);
  document.getElementById('scImportZone').style.display='none';
  document.getElementById('scImportZoneDesc').style.display='none';
  const rb=document.getElementById('scReuploadBtn');
  if(rb)rb.style.display='';
  document.getElementById('scImportBtn').disabled=true;

  let html=`
    <div style="background:var(--accent-bg);border:1px solid var(--accent-bd);border-radius:var(--r);padding:12px 16px;margin-bottom:14px;font-size:12.5px;color:var(--accent);font-weight:600">
      👆 Click a row to use it as the column header
    </div>
    <div style="border:1px solid var(--border);border-radius:var(--r);overflow:hidden;overflow-x:auto">
      <table style="width:100%;border-collapse:collapse;font-size:11.5px;min-width:500px">
        <tbody>`;

  preview.forEach((line,i)=>{
    const cells=splitCSVLine(line).map(v=>v.trim().replace(/^"|"$/g,''));
    const isEmpty=cells.every(c=>!c);
    html+=`<tr id="hprow_${i}" onclick="selectHeaderRow(${i})" style="cursor:pointer;transition:background .12s;${isEmpty?'opacity:.35':''}">
      <td style="padding:6px 10px;border-bottom:1px solid var(--border2);background:var(--surface2);font-size:10px;font-weight:700;color:var(--text4);white-space:nowrap;width:40px">Row ${i+1}</td>
      ${cells.slice(0,8).map(c=>`<td style="padding:6px 10px;border-bottom:1px solid var(--border2);border-left:1px solid var(--border2);max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:${c?'var(--text2)':'var(--text4)'};">${esc(c||'—')}</td>`).join('')}
      ${cells.length>8?`<td style="padding:6px 10px;border-bottom:1px solid var(--border2);border-left:1px solid var(--border2);color:var(--text4);font-size:10px">+${cells.length-8} more</td>`:''}
    </tr>`;
  });

  html+=`</tbody></table></div>`;
  document.getElementById('scImportResult').innerHTML=html;
}

function selectHeaderRow(rowIdx){
  // Highlight selected row
  document.querySelectorAll('[id^="hprow_"]').forEach(r=>r.style.background='');
  const sel=document.getElementById('hprow_'+rowIdx);
  if(sel)sel.style.background='var(--accent-bg)';

  const lines=_parsedLines;
  const headers=splitCSVLine(lines[rowIdx]).map(h=>h.trim().replace(/^"|"$/g,''));

  let currentCategory='';
  const rows=[];
  lines.slice(rowIdx+1).forEach(line=>{
    const vals=splitCSVLine(line);
    const cells=vals.map(v=>v.trim().replace(/^"|"$/g,''));
    const nonEmpty=cells.filter(Boolean);
    if(nonEmpty.length===1&&nonEmpty[0].length>1&&!/^\d{8,14}$/.test(nonEmpty[0])&&!nonEmpty[0].startsWith('£')){
      currentCategory=nonEmpty[0];
      return;
    }
    const obj={};
    headers.forEach((h,i)=>obj[h]=(vals[i]||'').trim().replace(/^"|"$/g,''));
    if(currentCategory&&!obj['category']&&!obj['Category']&&!obj['CATEGORY']){
      obj['__detectedCategory']=currentCategory;
    }
    if(Object.values(obj).some(v=>v))rows.push(obj);
  });

  if(!rows.length){showImportError('No data rows found after selected header.');return;}
  importRows=rows;
  showImportPreview(headers,rows);
}

function splitCSVLine(line){
  const result=[];let cur='';let inQ=false;
  for(let i=0;i<line.length;i++){
    const c=line[i];
    if(c==='"'){if(inQ&&line[i+1]==='"'){cur+='"';i++;}else inQ=!inQ;}
    else if((c===','||c==='	')&&!inQ){result.push(cur);cur='';}
    else cur+=c;
  }
  result.push(cur);return result;
}

const COL_MAP={
  ean:['ean','barcode','gtin','ean13','ean/upc','inner barcode'],
  product_name:['product name','productname','name','title','description','product description','product'],
  code:['code','sku','supplier code','product code','item code'],
  cost:['cost','price','unit cost','wholesale price','buy price','piece price','unit'],
  case_size:['case','case size','pack size','pack','qty per case','case qty','available'],
  category:['category','cat','type','department'],
  status:['status'],
  agent:['agent','approved by'],
  barcode:['barcode','outer barcode','internal barcode'],
  product_image:['image','image url','product image','photo','img'],
};

function detectMapping(headers){
  const map={};
  Object.entries(COL_MAP).forEach(([col,aliases])=>{
    const found=headers.find(h=>aliases.includes(h.toLowerCase().trim()));
    map[col]=found||'';
  });
  return map;
}

  function removeImportColumn(header){
  // Remove from importRows
  importRows.forEach(r=>delete r[header]);
  // Clear mapping if this column was mapped
  Object.keys(currentMapping).forEach(col=>{
    if(currentMapping[col]===header)currentMapping[col]='';
  });
  // Remove chip visually
  const safe=header.replace(/[^a-zA-Z0-9]/g,'_');
  const chip=document.getElementById('colchip_'+safe);
  if(chip)chip.remove();
  // Update the mapping selects — remove this option from all of them
  document.querySelectorAll('.sc-import-mapping select,[data-col]').forEach(sel=>{
    [...sel.options].forEach(opt=>{if(opt.value===header)opt.remove();});
    // If the currently selected value was this column, reset to ignore
    if(sel.value===header)sel.value='';
  });
  // Rebuild preview table rows
  const tbody=document.querySelector('.sc-import-preview-table tbody');
  const thead=document.querySelector('.sc-import-preview-table thead tr');
  if(!tbody||!thead)return;
  // Remove header th
  [...thead.querySelectorAll('th')].forEach(th=>{if(th.textContent===header)th.remove();});
  // Remove corresponding td from each row by index — rebuild from importRows
  const currentHeaders=[...thead.querySelectorAll('th')].map(th=>th.textContent).filter(t=>t.trim());
  tbody.innerHTML=importRows.slice(0,15).map((r,i)=>`<tr id="previewrow_${i}"><td style="width:24px;padding:4px 6px"><span onclick="removeImportRow(${i})" style="cursor:pointer;width:16px;height:16px;border-radius:4px;background:var(--border);display:inline-flex;align-items:center;justify-content:center;color:var(--text4);font-size:9px;font-weight:800;flex-shrink:0" onmouseenter="this.style.background='var(--red-bd)';this.style.color='var(--red)'" onmouseleave="this.style.background='var(--border)';this.style.color='var(--text4)'">✕</span></td>${currentHeaders.map(h=>`<td>${esc(r[h]||'')}</td>`).join('')}</tr>`).join('');
}
  
function showImportError(msg){
  document.getElementById('scImportResult').innerHTML=`<div class="sc-import-error">${esc(msg)}</div>`;
  document.getElementById('scImportBtn').disabled=true;
}

function removeImportRow(previewIdx){
  // previewIdx is the index within the first 5 rows shown
  // We need to find and remove the actual row from importRows
  // The preview shows importRows[0..4], so previewIdx maps directly
  if(previewIdx>=importRows.length)return;
  importRows.splice(previewIdx,1);
  // Rebuild preview tbody with updated indices
  const currentHeaders=[...document.querySelectorAll('.sc-import-preview-table thead th')].map(th=>th.textContent).filter(t=>t.trim());
  const tbody=document.getElementById('scImportPreviewTbody');
  if(!tbody)return;
  const preview=importRows.slice(0,15);
  tbody.innerHTML=preview.map((r,i)=>`<tr id="previewrow_${i}"><td style="width:24px;padding:4px 6px"><span onclick="removeImportRow(${i})" style="cursor:pointer;width:16px;height:16px;border-radius:4px;background:var(--border);display:inline-flex;align-items:center;justify-content:center;color:var(--text4);font-size:9px;font-weight:800;flex-shrink:0" onmouseenter="this.style.background='var(--red-bd)';this.style.color='var(--red)'" onmouseleave="this.style.background='var(--border)';this.style.color='var(--text4)'">✕</span></td>${currentHeaders.map(h=>`<td>${esc(r[h]||'')}</td>`).join('')}</tr>`).join('');
  // Update row count badge
  const cnt=document.getElementById('scImportRowCount');
  if(cnt)cnt.textContent=importRows.length+' rows detected';
}

async function doImport(){
  if(!importRows.length){toast('No data to import','error');return;}
  const sup=allSuppliers.find(x=>x.supplier_id===importSupId);
  if(!sup){toast('Supplier not found','error');return;}
  const btn=document.getElementById('scImportBtn');
  btn.disabled=true;
  const today=new Date();
  const dateStr=`${String(today.getDate()).padStart(2,'0')}/${String(today.getMonth()+1).padStart(2,'0')}/${today.getFullYear()}`;
const tid=toast('Analysing '+importRows.length+' rows…','loading',0);
  try{
    // Fetch existing rows for this supplier to check duplicates
    const{data:existing}=await sb.from('catalog').select('id,ean,cost,supplier_id').eq('supplier_id',importSupId);
    const existingMap={};
    (existing||[]).forEach(r=>{
      const k=String(r.ean||'').trim();
      if(k)existingMap[k]=r;
    });

    // Build and filter valid rows first, THEN assign IDs
    const mapping=window.currentMapping;
    const getVal=(row,col)=>mapping[col]?(row[mapping[col]]||'').trim():'';
    const maxNum=allCatalogData.reduce((mx,c)=>{const n=parseInt((c.id||'').replace(/[^0-9]/g,''));return isNaN(n)?mx:Math.max(mx,n);},0);

    const validRows=[];
    let skippedIncomplete=0;
    importRows.forEach(row=>{
      const ean=getVal(row,'ean')||null;
      const product_name=getVal(row,'product_name')||null;
      const costRaw=getVal(row,'cost').replace(/[£$,\s]/g,'').trim();
      const cost=costRaw!==''?parseFloat(costRaw):null;
      if(!ean||!product_name){skippedIncomplete++;return;}
      validRows.push({
        ean,product_name,cost,
        code:getVal(row,'code')||null,
        case_size:getVal(row,'case_size')||null,
        category:getVal(row,'category')||row['__detectedCategory']||null,
        status:getVal(row,'status')||null,
        agent:getVal(row,'agent')||null,
        barcode:getVal(row,'barcode')||null,
        product_image:getVal(row,'product_image')||null,
        supplier_id:importSupId,
        supplier_name:sup.name,
        supplier_email:sup.contact||null,
        date:dateStr,
      });
    });

    const toInsertNew=[];
    const toUpdate=[];
    let skipped=0;
    let idCounter=maxNum;

    validRows.forEach(row=>{
      const eanKey=String(row.ean||'').trim();
      const match=existingMap[eanKey];
      if(!match){
        row.id='CAT-'+String(++idCounter).padStart(4,'0');
        toInsertNew.push(row);return;
      }
      const oldCost=parseFloat(match.cost)||0;
      const newCost=parseFloat(row.cost)||0;
      if(oldCost===newCost){skipped++;return;}
      toUpdate.push({id:match.id,oldCost,newCost,row});
    });

    const validInsert=toInsertNew; // already filtered above

    removeToast(tid);
    
    const doThImport=async()=>{
      const tid2=toast('Importing…','loading',0);
      let insertedCount=0,updatedCount=0;
      try{
        // Inserts
        const BATCH=500;
        for(let i=0;i<toInsertNew.length;i+=BATCH){
          const{error}=await sb.from('catalog').insert(toInsertNew.slice(i,i+BATCH));
          if(error)throw error;
        }
        insertedCount=toInsertNew.length;

        // Updates
        for(const u of toUpdate){
          await sb.from('catalog').update({
            cost:u.newCost,
            date:dateStr,
            status:'New price',
            agent:null,
          }).eq('id',u.id);
          // Update local data
          [catalogData,allCatalogData].forEach(arr=>{
            const r=arr.find(x=>x.id===u.id);
            if(r){r.cost=u.newCost;r.date=dateStr;r.status='New price';r.agent=null;}
          });
          updatedCount++;
        }

        allCatalogData.push(...toInsertNew);
        catalogData=allCatalogData.filter(c=>c.supplier_id===importSupId);
        populateCategoryFilter(catalogData);
        renderCatalog();
        const cnt=document.getElementById('scCatCount');
        cnt.textContent=catalogData.length+' product'+(catalogData.length!==1?'s':'');
        const s=allSuppliers.find(x=>x.supplier_id===importSupId);
        if(s)renderSupplierCard(s);
        removeToast(tid2);
        closeImportDrawer();

        // Post-import summary modal
        showImportSummary(insertedCount,updatedCount,skipped,toUpdate,skippedIncomplete);
      }catch(e){
        removeToast(tid2);toast('Import failed: '+e.message,'error');
        btn.disabled=false;
      }
    };

    // If there are price updates, show preview first
    if(toUpdate.length>0||skipped>0){
      showImportConfirm(toInsertNew.length,toUpdate,skipped,skippedIncomplete,doThImport,()=>{btn.disabled=false;});
    }else{
      await doThImport();
    }

  }catch(e){
    toast('Import failed: '+e.message,'error');
    btn.disabled=false;
  }
}

    <button class="sc-btn sc-btn-secondary sc-btn-sm" onclick="(${onCancel.toString()})()">Cancel</button>

      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" width="12" height="12"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      Confirm Import
    </button>`;
}

function showImportSummary(inserted,updated,skipped,updates,incomplete){
  const increases=updates.filter(u=>u.newCost>u.oldCost).length;
  const decreases=updates.filter(u=>u.newCost<u.oldCost).length;
  let msg=`${inserted} added`;
  if(updated)msg+=`, ${updated} price${updated!==1?'s':''} updated (${increases} ▲ ${decreases} ▼)`;
  if(skipped)msg+=`, ${skipped} unchanged`;
  if(incomplete)msg+=`, ${incomplete} skipped (missing EAN/Product name)`;
  toast(msg,'success',6000);
}

  
/* ── REFRESH ── */
async function handleRefresh(){
  const btn=document.getElementById('scRefreshBtn');
  btn.classList.add('spinning');
  const tid=toast('Refreshing…','loading',0);
  try{
    const[{data:sups,error:sErr}]=await Promise.all([
      sb.from('suppliers').select('*').order('name'),
    ]);
    if(sErr)throw sErr;
    allSuppliers=sups||[];
    renderSupDropdown();
    if(currentSupId){
      const{data:cats,error:cErr}=await sb.from('catalog').select('*').eq('supplier_id',currentSupId).order('product_name').limit(10000);
      if(cErr)throw cErr;
      catalogData=cats||[];
      const ids=new Set(catalogData.map(c=>c.id));
      allCatalogData=allCatalogData.filter(c=>!ids.has(c.id));
      allCatalogData.push(...catalogData);
      const s=allSuppliers.find(x=>x.supplier_id===currentSupId);
      if(s){renderSupplierCard(s);populateCategoryFilter(catalogData);renderCatalog();}
      const cnt=document.getElementById('scCatCount');
      cnt.textContent=catalogData.length+' product'+(catalogData.length!==1?'s':'');
    }
    removeToast(tid);toast('Refreshed','success');
  }catch(e){removeToast(tid);toast('Refresh failed: '+e.message,'error');}
  setTimeout(()=>btn.classList.remove('spinning'),700);
}

/* ── CONFIRM ── */
function closeConfirm(){
  document.getElementById('scConfirmOverlay').classList.remove('open');
  document.getElementById('scConfirmOk').onclick=null;
}

/* ── TOAST ── */
let _tn=0;
function toast(msg,type,dur){
  const c=document.getElementById('scToasts');
  const id='sct_'+(++_tn);
  const t=document.createElement('div');
  t.className='sc-toast '+(type||'info');t.id=id;
  const icons={success:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>',error:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>',loading:'<span class="sc-spin sc-spin-sm" style="flex-shrink:0"></span>',info:''};
  t.innerHTML=(icons[type]||'')+`<span>${esc(msg)}</span>`;
  c.appendChild(t);
  const ms=dur===undefined?3000:dur;
  if(ms>0)setTimeout(()=>t.remove(),ms);
  return id;
}
function removeToast(id){document.getElementById(id)?.remove();}

/* ── KEYBOARD / CLICK OUTSIDE ── */
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    if(document.getElementById('scAllCatOverlay').classList.contains('open')){closeAllCatalog();return;}
    if(document.getElementById('scImportDrawer').classList.contains('open')){closeImportDrawer();return;}
    if(document.getElementById('scEditDrawer').classList.contains('open')){closeEditDrawer();return;}
    if(document.getElementById('scConfirmOverlay').classList.contains('open')){closeConfirm();return;}
    if(dropdownOpen){closeSupDropdown();return;}
  }
});
document.addEventListener('click',e=>{
  const menu=document.getElementById('scSupActionMenu');
  if(menu&&menu.classList.contains('open')&&!menu.contains(e.target)&&!e.target.closest('#scSupActionBtn'))closeSupActionMenu();
  if(dropdownOpen&&!document.getElementById('scSupFilter').contains(e.target)&&!document.getElementById('scSupDropdown').contains(e.target))closeSupDropdown();
});
