<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#eef1f8;--surface:#ffffff;--surface2:#f5f7fc;--border:#e2e8f5;--border2:#ecf0f9;
  --text:#0c1526;--text2:#2a3a54;--text3:#64748b;--text4:#98a7bc;
  --accent:#1847d4;--accent-l:#2a5eed;--accent-bg:#eef2fd;--accent-bd:#c4d3f9;
  --green:#0c7a42;--green-bg:#ecfdf5;--green-bd:#86efac;
  --red:#b91c1c;--red-bg:#fef2f2;--red-bd:#fecaca;
  --amber:#92400e;--amber-bg:#fffbeb;--amber-bd:#fcd34d;
  --navy:#0c1526;--navy2:#141d2e;
  --r:10px;--r-sm:7px;--r-lg:14px;--r-xl:18px;
  --font:'Plus Jakarta Sans',system-ui,sans-serif;--mono:'JetBrains Mono',monospace;
  --sh-sm:0 1px 3px rgba(12,21,38,.06),0 1px 2px rgba(12,21,38,.04);
  --sh:0 4px 16px rgba(12,21,38,.08),0 2px 6px rgba(12,21,38,.04);
  --sh-lg:0 20px 50px rgba(12,21,38,.14),0 6px 16px rgba(12,21,38,.07);
}
html,body{font-family:var(--font);font-size:14px;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased;height:100%;}
body{overflow:hidden}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:6px}
::-webkit-scrollbar-thumb:hover{background:var(--text4)}

.fba-app{display:flex;flex-direction:column;height:100vh;max-height:100vh;overflow:hidden;position:relative;background:radial-gradient(ellipse at 20% 0%,rgba(24,71,212,.04) 0%,transparent 60%),radial-gradient(ellipse at 80% 100%,rgba(24,71,212,.03) 0%,transparent 60%),var(--bg);}

.topnav{display:flex;align-items:center;gap:10px;padding:8px 18px;background:rgba(255,255,255,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);flex-shrink:0;z-index:10;}
.tnav-left{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.tnav-chips{display:flex;align-items:center;gap:6px}
.tnav-chip{display:flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;background:var(--surface2);border:1px solid var(--border);color:var(--text3);font-size:11.5px;font-weight:600;white-space:nowrap;cursor:pointer;transition:all .15s;}
.tnav-chip svg{width:11px;height:11px;flex-shrink:0}
.tnav-chip:hover{border-color:var(--accent-bd);color:var(--accent)}
.tnav-chip.accent{background:var(--accent-bg);border-color:var(--accent-bd);color:var(--accent);}
.tnav-chip.green{background:var(--green-bg);border-color:var(--green-bd);color:var(--green);}
.tnav-chip.red{background:var(--red-bg);border-color:var(--red-bd);color:var(--red);}
.tnav-chip.chip-active{outline:2px solid currentColor;outline-offset:1px;}
.tnav-actions{display:flex;align-items:center;gap:6px;flex-shrink:0}
.nav-btn{display:flex;align-items:center;gap:5px;padding:6px 13px;border-radius:var(--r-sm);background:var(--surface2);border:1px solid var(--border);color:var(--text2);font-size:12px;font-weight:600;font-family:var(--font);cursor:pointer;transition:all .15s;white-space:nowrap;}
.nav-btn svg{width:13px;height:13px;flex-shrink:0}
.nav-btn:hover{background:var(--border);color:var(--text)}
.nav-btn:disabled{opacity:.5;cursor:default}

.toolbar{display:flex;align-items:center;gap:8px;padding:9px 18px;background:rgba(255,255,255,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);flex-shrink:0;flex-wrap:wrap;}
.tb-left{display:flex;align-items:center;gap:8px;flex:1;min-width:0;flex-wrap:wrap}
.tb-right{display:flex;align-items:center;gap:6px;flex-shrink:0}
.search-box{position:relative;min-width:160px;max-width:260px;flex:1}
.search-box svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text4);width:14px;height:14px;pointer-events:none;}
.search-box input{width:100%;padding:7px 10px 7px 33px;border:1.5px solid var(--border);border-radius:var(--r-sm);font-size:13px;font-family:var(--font);background:var(--surface2);color:var(--text);outline:none;transition:all .15s;}
.search-box input:focus{border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px rgba(24,71,212,.07)}

.view-toggle{display:flex;border:1.5px solid var(--border);border-radius:var(--r-sm);overflow:hidden;background:var(--surface2);}
.view-btn{display:flex;align-items:center;justify-content:center;padding:5px 9px;border:none;background:none;cursor:pointer;color:var(--text4);transition:all .15s;}
.view-btn:hover{color:var(--text2);background:var(--border2)}
.view-btn.active{background:var(--accent);color:#fff;}
.view-btn svg{width:14px;height:14px}

.fba-content{flex:1;overflow:hidden;min-height:0;display:flex;flex-direction:column;position:relative}
.grid-outer{flex:1;overflow-y:auto;overflow-x:hidden;padding:16px 18px}
.fba-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.fba-list{display:flex;flex-direction:column;gap:6px;}

.fba-list-item{background:var(--surface);border:1px solid var(--border);border-left:2px solid var(--accent);border-radius:var(--r);padding:11px 16px;cursor:pointer;transition:box-shadow .15s,border-color .15s,transform .12s;display:flex;align-items:center;gap:14px;animation:fadeUp .18s ease both;box-shadow:var(--sh-sm);}
.fba-list-item:hover{box-shadow:var(--sh);border-color:var(--accent-bd);transform:translateX(2px)}
.fba-list-item.approved{border-left-color:var(--green)}
.fba-list-item.rejected{border-left-color:var(--red)}
.fba-list-item.pending{border-left-color:#d1d9e6;border-left-width:1px}
.fba-list-name{font-size:13px;font-weight:700;color:var(--text);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.fba-list-asin{font-family:var(--mono);font-size:10px;color:var(--text4);width:100px;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.fba-list-date{font-size:11px;color:var(--text4);width:80px;flex-shrink:0}
.fba-list-stat{display:flex;flex-direction:column;gap:1px;width:60px;flex-shrink:0}
.fba-list-stat-lbl{font-size:8.5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--text4)}
.fba-list-stat-val{font-size:12px;font-weight:700;color:var(--text2)}
.fba-list-badges{display:flex;gap:5px;flex-shrink:0}

.fba-card{background:var(--surface);border:1px solid var(--border);border-left:2px solid var(--accent);border-radius:var(--r-lg);padding:14px 16px;cursor:pointer;transition:box-shadow .15s,border-color .15s,transform .12s;display:flex;flex-direction:column;gap:8px;animation:fadeUp .18s ease both;box-shadow:var(--sh-sm);}
@keyframes fadeUp{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
.fba-card:hover{box-shadow:var(--sh);border-color:var(--accent-bd);transform:translateY(-1px)}
.fba-card.approved{border-left-color:var(--green)}
.fba-card.rejected{border-left-color:var(--red)}
.fba-card.pending{border-left-color:#d1d9e6;border-left-width:1px}
.fba-card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.fba-card-name{font-size:13px;font-weight:700;color:var(--text);line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;flex:1}
.fba-status-badge{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:700;flex-shrink:0}
.fba-status-badge.approved{background:var(--green-bg);color:var(--green);border:1px solid var(--green-bd)}
.fba-status-badge.rejected{background:var(--red-bg);color:var(--red);border:1px solid var(--red-bd)}
.fba-status-badge.pending{background:var(--surface2);color:var(--text3);border:1px solid var(--border)}
.fba-card-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.fba-card-asin{font-family:var(--mono);font-size:10px;color:var(--text4)}
.fba-card-date{font-size:10px;color:var(--text4)}
.fba-card-sep{width:3px;height:3px;border-radius:50%;background:var(--text4);flex-shrink:0}
.fba-card-stats{display:flex;gap:14px}
.fba-stat{display:flex;flex-direction:column;gap:1px}
.fba-stat-label{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--text4)}
.fba-stat-val{font-size:12.5px;font-weight:700;color:var(--text2)}
.fba-card-flags{display:flex;gap:5px;flex-wrap:wrap;padding-top:6px;border-top:1px solid var(--border2)}
.fba-flag{display:inline-flex;align-items:center;gap:3px;padding:1px 6px;border-radius:20px;font-size:9.5px;font-weight:700}
.fba-flag.yes{background:var(--green-bg);color:var(--green);border:1px solid var(--green-bd)}
.fba-flag.no{background:var(--red-bg);color:var(--red);border:1px solid var(--red-bd)}
.fba-flag.na{background:var(--surface2);color:var(--text4);border:1px solid var(--border)}

.state-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;gap:12px;text-align:center;flex:1;}
.state-wrap .icon{width:52px;height:52px;border-radius:14px;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--text4);}
.state-wrap .icon svg{width:24px;height:24px}
.state-wrap p{font-size:14px;font-weight:700;color:var(--text2)}
.state-wrap span{font-size:12px;color:var(--text4)}
.spinner{display:inline-block;border:2.5px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .65s linear infinite;}
.spin-sm{width:16px;height:16px}
.spin-md{width:28px;height:28px;border-width:3px}
@keyframes spin{to{transform:rotate(360deg)}}

.pbar{position:fixed;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--accent),#4f80f7);z-index:50;transform:scaleX(0);transform-origin:left;transition:transform .3s ease;opacity:0;}
.pbar.active{opacity:1}

.drawer-overlay{position:fixed;inset:0;background:rgba(12,21,38,.35);z-index:1250;opacity:0;pointer-events:none;transition:opacity .25s;backdrop-filter:blur(2px);}
.drawer-overlay.open{opacity:1;pointer-events:all}
.drawer{position:fixed;top:0;right:0;width:560px;max-width:97vw;height:100vh;background:var(--surface);box-shadow:-12px 0 50px rgba(12,21,38,.15);z-index:1300;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .28s cubic-bezier(.4,0,.2,1);overflow:hidden;}
.drawer.open{transform:translateX(0)}
.drawer-hero{padding:16px 20px 14px;background:linear-gradient(140deg,var(--navy2) 0%,#0d1631 100%);position:relative;overflow:hidden;flex-shrink:0;}
.drawer-hero::before{content:'';position:absolute;top:-50px;right:-50px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.03);}
.drawer-hero::after{content:'';position:absolute;bottom:-25px;left:30px;width:100px;height:100px;border-radius:50%;background:rgba(24,71,212,.1);}
.drw-close{width:28px;height:28px;border:none;border-radius:7px;background:rgba(255,255,255,.1);cursor:pointer;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.6);transition:all .15s;z-index:2;flex-shrink:0;}
.drw-close:hover{background:rgba(255,255,255,.2);color:#fff}
.drw-topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;position:relative;z-index:2;}
.drw-topbar-left{display:flex;align-items:center;gap:6px;}
.drw-nav-counter{font-size:10px;font-weight:600;color:rgba(255,255,255,.45);white-space:nowrap;}
.drw-nav{display:flex;align-items:center;gap:5px;z-index:2;}
.drw-nav-btn{width:28px;height:28px;border:none;border-radius:7px;background:rgba(255,255,255,.1);cursor:pointer;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.6);transition:all .15s;}
.drw-nav-btn:hover{background:rgba(255,255,255,.2);color:#fff}
.drw-nav-btn:disabled{opacity:.3;cursor:default}
.drw-nav-btn svg{width:13px;height:13px}
.drw-stage-badge{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:20px;margin-bottom:6px;margin-top:2px;font-size:10px;font-weight:700;letter-spacing:.2px;position:relative;z-index:1;}
.drw-stage-badge.pending{background:rgba(24,71,212,.2);border:1px solid rgba(96,165,250,.3);color:#60a5fa;}
.drw-stage-badge.approved{background:rgba(12,122,66,.25);border:1px solid rgba(134,239,172,.35);color:#4ade80;}
.drw-stage-badge.rejected{background:rgba(185,28,28,.25);border:1px solid rgba(252,165,165,.3);color:#f87171;}
.drw-name{font-size:16px;font-weight:800;color:#fff;line-height:1.3;margin-bottom:3px;padding-right:48px;position:relative;z-index:1;}
.drw-meta-row{display:flex;align-items:center;gap:8px;margin-bottom:12px;position:relative;z-index:1;flex-wrap:wrap}
.drw-asin{font-family:var(--mono);font-size:10px;color:rgba(255,255,255,.38)}
.drw-date{font-size:10px;color:rgba(255,255,255,.45)}
.drw-meta-sep{width:3px;height:3px;border-radius:50%;background:rgba(255,255,255,.2);flex-shrink:0}
.drw-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;position:relative;z-index:1}
.drw-kpi{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);border-radius:9px;padding:8px 10px;}
.drw-kpi-lbl{font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:rgba(255,255,255,.38);margin-bottom:2px}
.drw-kpi-val{font-size:15px;font-weight:800;color:#fff}

.drawer-tabs{display:flex;border-bottom:1px solid var(--border);background:var(--surface);flex-shrink:0;overflow-x:auto;scrollbar-width:none;}
.drawer-tabs::-webkit-scrollbar{display:none}
.drawer-tab{padding:9px 14px;font-size:12px;font-weight:700;font-family:var(--font);color:var(--text3);border:none;background:none;cursor:pointer;border-bottom:2px solid transparent;transition:all .15s;white-space:nowrap;display:flex;align-items:center;gap:5px;flex-shrink:0;}
.drawer-tab:hover{color:var(--text2)}
.drawer-tab.active{color:var(--accent);border-bottom-color:var(--accent);background:var(--accent-bg);}

.drawer-body{flex:1;overflow-y:auto;padding:16px 20px;min-height:0}
.drawer-section{margin-bottom:20px}
.sec-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--text4);margin-bottom:10px;display:flex;align-items:center;gap:8px;}
.sec-label::after{content:'';flex:1;height:1px;background:var(--border2)}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.info-card{background:var(--surface2);border:1.5px solid var(--border2);border-radius:var(--r);padding:10px 13px;transition:border-color .15s;}
.info-card:focus-within{border-color:var(--accent-bd);background:#fff}
.info-card label{display:flex;align-items:center;gap:5px;font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--text4);margin-bottom:5px;}
.info-card label svg{width:11px;height:11px;flex-shrink:0}
.info-card .read-val{font-size:13px;font-weight:600;color:var(--text2);padding:3px 0}
.info-card select,.info-card input[type="number"]{width:100%;padding:6px 10px;border:1.5px solid var(--border);border-radius:7px;font-size:13px;font-weight:600;font-family:var(--font);background:var(--surface);color:var(--text2);outline:none;cursor:pointer;transition:all .15s;-webkit-appearance:none;appearance:none;}
.info-card select:focus,.info-card input[type="number"]:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(24,71,212,.07)}
.info-card .select-wrap{position:relative}
.info-card .select-wrap svg.sel-ico{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:11px;height:11px;color:var(--text4);pointer-events:none;}
.info-card select.val-yes{background:var(--green-bg);color:var(--green);border-color:var(--green-bd)}
.info-card select.val-no{background:var(--red-bg);color:var(--red);border-color:var(--red-bd)}
.info-card select.val-empty{background:var(--surface);color:var(--text3)}
.pound-wrap{position:relative}
.pound-wrap span{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:13px;font-weight:700;color:var(--text3);pointer-events:none;}
.pound-wrap input{padding-left:22px!important;}

.rec-field{overflow:hidden;max-height:0;opacity:0;transform:translateY(-6px);transition:max-height .38s cubic-bezier(.4,0,.2,1),opacity .3s ease,transform .3s ease,margin .3s ease;margin-bottom:0;}
.rec-field.visible{max-height:200px;opacity:1;transform:translateY(0);margin-bottom:8px;}
.rec-field-inner{background:var(--surface2);border:1.5px solid var(--border2);border-radius:var(--r);padding:10px 13px;transition:border-color .15s;}
.rec-field-inner:focus-within{border-color:var(--accent-bd);background:#fff}
.rec-field-inner label{display:flex;align-items:center;gap:5px;font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--text4);margin-bottom:5px;}
.rec-field-inner label svg{width:11px;height:11px;flex-shrink:0}
.rec-field-inner select,.rec-field-inner input[type="number"]{width:100%;padding:6px 10px;border:1.5px solid var(--border);border-radius:7px;font-size:13px;font-weight:600;font-family:var(--font);background:var(--surface);color:var(--text2);outline:none;transition:all .15s;-webkit-appearance:none;appearance:none;}
.rec-field-inner select:focus,.rec-field-inner input[type="number"]:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(24,71,212,.07)}
.rec-field-inner .select-wrap{position:relative}
.rec-field-inner .select-wrap svg.sel-ico{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:11px;height:11px;color:var(--text4);pointer-events:none;}
.rec-field-inner select.val-yes{background:var(--green-bg);color:var(--green);border-color:var(--green-bd)}
.rec-field-inner select.val-no{background:var(--red-bg);color:var(--red);border-color:var(--red-bd)}

.status-result{overflow:hidden;max-height:0;opacity:0;transform:translateY(-6px);transition:max-height .4s cubic-bezier(.4,0,.2,1),opacity .35s ease,transform .35s ease,margin .3s ease;margin-bottom:0;}
.status-result.visible{max-height:160px;opacity:1;transform:translateY(0);margin-bottom:8px;}
.status-result-inner{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:12px;border:1.5px solid;}
.status-result-inner.approved{background:var(--green-bg);border-color:var(--green-bd)}
.status-result-inner.rejected{background:var(--red-bg);border-color:var(--red-bd)}
.status-result-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.status-result-inner.approved .status-result-icon{background:#dcfce7}
.status-result-inner.rejected .status-result-icon{background:#fee2e2}
.status-result-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;margin-bottom:3px}
.status-result-inner.approved .status-result-label{color:var(--green)}
.status-result-inner.rejected .status-result-label{color:var(--red)}
.status-result-val{font-size:17px;font-weight:800;}
.status-result-inner.approved .status-result-val{color:var(--green)}
.status-result-inner.rejected .status-result-val{color:var(--red)}
.status-result-sub{font-size:11px;margin-top:2px}
.status-result-inner.approved .status-result-sub{color:#166534}
.status-result-inner.rejected .status-result-sub{color:#991b1b}

.drawer-foot{padding:11px 20px;border-top:1px solid var(--border);display:flex;gap:8px;align-items:center;justify-content:space-between;background:var(--surface2);flex-shrink:0;}
.drw-save-btn{display:flex;align-items:center;gap:5px;padding:6px 13px;border-radius:var(--r-sm);background:var(--accent);border:1.5px solid var(--accent);color:#fff;font-size:12px;font-weight:700;font-family:var(--font);cursor:pointer;transition:all .15s;}
.drw-save-btn:hover{background:var(--accent-l)}
.drw-save-btn svg{width:13px;height:13px}

.toasts{position:fixed;top:16px;right:18px;z-index:9999;display:flex;flex-direction:column;gap:7px;pointer-events:none;}
.toast{display:flex;align-items:center;gap:9px;padding:11px 15px;background:var(--navy2);color:#fff;border-radius:var(--r);font-size:13px;font-weight:600;box-shadow:var(--sh-lg);animation:toastIn .22s ease;max-width:320px;pointer-events:auto;border-left:3px solid rgba(255,255,255,.15);}
.toast.success{background:#14532d;border-left-color:var(--green)}
.toast.error{background:#7f1d1d;border-left-color:var(--red)}
.toast.info{background:#1e3a8a;border-left-color:var(--accent)}
@keyframes toastIn{from{opacity:0;transform:translateY(-8px) scale(.95)}to{opacity:1;transform:translateY(0) scale(1)}}

@media(max-width:768px){.fba-grid{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}.toolbar,.topnav{padding:8px 12px}.grid-outer{padding:12px}.fba-list-date,.fba-list-asin{display:none}}
@media(max-width:600px){.drawer{width:100%;max-width:100%}.drw-kpis{grid-template-columns:repeat(2,1fr)}.info-grid{grid-template-columns:1fr}.fba-grid{grid-template-columns:1fr}.tnav-chips{display:none}}
</style>

<div class="pbar" id="pbar"></div>
<div class="toasts" id="toasts"></div>

<div class="drawer-overlay" id="drawerOverlay" onclick="closeDrawer()"></div>
<div class="drawer" id="detailDrawer">
  <div id="drawerHero"></div>
  <div class="drawer-tabs" id="drawerTabs"></div>
  <div class="drawer-body" id="drawerBody"></div>
  <div class="drawer-foot" id="drawerFoot"></div>
</div>

<div class="fba-app">
  <nav class="topnav">
    <div class="tnav-left">
      <div class="tnav-chips">
        <div class="tnav-chip accent" id="chipTotal" onclick="filterByStatus('')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          <span>—</span>
        </div>
        <div class="tnav-chip green" id="chipApproved" onclick="filterByStatus('approved')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
          <span>—</span>
        </div>
        <div class="tnav-chip red" id="chipRejected" onclick="filterByStatus('rejected')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          <span>—</span>
        </div>
      </div>
    </div>
    <div class="tnav-actions">
      <button class="nav-btn" id="refreshBtn" onclick="refreshData()">
        <svg id="refreshIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
        Refresh
      </button>
    </div>
  </nav>

  <div class="toolbar">
    <div class="tb-left">
      <div class="search-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="searchInput" placeholder="Search product, ASIN, supplier…" oninput="renderView()">
      </div>
    </div>
    <div class="tb-right">
      <span id="filterCount" style="font-size:12px;color:var(--text4);font-weight:600"></span>
      <div class="view-toggle">
        <button class="view-btn active" id="viewGrid" onclick="setView('grid')" title="Grid view">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        </button>
        <button class="view-btn" id="viewList" onclick="setView('list')" title="List view">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
        </button>
      </div>
    </div>
  </div>

  <div class="fba-content" id="fbaContent">
    <div class="state-wrap">
      <span class="spinner spin-md"></span>
      <p>Loading FBA opportunities…</p>
    </div>
  </div>
</div>

<script>
(function(){
'use strict';

const sb = window.sb;

let allData = [];
let activeTab = 'overview';
let _openId = '';
let _viewMode = 'grid';
let _filteredIds = [];
let _statusFilter = '';
let _saveTimer = null;

/* ── PROGRESS BAR ── */
let _pv=0,_pt=null;
function pStart(){const b=document.getElementById('pbar');clearInterval(_pt);_pv=0.1;b.style.transform='scaleX(0.1)';b.classList.add('active');_pt=setInterval(()=>{_pv=Math.min(_pv+(1-_pv)*0.07,0.92);b.style.transform=`scaleX(${_pv})`;},250);}
function pDone(){clearInterval(_pt);const b=document.getElementById('pbar');b.style.transform='scaleX(1)';setTimeout(()=>{b.classList.remove('active');b.style.transform='scaleX(0)';},380);}

/* ── HELPERS ── */
function esc(s){return String(s!=null?s:'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function fmt(v){const n=parseFloat(v);return isNaN(n)?'—':'£'+n.toFixed(2);}
function fmtNum(v){const n=parseFloat(v);return isNaN(n)?'—':String(Math.round(n));}
function fmtDate(v){if(!v)return '—';try{const d=new Date(v);return isNaN(d)?String(v):d.toLocaleDateString('en-GB',{day:'numeric',month:'short'});}catch(e){return String(v);}}
function boolToLabel(v){return v===true?'Yes':v===false?'No':'—';}

/* ── STATUS CALCULATION ── */
function calculateStatus(row){
  const dg = row.dg;
  const profit = parseFloat(row.profit_dg);
  const standardPack = row.standard_pack_size;
  const underOneKg = row.under_1kg;
  const competition = parseInt(row.competition);
  const asinSales = parseFloat(row.asin_sales);

  if(dg===null||dg===undefined||isNaN(profit)||standardPack===null||standardPack===undefined||isNaN(competition)||isNaN(asinSales)){
    return 'pending';
  }

  let profitOk = false;
  if(dg===true && profit>=45) profitOk=true;
  if(dg===false && profit>=35) profitOk=true;

  const packOk = standardPack===true;
  const kgOk = underOneKg===true;

  let compOk = false;
  if((competition===1||competition===2)&&asinSales>=75) compOk=true;
  if(competition===0&&asinSales>=10) compOk=true;

  return (profitOk&&packOk&&kgOk&&compOk)?'approved':'rejected';
}

function getRowStatus(row){
  if(row.fba_status){
    const s = row.fba_status.toLowerCase();
    if(s==='approved') return 'approved';
    if(s==='rejected') return 'rejected';
  }
  return calculateStatus(row);
}

/* ── FETCH ── */
async function loadData(){
  pStart();
  try{
    const {data,error} = await sb
      .from('listing')
      .select('*')
      .eq('fba_opportunity','Yes')
      .order('date',{ascending:false});
    if(error) throw error;
    allData = data||[];
    renderView();
    updateChips();
  }catch(e){
    showEmpty('Failed to load','Check your Supabase connection');
    toast('Failed to load data','error');
    console.error(e);
  }finally{pDone();}
}

async function refreshData(){
  const ic=document.getElementById('refreshIcon');
  const btn=document.getElementById('refreshBtn');
  btn.disabled=true;ic.style.animation='spin .7s linear infinite';
  await loadData();
  ic.style.animation='';btn.disabled=false;
}

/* ── SAVE TO SUPABASE ── */
async function persistRow(opportunityId, changes){
  const ind=document.getElementById('save-indicator');
  if(ind){ind.textContent='Saving…';ind.style.color='var(--text4)';}
  try{
    const {error} = await sb.from('listing').update(changes).eq('opportunity_id',opportunityId);
    if(error) throw error;
    if(ind){ind.textContent='Saved ✓';ind.style.color='var(--green)';}
    setTimeout(()=>{if(ind)ind.textContent='';},2500);
    // Update local cache
    const idx = allData.findIndex(r=>r.opportunity_id===opportunityId);
    if(idx!==-1) Object.assign(allData[idx],changes);
  }catch(e){
    if(ind){ind.textContent='Save failed';ind.style.color='var(--red)';}
    toast('Save failed: '+e.message,'error');
  }
}

/* ── CHIPS ── */
function updateChips(){
  const total=allData.length;
  const approved=allData.filter(r=>getRowStatus(r)==='approved').length;
  const rejected=allData.filter(r=>getRowStatus(r)==='rejected').length;
  setChip('chipTotal',total+' FBA Products');
  setChip('chipApproved',approved+' Approved');
  setChip('chipRejected',rejected+' Rejected');
  updateChipActiveState();
}

function setChip(id,txt){
  const el=document.getElementById(id);if(!el)return;
  const svg=el.querySelector('svg');
  el.innerHTML=(svg?svg.outerHTML:'')+'<span>'+esc(txt)+'</span>';
}

function filterByStatus(status){
  _statusFilter=(_statusFilter===status&&status!=='')?'':status;
  updateChipActiveState();
  renderView();
}

function updateChipActiveState(){
  ['chipTotal','chipApproved','chipRejected'].forEach(id=>{
    document.getElementById(id)?.classList.remove('chip-active');
  });
  if(_statusFilter==='approved') document.getElementById('chipApproved')?.classList.add('chip-active');
  else if(_statusFilter==='rejected') document.getElementById('chipRejected')?.classList.add('chip-active');
}

/* ── FILTER ── */
function getFiltered(){
  const q=(document.getElementById('searchInput').value||'').toLowerCase().trim();
  return allData.filter(r=>{
    if(q){
      const s=(String(r.listing_name||'')+' '+String(r.asins||'')+' '+String(r.supplier_name||'')).toLowerCase();
      if(!s.includes(q)) return false;
    }
    if(_statusFilter && getRowStatus(r)!==_statusFilter) return false;
    return true;
  });
}

/* ── VIEW ── */
function setView(mode){
  _viewMode=mode;
  document.getElementById('viewGrid').classList.toggle('active',mode==='grid');
  document.getElementById('viewList').classList.toggle('active',mode==='list');
  renderView();
}

function renderView(){
  const data=getFiltered();
  _filteredIds=data.map(r=>r.opportunity_id);
  const area=document.getElementById('fbaContent');
  const fc=document.getElementById('filterCount');
  if(fc) fc.textContent=data.length!==allData.length?data.length+' of '+allData.length:'';
  if(!data.length&&!allData.length) return;
  if(!data.length){showEmpty('No results','Try adjusting your search or filters');return;}
  area.className='fba-content';area.innerHTML='';
  const outer=document.createElement('div');outer.className='grid-outer';

  if(_viewMode==='grid'){
    const grid=document.createElement('div');grid.className='fba-grid';
    data.forEach((r,i)=>{const card=buildCard(r);card.style.animationDelay=(i*0.02)+'s';grid.appendChild(card);});
    outer.appendChild(grid);
  } else {
    const list=document.createElement('div');list.className='fba-list';
    data.forEach((r,i)=>{const item=buildListItem(r);item.style.animationDelay=(i*0.015)+'s';list.appendChild(item);});
    outer.appendChild(list);
  }
  area.appendChild(outer);
}

function getStatusInfo(row){
  const s=getRowStatus(row);
  return {
    cls: s==='approved'?'approved':s==='rejected'?'rejected':'pending',
    label: s==='approved'?'Approved':s==='rejected'?'Rejected':'Pending'
  };
}

function buildCard(r){
  const card=document.createElement('div');
  const {cls,label}=getStatusInfo(r);
  card.className='fba-card '+cls;
  const dateStr=fmtDate(r.date);
  let html='';
  html+='<div class="fba-card-top">';
  html+='<div class="fba-card-name">'+esc(r.listing_name||'—')+'</div>';
  html+='<span class="fba-status-badge '+cls+'">'+esc(label)+'</span>';
  html+='</div>';
  html+='<div class="fba-card-meta">';
  if(r.asins) html+='<span class="fba-card-asin">'+esc(r.asins.split(',')[0].trim())+'</span>';
  if(r.asins&&dateStr!=='—') html+='<span class="fba-card-sep"></span>';
  if(dateStr!=='—') html+='<span class="fba-card-date">'+esc(dateStr)+'</span>';
  html+='</div>';
  html+='<div class="fba-card-stats">';
  html+='<div class="fba-stat"><div class="fba-stat-label">QTY</div><div class="fba-stat-val">'+esc(String(r.qty_purchased||'—'))+'</div></div>';
  html+='<div class="fba-stat"><div class="fba-stat-label">Sales</div><div class="fba-stat-val">'+esc(fmtNum(r.sales))+'</div></div>';
  html+='<div class="fba-stat"><div class="fba-stat-label">FBA Fees</div><div class="fba-stat-val">'+esc(fmt(r.fba_fees))+'</div></div>';
  html+='</div>';
  html+='<div class="fba-card-flags">';
  if(r.dg!==null&&r.dg!==undefined) html+='<span class="fba-flag '+(r.dg?'yes':'no')+'">DG: '+(r.dg?'Yes':'No')+'</span>';
  if(r.competition!==null&&r.competition!==undefined) html+='<span class="fba-flag na">Competition: '+esc(String(r.competition))+'</span>';
  html+='</div>';
  card.innerHTML=html;
  card._id=r.opportunity_id;
  card.addEventListener('click',()=>openDrawer(r.opportunity_id));
  return card;
}

function buildListItem(r){
  const item=document.createElement('div');
  const {cls,label}=getStatusInfo(r);
  item.className='fba-list-item '+cls;
  const dateStr=fmtDate(r.date);
  item.innerHTML=
    '<div class="fba-list-name">'+esc(r.listing_name||'—')+'</div>'
    +'<div class="fba-list-asin">'+esc(r.asins?r.asins.split(',')[0].trim():'—')+'</div>'
    +'<div class="fba-list-date">'+esc(dateStr)+'</div>'
    +'<div class="fba-list-stat"><div class="fba-list-stat-lbl">QTY</div><div class="fba-list-stat-val">'+esc(String(r.qty_purchased||'—'))+'</div></div>'
    +'<div class="fba-list-stat"><div class="fba-list-stat-lbl">Sales</div><div class="fba-list-stat-val">'+esc(fmtNum(r.sales))+'</div></div>'
    +'<div class="fba-list-badges">'
    +'<span class="fba-status-badge '+cls+'">'+esc(label)+'</span>'
    +(r.dg!==null&&r.dg!==undefined?'<span class="fba-flag '+(r.dg?'yes':'no')+'">DG: '+(r.dg?'Yes':'No')+'</span>':'')
    +'</div>';
  item._id=r.opportunity_id;
  item.addEventListener('click',()=>openDrawer(r.opportunity_id));
  return item;
}

function showEmpty(title,sub){
  document.getElementById('fbaContent').innerHTML='<div class="state-wrap"><div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></div><p>'+esc(title)+'</p><span>'+esc(sub)+'</span></div>';
}

/* ── DRAWER ── */
function openDrawer(id){
  const row=allData.find(r=>r.opportunity_id===id);
  if(!row) return;
  _openId=id;activeTab='overview';
  renderDrawer(row);
  document.getElementById('drawerOverlay').classList.add('open');
  document.getElementById('detailDrawer').classList.add('open');
}

function closeDrawer(){
  document.getElementById('drawerOverlay').classList.remove('open');
  document.getElementById('detailDrawer').classList.remove('open');
  _openId='';
  renderView();
}

function switchTab(t){
  activeTab=t;
  const row=allData.find(r=>r.opportunity_id===_openId);
  if(row) renderDrawer(row);
}

function navDrawer(dir){
  const idx=_filteredIds.indexOf(_openId);
  if(idx===-1) return;
  const next=idx+dir;
  if(next<0||next>=_filteredIds.length) return;
  openDrawer(_filteredIds[next]);
}

function renderDrawer(row){
  const id=row.opportunity_id;
  const status=getRowStatus(row);
  const idx=_filteredIds.indexOf(id);
  const total=_filteredIds.length;
  const badgeCls=status==='approved'?'approved':status==='rejected'?'rejected':'pending';
  const badgeLabel=status==='approved'?'Approved':status==='rejected'?'Rejected':'FBA Opportunity';
  const badgeIcon=status==='approved'
    ?'<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>'
    :status==='rejected'
    ?'<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>'
    :'<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>';

  document.getElementById('drawerHero').innerHTML=
    '<div class="drawer-hero">'
    +'<div class="drw-topbar">'
    +'<div class="drw-topbar-left">'
    +'<div class="drw-nav">'
    +'<button class="drw-nav-btn" onclick="navDrawer(-1)"'+(idx<=0?' disabled':'')+' title="Previous"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></button>'
    +'<button class="drw-nav-btn" onclick="navDrawer(1)"'+(idx>=total-1?' disabled':'')+' title="Next"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></button>'
    +'</div>'
    +(total>1?'<span class="drw-nav-counter">'+(idx+1)+' / '+total+'</span>':'')
    +'</div>'
    +'<button class="drw-close" onclick="closeDrawer()"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>'
    +'</div>'
    +'<div class="drw-stage-badge '+badgeCls+'">'+badgeIcon+esc(badgeLabel)+'</div>'
    +'<div class="drw-name">'+esc(row.listing_name||'—')+'</div>'
    +'<div class="drw-meta-row">'
    +(row.asins?'<span class="drw-asin">'+esc(row.asins.split(',')[0].trim())+'</span>':'')
    +(row.asins&&fmtDate(row.date)!=='—'?'<span class="drw-meta-sep"></span>':'')
    +(fmtDate(row.date)!=='—'?'<span class="drw-date">'+esc(fmtDate(row.date))+'</span>':'')
    +'</div>'
    +'<div class="drw-kpis">'
    +drwKpi('QTY',String(row.qty_purchased||'—'))
    +drwKpi('Unit Cost',fmt(row.unit_cost))
    +drwKpi('FBA Fees',fmt(row.fba_fees))
    +'</div>'
    +'</div>';

  document.getElementById('drawerTabs').innerHTML=
    tabBtn('overview','<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>','Overview')
    +tabBtn('fba','<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>','FBA Form');

  let body='';

  if(activeTab==='overview'){
    body+=sec('Listing Info')
      +'<div class="info-grid">'
      +readCard('Supplier',row.supplier_name||'—','<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 11c1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3 1.34 3 3 3z"/><path d="M8 11c1.66 0 3-1.34 3-3S9.66 5 8 5 5 6.34 5 8s1.34 3 3 3z"/><path d="M2 20v-2a4 4 0 0 1 4-4"/><path d="M22 20v-2a4 4 0 0 0-4-4"/></svg>')
      +readCard('Code / EAN',row.code||'—','<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>')
      +readCard('ASINs',row.asins||'—','<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>')
      +readCard('Arrived',boolToLabel(row.arrived),'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>')
      +'</div></div>'
      +sec('Financials')
      +'<div class="info-grid">'
      +readCard('QTY Purchased',String(row.qty_purchased||'—'),'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/></svg>')
      +readCard('Sales',fmtNum(row.sales),'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg>')
      +readCard('Unit Cost',fmt(row.unit_cost),'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>')
      +readCard('ASIN Cost',fmt(row.asin_cost),'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>')
      +'</div></div>';
  }

  if(activeTab==='fba'){
    body+=sec('FBA Assessment')
      +'<div class="info-grid">'
      +inputBoolCard('fba-profitable','Profitable',row.profitable,'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg>','Is profit £1 or more?')
      +inputAmountCard('fba-fees','FBA Fees (£)',row.fba_fees,'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>')
      +inputBoolCard('fba-dg','DG (Dangerous Goods)',row.dg,'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>')
      +inputWholeCard('fba-competition','Competition',row.competition,'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>')
      +'</div></div>'
      +sec('Recommendations')
      +'<div id="recFields">'
      // Parcel Weight
      +'<div class="rec-field visible" id="rec-parcel-weight"><div class="rec-field-inner">'
      +'<label><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>Parcel Weight (kg)</label>'
      +'<input type="number" id="rec-parcel-weight-val" step="0.01" min="0" placeholder="e.g. 0.5"'+(row.parcel_weight!=null?' value="'+esc(String(row.parcel_weight))+'"':'')+' oninput="onRecChange()" style="padding-left:10px!important">'
      +'</div></div>'
      // Standard Pack Size
      +'<div class="rec-field" id="rec-standard-pack"><div class="rec-field-inner">'
      +'<label><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>Standard Pack Size</label>'
      +'<div class="select-wrap"><select id="rec-standard-pack-val" onchange="updateSelectColour(this);onRecChange();" class="'+(row.standard_pack_size===true?'val-yes':row.standard_pack_size===false?'val-no':'val-empty')+'">'
      +'<option value="">Select…</option>'
      +'<option value="Yes"'+(row.standard_pack_size===true?' selected':'')+'>Yes</option>'
      +'<option value="No"'+(row.standard_pack_size===false?' selected':'')+'>No</option>'
      +'</select><svg class="sel-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg></div>'
      +'</div></div>'
      // ASIN Sales
      +'<div class="rec-field" id="rec-asin-sales"><div class="rec-field-inner">'
      +'<label><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg>ASIN Sales</label>'
      +'<input type="number" id="rec-asin-sales-val" step="1" min="0" placeholder="e.g. 120"'+(row.asin_sales!=null?' value="'+esc(String(row.asin_sales))+'"':'')+' oninput="onRecChange()">'
      +'</div></div>'
      // Profit (DG)
      +'<div class="rec-field" id="rec-profit-dg"><div class="rec-field-inner">'
      +'<label><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>Profit ROI (%)</label>'
      +'<input type="number" id="rec-profit-dg-val" step="1" min="0" placeholder="e.g. 38"'+(row.profit_dg!=null?' value="'+esc(String(row.profit_dg))+'"':'')+' oninput="onRecChange()" style="padding-left:10px!important">'
      +'</div></div>'
      // Status result
      +'<div class="status-result" id="rec-status-result"><div class="status-result-inner" id="rec-status-inner">'
      +'<div class="status-result-icon" id="rec-status-icon"></div>'
      +'<div><div class="status-result-label" id="rec-status-label">Status</div>'
      +'<div class="status-result-val" id="rec-status-val"></div>'
      +'<div class="status-result-sub" id="rec-status-sub"></div></div>'
      +'</div></div>'
      +'</div></div>';

    document.getElementById('drawerBody').innerHTML=body;
    setTimeout(()=>evaluateRec(row),80);
    renderFooter(id);
    return;
  }

  document.getElementById('drawerBody').innerHTML=body;
  renderFooter(id);
}

function renderFooter(id){
  document.getElementById('drawerFoot').innerHTML=
    '<span id="save-indicator" style="font-size:11px;font-weight:600;transition:color .2s;flex:1"></span>'
    +'<button class="drw-save-btn" onclick="saveFbaFields()">'
    +'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>'
    +'Save'
    +'</button>';
}

/* ── RECOMMENDATIONS LOGIC ── */
function show(id){document.getElementById(id)?.classList.add('visible');}
function hide(id){document.getElementById(id)?.classList.remove('visible');}

function updateSelectColour(el){
  el.classList.remove('val-yes','val-no','val-empty');
  if(el.value==='Yes') el.classList.add('val-yes');
  else if(el.value==='No') el.classList.add('val-no');
  else el.classList.add('val-empty');
}

function getRecValues(){
  return {
    parcelWeight: parseFloat(document.getElementById('rec-parcel-weight-val')?.value)||null,
    standardPack: document.getElementById('rec-standard-pack-val')?.value||'',
    asinSales: parseFloat(document.getElementById('rec-asin-sales-val')?.value)||null,
    profitDg: parseFloat(document.getElementById('rec-profit-dg-val')?.value)||null
  };
}

function onRecChange(){
  ['rec-standard-pack-val'].forEach(id=>{
    const el=document.getElementById(id);if(el) updateSelectColour(el);
  });
  // Update FBA Fees KPI in hero
  const feesEl=document.getElementById('fba-fees');
  if(feesEl){
    document.querySelectorAll('.drw-kpi').forEach(kpi=>{
      const lbl=kpi.querySelector('.drw-kpi-lbl');
      if(lbl&&lbl.textContent.trim().toUpperCase()==='FBA FEES'){
        const val=kpi.querySelector('.drw-kpi-val');
        if(val){const n=parseFloat(feesEl.value);val.textContent=isNaN(n)?'—':'£'+n.toFixed(2);}
      }
    });
  }
  const row=allData.find(r=>r.opportunity_id===_openId);
  if(row) evaluateRec(row);
}

function evaluateRec(row){
  const dgEl=document.getElementById('fba-dg');
  const dgVal=dgEl?dgEl.value:(row.dg===true?'Yes':row.dg===false?'No':'');
  const compEl=document.getElementById('fba-competition');
  const comp=compEl&&compEl.value!==''?parseInt(compEl.value):(row.competition!=null?parseInt(row.competition):NaN);
  const v=getRecValues();

  show('rec-parcel-weight');

  if(v.parcelWeight===null||isNaN(v.parcelWeight)){
    hide('rec-standard-pack');hide('rec-asin-sales');hide('rec-profit-dg');hide('rec-status-result');return;
  }
  show('rec-standard-pack');

  const underOneKg=v.parcelWeight<=1;
  if(!underOneKg){hide('rec-asin-sales');hide('rec-profit-dg');showResult('rejected');return;}

  if(!v.standardPack){hide('rec-asin-sales');hide('rec-profit-dg');hide('rec-status-result');return;}
  if(v.standardPack==='No'){hide('rec-asin-sales');hide('rec-profit-dg');showResult('rejected');return;}

  show('rec-asin-sales');
  if(v.asinSales===null){hide('rec-profit-dg');hide('rec-status-result');return;}

  let compOk=false;
  if(!isNaN(comp)){
    if((comp===1||comp===2)&&v.asinSales>=75) compOk=true;
    if(comp===0&&v.asinSales>=10) compOk=true;
  }
  if(!compOk){hide('rec-profit-dg');showResult('rejected');return;}

  show('rec-profit-dg');
  if(v.profitDg===null){hide('rec-status-result');return;}

  const dg=String(dgVal||'').trim().toLowerCase();
  let profitOk=false;
  if(dg==='yes'&&v.profitDg>=45) profitOk=true;
  if(dg==='no'&&v.profitDg>=35) profitOk=true;

  showResult(profitOk?'approved':'rejected');
}

function showResult(status){
  const wrap=document.getElementById('rec-status-result');
  const inner=document.getElementById('rec-status-inner');
  const icon=document.getElementById('rec-status-icon');
  const val=document.getElementById('rec-status-val');
  const sub=document.getElementById('rec-status-sub');
  if(!wrap) return;
  inner.className='status-result-inner '+(status==='approved'?'approved':'rejected');
  icon.innerHTML=status==='approved'
    ?'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0c7a42" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>'
    :'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#b91c1c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';
  val.textContent=status==='approved'?'✓ Approved':'✗ Rejected';
  sub.textContent=status==='approved'?'All conditions met — ready for FBA.':'Does not meet FBA criteria.';
  wrap.classList.add('visible');

  // Update local data immediately
  const row=allData.find(r=>r.opportunity_id===_openId);
  if(row){
    row.fba_status=status==='approved'?'Approved':'Rejected';
    updateChips();
  }
}

function saveFbaFields(){
  const row=allData.find(r=>r.opportunity_id===_openId);
  if(!row) return;

  const dgEl=document.getElementById('fba-dg');
  const profitableEl=document.getElementById('fba-profitable');
  const feesEl=document.getElementById('fba-fees');
  const compEl=document.getElementById('fba-competition');
  const pwEl=document.getElementById('rec-parcel-weight-val');
  const spEl=document.getElementById('rec-standard-pack-val');
  const asEl=document.getElementById('rec-asin-sales-val');
  const pdEl=document.getElementById('rec-profit-dg-val');

  const changes = {};

  if(dgEl&&dgEl.value!=='') changes.dg = dgEl.value==='Yes';
  if(profitableEl&&profitableEl.value!=='') changes.profitable = profitableEl.value==='Yes';
  if(feesEl&&feesEl.value!=='') changes.fba_fees = parseFloat(feesEl.value)||null;
  if(compEl&&compEl.value!=='') changes.competition = parseInt(compEl.value);
  if(pwEl&&pwEl.value!=='') {
    const pw=parseFloat(pwEl.value);
    changes.parcel_weight = pw;
    changes.under_1kg = pw<=1;
  }
  if(spEl&&spEl.value!=='') changes.standard_pack_size = spEl.value==='Yes';
  if(asEl&&asEl.value!=='') changes.asin_sales = parseFloat(asEl.value)||null;
  if(pdEl&&pdEl.value!=='') changes.profit_dg = parseFloat(pdEl.value)||null;

  // Get current calculated status
  const statusResult=document.getElementById('rec-status-inner');
  if(statusResult){
    if(statusResult.classList.contains('approved')) changes.fba_status='Approved';
    else if(statusResult.classList.contains('rejected')) changes.fba_status='Rejected';
  }

  if(Object.keys(changes).length===0){
    toast('No changes to save','info');
    return;
  }

  clearTimeout(_saveTimer);
  _saveTimer=setTimeout(()=>persistRow(_openId,changes),300);
}

/* ── DRAWER HELPERS ── */
function drwKpi(lbl,val){return '<div class="drw-kpi"><div class="drw-kpi-lbl">'+esc(lbl)+'</div><div class="drw-kpi-val">'+esc(String(val))+'</div></div>';}
function tabBtn(t,icon,label){return '<button class="drawer-tab'+(activeTab===t?' active':'')+'" onclick="switchTab(\''+t+'\')">'+(icon||'')+esc(label)+'</button>';}
function sec(label){return '<div class="drawer-section"><div class="sec-label">'+esc(label)+'</div>';}
function readCard(label,value,iconSvg){return '<div class="info-card"><label>'+(iconSvg||'')+esc(label)+'</label><div class="read-val">'+esc(String(value))+'</div></div>';}

function inputBoolCard(fieldId,label,currentVal,iconSvg,hint){
  const isTrue=currentVal===true;
  const isFalse=currentVal===false;
  const cls=currentVal===true?'val-yes':currentVal===false?'val-no':'val-empty';
  return '<div class="info-card"><label>'+(iconSvg||'')+esc(label)
    +(hint?'<span style="display:inline-flex;align-items:center;gap:4px;margin-left:6px;padding:2px 7px;background:#fefce8;border:1px solid #fde68a;border-radius:20px;font-size:10px;font-weight:600;color:#92400e;text-transform:none;letter-spacing:0">'+esc(hint)+'</span>':'')
    +'</label>'
    +'<div class="select-wrap"><select id="'+fieldId+'" class="'+cls+'" onchange="this.className=\'val-\'+(this.value===\'Yes\'?\'yes\':this.value===\'No\'?\'no\':\'empty\');onRecChange();">'
    +'<option value="">Select…</option>'
    +'<option value="Yes"'+(isTrue?' selected':'')+'>Yes</option>'
    +'<option value="No"'+(isFalse?' selected':'')+'>No</option>'
    +'</select><svg class="sel-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg></div>'
    +'</div>';
}

function inputAmountCard(fieldId,label,currentVal,iconSvg){
  const cur=parseFloat(currentVal);
  return '<div class="info-card"><label>'+(iconSvg||'')+esc(label)+'</label>'
    +'<div class="pound-wrap"><span>£</span>'
    +'<input type="number" id="'+fieldId+'" step="0.01" min="0" placeholder="0.00"'+(isNaN(cur)?'':' value="'+cur.toFixed(2)+'"')+' oninput="onRecChange()">'
    +'</div></div>';
}

function inputWholeCard(fieldId,label,currentVal,iconSvg){
  const cur=parseInt(currentVal);
  return '<div class="info-card"><label>'+(iconSvg||'')+esc(label)+'</label>'
    +'<input type="number" id="'+fieldId+'" step="1" min="0" placeholder="e.g. 2"'+(isNaN(cur)?'':' value="'+cur+'"')+' oninput="onRecChange()" style="margin-top:2px;width:100%">'
    +'</div>';
}

/* ── TOAST ── */
function toast(msg,type){
  const c=document.getElementById('toasts');
  const t=document.createElement('div');t.className='toast '+(type||'');
  const icons={success:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>',error:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>',info:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>'};
  t.innerHTML=(icons[type]||'')+esc(msg);c.appendChild(t);
  setTimeout(()=>{if(t.parentNode)t.remove();},3200);
}

/* ── KEYBOARD ── */
document.addEventListener('keydown',e=>{
  if(document.getElementById('detailDrawer').classList.contains('open')){
    if(e.key==='Escape') closeDrawer();
    if(e.key==='ArrowLeft') navDrawer(-1);
    if(e.key==='ArrowRight') navDrawer(1);
  }
});

/* ── GLOBALS ── */
window.closeDrawer=closeDrawer;
window.switchTab=switchTab;
window.refreshData=refreshData;
window.renderView=renderView;
window.setView=setView;
window.navDrawer=navDrawer;
window.onRecChange=onRecChange;
window.filterByStatus=filterByStatus;
window.saveFbaFields=saveFbaFields;
window.updateSelectColour=updateSelectColour;

loadData();
})();
</script>
