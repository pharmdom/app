<style>
.pwb-wrap{padding:16px;}
.pwb-search-row{position:sticky;top:0;z-index:5;background:var(--bg);padding-bottom:12px;display:flex;gap:8px;}
.pwb-search{position:relative;flex:1;}
.pwb-search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--text-4);pointer-events:none;}
.pwb-search input{width:100%;padding:9px 10px 9px 33px;border:1.5px solid var(--border);border-radius:10px;font-size:13px;font-family:inherit;background:var(--white);color:var(--text-primary);outline:none;transition:border-color .15s;}
.pwb-search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
.pwb-add-btn{display:flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:10px;background:var(--accent);border:none;color:#fff;cursor:pointer;flex-shrink:0;transition:background .15s;}
.pwb-add-btn:hover{background:var(--accent-h);}
.pwb-add-btn svg{width:16px;height:16px;}
.pwb-group-label{font-size:10.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--text-4);margin:14px 4px 8px;}
.pwb-list{display:flex;flex-direction:column;gap:8px;}
.pwb-card{background:var(--white);border:1px solid var(--border);border-radius:13px;padding:12px 13px;transition:border-color .15s,box-shadow .15s;}
.pwb-card:hover{border-color:rgba(0,0,0,.12);box-shadow:0 2px 8px rgba(0,0,0,.05);}
.pwb-card-top{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none;}
.pwb-avatar{width:36px;height:36px;border-radius:10px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;letter-spacing:-.2px;}
.pwb-card-info{flex:1;min-width:0;}
.pwb-card-name{font-size:13.5px;font-weight:700;color:var(--text-primary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.pwb-card-meta{font-size:11.5px;color:var(--text-4);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.pwb-chevron{width:14px;height:14px;color:var(--text-4);flex-shrink:0;transition:transform .2s;}
.pwb-chevron.open{transform:rotate(90deg);}
.pwb-card-body{overflow:hidden;max-height:0;transition:max-height .25s cubic-bezier(.4,0,.2,1);}
.pwb-card-body.open{max-height:420px;}
.pwb-field-row{display:flex;align-items:center;gap:6px;margin-top:10px;padding-top:10px;border-top:1px solid var(--border);}
.pwb-field-row:first-of-type{border-top:1px solid var(--border);}
.pwb-field-col{flex:1;min-width:0;}
.pwb-field-label{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text-4);margin-bottom:3px;}
.pwb-field-val{font-size:12.5px;color:var(--text-2);font-family:'SF Mono','JetBrains Mono',monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.pwb-icon-btn{width:28px;height:28px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text-3);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s;}
.pwb-icon-btn:hover{background:var(--white);color:var(--text-primary);border-color:rgba(0,0,0,.15);}
.pwb-icon-btn svg{width:13px;height:13px;}
.pwb-edit-grid{display:flex;flex-direction:column;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--border);}
.pwb-inp{width:100%;padding:7px 9px;border:1.5px solid var(--border);border-radius:8px;font-size:12.5px;font-family:inherit;background:var(--bg);color:var(--text-primary);outline:none;transition:border-color .15s;}
.pwb-inp:focus{border-color:var(--accent);background:var(--white);}
.pwb-inp-label{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text-4);margin-bottom:3px;display:block;}
.pwb-edit-actions{display:flex;gap:8px;margin-top:4px;}
.pwb-btn{flex:1;padding:8px;border-radius:9px;border:none;font-size:12.5px;font-weight:600;font-family:inherit;cursor:pointer;transition:all .15s;}
.pwb-btn-primary{background:var(--accent);color:#fff;}
.pwb-btn-primary:hover{background:var(--accent-h);}
.pwb-btn-ghost{background:var(--bg);color:var(--text-3);border:1px solid var(--border);}
.pwb-btn-ghost:hover{background:var(--white);color:var(--text-primary);}
.pwb-btn-danger{background:#fef2f2;color:#dc2626;border:1px solid #fecaca;flex:none;width:38px;}
.pwb-btn-danger:hover{background:#fee2e2;}
.pwb-updated{font-size:10.5px;color:var(--text-4);margin-top:8px;}
.pwb-empty{text-align:center;padding:50px 20px;color:var(--text-4);}
.pwb-empty svg{width:36px;height:36px;margin-bottom:10px;opacity:.5;}
.pwb-empty p{font-size:13px;font-weight:600;color:var(--text-3);margin-bottom:3px;}
.pwb-empty span{font-size:11.5px;}
.pwb-toast-stack{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column-reverse;gap:8px;pointer-events:none;}
.pwb-toast{background:#111827;color:#fff;padding:9px 16px;border-radius:10px;font-size:12.5px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.2);opacity:0;transform:translateY(8px);transition:all .25s cubic-bezier(.34,1.56,.64,1);}
.pwb-toast.show{opacity:1;transform:translateY(0);}
</style>

<div class="pwb-wrap">
  <div class="pwb-search-row">
    <div class="pwb-search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="pwbSearch" placeholder="Search platforms…" oninput="window.pwbRender()">
    </div>
    <button class="pwb-add-btn" onclick="window.pwbStartAdd()" title="Add platform">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </button>
  </div>
  <div id="pwbAddCard"></div>
  <div id="pwbList" class="pwb-list"></div>
</div>
<div class="pwb-toast-stack" id="pwbToastStack"></div>

<script>
(function(){
  'use strict';
  const sb = window.sb;
  let _pwbData = [];
  let _openId = null;
  let _editId = null;
  let _revealTimers = {};

  function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function initials(s){ const w=(s||'').trim().split(/\s+/).filter(Boolean); if(!w.length)return '?'; return (w[0][0]+(w[1]?w[1][0]:'')).toUpperCase(); }
  function colourFor(s){
    const palette = [
      {bg:'#eef2ff',fg:'#4338ca'},{bg:'#ecfdf5',fg:'#047857'},{bg:'#fff7ed',fg:'#c2410c'},
      {bg:'#fef2f2',fg:'#b91c1c'},{bg:'#f0f9ff',fg:'#0369a1'},{bg:'#fdf4ff',fg:'#a21caf'},
      {bg:'#fefce8',fg:'#a16207'},{bg:'#f0fdfa',fg:'#0f766e'}
    ];
    let h=0; for(let i=0;i<(s||'').length;i++) h=(h*31+s.charCodeAt(i))>>>0;
    return palette[h%palette.length];
  }
  function timeAgo(iso){
    if(!iso) return '';
    const diff = Date.now()-new Date(iso).getTime();
    const mins = Math.floor(diff/60000);
    if(mins<1) return 'just now';
    if(mins<60) return mins+'m ago';
    const hrs = Math.floor(mins/60);
    if(hrs<24) return hrs+'h ago';
    const days = Math.floor(hrs/24);
    if(days<30) return days+'d ago';
    return new Date(iso).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
  }
  function toast(msg){
    const stack = document.getElementById('pwbToastStack');
    if(!stack) return;
    const el = document.createElement('div');
    el.className='pwb-toast'; el.textContent=msg;
    stack.appendChild(el);
    requestAnimationFrame(()=>el.classList.add('show'));
    setTimeout(()=>{ el.classList.remove('show'); setTimeout(()=>el.remove(),250); },1800);
  }
  function copyText(val,label){
    if(!val){ toast('Nothing to copy'); return; }
    navigator.clipboard.writeText(val).then(()=>toast(label+' copied')).catch(()=>toast('Copy failed'));
  }

  async function pwbInit(){
    const list = document.getElementById('pwbList');
    list.innerHTML = '<div style="text-align:center;padding:40px;color:var(--text-4);font-size:12.5px">Loading…</div>';
    try{
      const { data, error } = await sb.from('password_book').select('*').order('platform_name');
      if(error) throw error;
      _pwbData = data || [];
    }catch(e){
      list.innerHTML = '<div class="pwb-empty"><p>Failed to load</p><span>'+esc(e.message||'')+'</span></div>';
      return;
    }
    window.pwbRender();
  }

  function getFiltered(){
    const q = (document.getElementById('pwbSearch').value||'').toLowerCase().trim();
    if(!q) return _pwbData;
    return _pwbData.filter(r=>
      (r.platform_name||'').toLowerCase().includes(q) ||
      (r.username||'').toLowerCase().includes(q) 
    );
  }

  window.pwbRender = function(){
    const list = document.getElementById('pwbList');
    const data = getFiltered();
    if(!data.length){
      list.innerHTML = `<div class="pwb-empty">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <p>${_pwbData.length ? 'No matches' : 'No platforms saved yet'}</p>
        <span>${_pwbData.length ? 'Try a different search' : 'Click + to add your first login'}</span>
      </div>`;
      return;
    }
    list.innerHTML = data.map(r=>{
      const id = r.id;
      const col = colourFor(r.platform_name||'');
      const isOpen = _openId===id;
      const isEditing = _editId===id;
      let body;
      if(isEditing){
        body = `
          <div class="pwb-edit-grid">
            <div><span class="pwb-inp-label">Platform Name</span><input class="pwb-inp" id="pwbEditName_${id}" value="${esc(r.platform_name)}"></div>
            <div><span class="pwb-inp-label">Username / Email</span><input class="pwb-inp" id="pwbEditUser_${id}" value="${esc(r.username||'')}"></div>
            <div><span class="pwb-inp-label">Password</span><input class="pwb-inp" id="pwbEditPass_${id}" value="${esc(r.password||'')}"></div>
            <div><span class="pwb-inp-label">Login URL</span><input class="pwb-inp" id="pwbEditUrl_${id}" value="${esc(r.url||'')}" placeholder="https://…"></div>
            <div><span class="pwb-inp-label">Notes</span><input class="pwb-inp" id="pwbEditNotes_${id}" value="${esc(r.notes||'')}"></div>
            <div class="pwb-edit-actions">
              <button class="pwb-btn pwb-btn-danger" onclick="window.pwbDelete(${id})" title="Delete">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" width="13" height="13" style="margin:0 auto"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
              </button>
              <button class="pwb-btn pwb-btn-ghost" onclick="window.pwbCancelEdit()">Cancel</button>
              <button class="pwb-btn pwb-btn-primary" onclick="window.pwbSave(${id})">Save</button>
            </div>
          </div>`;
      } else {
        const revealed = !!_revealTimers[id];
        body = `
          <div class="pwb-field-row">
            <div class="pwb-field-col">
              <div class="pwb-field-label">Username / Email</div>
              <div class="pwb-field-val">${esc(r.username||'—')}</div>
            </div>
            <button class="pwb-icon-btn" onclick="event.stopPropagation();window.pwbCopy(${id},'username')" title="Copy">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
            </button>
          </div>
          <div class="pwb-field-row">
            <div class="pwb-field-col">
              <div class="pwb-field-label">Password</div>
              <div class="pwb-field-val">${revealed ? esc(r.password||'—') : '••••••••'}</div>
            </div>
            <button class="pwb-icon-btn" onclick="event.stopPropagation();window.pwbToggleReveal(${id})" title="${revealed?'Hide':'Show'}">
              ${revealed
                ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/></svg>'
                : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>'}
            </button>
            <button class="pwb-icon-btn" onclick="event.stopPropagation();window.pwbCopy(${id},'password')" title="Copy">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
            </button>
          </div>
          ${r.url ? `<div class="pwb-field-row"><div class="pwb-field-col"><div class="pwb-field-label">Login URL</div><div class="pwb-field-val"><a href="${esc(r.url)}" target="_blank" rel="noopener" style="color:var(--accent);text-decoration:none">${esc(r.url)}</a></div></div></div>` : ''}
          ${r.notes ? `<div class="pwb-field-row"><div class="pwb-field-col"><div class="pwb-field-label">Notes</div><div class="pwb-field-val" style="white-space:normal;font-family:inherit">${esc(r.notes)}</div></div></div>` : ''}
          <div style="display:flex;align-items:center;justify-content:space-between">
            <div class="pwb-updated">${r.updated_by ? 'Updated by '+esc(r.updated_by)+' · ' : ''}${timeAgo(r.updated_at)}</div>
            <button class="pwb-icon-btn" onclick="event.stopPropagation();window.pwbStartEdit(${id})" title="Edit">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4Z"/></svg>
            </button>
          </div>`;
      }
      return `<div class="pwb-card">
        <div class="pwb-card-top" onclick="window.pwbToggleOpen(${id})">
          <div class="pwb-avatar" style="background:${col.bg};color:${col.fg}">${esc(initials(r.platform_name))}</div>
          <div class="pwb-card-info">
            <div class="pwb-card-name">${esc(r.platform_name||'Untitled')}</div>
            <div class="pwb-card-meta">${esc(r.username||'')}${r.updated_at ? ' · updated '+timeAgo(r.updated_at) : ''}</div>
          </div>
          <svg class="pwb-chevron${isOpen?' open':''}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
        </div>
        <div class="pwb-card-body${isOpen?' open':''}">${body}</div>
      </div>`;
    }).join('');
  };

  window.pwbToggleOpen = function(id){
    if(_editId===id) return;
    _openId = (_openId===id) ? null : id;
    window.pwbRender();
  };
  window.pwbToggleReveal = function(id){
    if(_revealTimers[id]){
      clearTimeout(_revealTimers[id]);
      delete _revealTimers[id];
    } else {
      _revealTimers[id] = setTimeout(()=>{ delete _revealTimers[id]; window.pwbRender(); }, 10000);
    }
    window.pwbRender();
  };
  window.pwbCopy = function(id,field){
    const row = _pwbData.find(r=>r.id===id);
    if(!row) return;
    copyText(field==='username'?row.username:row.password, field==='username'?'Username':'Password');
  };
  window.pwbStartEdit = function(id){
    _editId = id; _openId = id;
    window.pwbRender();
  };
  window.pwbCancelEdit = function(){
    _editId = null;
    window.pwbRender();
  };
  window.pwbSave = async function(id){
    const payload = {
      platform_name: document.getElementById('pwbEditName_'+id).value.trim(),
      username: document.getElementById('pwbEditUser_'+id).value.trim() || null,
      password: document.getElementById('pwbEditPass_'+id).value || null,
      url: document.getElementById('pwbEditUrl_'+id).value.trim() || null,
      notes: document.getElementById('pwbEditNotes_'+id).value.trim() || null,
      updated_by: (window.currentUser && ((window.currentUser.firstName||'')+' '+(window.currentUser.lastName||'')).trim()) || null,
      updated_at: new Date().toISOString(),
    };
    if(!payload.platform_name){ toast('Platform name is required'); return; }
    try{
      const { error } = await sb.from('password_book').update(payload).eq('id', id);
      if(error) throw error;
      const idx = _pwbData.findIndex(r=>r.id===id);
      if(idx>-1) _pwbData[idx] = { ..._pwbData[idx], ...payload };
      _editId = null;
      toast('Saved');
      window.pwbRender();
    }catch(e){
      toast('Failed to save: '+(e.message||''));
    }
  };
  window.pwbDelete = async function(id){
    if(!confirm('Delete this platform login? This cannot be undone.')) return;
    try{
      const { error } = await sb.from('password_book').delete().eq('id', id);
      if(error) throw error;
      _pwbData = _pwbData.filter(r=>r.id!==id);
      _editId = null; _openId = null;
      toast('Deleted');
      window.pwbRender();
    }catch(e){
      toast('Failed to delete: '+(e.message||''));
    }
  };

  window.pwbStartAdd = function(){
    const el = document.getElementById('pwbAddCard');
    el.innerHTML = `<div class="pwb-card" style="margin-bottom:8px">
      <div class="pwb-edit-grid" style="margin-top:0;padding-top:0;border-top:none">
        <div><span class="pwb-inp-label">Platform Name</span><input class="pwb-inp" id="pwbNewName" placeholder="e.g. Amazon Seller Central" autofocus></div>
        <div><span class="pwb-inp-label">Username / Email</span><input class="pwb-inp" id="pwbNewUser" placeholder="team@pharmdomestic.com"></div>
        <div><span class="pwb-inp-label">Password</span><input class="pwb-inp" id="pwbNewPass" placeholder="Password"></div>
        <div><span class="pwb-inp-label">Login URL</span><input class="pwb-inp" id="pwbNewUrl" placeholder="https://…"></div>
        <div><span class="pwb-inp-label">Notes</span><input class="pwb-inp" id="pwbNewNotes" placeholder="Optional"></div>
        <div class="pwb-edit-actions">
          <button class="pwb-btn pwb-btn-ghost" onclick="window.pwbCancelAdd()">Cancel</button>
          <button class="pwb-btn pwb-btn-primary" onclick="window.pwbSubmitAdd()">Add Platform</button>
        </div>
      </div>
    </div>`;
    setTimeout(()=>document.getElementById('pwbNewName')?.focus(),50);
  };
  window.pwbCancelAdd = function(){
    document.getElementById('pwbAddCard').innerHTML = '';
  };
  window.pwbSubmitAdd = async function(){
    const name = document.getElementById('pwbNewName').value.trim();
    if(!name){ toast('Platform name is required'); return; }
    const payload = {
      platform_name: name,
      username: document.getElementById('pwbNewUser').value.trim() || null,
      password: document.getElementById('pwbNewPass').value || null,
      url: document.getElementById('pwbNewUrl').value.trim() || null,
      notes: document.getElementById('pwbNewNotes').value.trim() || null,
      updated_by: (window.currentUser && ((window.currentUser.firstName||'')+' '+(window.currentUser.lastName||'')).trim()) || null,
    };
    try{
      const { data, error } = await sb.from('password_book').insert(payload).select().single();
      if(error) throw error;
      _pwbData.push(data);
      _pwbData.sort((a,b)=>(a.platform_name||'').localeCompare(b.platform_name||''));
      document.getElementById('pwbAddCard').innerHTML = '';
      toast('Platform added');
      window.pwbRender();
    }catch(e){
      toast('Failed to add: '+(e.message||''));
    }
  };

  pwbInit();
})();
</script>
