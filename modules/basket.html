<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes toastIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
  @keyframes drawerIn { from { transform:translateX(100%); } to { transform:translateX(0); } }

  .cb-page {
    display: flex; flex-direction: column;
    height: calc(100vh - 64px - 30px);
    font-family: 'Inter', system-ui, sans-serif; color: #0f172a;
    overflow: hidden;
    margin-left: 10px; margin-right:10px;
  }

  /* ── HEADER ── */
.cb-header {
    flex-shrink: 0; position: sticky; top: -15px; z-index: 100;
    background: #fff;
    padding: 10px 10px 10px; border-bottom: 1px solid #e2e8f0;
    box-shadow: 0 1px 6px rgba(0,0,0,.06);
  }
 
  @media (max-width: 480px) { .cb-header { padding: 10px 10px 10px; } }

  /* ── TABS ── */
  .cb-tabs { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .cb-tab {
    padding: 6px 16px; border-radius: 8px; font-size: 12.5px; font-weight: 600;
    font-family: inherit; cursor: pointer; border: 1.5px solid #e2e8f0;
    background: #fff; color: #64748b; transition: all .15s;
  }
  .cb-tab:hover { border-color: #94a3b8; color: #334155; }
  .cb-tab.active-to-buy    { background: #0f172a; color: #fff; border-color: #0f172a; }
  .cb-tab.active-purchased { background: #15803d; color: #fff; border-color: #15803d; }
  .cb-tab.active-inquire   { background: #7c3aed; color: #fff; border-color: #7c3aed; }

  /* ── TOOLBAR ── */
  .cb-toolbar-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .cb-chip {
    display: flex; align-items: center; gap: 5px; padding: 4px 10px;
    border-radius: 100px; background: #f8fafc; border: 1px solid #e2e8f0;
    color: #64748b; font-size: 11.5px; font-weight: 600; white-space: nowrap; flex-shrink: 0;
  }

  /* ── TYPE DROPDOWN ── */
  .cb-type-wrap { position: relative; flex-shrink: 0; }
  .cb-type-btn {
    display: inline-flex; align-items: center; gap: 6px; padding: 6px 11px;
    border-radius: 8px; font-size: 12px; font-weight: 600; font-family: inherit;
    cursor: pointer; border: 1.5px solid #e2e8f0; background: #fff;
    color: #0f172a; transition: all .15s; white-space: nowrap;
  }
  .cb-type-btn:hover { border-color: #94a3b8; }
  .cb-type-btn svg { width: 12px; height: 12px; flex-shrink: 0; }
  .cb-type-menu {
    position: absolute; top: calc(100% + 5px); left: 0; z-index: 300;
    background: #fff; border: 1.5px solid #e2e8f0; border-radius: 10px;
    box-shadow: 0 8px 24px rgba(0,0,0,.1); padding: 5px; min-width: 170px;
    opacity: 0; pointer-events: none; transform: translateY(-4px);
    transition: opacity .15s, transform .15s;
  }
  .cb-type-menu.open { opacity: 1; pointer-events: all; transform: translateY(0); }
  .cb-type-opt {
    display: flex; align-items: center; gap: 8px; padding: 8px 10px;
    border-radius: 7px; font-size: 12.5px; font-weight: 600; cursor: pointer;
    color: #0f172a; transition: background .12s;
  }
  .cb-type-opt:hover, .cb-type-opt.selected { background: #f1f5f9; }
  .cb-type-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

  .cb-search-wrap { position: relative; flex: 1; min-width: 160px; }
  .cb-search-wrap svg {
    position: absolute; left: 9px; top: 50%; transform: translateY(-50%);
    color: #94a3b8; width: 13px; height: 13px; pointer-events: none;
  }
  .cb-search {
    width: 100%; padding: 6px 9px 6px 30px; border: 1.5px solid #e2e8f0;
    border-radius: 8px; font-size: 12px; font-family: inherit; background: #fff;
    color: #0f172a; outline: none; transition: border-color .15s;
  }
  .cb-search:focus { border-color: #2563eb; }
  .cb-supplier-select {
    padding: 6px 9px; border: 1.5px solid #e2e8f0; border-radius: 8px;
    font-size: 12px; font-family: inherit; background: #fff;
    color: #0f172a; outline: none; cursor: pointer; max-width: 180px;
  }
.cb-moq-bar {
    display: none; padding: 6px 12px; background: #f8fafc;
    border: 1px solid #e2e8f0; border-radius: 8px; margin-top: 0;
    min-width: 0; align-items: center; gap: 10px;
  }

  /* ── BODY ── */
.cb-body {
    flex: 1; min-height: 0; overflow: hidden;
    padding: 14px 10px 10px 10px; margin-left: 10px; margin-right:10px; display: flex; flex-direction: column;
  }

  /* ── KANBAN ── */
  .cb-kanban {
    display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
    flex: 1; min-height: 0; overflow: hidden;
  }
  @media (max-width: 600px) { .cb-kanban { grid-template-columns: 1fr; overflow-y: auto; gap: 10px; } }
  .cb-kanban-col {
    display: flex; flex-direction: column; min-height: 0; overflow: hidden;
    border-radius: 12px; border: 1px solid #e2e8f0; background: #fff;
  }
  .cb-kanban-header {
    padding: 9px 12px; font-size: 11px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .6px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid #e2e8f0;
  }
  .cb-kanban-header.nl   { background: #eff6ff; color: #1d4ed8; }
  .cb-kanban-header.repl { background: #f5f3ff; color: #7c3aed; }
  .cb-kanban-header.inq  { background: #fef3c7; color: #92400e; }
  .cb-kanban-body {
    flex: 1; min-height: 0; overflow-y: auto;
    padding: 8px; display: flex; flex-direction: column; gap: 6px; background: #fafafa;
  }
  .cb-kanban-body::-webkit-scrollbar { width: 4px; }
  .cb-kanban-body::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 4px; }

  /* ── CARDS ── */
  .cb-card {
    background: #fff; border: 1px solid #e2e8f0; border-radius: 10px;
    padding: 11px 13px; cursor: pointer; transition: box-shadow .12s, border-color .12s;
    user-select: none;
  }
  .cb-card:hover { box-shadow: 0 3px 10px rgba(0,0,0,.08); border-color: #bfdbfe; }
  .cb-card.inquire-card { border-color: #fde68a; background: #fffbeb; }
  .cb-card.inquire-card:hover { border-color: #f59e0b; box-shadow: 0 3px 10px rgba(245,158,11,.15); }
  .cb-card-name {
    font-size: 12.5px; font-weight: 600; color: #0f172a;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 5px;
  }
  .cb-card-meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .cb-card-tag {
    font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 4px; white-space: nowrap;
  }
  .cb-card-tag.nl       { background: #eff6ff; color: #1d4ed8; border: 1px solid #bfdbfe; }
  .cb-card-tag.repl     { background: #f5f3ff; color: #7c3aed; border: 1px solid #c4b5fd; }
  .cb-card-tag.purchased { background: #dcfce7; color: #15803d; border: 1px solid #bbf7d0; }
  .cb-card-tag.inquire  { background: #fef3c7; color: #92400e; border: 1px solid #fde68a; }
  .cb-card-sup {
    font-size: 11px; color: #64748b; background: #f1f5f9; border: 1px solid #e2e8f0;
    border-radius: 4px; padding: 1px 6px; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; max-width: 120px;
  }
  .cb-card-val { font-size: 11px; font-weight: 700; color: #15803d; margin-left: auto; flex-shrink: 0; }

  /* ── LIST VIEW ── */
  .cb-list-body { flex: 1; min-height: 0; overflow-y: auto; }
  .cb-list-body::-webkit-scrollbar { width: 4px; }
  .cb-list-body::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 4px; }
  .cb-list-card {
    background: #fff; border: 1px solid #e2e8f0; border-radius: 10px;
    padding: 12px 14px; margin-bottom: 6px; cursor: pointer;
    transition: box-shadow .12s, border-color .12s;
  }
  .cb-list-card:hover { box-shadow: 0 3px 10px rgba(0,0,0,.08); border-color: #bfdbfe; }
  .cb-list-card.inquire-card { border-color: #fde68a; background: #fffbeb; }
  .cb-list-card-name {
    font-size: 13px; font-weight: 600; color: #0f172a;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 5px;
  }
  .cb-list-card-meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }

  /* ── PAGINATION ── */
  .cb-pagination {
    display: flex; align-items: center; justify-content: center;
    gap: 6px; padding: 10px 0 4px; flex-shrink: 0; flex-wrap: wrap;
  }
  .cb-page-btn {
    padding: 5px 12px; border-radius: 7px; border: 1.5px solid #e2e8f0;
    background: #fff; color: #64748b; font-size: 12px; font-weight: 600;
    font-family: inherit; cursor: pointer; transition: all .15s;
  }
  .cb-page-btn:hover:not(:disabled) { border-color: #94a3b8; color: #334155; }
  .cb-page-btn:disabled { opacity: .4; cursor: not-allowed; }
  .cb-page-btn.active { background: #0f172a; color: #fff; border-color: #0f172a; }

  /* ── DRAWER OVERLAY ── */
  .cb-drawer-overlay {
    position: fixed; inset: 0; background: rgba(15,23,42,.3); z-index: 900;
    opacity: 0; pointer-events: none; transition: opacity .25s; backdrop-filter: blur(2px);
  }
  .cb-drawer-overlay.open { opacity: 1; pointer-events: all; }

  /* ── DRAWER ── */
  .cb-drawer {
    position: fixed; top: 0; right: 0; width: 500px; max-width: 100vw; height: 100vh;
    background: #fff; box-shadow: -8px 0 40px rgba(0,0,0,.13); z-index: 1000;
    display: flex; flex-direction: column;
    transform: translateX(100%); transition: transform .28s cubic-bezier(.4,0,.2,1);
  }
  .cb-drawer.open { transform: translateX(0); }

  /* Hero */
  .cb-drawer-hero {
    padding: 18px 20px 16px; flex-shrink: 0;
    background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
    position: relative; overflow: hidden;
  }
  .cb-drawer-hero::before {
    content: ''; position: absolute; top: -40px; right: -40px;
    width: 160px; height: 160px; border-radius: 50%; background: rgba(255,255,255,.03);
  }
  .cb-drawer-hero::after {
    content: ''; position: absolute; bottom: -20px; left: 20px;
    width: 90px; height: 90px; border-radius: 50%; background: rgba(59,130,246,.08);
  }
  .cb-drawer-close {
    position: absolute; top: 12px; right: 12px; width: 28px; height: 28px;
    border: none; border-radius: 7px; background: rgba(255,255,255,.1);
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    color: rgba(255,255,255,.65); transition: background .15s; z-index: 2;
  }
  .cb-drawer-close:hover { background: rgba(255,255,255,.2); color: #fff; }
  .cb-drawer-badge {
    display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px;
    border-radius: 100px; font-size: 10px; font-weight: 700; margin-bottom: 6px;
    position: relative; z-index: 1;
  }
  .cb-drawer-badge.nl      { background: rgba(59,130,246,.18); border: 1px solid rgba(59,130,246,.3); color: #60a5fa; }
  .cb-drawer-badge.repl    { background: rgba(124,58,237,.18); border: 1px solid rgba(124,58,237,.3); color: #a78bfa; }
  .cb-drawer-badge.pur     { background: rgba(34,197,94,.18);  border: 1px solid rgba(34,197,94,.3);  color: #4ade80; }
  .cb-drawer-badge.inq     { background: rgba(245,158,11,.18); border: 1px solid rgba(245,158,11,.3); color: #fbbf24; }
  .cb-drawer-name { font-size: 16px; font-weight: 700; color: #fff; padding-right: 36px; line-height: 1.3; margin-bottom: 3px; position: relative; z-index: 1; }
  .cb-drawer-sub  { font-size: 11px; color: rgba(255,255,255,.4); position: relative; z-index: 1; margin-bottom: 12px; }
  .cb-drawer-kpis {
    display: grid; grid-template-columns: repeat(3,1fr); gap: 6px; position: relative; z-index: 1;
  }
  .cb-kpi {
    background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.1);
    border-radius: 9px; padding: 8px 10px;
  }
  .cb-kpi-label { font-size: 9px; font-weight: 600; text-transform: uppercase; letter-spacing: .5px; color: rgba(255,255,255,.4); margin-bottom: 3px; }
  .cb-kpi-val   { font-size: 15px; font-weight: 700; color: #fff; line-height: 1; }

  /* Drawer tabs */
  .cb-drawer-tabs {
    display: flex; border-bottom: 1px solid #e2e8f0; background: #fff;
    flex-shrink: 0; overflow-x: auto; scrollbar-width: none;
  }
  .cb-drawer-tabs::-webkit-scrollbar { display: none; }
  .cb-drawer-tab {
    padding: 9px 14px; font-size: 12px; font-weight: 700; font-family: inherit;
    color: #64748b; border: none; background: none; cursor: pointer;
    border-bottom: 2px solid transparent; transition: all .15s; white-space: nowrap;
    display: flex; align-items: center; gap: 5px; flex-shrink: 0;
  }
  .cb-drawer-tab svg { width: 13px; height: 13px; }
  .cb-drawer-tab:hover { color: #334155; }
  .cb-drawer-tab.active { color: #2563eb; border-bottom-color: #2563eb; background: #fafcff; }

  /* Drawer body */
  .cb-drawer-body { flex: 1; overflow-y: auto; padding: 16px 20px; min-height: 0; }
  .cb-drawer-body::-webkit-scrollbar { width: 4px; }
  .cb-drawer-body::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 4px; }

  /* Info cards (listing-style) */
  .cb-info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; }
  .cb-info-grid.full { grid-template-columns: 1fr; }
  @media (max-width: 480px) { .cb-info-grid { grid-template-columns: 1fr; } }
  .cb-info-card {
    background: #fff; border: 1.5px solid #e2e8f0; border-radius: 10px; padding: 10px 13px;
  }
  .cb-info-card label {
    display: flex; align-items: center; gap: 5px; font-size: 9.5px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .6px; color: #94a3b8; margin-bottom: 6px;
  }
  .cb-info-card label svg { width: 11px; height: 11px; color: #94a3b8; }
  .cb-info-val-static { font-size: 13px; font-weight: 600; color: #0f172a; padding: 3px 0; }
  .cb-info-val-mono   { font-size: 12px; font-weight: 600; color: #0f172a; font-family: monospace; padding: 3px 0; }
  .cb-edit-input {
    width: 100%; padding: 6px 10px; border: 1.5px solid #e2e8f0; border-radius: 7px;
    font-size: 13px; font-family: inherit; color: #0f172a; background: #fff;
    outline: none; transition: border-color .15s;
  }
  .cb-edit-input:focus { border-color: #2563eb; background: #fafcff; }

  .cb-sec-label {
    font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .8px;
    color: #94a3b8; margin-bottom: 10px; display: flex; align-items: center; gap: 8px;
  }
  .cb-sec-label::after { content: ''; flex: 1; height: 1px; background: #f1f5f9; }

  /* Status badge in drawer */
  .cb-status-badge {
    display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px;
    border-radius: 7px; font-size: 12px; font-weight: 600;
  }
  .cb-status-badge.purchased { background: #dcfce7; border: 1px solid #bbf7d0; color: #15803d; }
  .cb-status-badge.inquire   { background: #fef3c7; border: 1px solid #fde68a; color: #92400e; }

  /* Catalog price table */
  .cb-catalog-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .cb-catalog-table th {
    background: #f8fafc; padding: 8px 10px; text-align: left; font-size: 10px;
    font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: #64748b;
    border-bottom: 2px solid #e2e8f0; white-space: nowrap;
  }
  .cb-catalog-table td { padding: 9px 10px; border-bottom: 1px solid #f1f5f9; color: #334155; }
  .cb-catalog-table tr:hover td { background: #fafbff; }
  .cb-catalog-table tr.best-price td { background: #f0fdf4; }
  .cb-catalog-best { font-size: 9px; font-weight: 700; padding: 1px 5px; border-radius: 3px; background: #dcfce7; color: #15803d; margin-left: 4px; }

  /* Drawer actions */
  .cb-drawer-actions {
    padding: 14px 20px; border-top: 1px solid #e2e8f0; flex-shrink: 0; background: #fafafa;
  }
  .cb-action-section { margin-bottom: 12px; }
  .cb-action-section:last-child { margin-bottom: 0; }
  .cb-action-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .6px; color: #94a3b8; margin-bottom: 7px; }
  .cb-action-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .cb-select {
    flex: 1; padding: 7px 10px; border: 1.5px solid #e2e8f0; border-radius: 8px;
    font-size: 12.5px; font-family: inherit; background: #fff; color: #0f172a;
    outline: none; cursor: pointer; min-width: 140px;
  }
  .cb-qty-input {
    width: 120px; padding: 7px 10px; border: 1.5px solid #e2e8f0; border-radius: 8px;
    font-size: 12.5px; font-family: inherit; background: #fff; color: #0f172a; outline: none;
  }
  .cb-qty-input:focus, .cb-select:focus { border-color: #2563eb; outline: none; }
  .cb-btn {
    display: inline-flex; align-items: center; gap: 6px; padding: 7px 13px;
    border-radius: 8px; font-size: 12px; font-weight: 600; font-family: inherit;
    cursor: pointer; border: 1.5px solid; transition: all .15s; white-space: nowrap;
  }
  .cb-btn svg { width: 11px; height: 11px; }
  .cb-btn-green  { background: #f0fdf4; color: #15803d; border-color: #bbf7d0; }
  .cb-btn-green:hover  { background: #dcfce7; border-color: #86efac; }
  .cb-btn-amber  { background: #fef3c7; color: #92400e; border-color: #fde68a; }
  .cb-btn-amber:hover  { background: #fde68a; }
  .cb-btn-slate  { background: #f8fafc; color: #64748b; border-color: #e2e8f0; }
  .cb-btn-slate:hover  { background: #f1f5f9; border-color: #cbd5e1; }
  .cb-btn-yellow { background: #fef9c3; color: #854d0e; border-color: #fde047; }
  .cb-btn-yellow:hover { background: #fef08a; }
  .cb-btn-red    { background: #fef2f2; color: #dc2626; border-color: #fecaca; }
  .cb-btn-red:hover    { background: #fee2e2; }

  /* ── PDF MODAL ── */
  .cb-modal-overlay {
    position: fixed; inset: 0; background: rgba(15,23,42,.4); z-index: 1100;
    display: flex; align-items: center; justify-content: center; padding: 16px;
    opacity: 0; pointer-events: none; transition: opacity .2s; backdrop-filter: blur(3px);
  }
  .cb-modal-overlay.open { opacity: 1; pointer-events: all; }
  .cb-modal {
    background: #fff; border-radius: 16px; box-shadow: 0 25px 60px rgba(0,0,0,.2);
    width: 440px; max-width: 95vw; overflow: hidden;
    transform: scale(.95) translateY(10px); transition: transform .25s cubic-bezier(.34,1.56,.64,1);
  }
  .cb-modal-overlay.open .cb-modal { transform: scale(1) translateY(0); }
  .cb-modal-header {
    padding: 16px 20px; border-bottom: 1px solid #e2e8f0;
    display: flex; align-items: center; justify-content: space-between;
  }
  .cb-modal-header h3 { font-size: 15px; font-weight: 700; color: #0f172a; }
  .cb-modal-close {
    width: 28px; height: 28px; border: none; border-radius: 7px; background: #f1f5f9;
    cursor: pointer; display: flex; align-items: center; justify-content: center; color: #64748b;
  }
  .cb-modal-body { padding: 20px; }
  .cb-modal-footer { padding: 14px 20px; border-top: 1px solid #e2e8f0; display: flex; gap: 8px; justify-content: flex-end; }
  .cb-form-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: #64748b; margin-bottom: 6px; display: block; }
  .cb-form-select {
    width: 100%; padding: 8px 10px; border: 1.5px solid #e2e8f0; border-radius: 8px;
    font-size: 13px; font-family: inherit; background: #fff; color: #0f172a; outline: none; margin-bottom: 12px;
  }
  .cb-form-select:focus { border-color: #2563eb; }

  /* ── TOAST ── */
  .cb-toasts {
    position: fixed; bottom: 20px; right: 20px;
    z-index: 9999; display: flex; flex-direction: column; gap: 7px; pointer-events: none;
  }


 /* ── PRODUCT AVATAR ── */
  .cb-avatar {
    width: 36px; height: 36px; border-radius: 8px; flex-shrink: 0;
    overflow: hidden; position: relative;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700;
  }
  .cb-avatar img {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: contain; border-radius: 8px;
  }
  .cb-avatar.nl   { background: #eff6ff; color: #2563eb; border: 1px solid #bfdbfe; }
  .cb-avatar.repl { background: #f5f3ff; color: #7c3aed; border: 1px solid #c4b5fd; }
  .cb-avatar.inq  { background: #fef3c7; color: #92400e; border: 1px solid #fde68a; }
  .cb-avatar.pur  { background: #dcfce7; color: #15803d; border: 1px solid #bbf7d0; }

    display: flex; align-items: center; justify-content: center;

<script>
(function () {
  'use strict';
  const sb = window.sb;

  let _cbFilter     = 'all';
  let _cbTab        = 'tobuy';
  let _cbPage       = 1;
  let _drawerTab    = 'details';
  let _drawerItem   = null;
  let _catalogCache = null;
  let _allPurchased = { nl: [], repl: [] };
  const PAGE_SIZE   = 25;
  let _cbSupplierList = [];

  /* ── UTILS ── */
  function escH(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function escA(s) { return String(s||'').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
  function fmtVal(v) { const n=parseFloat(v); return isNaN(n)?'—':n.toLocaleString('en-GB'); }
  function fmtGBP(v) { const n=parseFloat(v); return isNaN(n)?'—':'£'+n.toLocaleString('en-GB',{minimumFractionDigits:2,maximumFractionDigits:2}); }
  function fmtDate(d) { if(!d) return '—'; return new Date(d).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}); }
  function fmtDateTime(d) { if(!d) return '—'; return new Date(d).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}); }
  function weekLabel(d) {
    const dt = new Date(d);
    const jan1 = new Date(dt.getFullYear(),0,1);
    const wk = Math.ceil(((dt-jan1)/86400000+jan1.getDay()+1)/7);
    return `W${wk} ${dt.getFullYear()}`;
  }
  function monthLabel(d) {
    return new Date(d).toLocaleDateString('en-GB',{month:'long',year:'numeric'});
  }

  /* ── SUPPLIERS ── */
  async function _loadCbSuppliers() {
    if (_cbSupplierList.length) return _cbSupplierList;
    try {
      const { data } = await sb.from('suppliers').select('name,moq').order('name');
      _cbSupplierList = (data||[]).map(s=>({ name:s.name, moq:parseFloat(s.moq)||0 }));
    } catch(e) { _cbSupplierList=[]; }
    return _cbSupplierList;
  }

  /* ── CATALOG LOOKUP ── */
  async function _loadCatalog() {
    if (_catalogCache) return _catalogCache;
    try {
      const { data } = await sb.from('catalog').select('ean,product_name,cost,old_cost,supplier_name').not('ean','is',null);
      _catalogCache = data || [];
    } catch(e) { _catalogCache=[]; }
    return _catalogCache;
  }

  /* ── TABS ── */
  window.setCbTab = function(tab) {
    _cbTab=tab; _cbPage=1;
    document.getElementById('cbTabToBuy').className    = 'cb-tab'+(tab==='tobuy'    ?' active-to-buy':'');
    document.getElementById('cbTabPurchased').className = 'cb-tab'+(tab==='purchased'?' active-purchased':'');
    document.getElementById('cbTabInquire').className   = 'cb-tab'+(tab==='inquire'  ?' active-inquire':'');
    document.getElementById('cbPdfBtn').style.display   = tab==='purchased'?'inline-flex':'none';
    window.renderCentralBasket();
  };

  /* ── TYPE DROPDOWN ── */
  window.toggleCbTypeMenu = function(e) {
    e.stopPropagation();
    document.getElementById('cbTypeMenu').classList.toggle('open');
  };
  document.addEventListener('click', ()=>{ document.getElementById('cbTypeMenu')?.classList.remove('open'); });

  function _updateTypeDropdown() {
    const labels = { all:'All', newline:'New Lines', replens:'Replenishments' };
    const btn = document.getElementById('cbTypeBtn');
    if (btn) {
      btn.style.borderColor = _cbFilter==='all'?'#e2e8f0':_cbFilter==='newline'?'#bfdbfe':'#c4b5fd';
      btn.style.color       = _cbFilter==='all'?'#0f172a':_cbFilter==='newline'?'#1d4ed8':'#7c3aed';
      btn.style.background  = _cbFilter==='all'?'#fff'   :_cbFilter==='newline'?'#eff6ff':'#f5f3ff';
      document.getElementById('cbTypeBtnLabel').textContent = labels[_cbFilter];
    }
    ['all','newline','replens'].forEach(k=>{
      document.getElementById('cbTypeOpt'+k.charAt(0).toUpperCase()+k.slice(1))?.classList.toggle('selected',k===_cbFilter);
    });
    document.getElementById('cbTypeMenu')?.classList.remove('open');
  }
  window.setCbFilter = function(f) { _cbFilter=f; _cbPage=1; _updateTypeDropdown(); window.renderCentralBasket(); };

  /* ── DRAWER ── */
  window.openCbDrawer = function(type, dataJson) {
    const data = typeof dataJson==='string' ? JSON.parse(dataJson) : dataJson;
    _drawerItem = { type, data };
    _drawerTab  = 'details';
    _renderCbDrawer();
    document.getElementById('cbDrawer').classList.add('open');
    document.getElementById('cbDrawerOverlay').classList.add('open');
  };
  window.closeCbDrawer = function() {
    document.getElementById('cbDrawer').classList.remove('open');
    document.getElementById('cbDrawerOverlay').classList.remove('open');
    _drawerItem = null;
  };
  window.switchCbDrawerTab = function(tab) {
    _drawerTab = tab;
    _renderCbDrawer();
    if (tab==='prices') _renderPricesTab();
  };

  function _renderCbDrawer() {
    if (!_drawerItem) return;
    const { type, data: p } = _drawerItem;
    const isPurchased = _cbTab==='purchased';
    const isInquire   = _cbTab==='inquire';

    /* ── Hero ── */
    const name = type==='nl' ? (p.product_name||'—') : (p.name||'—');
    const eanDisplay = type==='nl'
      ? ((p.code||'').split(',')[0].split(':')[0].trim() || '—')
      : (p.ean||'—');
    const badgeCls = isPurchased?'pur': isInquire?'inq': type==='nl'?'nl':'repl';
    const badgeTxt = isPurchased?'Purchased': isInquire?'Inquire': type==='nl'?'New Line':'Replenishment';

    let kpis = '';
    if (type==='nl') {
      const cost=parseFloat(p.cost_of_unit); const qty=parseFloat(p.unit_quantity)||0;
      const total=!isNaN(cost)?cost*qty:0;
      kpis=`<div class="cb-kpi"><div class="cb-kpi-label">Unit Cost</div><div class="cb-kpi-val">${!isNaN(cost)?'£'+cost.toFixed(2):'—'}</div></div>
            <div class="cb-kpi"><div class="cb-kpi-label">Qty</div><div class="cb-kpi-val">${fmtVal(p.unit_quantity)}</div></div>
            <div class="cb-kpi"><div class="cb-kpi-label">Total</div><div class="cb-kpi-val">${total>0?fmtGBP(total):'—'}</div></div>`;
} else {
      const cost=parseFloat(p.cost_price)||0; const qty=parseInt(p.order_qty)||0;
      const total=cost*qty; const dl=parseFloat(p.days_left)||0;
      kpis=`<div class="cb-kpi"><div class="cb-kpi-label">Cost/unit</div><div class="cb-kpi-val">${cost>0?'£'+cost.toFixed(2):'—'}</div></div>
            <div class="cb-kpi"><div class="cb-kpi-label">Total Value</div><div class="cb-kpi-val">${total>0?fmtGBP(total):'—'}</div></div>
            <div class="cb-kpi"><div class="cb-kpi-label">${dl<=0?'Stock':'Days left'}</div><div class="cb-kpi-val" style="color:${dl<=0?'#f87171':dl<7?'#f87171':dl<20?'#fbbf24':'#4ade80'};">${dl<=0?'OOS':dl+'d'}</div></div>`;
    }

const imgUrl = p.image_url || '';
    const heroIni = (name||'?').split(' ').filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join('');
    document.getElementById('cbDrawerHero').innerHTML = `
      <div class="cb-drawer-hero">
        <button class="cb-drawer-close" onclick="window.closeCbDrawer()">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
        <div class="cb-drawer-top">
          <div class="cb-drawer-img">${imgUrl?`<img src="${escA(imgUrl)}" alt="" onerror="this.style.display='none'">`:''}${escH(heroIni)}</div>
          <div class="cb-drawer-top-text">
            <div class="cb-drawer-badge ${badgeCls}" style="margin-bottom:5px;">${badgeTxt}</div>
            <div class="cb-drawer-name" style="padding-right:36px;">${escH(name)}</div>
            <div class="cb-drawer-sub" style="cursor:pointer;text-decoration:underline;text-decoration-color:rgba(255,255,255,.2);" onclick="window.open('https://www.google.com/search?tbm=isch&q=${encodeURIComponent(eanDisplay)}','_blank')" title="Search images">${escH(eanDisplay)}</div>
          </div>
        </div>
        <div class="cb-drawer-kpis">${kpis}</div>
      </div>`;

    /* ── Tabs ── */
    const tabs = [
      { id:'details', label:'Details',    icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>' },
      { id:'prices',  label:'Catalog Prices', icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>' },
    ];
    document.getElementById('cbDrawerTabs').innerHTML = tabs.map(t=>
      `<button class="cb-drawer-tab${_drawerTab===t.id?' active':''}" onclick="window.switchCbDrawerTab('${t.id}')">${t.icon}${t.label}</button>`
    ).join('');

    /* ── Body ── */
    if (_drawerTab==='details') _renderDetailsTab(type, p, isPurchased, isInquire);
    else if (_drawerTab==='prices') _renderPricesTab();

    /* ── Actions ── */
    _renderDrawerActions(type, p, isPurchased, isInquire);
  }

function _renderDetailsTab(type, p, isPurchased, isInquire) {
    const suppOpts = '<option value="">— Select Supplier —</option>'
      + _cbSupplierList.map(s=>`<option value="${escA(s.name)}"${s.name===(p.supplier_name||'')?' selected':''}>${escH(s.name)}</option>`).join('')
      + `<option value="Inquiry"${'Inquiry'===(p.supplier_name||'')?' selected':''}>Inquiry</option>`;
    const supplierSelect = (updateFn) => `
      <div class="cb-info-card" style="grid-column:1/-1">
        <label><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>Supplier</label>
        <select class="cb-edit-input" onchange="${updateFn}">${suppOpts}</select>
      </div>`;
    let html = '';
    if (type==='nl') {
      const cost=parseFloat(p.cost_of_unit); const qty=parseFloat(p.unit_quantity)||0;
      const qtyPur=parseFloat(p.qty_purchased)||0;
      html = `
        <div class="cb-sec-label">Product Info</div>
        <div class="cb-info-grid">
          ${supplierSelect(`window.cbUpdateNLSupplier('${escA(p.opportunity_id)}',this.value)`)}
          <div class="cb-info-card">
            <label><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 7H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2z"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>Qty Approved</label>
            <input type="number" class="cb-edit-input" value="${qty||''}" placeholder="0" min="0" step="1"
              onblur="window.cbUpdateNLQty('${escA(p.opportunity_id)}',this.value)" id="cbQtyNL_${escA(p.opportunity_id)}">
          </div>
          <div class="cb-info-card">
            <label><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>Cost per Unit</label>
            <input type="number" class="cb-edit-input" value="${!isNaN(cost)?cost.toFixed(2):''}" placeholder="£0.00" step="0.01" min="0"
             oninput="window.cbUpdateNLCostLive('${escA(p.opportunity_id)}',this.value)"
             onblur="window.cbUpdateNLCost('${escA(p.opportunity_id)}',this.value)" id="cbCostNL_${escA(p.opportunity_id)}">
          </div>
          ${isPurchased?`<div class="cb-info-card">
            <label><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>Qty Purchased</label>
            <div class="cb-info-val-static" style="color:#15803d;">${qtyPur>0?fmtVal(qtyPur)+' units':'—'}</div>
          </div>`:''}
        </div>
        <div class="cb-sec-label">Timeline</div>
        <div class="cb-info-grid">
          <div class="cb-info-card">
            <label><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>Added to Basket</label>
            <div class="cb-info-val-static">${fmtDate(p.basket_added_at||p.last_updated||p.created_at)}</div>
          </div>
          ${isPurchased&&p.purchased_at?`<div class="cb-info-card">
            <label><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>When Purchased</label>
            <div class="cb-info-val-static">${fmtDate(p.purchased_at)}</div>
          </div>`:''}
        </div>`;
    } else {
      const cost=parseFloat(p.cost_price)||0; const qty=parseInt(p.order_qty)||0;
      const dl=parseFloat(p.days_left)||0;
      const daysCls=dl<=0?'#dc2626':dl<7?'#dc2626':dl<20?'#92400e':'#15803d';
      const daysTxt=dl<=0?'Out of stock':dl+'d left';
      html = `
        <div class="cb-sec-label">Product Info</div>
        <div class="cb-info-grid">
          ${supplierSelect(`window.cbUpdateReplSupplier('${escA(p.sku)}',this.value)`)}
          <div class="cb-info-card">
            <label><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>SKU</label>
            <div class="cb-info-val-mono">${escH(p.sku||'—')}</div>
          </div>
          <div class="cb-info-card">
            <label><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 7H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2z"/></svg>Order Qty</label>
            <input type="number" class="cb-edit-input" value="${qty||''}" placeholder="0" min="0" step="1"
              onblur="window.cbUpdateReplQty('${escA(p.sku)}',this.value)" id="cbQtyRepl_${escA(p.sku)}">
          </div>
          <div class="cb-info-card">
            <label><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>Cost per Unit</label>
            <input type="number" class="cb-edit-input" value="${cost>0?cost.toFixed(2):''}" placeholder="£0.00" step="0.01" min="0"
            oninput="window.cbUpdateReplCostLive('${escA(p.sku)}',this.value)"
              onblur="window.cbUpdateReplCost('${escA(p.sku)}',this.value)" id="cbCostRepl_${escA(p.sku)}">
          </div>
        </div>
        <div class="cb-sec-label">Timeline</div>
        <div class="cb-info-grid">

  function _safeJson(p) { return JSON.stringify(p).replace(/\\/g,'\\\\').replace(/"/g,'&quot;'); }

function _nlCard(p,isPurchased,isInquire) {
    const cost=parseFloat(p.cost_of_unit); const qty=parseFloat(p.unit_quantity)||0;
    const total=!isNaN(cost)?cost*qty:0;
    const tagCls=isPurchased?'pur':isInquire?'inq':'nl';
    const tagTxt=isPurchased?'Purchased':isInquire?'Inquire':'New Line';
    const cardCls=isPurchased?'purchased':isInquire?'inquire':'nl';
    return `<div class="cb-card${isInquire?' inquire-card':''}" onclick="window.openCbDrawer('nl','${_safeJson(p)}')">
      <div style="display:flex;align-items:center;gap:9px;margin-bottom:6px;">
        ${_avatar(p.image_url||'', p.product_name, tagCls)}
        <div style="flex:1;min-width:0;">
          <div class="cb-card-name" title="${escH(p.product_name||'')}">${escH(p.product_name||'—')}</div>
          <div class="cb-card-meta">
            <span class="cb-card-sup">${escH(p.supplier_name||'—')}</span>
            ${total>0?`<span class="cb-card-val">${fmtGBP(total)}</span>`:''}
          </div>
        </div>
      </div>
    </div>`;
  }

  function _replCard(p,isPurchased,isInquire) {
    const cost=parseFloat(p.cost_price)||0; const qty=parseInt(p.order_qty)||0;
    const total=cost*qty;
    const tagCls=isPurchased?'pur':isInquire?'inq':'repl';
    const tagTxt=isPurchased?'Purchased':isInquire?'Inquire':'Replenishment';
    const cardCls=isPurchased?'purchased':isInquire?'inquire':'repl';
    return `<div class="cb-card${isInquire?' inquire-card':''}" onclick="window.openCbDrawer('repl','${_safeJson(p)}')">
      <div style="display:flex;align-items:center;gap:9px;margin-bottom:6px;">
        ${_avatar(p.image_url||'', p.name, tagCls)}
        <div style="flex:1;min-width:0;">

    const tagCls=isPurchased?'pur':isInquire?'inq':'repl';

function _refreshHeroKpis() {
    if (!_drawerItem) return;

    let kpis = '';
    if (type==='nl') {

            <div class="cb-kpi"><div class="cb-kpi-label">${dl<=0?'Stock':'Days left'}</div><div class="cb-kpi-val" style="color:${dl<=0?'#f87171':dl<7?'#f87171':dl<20?'#fbbf24':'#4ade80'};">${dl<=0?'OOS':dl+'d'}</div></div>`;
    }
    const kpisEl = document.querySelector('#cbDrawerHero .cb-drawer-kpis');
    if (kpisEl) kpisEl.innerHTML = kpis;

  /* ── PDF ── */
  window.openCbPdfModal = function() {
    const { nl, repl } = _allPurchased;
    const allDates = [
      ...nl.map(p=>p.purchased_at||p.last_updated||p.created_at).filter(Boolean),
      ...repl.map(p=>p.actioned_at).filter(Boolean),
    ].map(d=>new Date(d));

    // Months
    const monthSet = new Set(allDates.map(d=>d.toISOString().slice(0,7)));
    const monthSel = document.getElementById('cbPdfMonth');
    monthSel.innerHTML=[...monthSet].sort().reverse()
      .map(m=>`<option value="${m}">${new Date(m+'-01').toLocaleDateString('en-GB',{month:'long',year:'numeric'})}</option>`).join('');

    // Weeks
    const weekMap = {};
    allDates.forEach(d=>{
      const key=weekLabel(d); const iso=d.toISOString().slice(0,10);
      if (!weekMap[key]||iso<weekMap[key]) weekMap[key]=iso;
    });
    const weekSel=document.getElementById('cbPdfWeek');
    weekSel.innerHTML=Object.entries(weekMap).sort((a,b)=>b[1].localeCompare(a[1]))
      .map(([label,iso])=>`<option value="${iso}">${label}</option>`).join('');

    document.getElementById('cbPdfPeriod').value='all';
    document.getElementById('cbPdfMonthWrap').style.display='none';
    document.getElementById('cbPdfWeekWrap').style.display='none';
    document.getElementById('cbPdfModal').classList.add('open');
  };

  window.closeCbPdfModal = function() {
    document.getElementById('cbPdfModal').classList.remove('open');
  };

  document.getElementById('cbPdfPeriod').addEventListener('change', function() {
    document.getElementById('cbPdfMonthWrap').style.display = this.value==='month'?'block':'none';
    document.getElementById('cbPdfWeekWrap').style.display  = this.value==='week' ?'block':'none';
  });

  window.generateCbPdf = function() {
    const period=document.getElementById('cbPdfPeriod').value;
    let { nl, repl } = _allPurchased;

    if (period==='month') {
      const m=document.getElementById('cbPdfMonth').value;
      nl   = nl.filter(p=>(p.purchased_at||p.last_updated||'').startsWith(m));
      repl = repl.filter(p=>(p.actioned_at||'').startsWith(m));
    } else if (period==='week') {
      const wkIso=document.getElementById('cbPdfWeek').value;
      const wkDate=new Date(wkIso);
      const wkEnd=new Date(wkDate); wkEnd.setDate(wkDate.getDate()+6);
      nl   = nl.filter(p=>{ const d=new Date(p.purchased_at||p.last_updated||0); return d>=wkDate&&d<=wkEnd; });
      repl = repl.filter(p=>{ const d=new Date(p.actioned_at||0); return d>=wkDate&&d<=wkEnd; });
    }

    const totalNLVal  = nl.reduce((s,p)=>{const c=parseFloat(p.cost_of_unit)||0;const q=parseFloat(p.unit_quantity)||0;return s+c*q;},0);
    const totalReplVal= repl.reduce((s,p)=>{const c=parseFloat(p.cost_price)||0;const q=parseInt(p.order_qty)||0;return s+c*q;},0);
    const grandTotal  = totalNLVal+totalReplVal;

    const periodLabel = period==='all'?'All Purchases'
      : period==='month'?document.getElementById('cbPdfMonth').options[document.getElementById('cbPdfMonth').selectedIndex]?.text
      : document.getElementById('cbPdfWeek').options[document.getElementById('cbPdfWeek').selectedIndex]?.text;

    const nlRows=nl.map(p=>{
      const c=parseFloat(p.cost_of_unit)||0; const q=parseFloat(p.unit_quantity)||0;
      return `<tr><td>${escH(p.product_name||'—')}</td><td>${escH(p.supplier_name||'—')}</td><td>${fmtDate(p.purchased_at||p.last_updated||p.created_at)}</td><td style="text-align:right;">${q.toLocaleString()}</td><td style="text-align:right;">${fmtGBP(c)}</td><td style="text-align:right;font-weight:600;">${fmtGBP(c*q)}</td></tr>`;
    }).join('');

    const replRows=repl.map(p=>{
      const c=parseFloat(p.cost_price)||0; const q=parseInt(p.order_qty)||0;
      return `<tr><td>${escH(p.name||'—')}</td><td>${escH(p.supplier_name||'—')}</td><td>${fmtDate(p.actioned_at)}</td><td style="text-align:right;">${q.toLocaleString()}</td><td style="text-align:right;">${fmtGBP(c)}</td><td style="text-align:right;font-weight:600;">${fmtGBP(c*q)}</td></tr>`;
    }).join('');

    const html=`<!DOCTYPE html><html><head><meta charset="utf-8">
    <title>Purchase Summary — ${escH(periodLabel)}</title>
    <style>
      *{box-sizing:border-box;margin:0;padding:0;}
      body{font-family:'Inter',Arial,sans-serif;font-size:11px;color:#0f172a;background:#fff;padding:32px;}
      .brand{display:flex;align-items:center;gap:12px;margin-bottom:24px;padding-bottom:16px;border-bottom:2px solid #0f172a;}
      .brand img{height:36px;object-fit:contain;}
      .brand-name{font-size:18px;font-weight:800;color:#0f172a;letter-spacing:-0.5px;}
      .brand-sub{font-size:11px;color:#64748b;}
      h1{font-size:16px;font-weight:700;margin-bottom:4px;}
      .period{font-size:12px;color:#64748b;margin-bottom:20px;}
      .summary-chips{display:flex;gap:12px;margin-bottom:24px;flex-wrap:wrap;}
      .chip{background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:10px 14px;}
      .chip-label{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:#94a3b8;margin-bottom:3px;}
      .chip-val{font-size:15px;font-weight:700;color:#0f172a;}
      .chip-val.green{color:#15803d;}
      h2{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:#64748b;margin:20px 0 8px;padding-top:16px;border-top:1px solid #e2e8f0;}
      table{width:100%;border-collapse:collapse;margin-bottom:16px;}
      th{background:#f8fafc;padding:7px 10px;text-align:left;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:#64748b;border-bottom:2px solid #e2e8f0;}
      td{padding:7px 10px;border-bottom:1px solid #f1f5f9;font-size:11px;}
      tr:nth-child(even) td{background:#fafafa;}
      .total-row td{border-top:2px solid #0f172a;font-weight:700;background:#f8fafc!important;}
      .grand-total{margin-top:20px;padding:14px 16px;background:linear-gradient(135deg,#0f172a,#1e293b);border-radius:10px;display:flex;justify-content:space-between;align-items:center;}
      .grand-total-label{color:rgba(255,255,255,.6);font-size:11px;font-weight:600;}
      .grand-total-val{color:#fff;font-size:18px;font-weight:800;}
      .footer{margin-top:32px;padding-top:12px;border-top:1px solid #e2e8f0;font-size:10px;color:#94a3b8;display:flex;justify-content:space-between;}
      @media print{body{padding:20px;}.grand-total{-webkit-print-color-adjust:exact;print-color-adjust:exact;}}
    </style></head><body>
    <div class="brand">
      <img src="https://raw.githubusercontent.com/pharmdom/app/refs/heads/main/assets/logo_pharm_and_domestic.png" alt="Pharm & Dom" onerror="this.style.display='none'">
      <div><div class="brand-name">Pharm & Dom</div><div class="brand-sub">Procurement Purchase Summary</div></div>
    </div>
    <h1>Purchase Summary</h1>
    <div class="period">${escH(periodLabel)} · Generated ${fmtDateTime(new Date().toISOString())}</div>
    <div class="summary-chips">
      <div class="chip"><div class="chip-label">New Lines</div><div class="chip-val">${nl.length} item${nl.length!==1?'s':''}</div></div>
      <div class="chip"><div class="chip-label">Replenishments</div><div class="chip-val">${repl.length} item${repl.length!==1?'s':''}</div></div>
      <div class="chip"><div class="chip-label">NL Total Value</div><div class="chip-val green">${fmtGBP(totalNLVal)}</div></div>
      <div class="chip"><div class="chip-label">Repl Total Value</div><div class="chip-val green">${fmtGBP(totalReplVal)}</div></div>
    </div>
    ${nl.length?`<h2>New Lines (${nl.length})</h2>
    <table><thead><tr><th>Product</th><th>Supplier</th><th>Date</th><th style="text-align:right">Qty</th><th style="text-align:right">Unit Cost</th><th style="text-align:right">Total</th></tr></thead>
    <tbody>${nlRows}<tr class="total-row"><td colspan="5">New Lines Total</td><td style="text-align:right">${fmtGBP(totalNLVal)}</td></tr></tbody></table>`:''}
    ${repl.length?`<h2>Replenishments (${repl.length})</h2>
    <table><thead><tr><th>Product</th><th>Supplier</th><th>Date</th><th style="text-align:right">Qty</th><th style="text-align:right">Unit Cost</th><th style="text-align:right">Total</th></tr></thead>
    <tbody>${replRows}<tr class="total-row"><td colspan="5">Replenishments Total</td><td style="text-align:right">${fmtGBP(totalReplVal)}</td></tr></tbody></table>`:''}
    <div class="grand-total">
      <div class="grand-total-label">Grand Total · ${nl.length+repl.length} items</div>
      <div class="grand-total-val">${fmtGBP(grandTotal)}</div>
    </div>
    <div class="footer"><span>Pharm & Dom · Internal Use Only</span><span>Generated ${fmtDateTime(new Date().toISOString())}</span></div>
    </body></html>`;

    const win=window.open('','_blank');
    win.document.write(html);
    win.document.close();
    setTimeout(()=>{ win.focus(); win.print(); },500);
    window.closeCbPdfModal();
  };

  /* ── TOAST ── */
  function _cbToast(msg, type) {
    if (window.showToast) { window.showToast(msg,type); return; }
    const c=document.getElementById('cbToastContainer'); if(!c) return;
    const t=document.createElement('div');
    t.style.cssText=`display:flex;align-items:center;gap:9px;padding:11px 16px;border-radius:10px;font-size:13px;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.18);animation:toastIn .2s ease;max-width:320px;color:#fff;pointer-events:auto;background:${type==='success'?'#15803d':type==='error'?'#dc2626':'#1e40af'};`;
    t.textContent=msg; c.appendChild(t); setTimeout(()=>t.remove(),3000);
  }

  /* ── INIT ── */
  _updateTypeDropdown();
  window.renderCentralBasket();
})();
</script>
