  window.pgxUploadVideo = function(inp){
    var f = inp.files && inp.files[0]; if(!f) return;
    var k = st.key, old = videos && videos[k];
    var path = k + '/' + Date.now() + '-' + f.name.replace(/[^\w.-]+/g,'_');
    vNote('Uploading '+f.name+' ('+(f.size/1048576).toFixed(1)+' MB)… keep this panel open.');
    window.sb.storage.from('page-guides').upload(path, f, { contentType: f.type || 'video/mp4', upsert:false }).then(function(r){
      if (r.error) throw r.error;
      var url = window.sb.storage.from('page-guides').getPublicUrl(path).data.publicUrl;
      return saveVideoRow({ page_key:k, url:url, kind:'upload', storage_path:path }).then(function(){ return removeStored(old); });
    }).then(loadVideos).then(function(){ render(); vNote('Video uploaded ✓'); })
      .catch(function(e){ vNote('Upload failed: '+((e&&e.message)||e)+(f.size>50*1048576?' — the file may be too large; try a link instead.':''), true); });
    inp.value = '';
  };
  window.pgxSaveLink = function(){
    var url = (document.getElementById('pgxVUrl').value||'').trim();
    if (!/^https?:\/\//i.test(url)) { vNote('Paste a full link starting with https://', true); return; }
    var k = st.key, old = videos && videos[k];
    vNote('Saving…');
    saveVideoRow({ page_key:k, url:url, kind:'link', storage_path:null }).then(function(){ return removeStored(old); })
      .then(loadVideos).then(function(){ render(); vNote('Video link saved ✓'); })
      .catch(function(e){ vNote('Could not save: '+((e&&e.message)||e), true); });
  };
  window.pgxRemoveVideo = function(){
    var k = st.key, old = videos && videos[k]; if(!old) return;
    if (!confirm('Remove the video from the '+GUIDES[k].name+' guide?')) return;
    window.sb.from('page_guide_videos').delete().eq('page_key', k).then(function(r){ if(r.error) throw r.error; return removeStored(old); })
      .then(loadVideos).then(function(){ render(); }).catch(function(e){ vNote('Could not remove: '+((e&&e.message)||e), true); });
  };

  /* ════════ RENDER ════════ */
  function render(){
    if (st.view === 'list' || !st.key) return renderList();
    var k = st.key, g = GUIDES[k], here = isHere(k);
    var tabs = [['overview','Overview',0],['actions','Quick actions',g.actions.length],['how','How it works',g.steps.length],['tips','Tips',g.tips.length]]
      .filter(function(t){ return t[0]==='overview' || t[2]; });
    if (!tabs.some(function(t){ return t[0]===st.tab; })) st.tab = 'overview';
    var h = '<div class="pgx-top"><div class="pgx-toprow">'
      + '<div class="pgx-ico">'+svg(SEC_ICON[g.section]||SEC_ICON.Widget)+'</div>'
      + '<div class="pgx-ttl"><div class="pgx-name">'+esc(g.name)+'</div><div class="pgx-meta">'+esc(SEC_LABEL[g.section]||g.section)+(here?' <span class="pgx-here">You’re here</span>':'')+'</div></div>'
      + '<button class="pgx-allbtn" onclick="pgxShowList()">'+svg('<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>')+'All guides</button>'
      + '</div><div class="pgx-tabs">'
      + tabs.map(function(t){ return '<button class="pgx-tab'+(st.tab===t[0]?' active':'')+'" onclick="pgxTab(\''+t[0]+'\')">'+t[1]+(t[2]?'<span class="n">'+t[2]+'</span>':'')+'</button>'; }).join('')
      + '</div></div><div class="pgx-body" id="pgxBody">' + tabHtml(k) + '</div>';
    // footer
    var hasTour = g.tour && g.tour.length;
    h += '<div class="pgx-foot"><div class="pgx-foot-hint"><span class="pgx-kbd">Ctrl</span><span class="pgx-kbd">G</span> opens guides anywhere</div>';
    if (!g.panel && !here) h += '<button class="pgx-btn ghost" onclick="pgxOpenPage()">Open page</button>';
    if (g.panel) h += '<button class="pgx-btn ghost" onclick="pgPanel(\''+g.panel+'\')">Open '+esc(g.name)+'</button>';
    if (hasTour) h += '<button class="pgx-btn" onclick="pgxTour()">'+svg('<polygon points="5 3 19 12 5 21 5 3"/>')+'Take the tour</button>';
    h += '</div>';
    root.innerHTML = h;
  }
  function tabHtml(k){
    var g = GUIDES[k];
    if (st.tab === 'overview'){
      var h = videoHtml(k) + '<p class="pgx-sum">'+g.summary+'</p>';
      var gl = [];
      if (g.actions.length) gl.push(['actions', g.actions.length, 'Quick actions']);
      if (g.steps.length) gl.push(['how', g.steps.length, 'Steps']);
      if (g.tips.length) gl.push(['tips', g.tips.length, 'Tips']);
      if (gl.length) h += '<div class="pgx-glance">'+gl.map(function(x){ return '<div class="pgx-gl" onclick="pgxTab(\''+x[0]+'\')"><b>'+x[1]+'</b><span>'+x[2]+'</span></div>'; }).join('')+'</div>';
      if (g.tour && g.tour.length) h += '<div class="pgx-tourcta" onclick="pgxTour()"><div class="i">'+svg('<polygon points="5 3 19 12 5 21 5 3"/>')+'</div><div><b>Take the guided tour</b><span>'+g.tour.length+' quick stops — we’ll point out each part of the page'+(isHere(k)?'':' (opens the page first)')+'</span></div></div>';
      return h;
    }
    if (st.tab === 'actions'){
      return '<p class="pgx-sub">'+(g.panel||isHere(k)?'Tap a card to do it now.':'Tap a card — we’ll open the page and take you there.')+'</p>'
        + g.actions.map(function(a,i){
            var run = !!a.run;
            return '<div class="pgx-card'+(run?' run':'')+'"'+(run?' onclick="pgxAction('+i+')"':'')+'><div class="pgx-cic '+esc(a.c||'blue')+'">'+svg(ACT_ICON)+'</div>'
              + '<div class="pgx-ct"><b>'+esc(a.t)+'</b><p>'+a.d+'</p></div>'
              + (run?'<div class="pgx-go">Go'+svg('<polyline points="9 18 15 12 9 6"/>',2.5)+'</div>':'')+'</div>';
          }).join('');
    }
    if (st.tab === 'how'){
      return '<div class="pgx-steps">'+g.steps.map(function(s,i){ return '<div class="pgx-step"><div class="pgx-num">'+(i+1)+'</div><div class="pgx-st"><b>'+esc(s.t)+'</b><p>'+s.d+'</p></div></div>'; }).join('')+'</div>';
    }
    if (st.tab === 'tips'){
      return g.tips.map(function(t){ return '<div class="pgx-tip">'+svg('<path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.74V17h8v-2.26A7 7 0 0 0 12 2z"/>')+'<div>'+t+'</div></div>'; }).join('');
    }
    return '';
  }
  function renderList(){
    var q = (st.q||'').toLowerCase().trim();
    var keys = Object.keys(GUIDES).filter(canSee).filter(function(k){
      if (!q) return true; var g = GUIDES[k];
      return (g.name+' '+g.section+' '+g.summary.replace(/<[^>]+>/g,'')).toLowerCase().indexOf(q) >= 0;
    });
    var cur = guideForPage(ctx.current);
    var h = '<div class="pgx-top" style="padding-bottom:14px"><div class="pgx-toprow" style="margin-bottom:0">'
      + '<div class="pgx-ico">'+svg('<path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>')+'</div>'
      + '<div class="pgx-ttl"><div class="pgx-name">All guides</div><div class="pgx-meta">'+Object.keys(GUIDES).filter(canSee).length+' guides for the pages you can open</div></div>'
      + (cur && canSee(cur) ? '<button class="pgx-allbtn" onclick="pgxOpen(\''+cur+'\')">This page</button>' : '')
      + '</div></div><div class="pgx-body" id="pgxBody">'
      + '<div class="pgx-search">'+svg('<circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>')+'<input class="pgx-input" id="pgxQ" placeholder="Search guides…" value="'+esc(st.q||'')+'" oninput="pgxSearch(this.value)"></div>';
    if (!keys.length) h += '<div class="pgx-empty">No guides match “'+esc(st.q)+'”.</div>';
    SEC_ORDER.forEach(function(sec){
      var ks = keys.filter(function(k){ return GUIDES[k].section === sec; }); if (!ks.length) return;
      h += '<div class="pgx-sec">'+esc(SEC_LABEL[sec]||sec)+'</div>';
      ks.forEach(function(k){
        var g = GUIDES[k], plain = g.summary.replace(/<[^>]+>/g,'');
        h += '<div class="pgx-item'+(k===cur?' cur':'')+'" onclick="pgxOpen(\''+k+'\')"><div class="pgx-ico">'+svg(SEC_ICON[g.section]||SEC_ICON.Widget)+'</div>'
          + '<div class="pgx-it"><b>'+esc(g.name)+(k===cur?' <span class="pgx-here">You’re here</span>':'')+'</b><span class="pgx-desc">'+esc(plain)+'</span></div>'
          + (videos && videos[k] ? '<span class="pgx-vdot" title="Has a video"></span>' : '')
          + svg('<polyline points="9 18 15 12 9 6"/>',2.5).replace('<svg','<svg class="pgx-chev"')+'</div>';
      });
    });
    h += '</div>';
    root.innerHTML = h;
    var qi = document.getElementById('pgxQ'); if (qi && st.q){ qi.focus(); qi.setSelectionRange(qi.value.length, qi.value.length); }
  }
  window.pgxTab = function(t){ st.tab = t; render(); var b = document.getElementById('pgxBody'); if(b) b.scrollTop = 0; };
  window.pgxShowList = function(){ st.view = 'list'; render(); };
  window.pgxOpen = function(k){ st.view = 'guide'; st.key = k; st.tab = 'overview'; render(); };
  window.pgxSearch = function(v){ st.q = v; renderList(); };

  /* ════════ GOING TO THE PAGE, ACTIONS, TOUR ════════ */
  function ensureOnPage(k){
    var g = GUIDES[k];
    if (g.panel) return Promise.resolve();
    if (isHere(k)) { if (window.closeWidgetPanel) window.closeWidgetPanel(); return wait(260); }
    var page = targetPage(k);
    if (window.gwGoToPage) window.gwGoToPage(page); else if (window.closeWidgetPanel) window.closeWidgetPanel();
    return waitFor(function(){
      var c = document.getElementById('content');
      var cx = window.gwGuideCtx && window.gwGuideCtx();
      return cx && cx.current === page && c && c.classList.contains('show');
    }, 8000).then(function(){ return wait(700); });
  }
  window.pgxOpenPage = function(){ ensureOnPage(st.key); };
  window.pgxAction = function(i){
    var k = st.key, a = GUIDES[k].actions[i]; if (!a || !a.run) return;
    ensureOnPage(k).then(function(){
      try { (new Function(a.run))(); } catch(e) { console.warn('[Page guide] action failed', e); }
    });
  };
  window.pgxTour = function(){
    var k = st.key, steps = GUIDES[k].tour || [];
    if (!steps.length) return;
    ensureOnPage(k).then(function(){ pgTour(steps, GUIDES[k].name); });
  };

  /* ════════ init ════════ */
  render();
  (videos ? Promise.resolve(videos) : loadVideos()).then(function(){ if (document.getElementById('pgxRoot')) render(); });
  // keep the panel in sync if it is reopened on another page
  window.__pgxRender = render;
})();

/* ════════ SHARED HELPERS (used by guide actions & tours) ════════ */
(function(){
  if (window.__pgHelpers) return; window.__pgHelpers = true;
  var css = document.createElement('style');
  css.textContent =
    '@keyframes pgPulse{0%{box-shadow:0 0 0 0 rgba(59,110,248,.55)}70%{box-shadow:0 0 0 12px rgba(59,110,248,0)}100%{box-shadow:0 0 0 0 rgba(59,110,248,0)}}'
  + '.pg-pulse{animation:pgPulse 1.1s ease-out 3;border-radius:10px;position:relative;z-index:5;outline:2px solid var(--accent,#3b6ef8);outline-offset:3px;}'
  + '.pg-tour-mask{position:fixed;inset:0;z-index:100000;pointer-events:auto;}'
  + '.pg-tour-hole{position:fixed;z-index:100001;border-radius:12px;box-shadow:0 0 0 9999px rgba(10,15,30,.58);outline:2px solid #fff;outline-offset:2px;transition:all .32s cubic-bezier(.4,0,.2,1);pointer-events:none;}'
  + '.pg-tour-tip{position:fixed;z-index:100002;width:320px;max-width:calc(100vw - 24px);background:#fff;border-radius:14px;box-shadow:0 20px 50px rgba(0,0,0,.28);padding:16px 16px 13px;font-family:Inter,system-ui,sans-serif;transition:top .32s cubic-bezier(.4,0,.2,1),left .32s cubic-bezier(.4,0,.2,1);}'
  + '.pg-tour-tip .pt-step{font-size:10px;font-weight:800;letter-spacing:.7px;text-transform:uppercase;color:var(--accent,#3b6ef8);margin-bottom:5px;}'
  + '.pg-tour-tip .pt-title{font-size:14.5px;font-weight:800;color:#0d0f14;margin-bottom:5px;}'
  + '.pg-tour-tip .pt-desc{font-size:12.5px;line-height:1.6;color:#4b5563;}'
  + '.pg-tour-tip .pt-desc strong{color:#0d0f14;}'
  + '.pg-tour-tip .pt-foot{display:flex;align-items:center;gap:8px;margin-top:14px;}'
  + '.pg-tour-tip .pt-dots{display:flex;gap:4px;flex:1;}'
  + '.pg-tour-tip .pt-dot{width:6px;height:6px;border-radius:50%;background:#e5e7eb;transition:all .2s;}'
  + '.pg-tour-tip .pt-dot.on{background:var(--accent,#3b6ef8);width:16px;border-radius:4px;}'
  + '.pg-tour-tip button{padding:7px 12px;border-radius:9px;font-size:12px;font-weight:700;font-family:inherit;cursor:pointer;border:1px solid #e5e7eb;background:#fff;color:#374151;}'
  + '.pg-tour-tip button.pt-next{background:var(--accent,#3b6ef8);border-color:var(--accent,#3b6ef8);color:#fff;}'
  + '.pg-tour-tip .pt-x{position:absolute;top:10px;right:10px;width:26px;height:26px;padding:0;border:none;border-radius:7px;color:#9ca3af;font-size:16px;line-height:1;}'
  + '.pg-tour-tip .pt-x:hover{background:#f1f2f5;color:#374151;}';
  document.head.appendChild(css);

  function wait(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }
  function waitFor(test, timeout){
    return new Promise(function(resolve){
      var t0 = Date.now();
      (function tick(){ var ok = false; try { ok = test(); } catch(e){} if (ok || Date.now()-t0 > (timeout||5000)) resolve(ok); else setTimeout(tick, 120); })();
    });
  }
  window.wait = window.wait || wait;
  window.waitFor = window.waitFor || waitFor;
  function first(sel){ try { var list = document.querySelectorAll(sel); for (var i=0;i<list.length;i++){ var r = list[i].getBoundingClientRect(); if (r.width||r.height) return list[i]; } return null; } catch(e){ return null; } }
  window.pgPulse = function(sel){
    return waitFor(function(){ return first(sel); }, 3000).then(function(){
      var el = first(sel); if (!el) return;
      el.scrollIntoView({ behavior:'smooth', block:'center' });
      el.classList.remove('pg-pulse'); void el.offsetWidth; el.classList.add('pg-pulse');
      setTimeout(function(){ el.classList.remove('pg-pulse'); }, 3400);
    });
  };
  window.pgFocus = function(sel){
    return waitFor(function(){ return first(sel); }, 3000).then(function(){ var el = first(sel); if (!el) return; el.focus(); window.pgPulse(sel); });
  };
  window.pgClick = function(sel){
    return waitFor(function(){ return first(sel); }, 3000).then(function(){ var el = first(sel); if (el) el.click(); });
  };
  window.pgCall = function(fn){
    var args = Array.prototype.slice.call(arguments, 1);
    return waitFor(function(){ return typeof window[fn] === 'function'; }, 3000).then(function(){ if (typeof window[fn] === 'function') return window[fn].apply(window, args); });
  };
  window.pgPanel = function(kind){
    if (typeof window.openWidgetPanel !== 'function') return Promise.resolve();
    window.openWidgetPanel(kind);
    return wait(700);
  };

  /* ════════ GUIDED TOUR ════════ */
  var T = null;
  window.pgTour = function(steps, name){
    pgTourEnd();
    // Steps whose part of the page isn't showing right now (e.g. no data loaded yet) still show, centred
    var usable = steps.slice();
    if (!usable.length) return;
    T = { steps: usable, i: 0, name: name };
    T.mask = document.createElement('div'); T.mask.className = 'pg-tour-mask';
    T.mask.addEventListener('click', function(e){ e.stopPropagation(); });
    T.hole = document.createElement('div'); T.hole.className = 'pg-tour-hole';
    T.tip = document.createElement('div'); T.tip.className = 'pg-tour-tip';
    document.body.appendChild(T.mask); document.body.appendChild(T.hole); document.body.appendChild(T.tip);
    T.onKey = function(e){
      if (!T) return;
      if (e.key === 'Escape') { e.preventDefault(); e.stopImmediatePropagation(); pgTourEnd(); }
      else if (e.key === 'ArrowRight' || e.key === 'Enter') { e.preventDefault(); e.stopImmediatePropagation(); pgTourGo(1); }
      else if (e.key === 'ArrowLeft') { e.preventDefault(); e.stopImmediatePropagation(); pgTourGo(-1); }
    };
    T.onResize = function(){ if (T) place(); };
    document.addEventListener('keydown', T.onKey, true);
    window.addEventListener('resize', T.onResize);
    show();
  };
  function target(){ var s = T.steps[T.i]; return first(s.s) || (s.f && first(s.f)); }
  function show(){
    var s = T.steps[T.i], n = T.steps.length, last = T.i === n-1;
    T.tip.innerHTML = '<button class="pt-x" title="End tour (Esc)" onclick="pgTourEnd()">×</button>'
      + '<div class="pt-step">'+(T.name?T.name+' · ':'')+'Step '+(T.i+1)+' of '+n+'</div>'
      + '<div class="pt-title">'+s.t+'</div><div class="pt-desc">'+s.d+'</div>'
      + (target() ? '' : '<div class="pt-desc" style="margin-top:8px;font-size:11.5px;color:#9ca3af">This part of the page appears once there’s data to show.</div>')
      + '<div class="pt-foot"><div class="pt-dots">'+T.steps.map(function(_,j){ return '<span class="pt-dot'+(j===T.i?' on':'')+'"></span>'; }).join('')+'</div>'
      + (T.i>0?'<button onclick="pgTourGo(-1)">Back</button>':'')
      + '<button class="pt-next" onclick="pgTourGo(1)">'+(last?'Finish':'Next')+'</button></div>';
    var el = target();
    if (el) el.scrollIntoView({ behavior:'smooth', block:'center', inline:'nearest' });
    setTimeout(place, 260);
    place();
  }
  function place(){
    if (!T) return;
    var el = target(), pad = 6, vw = window.innerWidth, vh = window.innerHeight;
    T.hole.style.opacity = el ? '1' : '0';
    T.mask.style.background = el ? 'transparent' : 'rgba(10,15,30,.58)';
    if (!el) {
      var tw0 = T.tip.offsetWidth || 320, th0 = T.tip.offsetHeight || 170;
      T.tip.style.top = Math.max(10, vh/2 - th0/2)+'px'; T.tip.style.left = Math.max(10, vw/2 - tw0/2)+'px';
      return;
    }
    var r = el.getBoundingClientRect();
    var top = Math.max(6, r.top - pad), left = Math.max(6, r.left - pad);
    var w = Math.min(vw - 12, r.width + pad*2), h = Math.min(vh - 12, r.height + pad*2);
    T.hole.style.top = top+'px'; T.hole.style.left = left+'px'; T.hole.style.width = w+'px'; T.hole.style.height = h+'px';
    var tw = T.tip.offsetWidth || 320, th = T.tip.offsetHeight || 170, gap = 14, tt, tl;
    if (top + h + gap + th < vh) tt = top + h + gap;           // below
    else if (top - gap - th > 0) tt = top - gap - th;          // above
    else tt = Math.max(10, Math.min(vh - th - 10, top + h/2 - th/2));
    if (tt === top + h + gap || tt === top - gap - th) tl = left + w/2 - tw/2;
    else tl = (left + w + gap + tw < vw) ? left + w + gap : left - gap - tw; // side
    tl = Math.max(10, Math.min(vw - tw - 10, tl));
    T.tip.style.top = tt+'px'; T.tip.style.left = tl+'px';
  }
  window.pgTourGo = function(d){
    if (!T) return;
    var ni = T.i + d;
    if (ni >= T.steps.length) return pgTourEnd();
    if (ni < 0) return;
    T.i = ni; show();
  };
  window.pgTourEnd = function(){
    if (!T) return;
    document.removeEventListener('keydown', T.onKey, true);
    window.removeEventListener('resize', T.onResize);
    [T.mask, T.hole, T.tip].forEach(function(n){ n && n.remove(); });
    T = null;
  };
  window.pgTourActive = function(){ return !!T; };
})();
</script>
