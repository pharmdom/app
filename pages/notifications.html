<style>
.ntf-wrap{display:flex;flex-direction:column;height:100%;font-family:'Inter',system-ui,sans-serif;font-size:13px;color:#0d0f14;}
.ntf-topbar{flex-shrink:0;padding:14px 18px;border-bottom:1px solid #e5e7eb;background:#fff;display:flex;align-items:center;justify-content:space-between;gap:10px;}
.ntf-title{font-size:14px;font-weight:700;color:#0d0f14;}
.ntf-mark-all{font-size:11.5px;font-weight:700;color:#3b6ef8;cursor:pointer;background:none;border:none;font-family:inherit;}
.ntf-mark-all:hover{text-decoration:underline;}
.ntf-mark-all:disabled{opacity:.4;cursor:default;text-decoration:none;}
.ntf-body{flex:1;overflow-y:auto;padding:10px 14px 20px;}
.ntf-body::-webkit-scrollbar{width:4px;}
.ntf-body::-webkit-scrollbar-thumb{background:#e5e7eb;border-radius:4px;}
.ntf-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;gap:10px;text-align:center;color:#9ca3af;}
.ntf-empty svg{width:30px;height:30px;opacity:.4;}
.ntf-empty-title{font-size:13px;font-weight:600;color:#6b7280;}
.ntf-row{display:flex;align-items:flex-start;gap:10px;padding:12px 10px;border-radius:11px;cursor:pointer;transition:background .15s;margin-bottom:2px;}
.ntf-row:hover{background:#f5f6fa;}
.ntf-row.unread{background:#eff6ff;}
.ntf-row.unread:hover{background:#e3edff;}
.ntf-icon{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.ntf-icon svg{width:14px;height:14px;}
.ntf-icon.in_progress{background:#f5f3ff;color:#7c3aed;}
.ntf-icon.completed{background:#f0fdf4;color:#15803d;}
.ntf-icon.comment{background:#eff6ff;color:#3b6ef8;}
.ntf-content{flex:1;min-width:0;}
.ntf-row-title{font-size:12.5px;font-weight:700;color:#0d0f14;line-height:1.35;}
.ntf-row-msg{font-size:12px;color:#6b7280;line-height:1.45;margin-top:2px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
.ntf-row-time{font-size:10.5px;color:#9ca3af;margin-top:4px;}
.ntf-unread-dot{width:7px;height:7px;border-radius:50%;background:#3b6ef8;flex-shrink:0;margin-top:6px;}
</style>

<div class="ntf-wrap">
  <div class="ntf-topbar">
    <div class="ntf-title">Notifications</div>
    <button class="ntf-mark-all" id="ntfMarkAllBtn" onclick="ntfMarkAllRead()">Mark all as read</button>
  </div>
  <div class="ntf-body" id="ntfBody">
    <div class="ntf-empty"><div class="ntf-empty-title">Loading…</div></div>
  </div>
</div>

<script>
(function(){
  const sb = window.sb;
  const myEmail = window.currentUser?.email;
  let ntfItems = [];

  const ICONS = {
    in_progress: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>',
    completed: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>',
    comment: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>',
  };

  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function timeAgo(iso){
    if (!iso) return '';
    const diff = (Date.now() - new Date(iso).getTime()) / 1000;
    if (diff < 60) return 'just now';
    if (diff < 3600) return Math.floor(diff/60) + 'm ago';
    if (diff < 86400) return Math.floor(diff/3600) + 'h ago';
    if (diff < 604800) return Math.floor(diff/86400) + 'd ago';
    return new Date(iso).toLocaleDateString();
  }

  async function ntfLoadList(){
    if (!myEmail) {
      document.getElementById('ntfBody').innerHTML = `<div class="ntf-empty"><div class="ntf-empty-title">Could not identify your account</div></div>`;
      return;
    }
    try {
      const { data, error } = await sb.from('feedback_notifications')
        .select('*')
        .eq('recipient_email', myEmail)
        .order('created_at', { ascending: false })
        .limit(50);
      if (error) throw error;
      ntfItems = data || [];
      ntfRender();
    } catch(e) {
      document.getElementById('ntfBody').innerHTML = `<div class="ntf-empty"><div class="ntf-empty-title">Couldn't load notifications</div></div>`;
    }
  }

  function ntfRender(){
    const body = document.getElementById('ntfBody');
    const markAllBtn = document.getElementById('ntfMarkAllBtn');
    const hasUnread = ntfItems.some(n => !n.is_read);
    markAllBtn.disabled = !hasUnread;

    if (!ntfItems.length) {
      body.innerHTML = `<div class="ntf-empty">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        <div class="ntf-empty-title">No notifications yet</div>
      </div>`;
      return;
    }

    body.innerHTML = ntfItems.map(n => `
      <div class="ntf-row ${n.is_read ? '' : 'unread'}" onclick="ntfOpenItem('${n.id}')">
        <div class="ntf-icon ${n.type}">${ICONS[n.type] || ICONS.comment}</div>
        <div class="ntf-content">
          <div class="ntf-row-title">${esc(n.title)}</div>
          <div class="ntf-row-msg">${esc(n.message || '')}</div>
          <div class="ntf-row-time">${timeAgo(n.created_at)}</div>
        </div>
        ${n.is_read ? '' : '<div class="ntf-unread-dot"></div>'}
      </div>
    `).join('');
  }

  window.ntfOpenItem = async function(id){
    const n = ntfItems.find(x => x.id === id);
    if (!n) return;
    if (!n.is_read) {
      n.is_read = true;
      ntfRender();
      sb.from('feedback_notifications').update({ is_read: true }).eq('id', id).then(() => {
        window.gwRefreshNotifCount && window.gwRefreshNotifCount();
      });
    }
    if (n.feedback_id) {
      window._fbDeepLinkId = n.feedback_id;
      window.openWidgetPanel('feedback');
    }
  };

  window.ntfMarkAllRead = async function(){
    const unreadIds = ntfItems.filter(n => !n.is_read).map(n => n.id);
    if (!unreadIds.length) return;
    ntfItems.forEach(n => n.is_read = true);
    ntfRender();
    try {
      await sb.from('feedback_notifications').update({ is_read: true }).in('id', unreadIds);
      window.gwRefreshNotifCount && window.gwRefreshNotifCount();
    } catch(e) { console.warn('Failed to mark all read', e); }
  };

  ntfLoadList();
})();
</script>
