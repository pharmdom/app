<style>
.pgx{display:flex;flex-direction:column;height:100%;font-family:'Inter',system-ui,sans-serif;font-size:13px;color:#0d0f14;background:#f5f6fa;}
.pgx *{box-sizing:border-box;}
.pgx-top{flex-shrink:0;background:#fff;border-bottom:1px solid #e5e7eb;padding:14px 18px 0;}
.pgx-toprow{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.pgx-ico{width:38px;height:38px;border-radius:11px;background:var(--accent-soft,#3b6ef81f);color:var(--accent,#3b6ef8);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.pgx-ico svg{width:18px;height:18px;}
.pgx-ttl{flex:1;min-width:0;}
.pgx-name{font-size:15.5px;font-weight:800;letter-spacing:-.2px;color:#0d0f14;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pgx-meta{display:flex;align-items:center;gap:6px;margin-top:2px;font-size:11.5px;color:#9ca3af;font-weight:600;}
.pgx-here{font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:#15803d;background:#dcfce7;border-radius:20px;padding:2px 7px;}
.pgx-allbtn{display:inline-flex;align-items:center;gap:6px;padding:7px 11px;border-radius:9px;border:1px solid #e5e7eb;background:#fff;color:#374151;font-size:12px;font-weight:700;font-family:inherit;cursor:pointer;flex-shrink:0;transition:all .15s;}
.pgx-allbtn:hover{border-color:#c7cbd6;background:#fafbfc;}
.pgx-allbtn svg{width:13px;height:13px;}
.pgx-tabs{display:flex;gap:2px;margin:0 -4px;overflow-x:auto;scrollbar-width:none;}
.pgx-tabs::-webkit-scrollbar{display:none;}
.pgx-tab{position:relative;padding:9px 10px 11px;font-size:12.5px;font-weight:700;color:#9ca3af;cursor:pointer;white-space:nowrap;border:none;background:none;font-family:inherit;transition:color .15s;}
.pgx-tab:hover{color:#374151;}
.pgx-tab.active{color:var(--accent,#3b6ef8);}
.pgx-tab.active::after{content:'';position:absolute;left:8px;right:8px;bottom:-1px;height:2.5px;border-radius:3px;background:var(--accent,#3b6ef8);}
.pgx-tab .n{display:inline-block;min-width:16px;margin-left:4px;padding:0 5px;border-radius:10px;background:#f1f2f5;color:#9ca3af;font-size:10px;line-height:16px;text-align:center;}
.pgx-tab.active .n{background:var(--accent-soft,#3b6ef81f);color:var(--accent,#3b6ef8);}
.pgx-body{flex:1;overflow-y:auto;padding:16px 18px 22px;}
.pgx-body::-webkit-scrollbar{width:4px;}
.pgx-body::-webkit-scrollbar-thumb{background:#e5e7eb;border-radius:4px;}
.pgx-foot{flex-shrink:0;background:#fff;border-top:1px solid #e5e7eb;padding:12px 18px;display:flex;align-items:center;gap:10px;}
.pgx-foot-hint{flex:1;font-size:11px;color:#9ca3af;display:flex;align-items:center;gap:5px;}
.pgx-kbd{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:19px;padding:0 5px;border-radius:5px;border:1px solid #e5e7eb;border-bottom-width:2px;background:#fafbfc;font-size:10px;font-weight:700;color:#374151;font-family:inherit;}
.pgx-btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 15px;border-radius:10px;border:none;background:var(--accent,#3b6ef8);color:#fff;font-size:12.5px;font-weight:700;font-family:inherit;cursor:pointer;transition:all .15s;white-space:nowrap;}
.pgx-btn:hover{filter:brightness(1.07);box-shadow:0 4px 14px var(--accent-glow,rgba(59,110,248,.28));}
.pgx-btn.ghost{background:#fff;color:#374151;border:1px solid #e5e7eb;}
.pgx-btn.ghost:hover{background:#fafbfc;box-shadow:none;filter:none;}
.pgx-btn svg{width:14px;height:14px;}
.pgx-btn:disabled{opacity:.55;cursor:default;}
/* overview */
.pgx-sum{font-size:13.5px;line-height:1.65;color:#374151;margin:14px 0 0;}
.pgx-video{position:relative;border-radius:14px;overflow:hidden;background:#0f172a;aspect-ratio:16/9;}
.pgx-video video,.pgx-video iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000;}
.pgx-vph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#cbd5e1;text-align:center;padding:16px;background:radial-gradient(ellipse at 30% 20%,rgba(59,110,248,.35),transparent 60%),linear-gradient(160deg,#1e293b,#0f172a);}
.pgx-play{width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.12);border:1.5px solid rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;color:#fff;}
.pgx-play svg{width:20px;height:20px;margin-left:3px;}
.pgx-vph b{font-size:13px;color:#fff;font-weight:700;}
.pgx-vph span{font-size:11.5px;color:#94a3b8;}
.pgx-vadmin{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
.pgx-vbtn{display:inline-flex;align-items:center;gap:5px;padding:6px 10px;border-radius:8px;border:1px solid #e5e7eb;background:#fff;color:#374151;font-size:11.5px;font-weight:700;font-family:inherit;cursor:pointer;transition:all .15s;}
.pgx-vbtn:hover{border-color:var(--accent,#3b6ef8);color:var(--accent,#3b6ef8);}
.pgx-vbtn.danger:hover{border-color:#ef4444;color:#dc2626;}
.pgx-vbtn svg{width:12px;height:12px;}
.pgx-vlink{display:none;gap:6px;margin-top:8px;}
.pgx-vlink.open{display:flex;}
.pgx-input{flex:1;min-width:0;padding:8px 10px;border:1.5px solid #e5e7eb;border-radius:9px;font-size:12.5px;font-family:inherit;outline:none;background:#fff;color:#0d0f14;}
.pgx-input:focus{border-color:var(--accent,#3b6ef8);box-shadow:0 0 0 3px var(--accent-soft,#3b6ef81f);}
.pgx-vnote{font-size:11px;color:#9ca3af;margin-top:6px;}
.pgx-glance{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px;}
.pgx-gl{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:11px 10px;text-align:center;cursor:pointer;transition:all .15s;}
.pgx-gl:hover{border-color:var(--accent,#3b6ef8);transform:translateY(-1px);}
.pgx-gl b{display:block;font-size:18px;font-weight:800;color:#0d0f14;}
.pgx-gl span{font-size:11px;font-weight:600;color:#6b7280;}
.pgx-tourcta{margin-top:14px;display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:13px;background:linear-gradient(135deg,var(--accent,#3b6ef8),#6366f1);color:#fff;cursor:pointer;transition:all .15s;}
.pgx-tourcta:hover{box-shadow:0 8px 22px var(--accent-glow,rgba(59,110,248,.3));transform:translateY(-1px);}
.pgx-tourcta .i{width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.pgx-tourcta .i svg{width:16px;height:16px;}
.pgx-tourcta b{display:block;font-size:13px;}
.pgx-tourcta span{font-size:11.5px;opacity:.85;}
/* actions */
.pgx-sub{font-size:12px;color:#9ca3af;margin:0 0 12px;}
.pgx-card{display:flex;gap:12px;align-items:flex-start;background:#fff;border:1px solid #e5e7eb;border-radius:13px;padding:13px 14px;margin-bottom:9px;transition:all .15s;}
.pgx-card.run{cursor:pointer;}
.pgx-card.run:hover{border-color:var(--accent,#3b6ef8);box-shadow:0 4px 14px rgba(0,0,0,.05);transform:translateY(-1px);}
.pgx-cic{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.pgx-cic svg{width:15px;height:15px;}
.pgx-cic.blue{background:#eff6ff;color:#2563eb;}.pgx-cic.purple{background:#f5f3ff;color:#7c3aed;}.pgx-cic.green{background:#f0fdf4;color:#16a34a;}.pgx-cic.amber{background:#fffbeb;color:#d97706;}.pgx-cic.red{background:#fef2f2;color:#dc2626;}.pgx-cic.teal{background:#f0fdfa;color:#0d9488;}
.pgx-ct{flex:1;min-width:0;}
.pgx-ct b{display:block;font-size:13px;font-weight:700;color:#0d0f14;margin-bottom:2px;}
.pgx-ct p{margin:0;font-size:12px;line-height:1.55;color:#6b7280;}
.pgx-ct p strong{color:#374151;}
.pgx-go{flex-shrink:0;align-self:center;font-size:11px;font-weight:700;color:var(--accent,#3b6ef8);display:flex;align-items:center;gap:3px;opacity:.75;}
.pgx-card.run:hover .pgx-go{opacity:1;}
.pgx-go svg{width:12px;height:12px;}
/* steps */
.pgx-steps{position:relative;}
.pgx-step{display:flex;gap:13px;position:relative;padding-bottom:16px;}
.pgx-step:not(:last-child)::before{content:'';position:absolute;left:13px;top:30px;bottom:2px;width:2px;background:#e5e7eb;border-radius:2px;}
.pgx-num{width:28px;height:28px;border-radius:50%;background:var(--accent,#3b6ef8);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex-shrink:0;box-shadow:0 2px 8px var(--accent-glow,rgba(59,110,248,.28));}
.pgx-st{flex:1;min-width:0;padding-top:4px;}
.pgx-st b{display:block;font-size:13px;font-weight:700;color:#0d0f14;margin-bottom:3px;}
.pgx-st p{margin:0;font-size:12.5px;line-height:1.6;color:#6b7280;}
.pgx-st p strong{color:#374151;}
/* tips */
.pgx-tip{display:flex;gap:10px;background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:11px 13px;margin-bottom:8px;font-size:12.5px;line-height:1.6;color:#374151;}
.pgx-tip svg{width:16px;height:16px;color:#f59e0b;flex-shrink:0;margin-top:2px;}
.pgx-tip strong{color:#0d0f14;}
.pgx-empty{padding:40px 16px;text-align:center;color:#9ca3af;font-size:12.5px;line-height:1.6;}
/* list */
.pgx-search{position:relative;margin-bottom:12px;}
.pgx-search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:#9ca3af;}
.pgx-search .pgx-input{width:100%;padding-left:33px;}
.pgx-sec{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.7px;color:#9ca3af;margin:16px 2px 7px;}
.pgx-sec:first-child{margin-top:4px;}
.pgx-item{display:flex;align-items:center;gap:11px;background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:10px 12px;margin-bottom:6px;cursor:pointer;transition:all .15s;}
.pgx-item:hover{border-color:var(--accent,#3b6ef8);transform:translateX(2px);}
.pgx-item.cur{border-color:var(--accent,#3b6ef8);background:#fafcff;}
.pgx-item .pgx-ico{width:32px;height:32px;border-radius:9px;}
.pgx-item .pgx-ico svg{width:15px;height:15px;}
.pgx-it{flex:1;min-width:0;}
.pgx-it b{display:block;font-size:13px;font-weight:700;color:#0d0f14;}
.pgx-it .pgx-desc{display:block;font-size:11.5px;color:#9ca3af;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pgx-it .pgx-here{margin-left:6px;vertical-align:1px;}
.pgx-vdot{width:7px;height:7px;border-radius:50%;background:#22c55e;flex-shrink:0;}
.pgx-chev{width:14px;height:14px;color:#c7cbd6;flex-shrink:0;}
@keyframes pgxFade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.pgx-body > *{animation:pgxFade .2s ease both;}
</style>

Rota, calculates each employee's earnings based on their hourly rate, and lets you mark weeks as paid or pending — all in one place.", "actions": [{"t": "Mark a week as paid", "d": "Open an employee and click <strong>Paid</strong> on any pending week — it updates instantly and can be undone.", "c": "green", "run": "pgClick('.emp-row')"}, {"t": "Add a bonus", "d": "Inside an employee’s drawer, click <strong>Bonus</strong> on an unpaid week to add a one-off amount with a note.", "c": "amber", "run": "pgClick('.emp-row')"}, {"t": "Filter by date range", "d": "Narrow to This Week, This Month, Last Month, Last 3 Months or a custom range.", "c": "blue", "run": "pgPulse('.date-filter-bar')"}, {"t": "Download a payslip", "d": "Employees download branded PDF payslips for paid weeks or months from Payment History.", "c": "purple", "run": null}], "steps": [{"t": "Data comes from the Rota", "d": "Every shift saved in the Rota carries the employee's hourly rate at the time it was created. Paycheck multiplies those hours by that rate to calculate each day's earnings. Breaks are automatically excluded from pay calculations."}, {"t": "Shifts are grouped into weeks", "d": "All shifts from Monday to Sunday are grouped into a single week block per employee. Each week shows the total hours, hourly rate, and total pay. The weekly view makes it easy to pay staff in one action rather than shift by shift."}, {"t": "Mark weeks as paid", "d": "Click an employee row to open their detail drawer. Each week has a <strong>Paid</strong> button — clicking it updates all shifts in that week to paid status instantly. You can undo this at any time with the Undo button."}, {"t": "Add bonuses to any week", "d": "For weeks that haven't been paid yet, use the <strong>Bonus</strong> button to add a one-off payment on top of the regular hours. Enter the amount and an optional note (e.g. \"Performance bonus\"). The bonus is stored against the first shift of that week and shows up in payslips."}, {"t": "Emplo
