<style>
.fb-wrap{display:flex;flex-direction:column;height:100%;font-family:'Inter',system-ui,sans-serif;font-size:13px;color:#0d0f14;}
.fb-topbar{flex-shrink:0;padding:14px 18px;border-bottom:1px solid #e5e7eb;background:#fff;display:flex;align-items:center;gap:10px;min-height:24px;}
.fb-tabs{display:flex;gap:5px;flex:1;}
.fb-tab{padding:6px 12px;border-radius:20px;font-size:12px;font-weight:600;color:#6b7280;cursor:pointer;transition:all .15s;user-select:none;}
.fb-tab:hover{background:#f5f6fa;}
.fb-tab.active{background:#3b6ef820;color:#3b6ef8;}
.fb-new-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:9px;border:none;background:#3b6ef8;color:#fff;font-size:12.5px;font-weight:700;font-family:inherit;cursor:pointer;transition:background .15s;white-space:nowrap;}
.fb-new-btn:hover{background:#4c7df9;}
.fb-back-btn{display:inline-flex;align-items:center;gap:7px;padding:7px 12px 7px 8px;border-radius:9px;border:1px solid #e5e7eb;background:#fff;color:#374151;font-size:12.5px;font-weight:600;font-family:inherit;cursor:pointer;transition:all .15s;}
.fb-back-btn:hover{background:#f5f6fa;}
.fb-back-btn svg{width:14px;height:14px;}
.fb-topbar-title{font-size:14px;font-weight:700;color:#0d0f14;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.fb-body{flex:1;overflow-y:auto;padding:14px 18px 24px;}
.fb-body::-webkit-scrollbar{width:4px;}
.fb-body::-webkit-scrollbar-thumb{background:#e5e7eb;border-radius:4px;}
/* list */
.fb-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;gap:10px;text-align:center;color:#9ca3af;}
.fb-empty svg{width:30px;height:30px;opacity:.4;}
.fb-empty-title{font-size:13px;font-weight:600;color:#6b7280;}
.fb-empty-sub{font-size:12px;}
.fb-card{background:#fff;border:1px solid #e5e7eb;border-radius:13px;padding:13px 14px;margin-bottom:9px;cursor:pointer;transition:all .15s;}
.fb-card:hover{border-color:#c7cbd6;box-shadow:0 3px 10px rgba(0,0,0,.05);}
.fb-card-top{display:flex;align-items:flex-start;gap:9px;margin-bottom:7px;}
.fb-type-icon{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.fb-type-icon.bug{background:#fef2f2;color:#dc2626;}
.fb-type-icon.feedback{background:#eff6ff;color:#3b6ef8;}
.fb-type-icon svg{width:14px;height:14px;}
.fb-card-title{font-size:13px;font-weight:700;color:#0d0f14;line-height:1.35;flex:1;min-width:0;}
.fb-card-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:11px;color:#9ca3af;}
.fb-badge{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;padding:2px 8px;border-radius:20px;border:1px solid;white-space:nowrap;}
.fb-badge.pri-low{color:#0d9488;background:#f0fdfa;border-color:#99f6e4;}
.fb-badge.pri-medium{color:#b45309;background:#fffbeb;border-color:#fde68a;}
.fb-badge.pri-high{color:#c2410c;background:#fff7ed;border-color:#fed7aa;}
.fb-badge.pri-critical{color:#dc2626;background:#fef2f2;border-color:#fecaca;}
.fb-badge.st-open{color:#3b6ef8;background:#eff6ff;border-color:#bfdbfe;}
.fb-badge.st-completed{color:#15803d;background:#f0fdf4;border-color:#bbf7d0;}
.fb-card-comments{display:flex;align-items:center;gap:4px;color:#9ca3af;font-size:11px;margin-left:auto;}
.fb-card-comments svg{width:11px;height:11px;}
/* detail */
.fb-detail-hero{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:16px;margin-bottom:16px;}
.fb-detail-badges{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;}
.fb-detail-title{font-size:15.5px;font-weight:800;color:#0d0f14;line-height:1.4;margin-bottom:8px;}
.fb-detail-meta{font-size:11.5px;color:#9ca3af;margin-bottom:14px;line-height:1.7;}
.fb-detail-meta b{color:#374151;font-weight:600;}
.fb-detail-desc{font-size:13px;color:#374151;line-height:1.65;white-space:pre-wrap;margin-bottom:14px;}
.fb-attachments{display:flex;flex-direction:column;gap:8px;margin-bottom:6px;}
.fb-attach-img{max-width:100%;border-radius:10px;border:1px solid #e5e7eb;display:block;}
.fb-attach-video{max-width:100%;border-radius:10px;border:1px solid #e5e7eb;}
.fb-attach-link{display:inline-flex;align-items:center;gap:7px;padding:9px 13px;border-radius:9px;background:#f5f6fa;border:1px solid #e5e7eb;color:#374151;font-size:12.5px;font-weight:600;text-decoration:none;width:fit-content;}
.fb-attach-link svg{width:14px;height:14px;flex-shrink:0;}
.fb-complete-btn{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;padding:10px 0;border-radius:10px;border:none;font-size:12.5px;font-weight:700;font-family:inherit;cursor:pointer;transition:all .15s;margin-top:14px;}
.fb-complete-btn.mark{background:#f0fdf4;color:#15803d;border:1.5px solid #bbf7d0;}
.fb-complete-btn.mark:hover{background:#dcfce7;}
.fb-complete-btn.reopen{background:#f5f6fa;color:#6b7280;border:1.5px solid #e5e7eb;}
.fb-complete-btn.reopen:hover{background:#eceef3;}
.fb-complete-btn svg{width:14px;height:14px;}
/* comments */
.fb-sec-lbl{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:#9ca3af;margin-bottom:10px;display:flex;align-items:center;gap:8px;}
.fb-sec-lbl::after{content:'';flex:1;height:1px;background:#e5e7eb;}
.fb-comment{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:11px 13px;margin-bottom:8px;}
.fb-comment-top{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
.fb-avatar{width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,#3b6ef8,#7c3aed);display:flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:700;color:#fff;flex-shrink:0;}
.fb-comment-author{font-size:12px;font-weight:700;color:#0d0f14;}
.fb-comment-time{font-size:10.5px;color:#9ca3af;margin-left:auto;}
.fb-comment-time.edited{font-style:italic;}
.fb-comment-text{font-size:12.5px;color:#374151;line-height:1.55;white-space:pre-wrap;}
.fb-comment-actions{display:flex;gap:10px;margin-top:7px;}
.fb-comment-action{font-size:11px;font-weight:600;color:#9ca3af;cursor:pointer;transition:color .15s;}
.fb-comment-action:hover{color:#3b6ef8;}
.fb-comment-action.danger:hover{color:#dc2626;}
.fb-comment-edit-box{width:100%;padding:8px 10px;border:1.5px solid #3b6ef8;border-radius:8px;font-size:12.5px;font-family:inherit;color:#0d0f14;resize:vertical;min-height:56px;outline:none;}
.fb-comment-edit-btns{display:flex;gap:6px;margin-top:7px;justify-content:flex-end;}
.fb-mini-btn{padding:5px 11px;border-radius:7px;font-size:11.5px;font-weight:700;font-family:inherit;cursor:pointer;border:1px solid;transition:all .15s;}
.fb-mini-btn.save{background:#3b6ef8;border-color:#3b6ef8;color:#fff;}
.fb-mini-btn.save:hover{background:#4c7df9;}
.fb-mini-btn.cancel{background:#fff;border-color:#e5e7eb;color:#6b7280;}
.fb-mini-btn.cancel:hover{background:#f5f6fa;}
.fb-empty-comments{font-size:12px;color:#9ca3af;text-align:center;padding:16px 0;}
.fb-composer{background:#fff;border:1.5px solid #e5e7eb;border-radius:13px;overflow:hidden;margin-top:12px;transition:border-color .15s;}
.fb-composer:focus-within{border-color:#3b6ef8;box-shadow:0 0 0 3px #3b6ef814;}
.fb-composer textarea{width:100%;border:none;outline:none;resize:none;padding:11px 13px;font-size:12.5px;font-family:inherit;color:#0d0f14;min-height:52px;max-height:110px;}
.fb-composer-bottom{display:flex;justify-content:flex-end;padding:8px 11px;border-top:1px solid #f1f2f5;background:#fafbfc;}
.fb-post-btn{padding:7px 14px;border-radius:8px;border:none;background:#3b6ef8;color:#fff;font-size:12px;font-weight:700;font-family:inherit;cursor:pointer;transition:background .15s;}
.fb-post-btn:hover{background:#4c7df9;}
.fb-post-btn:disabled{opacity:.45;cursor:default;}
/* form */
.fb-form-group{margin-bottom:14px;}
.fb-form-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:#6b7280;margin-bottom:6px;display:block;}
.fb-input,.fb-textarea,.fb-select{width:100%;padding:9px 11px;border:1.5px solid #e5e7eb;border-radius:9px;font-size:13px;font-family:inherit;color:#0d0f14;background:#fff;outline:none;transition:border-color .15s;}
.fb-input:focus,.fb-textarea:focus,.fb-select:focus{border-color:#3b6ef8;}
.fb-textarea{resize:vertical;min-height:76px;}
.fb-type-toggle{display:flex;gap:8px;}
.fb-type-opt{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;padding:10px 0;border-radius:10px;border:1.5px solid #e5e7eb;font-size:12.5px;font-weight:700;color:#6b7280;cursor:pointer;transition:all .15s;user-select:none;}
.fb-type-opt svg{width:14px;height:14px;}
.fb-type-opt.active.bug{border-color:#fecaca;background:#fef2f2;color:#dc2626;}
.fb-type-opt.active.feedback{border-color:#bfdbfe;background:#eff6ff;color:#3b6ef8;}
.fb-file-row{display:flex;align-items:center;gap:8px;}
.fb-file-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:9px;border:1.5px dashed #c7cbd6;background:#fafbfc;color:#6b7280;font-size:12px;font-weight:600;font-family:inherit;cursor:pointer;transition:all .15s;flex-shrink:0;}
.fb-file-btn:hover{border-color:#3b6ef8;color:#3b6ef8;background:#eff6ff;}
.fb-file-btn svg{width:13px;height:13px;}
.fb-file-name{font-size:11.5px;color:#374151;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0;}
.fb-file-clear{width:20px;height:20px;border-radius:6px;border:none;background:#f5f6fa;color:#9ca3af;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.fb-file-clear svg{width:10px;height:10px;}
.fb-submit-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:11px 0;border-radius:10px;border:none;background:#3b6ef8;color:#fff;font-size:13px;font-weight:700;font-family:inherit;cursor:pointer;transition:background .15s;margin-top:6px;}
.fb-submit-btn:hover{background:#4c7df9;}
.fb-submit-btn:disabled{opacity:.5;cursor:default;}
/* delete confirm */
.fb-confirm-overlay{position:fixed;inset:0;background:rgba(12,15,20,.4);z-index:3200;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .18s;padding:20px;}
.fb-confirm-overlay.open{opacity:1;pointer-events:auto;}
.fb-confirm-box{background:#fff;border-radius:16px;padding:20px;width:300px;max-width:100%;box-shadow:0 20px 50px rgba(0,0,0,.2);}
.fb-confirm-box h4{font-size:14px;font-weight:800;color:#0d0f14;margin-bottom:6px;}
.fb-confirm-box p{font-size:12.5px;color:#6b7280;line-height:1.6;margin-bottom:16px;}
.fb-confirm-btns{display:flex;gap:8px;justify-content:flex-end;}
.fb-loading{display:flex;align-items:center;justify-content:center;padding:50px 0;}
.fb-spinner{width:22px;height:22px;border:2.5px solid #e5e7eb;border-top-color:#3b6ef8;border-radius:50%;animation:fbspin .7s linear infinite;}
@keyframes fbspin{to{transform:rotate(360deg);}}
.fb-toast-wrap{position:fixed;bottom:20px;right:20px;z-index:3300;display:flex;flex-direction:column;gap:7px;}
.fb-toast{padding:10px 15px;background:#0d0f14;color:#fff;border-radius:10px;font-size:12.5px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.18);animation:fbtoastin .2s ease;}
.fb-toast.success{background:#14532d;}
.fb-toast.error{background:#7f1d1d;}
@keyframes fbtoastin{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
</style>
<div class="fb-wrap" id="fbWrap">
  <div class="fb-topbar" id="fbTopbar"></div>
  <div class="fb-body" id="fbBody"></div>
</div>
<div class="fb-confirm-overlay" id="fbConfirmOverlay">
  <div class="fb-confirm-box">
    <h4>Delete comment?</h4>
    <p>This can't be undone.</p>
    <div class="fb-confirm-btns">
      <button class="fb-mini-btn cancel" onclick="fbCloseConfirm()">Cancel</button>
      <button class="fb-mini-btn save" style="background:#dc2626;border-color:#dc2626;" id="fbConfirmBtn">Delete</button>
    </div>
  </div>
</div>
<div class="fb-toast-wrap" id="fbToastWrap"></div>
<script>
(function(){
  const sb = window.sb;
  const currentUserName = ((window.currentUser?.firstName||'') + ' ' + (window.currentUser?.lastName||'')).trim() || 'Unknown';

  let fbItems = [];
  let fbFilter = 'all';
  let fbCurrentItem = null;
  let fbCurrentComments = [];
  let fbPendingImage = null;
  let fbPendingVideo = null;
  let fbConfirmAction = null;

  function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function initials(name){ return (name||'?').split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join(''); }
  function timeAgo(d){
    const diff = (Date.now() - new Date(d).getTime())/1000;
    if (diff < 60) return 'just now';
    if (diff < 3600) return Math.floor(diff/60)+'m ago';
    if (diff < 86400) return Math.floor(diff/3600)+'h ago';
    if (diff < 604800) return Math.floor(diff/86400)+'d ago';
    return new Date(d).toLocaleDateString('en-GB',{day:'numeric',month:'short'});
  }
  function fullDate(d){ return new Date(d).toLocaleString('en-GB',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}); }
  function toast(msg, type){
    const c = document.getElementById('fbToastWrap');
    const t = document.createElement('div');
    t.className = 'fb-toast ' + (type||'');
    t.textContent = msg;
    c.appendChild(t);
    setTimeout(()=>t.remove(), 2800);
  }

  const TYPE_ICON = {
    bug: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 2l1.5 1.5M16 2l-1.5 1.5M12 8v13M12 8a4 4 0 0 1 4 4v1a4 4 0 0 1-8 0v-1a4 4 0 0 1 4-4z"/><path d="M4 15h4M16 15h4M6 20l2.5-2.5M18 20l-2.5-2.5M6 10l2.5 2.5M18 10l-2.5 2.5"/></svg>',
    feedback: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>',
  };
  const PRIORITIES = [
    { key:'low', label:'Low' }, { key:'medium', label:'Medium' },
    { key:'high', label:'High' }, { key:'critical', label:'Critical' },
  ];

  // ── TOPBAR ──
  function renderListTopbar(){
    document.getElementById('fbTopbar').innerHTML = `
      <div class="fb-tabs">
        <span class="fb-tab ${fbFilter==='all'?'active':''}" onclick="fbSetFilter('all')">All</span>
        <span class="fb-tab ${fbFilter==='open'?'active':''}" onclick="fbSetFilter('open')">Open</span>
        <span class="fb-tab ${fbFilter==='completed'?'active':''}" onclick="fbSetFilter('completed')">Completed</span>
      </div>
      <button class="fb-new-btn" onclick="fbShowForm()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        New
      </button>`;
  }
  function renderBackTopbar(title){
    document.getElementById('fbTopbar').innerHTML = `
      <button class="fb-back-btn" onclick="fbShowList()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        Back
      </button>
      <span class="fb-topbar-title">${esc(title)}</span>`;
  }

  // ── LIST ──
  async function fbLoadList(){
    renderListTopbar();
    document.getElementById('fbBody').innerHTML = `<div class="fb-loading"><div class="fb-spinner"></div></div>`;
    try {
      const { data, error } = await sb.from('feedback_bugs').select('*, feedback_bugs_comments(id)').order('created_at', { ascending:false });
      if (error) throw error;
      fbItems = data || [];
      fbRenderList();
    } catch(e) {
      document.getElementById('fbBody').innerHTML = `<div class="fb-empty"><div class="fb-empty-title">Couldn't load items</div><div class="fb-empty-sub">${esc(e.message||'')}</div></div>`;
    }
  }
  function fbSetFilter(f){ fbFilter = f; renderListTopbar(); fbRenderList(); }
  function fbRenderList(){
    const body = document.getElementById('fbBody');
    let items = fbItems;
    if (fbFilter !== 'all') items = items.filter(i => i.status === fbFilter);
    if (!items.length) {
      body.innerHTML = `<div class="fb-empty">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
        <div class="fb-empty-title">Nothing here yet</div>
        <div class="fb-empty-sub">Log a bug or leave feedback to get started.</div>
      </div>`;
      return;
    }
    body.innerHTML = items.map(i => {
      const commentCount = (i.feedback_bugs_comments||[]).length;
      return `<div class="fb-card" onclick="fbOpenItem('${i.id}')">
        <div class="fb-card-top">
          <div class="fb-type-icon ${i.type}">${TYPE_ICON[i.type]||TYPE_ICON.bug}</div>
          <div class="fb-card-title">${esc(i.title)}</div>
        </div>
        <div class="fb-card-meta">
          <span class="fb-badge pri-${i.priority}">${esc(i.priority)}</span>
          <span class="fb-badge st-${i.status}">${i.status === 'completed' ? 'Completed' : 'Open'}</span>
          <span>${esc((i.created_by||'').split(' ')[0])} · ${timeAgo(i.created_at)}</span>
          <span class="fb-card-comments">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
            ${commentCount}
          </span>
        </div>
      </div>`;
    }).join('');
  }
  function fbShowList(){ fbCurrentItem = null; fbLoadList(); }

  // ── NEW FORM ──
  function fbShowForm(){
    renderBackTopbar('New Report');
    fbPendingImage = null; fbPendingVideo = null;
    document.getElementById('fbBody').innerHTML = `
      <div class="fb-form-group">
        <label class="fb-form-label">Type</label>
        <div class="fb-type-toggle">
          <div class="fb-type-opt bug active" id="fbTypeOptBug" onclick="fbSetType('bug')">${TYPE_ICON.bug} Bug</div>
          <div class="fb-type-opt feedback" id="fbTypeOptFeedback" onclick="fbSetType('feedback')">${TYPE_ICON.feedback} Feedback</div>
        </div>
      </div>
      <div class="fb-form-group">
        <label class="fb-form-label">Title</label>
        <input class="fb-input" id="fbTitleInput" type="text" placeholder="Short summary…">
      </div>
      <div class="fb-form-group">
        <label class="fb-form-label">Description</label>
        <textarea class="fb-textarea" id="fbDescInput" placeholder="What happened, or what you'd like to see…"></textarea>
      </div>
      <div class="fb-form-group">
        <label class="fb-form-label">Priority</label>
        <select class="fb-select" id="fbPriorityInput">
          ${PRIORITIES.map(p => `<option value="${p.key}" ${p.key==='medium'?'selected':''}>${p.label}</option>`).join('')}
        </select>
      </div>
      <div class="fb-form-group">
        <label class="fb-form-label">Screenshot (optional)</label>
        <div class="fb-file-row" id="fbImageRow">
          <label class="fb-file-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
            Choose image
            <input type="file" accept="image/*" style="display:none" onchange="fbFileChosen(this,'image')">
          </label>
          <span class="fb-file-name" id="fbImageName"></span>
        </div>
      </div>
      <div class="fb-form-group">
        <label class="fb-form-label">Video (optional)</label>
        <div class="fb-file-row" id="fbVideoRow">
          <label class="fb-file-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
            Choose video
            <input type="file" accept="video/*" style="display:none" onchange="fbFileChosen(this,'video')">
          </label>
          <span class="fb-file-name" id="fbVideoName"></span>
        </div>
      </div>
      <div class="fb-form-group">
        <label class="fb-form-label">Loom link (optional)</label>
        <input class="fb-input" id="fbLoomInput" type="text" placeholder="https://www.loom.com/share/…">
      </div>
      <button class="fb-submit-btn" id="fbSubmitBtn" onclick="fbSubmit()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        Submit
      </button>`;
  }
  function fbSetType(t){
    document.getElementById('fbTypeOptBug').classList.toggle('active', t==='bug');
    document.getElementById('fbTypeOptFeedback').classList.toggle('active', t==='feedback');
    document.getElementById('fbWrap').dataset.selectedType = t;
  }
  function fbFileChosen(input, kind){
    const file = input.files[0];
    if (!file) return;
    if (kind === 'image') { fbPendingImage = file; document.getElementById('fbImageName').textContent = file.name; }
    else { fbPendingVideo = file; document.getElementById('fbVideoName').textContent = file.name; }
  }
  async function fbUploadFile(file, prefix){
    const path = prefix + '/' + Date.now() + '_' + file.name.replace(/[^a-zA-Z0-9_.-]/g,'_');
    const { error } = await sb.storage.from('feedback-uploads').upload(path, file);
    if (error) throw error;
    const { data } = sb.storage.from('feedback-uploads').getPublicUrl(path);
    return data.publicUrl;
  }
  async function fbSubmit(){
    const title = document.getElementById('fbTitleInput').value.trim();
    if (!title) { toast('Please add a title', 'error'); return; }
    const btn = document.getElementById('fbSubmitBtn');
    btn.disabled = true;
    btn.innerHTML = '<div class="fb-spinner" style="width:14px;height:14px;border-width:2px;"></div> Submitting…';
    try {
      let imageUrl = null, videoUrl = null;
      if (fbPendingImage) imageUrl = await fbUploadFile(fbPendingImage, 'images');
      if (fbPendingVideo) videoUrl = await fbUploadFile(fbPendingVideo, 'videos');
      const type = document.getElementById('fbWrap').dataset.selectedType || 'bug';
      const payload = {
        title,
        description: document.getElementById('fbDescInput').value.trim() || null,
        type,
        priority: document.getElementById('fbPriorityInput').value,
        status: 'open',
        image_url: imageUrl,
        video_url: videoUrl,
        loom_url: document.getElementById('fbLoomInput').value.trim() || null,
        created_by: currentUserName,
      };
      const { error } = await sb.from('feedback_bugs').insert(payload);
      if (error) throw error;
      toast('Reported — thanks!', 'success');
      fbShowList();
    } catch(e) {
      toast('Failed to submit: ' + (e.message||''), 'error');
      btn.disabled = false;
      btn.innerHTML = 'Submit';
    }
  }

  // ── DETAIL ──
  async function fbOpenItem(id){
    const item = fbItems.find(i => i.id === id);
    if (!item) return;
    fbCurrentItem = item;
    renderBackTopbar(item.title);
    document.getElementById('fbBody').innerHTML = `<div class="fb-loading"><div class="fb-spinner"></div></div>`;
    try {
      const { data, error } = await sb.from('feedback_bugs_comments').select('*').eq('feedback_id', id).order('created_at', { ascending:true });
      if (error) throw error;
      fbCurrentComments = data || [];
      fbRenderDetail();
    } catch(e) {
      document.getElementById('fbBody').innerHTML = `<div class="fb-empty"><div class="fb-empty-title">Couldn't load comments</div></div>`;
    }
  }
  function fbRenderDetail(){
    const i = fbCurrentItem;
    const attachments = [];
    if (i.image_url) attachments.push(`<img class="fb-attach-img" src="${esc(i.image_url)}" alt="">`);
    if (i.video_url) attachments.push(`<video class="fb-attach-video" src="${esc(i.video_url)}" controls></video>`);
    if (i.loom_url) attachments.push(`<a class="fb-attach-link" href="${esc(i.loom_url)}" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>Open Loom recording</a>`);
    document.getElementById('fbBody').innerHTML = `
      <div class="fb-detail-hero">
        <div class="fb-detail-badges">
          <span class="fb-badge pri-${i.priority}">${esc(i.priority)}</span>
          <span class="fb-badge st-${i.status}">${i.status === 'completed' ? 'Completed' : 'Open'}</span>
        </div>
        <div class="fb-detail-title">${esc(i.title)}</div>
        <div class="fb-detail-meta">
          <b>${esc(i.created_by||'Unknown')}</b> reported this ${timeAgo(i.created_at)} · ${fullDate(i.created_at)}<br>
          ${i.status === 'completed' ? `Marked complete by <b>${esc(i.completed_by||'Unknown')}</b> · ${fullDate(i.completed_at)}` : ''}
        </div>
        ${i.description ? `<div class="fb-detail-desc">${esc(i.description)}</div>` : ''}
        ${attachments.length ? `<div class="fb-attachments">${attachments.join('')}</div>` : ''}
        ${i.status === 'completed'
          ? `<button class="fb-complete-btn reopen" onclick="fbToggleComplete(false)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/></svg>Reopen</button>`
          : `<button class="fb-complete-btn mark" onclick="fbToggleComplete(true)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>Mark Completed</button>`}
      </div>
      <div class="fb-sec-lbl">Comments (${fbCurrentComments.length})</div>
      <div id="fbCommentsList">${fbBuildCommentsHtml()}</div>
      <div class="fb-composer">
        <textarea id="fbCommentInput" placeholder="Add a comment…" oninput="document.getElementById('fbPostBtn').disabled = !this.value.trim()"></textarea>
        <div class="fb-composer-bottom">
          <button class="fb-post-btn" id="fbPostBtn" disabled onclick="fbPostComment()">Post</button>
        </div>
      </div>`;
  }
  function fbBuildCommentsHtml(){
    if (!fbCurrentComments.length) return `<div class="fb-empty-comments">No comments yet — be the first to add one.</div>`;
    return fbCurrentComments.map(c => {
      const mine = (c.author_name||'').trim() === currentUserName.trim();
      return `<div class="fb-comment" id="fbComment_${c.id}">
        <div class="fb-comment-top">
          <div class="fb-avatar">${esc(initials(c.author_name))}</div>
          <span class="fb-comment-author">${esc(c.author_name||'Unknown')}</span>
          <span class="fb-comment-time${c.updated_at ? ' edited':''}">${timeAgo(c.created_at)}${c.updated_at ? ' · edited' : ''}</span>
        </div>
        <div class="fb-comment-body" id="fbCommentBody_${c.id}">
          <div class="fb-comment-text">${esc(c.text)}</div>
          ${mine ? `<div class="fb-comment-actions">
            <span class="fb-comment-action" onclick="fbEditComment('${c.id}')">Edit</span>
            <span class="fb-comment-action danger" onclick="fbDeleteComment('${c.id}')">Delete</span>
          </div>` : ''}
        </div>
      </div>`;
    }).join('');
  }
  async function fbToggleComplete(complete){
    const i = fbCurrentItem;
    const patch = complete
      ? { status:'completed', completed_by: currentUserName, completed_at: new Date().toISOString() }
      : { status:'open', completed_by: null, completed_at: null };
    try {
      const { error } = await sb.from('feedback_bugs').update(patch).eq('id', i.id);
      if (error) throw error;
      Object.assign(i, patch);
      const idx = fbItems.findIndex(x => x.id === i.id);
      if (idx > -1) Object.assign(fbItems[idx], patch);
      fbRenderDetail();
      toast(complete ? 'Marked completed' : 'Reopened', 'success');
    } catch(e) { toast('Failed to update', 'error'); }
  }

  // ── COMMENTS: add / edit / delete ──
  async function fbPostComment(){
    const input = document.getElementById('fbCommentInput');
    const text = input.value.trim();
    if (!text) return;
    const btn = document.getElementById('fbPostBtn');
    btn.disabled = true;
    try {
      const { data, error } = await sb.from('feedback_bugs_comments')
        .insert({ feedback_id: fbCurrentItem.id, author_name: currentUserName, text })
        .select().single();
      if (error) throw error;
      fbCurrentComments.push(data);
      document.getElementById('fbCommentsList').innerHTML = fbBuildCommentsHtml();
      input.value = '';
      const cardIdx = fbItems.findIndex(x => x.id === fbCurrentItem.id);
      if (cardIdx > -1) fbItems[cardIdx].feedback_bugs_comments = fbCurrentComments.map(c=>({id:c.id}));
    } catch(e) {
      toast('Failed to post comment', 'error');
      btn.disabled = false;
    }
  }
  function fbEditComment(id){
    const c = fbCurrentComments.find(x => x.id === id);
    if (!c) return;
    document.getElementById('fbCommentBody_' + id).innerHTML = `
      <textarea class="fb-comment-edit-box" id="fbEditBox_${id}">${esc(c.text)}</textarea>
      <div class="fb-comment-edit-btns">
        <button class="fb-mini-btn cancel" onclick="fbRenderCommentsOnly()">Cancel</button>
        <button class="fb-mini-btn save" onclick="fbSaveComment('${id}')">Save</button>
      </div>`;
  }
  function fbRenderCommentsOnly(){
    document.getElementById('fbCommentsList').innerHTML = fbBuildCommentsHtml();
  }
  async function fbSaveComment(id){
    const newText = document.getElementById('fbEditBox_' + id).value.trim();
    if (!newText) return;
    try {
      const { error } = await sb.from('feedback_bugs_comments').update({ text:newText, updated_at:new Date().toISOString() }).eq('id', id);
      if (error) throw error;
      const c = fbCurrentComments.find(x => x.id === id);
      if (c) { c.text = newText; c.updated_at = new Date().toISOString(); }
      fbRenderCommentsOnly();
      toast('Comment updated', 'success');
    } catch(e) { toast('Failed to save', 'error'); }
  }
  function fbDeleteComment(id){
    fbConfirmAction = async () => {
      try {
        const { error } = await sb.from('feedback_bugs_comments').delete().eq('id', id);
        if (error) throw error;
        fbCurrentComments = fbCurrentComments.filter(c => c.id !== id);
        fbRenderCommentsOnly();
        document.querySelector('.fb-sec-lbl').textContent = `Comments (${fbCurrentComments.length})`;
        toast('Comment deleted', 'success');
      } catch(e) { toast('Failed to delete', 'error'); }
      fbCloseConfirm();
    };
    document.getElementById('fbConfirmOverlay').classList.add('open');
  }
  function fbCloseConfirm(){
    document.getElementById('fbConfirmOverlay').classList.remove('open');
    fbConfirmAction = null;
  }
  document.getElementById('fbConfirmBtn').onclick = () => { if (fbConfirmAction) fbConfirmAction(); };

  // ── expose ──
  window.fbSetFilter = fbSetFilter;
  window.fbShowForm = fbShowForm;
  window.fbShowList = fbShowList;
  window.fbSetType = fbSetType;
  window.fbFileChosen = fbFileChosen;
  window.fbSubmit = fbSubmit;
  window.fbOpenItem = fbOpenItem;
  window.fbToggleComplete = fbToggleComplete;
  window.fbPostComment = fbPostComment;
  window.fbEditComment = fbEditComment;
  window.fbRenderCommentsOnly = fbRenderCommentsOnly;
  window.fbSaveComment = fbSaveComment;
  window.fbDeleteComment = fbDeleteComment;
  window.fbCloseConfirm = fbCloseConfirm;

  fbLoadList();
})();
</script>
