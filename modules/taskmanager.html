<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
.tm-wrap{font-family:'Inter',system-ui,sans-serif;color:#111827;}
.tm-toasts{position:fixed;top:76px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:8px;align-items:flex-end;}
@keyframes tmFadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
.tm-toast{display:flex;align-items:center;gap:8px;padding:11px 16px;border-radius:11px;font-size:13px;font-weight:600;color:#fff;box-shadow:0 8px 24px rgba(0,0,0,.18);min-width:220px;animation:tmFadeIn .18s ease;}
.tm-toast.success{background:#059669;} .tm-toast.error{background:#dc2626;} .tm-toast.info{background:#111827;}
.tm-modal-overlay{position:fixed;inset:0;background:rgba(17,24,39,.65);z-index:2200;display:none;align-items:center;justify-content:center;padding:16px;}
.tm-modal-overlay.open{display:flex;}
.tm-confirm-box{background:#fff;border-radius:16px;padding:22px;width:360px;max-width:100%;box-shadow:0 20px 50px rgba(0,0,0,.2);}
.tm-confirm-box h3{font-size:15px;font-weight:700;margin-bottom:6px;}
.tm-confirm-box p{font-size:13px;color:#6b7280;margin-bottom:18px;line-height:1.5;}
.tm-confirm-actions{display:flex;justify-content:flex-end;gap:8px;}
.tm-btn{padding:8px 15px;border-radius:9px;font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;border:1px solid transparent;transition:all .15s;}
.tm-btn-ghost{background:none;color:#6b7280;} .tm-btn-ghost:hover{background:#f3f4f6;}
.tm-btn-danger{background:#dc2626;color:#fff;} .tm-btn-danger:hover{background:#b91c1c;}
.tm-btn-primary{background:#2563eb;color:#fff;box-shadow:0 1px 2px rgba(37,99,235,.3);} .tm-btn-primary:hover{background:#1d4ed8;}
/* header */
.tm-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px;}
.tm-view-toggle{display:flex;gap:4px;background:#fff;border:1px solid #f1f5f9;border-radius:11px;padding:4px;box-shadow:0 1px 2px rgba(0,0,0,.04);}
.tm-view-btn{display:flex;align-items:center;gap:6px;padding:7px 13px;border-radius:8px;font-size:13px;font-weight:600;color:#6b7280;background:none;border:none;cursor:pointer;font-family:inherit;}
.tm-view-btn.active{background:#eff6ff;color:#2563eb;}
.tm-view-btn svg{width:15px;height:15px;}
.tm-user-badge{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid #f1f5f9;border-radius:11px;padding:6px 13px 6px 6px;box-shadow:0 1px 2px rgba(0,0,0,.04);}
.tm-user-badge span{font-size:13px;font-weight:600;color:#374151;}
/* toolbar */
.tm-toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:10px;}
.tm-toolbar-left{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.tm-pill-btn{position:relative;display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:9px;border:1px solid #e5e7eb;background:#fff;font-size:13px;color:#4b5563;cursor:pointer;font-family:inherit;transition:all .15s;}
.tm-pill-btn:hover{background:#f9fafb;}
.tm-pill-btn svg{width:14px;height:14px;}
.tm-pill-badge{background:#dbeafe;color:#2563eb;font-size:11px;font-weight:700;border-radius:100px;padding:0 6px;}
.tm-popover{position:absolute;z-index:400;top:calc(100% + 6px);left:0;min-width:170px;background:#fff;border-radius:11px;border:1px solid #f1f5f9;box-shadow:0 12px 32px rgba(0,0,0,.14);padding:6px;display:none;}
.tm-popover.right{left:auto;right:0;}
.tm-popover.open{display:block;}
.tm-popover-label{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:#9ca3af;padding:6px 8px 4px;}
.tm-popover-item{width:100%;display:flex;align-items:center;justify-content:space-between;gap:6px;padding:8px 9px;border-radius:8px;background:none;border:none;font-size:13px;color:#4b5563;cursor:pointer;font-family:inherit;text-align:left;}
.tm-popover-item:hover{background:#f9fafb;}
.tm-popover-item.tiny{font-size:11.5px;color:#9ca3af;}
.tm-search-box{display:flex;align-items:center;border:1px solid #e5e7eb;border-radius:9px;background:#fff;overflow:hidden;transition:width .2s;width:36px;}
.tm-search-box.open{width:220px;}
.tm-search-box button{padding:9px;border:none;background:none;color:#6b7280;cursor:pointer;display:flex;flex-shrink:0;}
.tm-search-box input{border:none;outline:none;font-size:13px;flex:1;min-width:0;padding-right:10px;background:transparent;font-family:inherit;}
/* tags/avatars */
.tm-tag{display:inline-flex;align-items:center;padding:3px 9px;border-radius:100px;font-size:11px;font-weight:600;white-space:nowrap;}
.tm-tag-cat{background:#f3f4f6;color:#4b5563;}
.tm-tag-Low{background:#f0f9ff;color:#0284c7;} .tm-tag-Medium{background:#fff7ed;color:#ea580c;} .tm-tag-Urgent{background:#fef2f2;color:#dc2626;}
.tm-tag-status-ToDo{background:#f3f4f6;color:#6b7280;} .tm-tag-status-InProgress{background:#faf5ff;color:#9333ea;} .tm-tag-status-Complete{background:#ecfdf5;color:#059669;}
.tm-avatar{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;flex-shrink:0;box-shadow:0 0 0 2px #fff;}
.tm-avatar-sm{width:24px;height:24px;font-size:10.5px;} .tm-avatar-md{width:32px;height:32px;font-size:13px;} .tm-avatar-lg{width:44px;height:44px;font-size:16px;}
.tm-avatar-stack{display:flex;}
.tm-avatar-stack .tm-avatar{margin-left:-8px;} .tm-avatar-stack .tm-avatar:first-child{margin-left:0;}
.tm-avatar-more{width:24px;height:24px;border-radius:50%;background:#e5e7eb;color:#6b7280;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-left:-8px;box-shadow:0 0 0 2px #fff;}
/* board */
.tm-board{display:flex;gap:18px;overflow-x:auto;padding-bottom:16px;}
.tm-col{display:flex;flex-direction:column;width:320px;flex-shrink:0;}
.tm-col-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px;padding:0 2px;}
.tm-col-head-left{display:flex;align-items:center;gap:8px;min-width:0;}
.tm-col-title{font-size:13.5px;font-weight:700;color:#111827;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tm-col-count{font-size:11px;font-weight:700;color:#9ca3af;background:#f3f4f6;border-radius:100px;padding:1px 8px;}
.tm-col-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.tm-col-add{padding:6px;border-radius:8px;border:none;background:none;color:#9ca3af;cursor:pointer;display:flex;flex-shrink:0;}
.tm-col-add:hover{background:#f3f4f6;color:#374151;}
.tm-col-body{flex:1;border-radius:16px;padding:2px;min-height:60px;transition:background .15s;}
.tm-col-body.over{background:#eff6ff;box-shadow:inset 0 0 0 2px #bfdbfe;}
.tm-col-empty{font-size:12px;color:#d1d5db;text-align:center;padding:28px 10px;border:1.5px dashed #e5e7eb;border-radius:16px;}
.tm-card{position:relative;background:#fff;border:1px solid #f1f5f9;box-shadow:0 1px 2px rgba(0,0,0,.04);border-radius:16px;padding:14px;margin-bottom:11px;cursor:pointer;transition:box-shadow .15s,transform .15s;}
.tm-card:hover{box-shadow:0 6px 18px rgba(0,0,0,.08);transform:translateY(-1px);}
.tm-card-check{position:absolute;top:13px;right:13px;width:19px;height:19px;border-radius:50%;border:2px solid #e5e7eb;background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;}
.tm-card-check.done{background:#059669;border-color:#059669;}
.tm-card-check svg{width:11px;height:11px;color:#fff;}
.tm-card-tags{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-bottom:9px;padding-right:24px;}
.tm-card-title{font-size:13.5px;font-weight:700;color:#111827;line-height:1.35;margin-bottom:3px;}
.tm-card-desc{font-size:11.5px;color:#9ca3af;margin-bottom:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tm-card-row{display:flex;align-items:center;justify-content:space-between;margin-top:9px;}
.tm-card-deadline{display:flex;align-items:center;gap:5px;font-size:11.5px;min-width:0;}
.tm-card-deadline svg{width:12px;height:12px;flex-shrink:0;}
.tm-card-deadline span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tm-card-meta{display:flex;align-items:center;gap:9px;color:#9ca3af;font-size:11px;flex-shrink:0;}
.tm-card-meta span{display:flex;align-items:center;gap:3px;}
.tm-card-meta svg{width:12px;height:12px;}
.tm-card-badge{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:7px;}
/* list */
.tm-list{background:#fff;border:1px solid #f1f5f9;border-radius:16px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.04);}
.tm-list-head{display:grid;grid-template-columns:3fr 1.2fr 1.2fr 1.6fr .6fr;gap:10px;padding:11px 18px;border-bottom:1px solid #f3f4f6;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:#9ca3af;}
.tm-list-row{display:grid;grid-template-columns:3fr 1.2fr 1.2fr 1.6fr .6fr;gap:10px;align-items:center;padding:11px 18px;border-bottom:1px solid #f9fafb;cursor:pointer;transition:background .12s;}
.tm-list-row:last-child{border-bottom:none;} .tm-list-row:hover{background:#f9fafb;}
.tm-list-title{font-size:13px;font-weight:600;color:#111827;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tm-list-deadline{display:flex;align-items:center;gap:6px;min-width:0;} .tm-list-deadline span{font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tm-list-empty{font-size:13px;color:#d1d5db;text-align:center;padding:44px 0;}
/* form modal */
.tm-form-box{background:#fff;border-radius:18px;box-shadow:0 25px 60px rgba(0,0,0,.22);width:100%;max-width:560px;max-height:92vh;overflow-y:auto;scrollbar-width:thin;scrollbar-color:#e2e8f0 transparent;}
.tm-form-box::-webkit-scrollbar{width:6px;}
.tm-form-box::-webkit-scrollbar-track{background:transparent;margin:18px 0;}
.tm-form-box::-webkit-scrollbar-thumb{background:#e2e8f0;border-radius:10px;}
.tm-form-box::-webkit-scrollbar-thumb:hover{background:#cbd5e1;}
  
.tm-modal-overlay.tm-drawer-mode{justify-content:flex-end;align-items:stretch;padding:0;background:rgba(15,23,42,.65);}
.tm-modal-overlay.tm-drawer-mode .tm-form-box{max-width:500px;width:100%;max-height:100vh;height:100%;border-radius:0;box-shadow:-8px 0 40px rgba(0,0,0,.13);animation:tmDrawerIn .28s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;overflow:hidden;}
@keyframes tmDrawerIn{from{transform:translateX(100%);}to{transform:translateX(0);}}
@media(max-width:600px){.tm-modal-overlay.tm-drawer-mode .tm-form-box{max-width:100%;}}
#tmConfirmOverlay{z-index:2400;}

/* Drawer hero (matches basket.html style) */
.tm-drawer-hero{padding:18px 20px 16px;flex-shrink:0;background:linear-gradient(135deg,#1e293b 0%,#0f172a 100%);position:relative;overflow:hidden;}
.tm-drawer-hero::before{content:'';position:absolute;top:-40px;right:-40px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.03);}
.tm-drawer-hero::after{content:'';position:absolute;bottom:-20px;left:20px;width:90px;height:90px;border-radius:50%;background:rgba(59,130,246,.08);}
.tm-drawer-close{position:absolute;top:12px;right:12px;width:28px;height:28px;border:none;border-radius:7px;background:rgba(255,255,255,.1);cursor:pointer;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.65);transition:background .15s;z-index:2;}
.tm-drawer-close:hover{background:rgba(255,255,255,.2);color:#fff;}
.tm-drawer-badge{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:100px;font-size:10px;font-weight:700;margin-bottom:6px;position:relative;z-index:1;}
.tm-drawer-title{font-size:16px;font-weight:700;color:#fff;padding-right:36px;line-height:1.3;margin-bottom:8px;position:relative;z-index:1;}
.tm-drawer-owners{display:flex;align-items:center;gap:7px;position:relative;z-index:1;margin-bottom:12px;}
.tm-drawer-owners span{font-size:11.5px;color:rgba(255,255,255,.55);}
.tm-drawer-kpis{display:grid;grid-template-columns:1fr 1fr;gap:6px;position:relative;z-index:1;}
.tm-kpi{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);border-radius:9px;padding:8px 10px;}
.tm-kpi-label{font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:rgba(255,255,255,.4);margin-bottom:3px;}
.tm-kpi-val{font-size:13px;font-weight:700;color:#fff;line-height:1.2;}
.tm-drawer-tabs{display:flex;border-bottom:1px solid #e2e8f0;background:#fff;flex-shrink:0;}
.tm-drawer-tab{padding:10px 14px;font-size:12.5px;font-weight:700;font-family:inherit;color:#64748b;border:none;background:none;cursor:pointer;border-bottom:2px solid transparent;transition:all .15s;}
.tm-drawer-tab:hover{color:#334155;}
.tm-drawer-tab.active{color:#2563eb;border-bottom-color:#2563eb;background:#fafcff;}
.tm-drawer-tabbody{flex:1;overflow-y:auto;padding:18px 20px;}
.tm-activity-item{display:flex;gap:10px;margin-bottom:14px;}
.tm-activity-item p:first-child{font-size:12px;color:#374151;line-height:1.4;}
.tm-activity-item p:first-child b{font-weight:700;}
.tm-activity-item p:last-child{font-size:10.5px;color:#9ca3af;margin-top:2px;}
  
.tm-form-hdr{position:sticky;top:0;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:16px 22px;border-bottom:1px solid #f3f4f6;border-radius:18px 18px 0 0;z-index:2;}
.tm-form-hdr h3{font-size:15px;font-weight:700;}
.tm-form-close{padding:6px;border-radius:8px;border:none;background:none;color:#9ca3af;cursor:pointer;}
.tm-form-close:hover{background:#f3f4f6;color:#374151;}
.tm-form-body{padding:22px;display:flex;flex-direction:column;gap:17px;}
.tm-flabel{display:block;font-size:11px;font-weight:700;color:#6b7280;margin-bottom:6px;}
.tm-finput,.tm-ftextarea{width:100%;padding:9px 12px;border-radius:9px;border:1px solid #e5e7eb;font-size:13px;font-family:inherit;outline:none;transition:border-color .15s;}
.tm-finput:focus,.tm-ftextarea:focus{border-color:#93c5fd;box-shadow:0 0 0 3px #eff6ff;}
.tm-ftextarea{resize:none;}
.tm-seg{display:flex;flex-wrap:wrap;gap:6px;}
.tm-seg-btn{padding:7px 13px;border-radius:100px;font-size:12.5px;font-weight:600;border:1px solid #e5e7eb;background:#fff;color:#6b7280;cursor:pointer;font-family:inherit;transition:all .15s;}
.tm-seg-btn.active{border-color:transparent;box-shadow:0 0 0 2px #d1d5db;}
.tm-date-row{display:flex;gap:8px;}
.tm-date-row input[type=date]{flex:1;}
.tm-date-row input[type=time]{width:110px;}
.tm-owner-trigger{width:100%;min-height:42px;display:flex;align-items:center;flex-wrap:wrap;gap:6px;padding:7px 10px;border-radius:9px;border:1px solid #e5e7eb;cursor:pointer;background:#fff;}
.tm-owner-chip{display:flex;align-items:center;gap:6px;background:#f3f4f6;border-radius:100px;padding:2px 9px 2px 2px;}
.tm-owner-chip span{font-size:11.5px;font-weight:600;color:#374151;}
.tm-owner-placeholder{color:#9ca3af;font-size:13px;}
.tm-owner-list{max-height:190px;overflow-y:auto;}
.tm-owner-item{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:8px;background:none;border:none;width:100%;cursor:pointer;font-family:inherit;}
.tm-owner-item:hover{background:#f9fafb;}
.tm-owner-item span{font-size:13px;font-weight:600;color:#374151;}
.tm-meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.tm-meta-grid p{font-size:13px;color:#4b5563;}
.tm-meta-user{display:flex;align-items:center;gap:8px;}
.tm-section{border-top:1px solid #f3f4f6;padding-top:16px;}
.tm-add-row{display:flex;gap:8px;margin-top:6px;}
.tm-add-row input{flex:1;min-width:0;padding:7px 10px;font-size:12.5px;border-radius:8px;border:1px solid #e5e7eb;outline:none;}
.tm-add-row button{padding:7px 12px;border-radius:8px;border:none;background:#f3f4f6;color:#4b5563;font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit;}
.tm-comment{display:flex;align-items:flex-start;gap:9px;margin-bottom:11px;}
.tm-comment p:first-child{font-size:11.5px;font-weight:700;color:#374151;}
.tm-comment p:last-child{font-size:12.5px;color:#4b5563;word-break:break-word;}
.tm-comments-list{max-height:150px;overflow-y:auto;margin-bottom:9px;}
.tm-form-ftr{position:sticky;bottom:0;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:14px 22px;border-top:1px solid #f3f4f6;border-radius:0 0 18px 18px;}
.tm-form-err{color:#dc2626;font-size:11.5px;margin-top:5px;}
</style>

<div class="tm-wrap" id="tmWrap">
  <div class="tm-toasts" id="tmToasts"></div>

  <div class="tm-modal-overlay" id="tmConfirmOverlay">
    <div class="tm-confirm-box">
      <h3>Delete this task?</h3>
      <p>This can't be undone. The task and its comments will be removed.</p>
      <div class="tm-confirm-actions">
        <button class="tm-btn tm-btn-ghost" onclick="window.tmCloseConfirm()">Cancel</button>
        <button class="tm-btn tm-btn-danger" onclick="window.tmConfirmDelete()">Delete</button>
      </div>
    </div>
  </div>

  <div class="tm-modal-overlay" id="tmFormOverlay" onclick="if(event.target===this)window.tmCloseForm()"><div id="tmFormBoxHost"></div></div>
  
  <div class="tm-header" id="tmHeader"></div>
  <div class="tm-toolbar" id="tmToolbar"></div>
  <div id="tmBoard"></div>
</div>

<script>
(function(){
  'use strict';
  const sb = window.sb;
  const authUser = window.currentUser || {};
  const authFullName = ((authUser.firstName||'') + ' ' + (authUser.lastName||'')).trim() || 'You';

  const STATUS_LIST = ['To Do','In Progress','Complete'];
  const PRIORITY_LIST = ['Low','Medium','Urgent'];
  const CATEGORY_SUGGESTIONS = ['Warehouse'];
  const AVATAR_COLORS = ['#6366f1','#f43f5e','#f59e0b','#10b981','#0ea5e9','#d946ef','#14b8a6','#f97316'];

  function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function escA(s){ return String(s==null?'':s).replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
  function uid(){ return Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4); }
  function tmSlug(name){ return 'u_' + String(name||'').toLowerCase().trim().replace(/[^a-z0-9]+/g,'_').slice(0,40); }
  function colorForId(id){ let h=0; for(const c of String(id)) h=(h*31+c.charCodeAt(0))>>>0; return AVATAR_COLORS[h % AVATAR_COLORS.length]; }
  function firstName(name){ return (name||'').trim().split(' ')[0]; }
  function formatFull(iso){
    if(!iso) return null;
    const d=new Date(iso);
    return d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}) + ' \u00b7 ' + d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  }
  function deadlineMeta(deadline, status){
    if(!deadline) return { full:'No deadline set', cls:'#9ca3af', badge:null };
    const d=new Date(deadline), now=new Date();
    const diffMs=d-now, diffDays=Math.ceil(diffMs/86400000);
    const full=formatFull(deadline);
    if(status==='Complete') return { full, cls:'#9ca3af', badge:{text:'Done',bg:'#f3f4f6',fg:'#6b7280'} };
    if(diffMs<0){
      const od=Math.abs(Math.floor(diffMs/86400000));
      return { full, cls:'#dc2626', badge:{text: od<1?'Overdue':`Overdue ${od}d`, bg:'#fef2f2', fg:'#dc2626'} };
    }
    if(diffDays===0) return { full, cls:'#d97706', badge:{text:'Due today',bg:'#fffbeb',fg:'#d97706'} };
    if(diffDays<=2) return { full, cls:'#d97706', badge:{text:diffDays+'d left',bg:'#fffbeb',fg:'#d97706'} };
    if(diffDays<=7) return { full, cls:'#374151', badge:{text:diffDays+'d left',bg:'#eff6ff',fg:'#2563eb'} };
    return { full, cls:'#6b7280', badge:{text:diffDays+'d left',bg:'#f3f4f6',fg:'#6b7280'} };
  }
  function sortTasks(tasks, sortBy){
    const arr=[...tasks];
    if(sortBy==='deadline') arr.sort((a,b)=> new Date(a.deadline||8.64e15) - new Date(b.deadline||8.64e15));
    else if(sortBy==='priority'){ const o={Urgent:0,Medium:1,Low:2}; arr.sort((a,b)=>o[a.priority]-o[b.priority]); }
    else if(sortBy==='created') arr.sort((a,b)=> new Date(b.createdAt)-new Date(a.createdAt));
    return arr;
  }
  function defaultDeadline(){
    const d=new Date(); d.setDate(d.getDate()+7);
    return { date:d.toISOString().slice(0,10), time:'17:00' };
  }

  /* ── DATA ── */
  async function ensureCurrentMember(){
    tmCurrentUserId = tmSlug(authFullName);
    if(!tmMembers.find(m=>m.id===tmCurrentUserId)){
      const m={ id:tmCurrentUserId, name:authFullName };
      try{ await sb.from('task_manager_members').upsert(m, {onConflict:'id'}); }catch(e){}
      tmMembers.push(m);
    }
  }
  async function loadAll(){
    try{
      const [taskRes, memRes, userRes] = await Promise.all([
        sb.from('task_manager_tasks').select('*').order('created_at',{ascending:false}),
        sb.from('task_manager_members').select('*').order('created_at',{ascending:true}),
        sb.from('users').select('user_id,first_name,last_name,role').ilike('role','warehouse'),
      ]);
      tmTasks = (taskRes.data||[]).map(rowToTask);
      tmMembers = memRes.data||[];
      tmWarehouseUsers = (userRes.data||[]).map(u=>({ id:u.user_id, name:((u.first_name||'')+' '+(u.last_name||'')).trim() }));
    }catch(e){ console.warn('TM load error', e); tmTasks=[]; tmMembers=[]; tmWarehouseUsers=[]; }
    await ensureCurrentMember();
    renderAll();
  }
  async function addMember(name){
    const m={ id:uid(), name };
    tmMembers.push(m);
    try{ await sb.from('task_manager_members').insert(m); }catch(e){}
    toast(firstName(name)+' added to the team');
    return m.id;
  }
  async function createTask(data){
    const row={
      title:data.title, description:data.description, category:data.category,
      priority:data.priority, status:data.status, deadline:data.deadline,
      owner_ids:data.ownerIds, created_by:tmCurrentUserId, created_by_name:tmCurrentUserName,
      attachments:[], comments:[],
    };
    try{
      const { data:inserted, error } = await sb.from('task_manager_tasks').insert(row).select().single();
      if(error) throw error;
      tmTasks.unshift(rowToTask(inserted));
      await logActivity(inserted.id, 'created this task');
      toast('Task created');
    }catch(e){ toast('Failed to create task','error'); console.warn(e); }
  }
  async function updateTask(id, data){
    const patch={
      title:data.title, description:data.description, category:data.category,
      priority:data.priority, status:data.status, deadline:data.deadline, owner_ids:data.ownerIds,
    };
    tmTasks = tmTasks.map(t=> t.id===id ? { ...t, ...data } : t);
    try{ await sb.from('task_manager_tasks').update(patch).eq('id', id); toast('Task updated'); }
    catch(e){ toast('Failed to update task','error'); }
  }
  async function deleteTask(id){
    tmTasks = tmTasks.filter(t=>t.id!==id);
    try{ await sb.from('task_manager_tasks').delete().eq('id', id); toast('Task deleted','info'); }
    catch(e){ toast('Failed to delete task','error'); }
  }
  async function toggleComplete(id){
    const t=tmTasks.find(x=>x.id===id); if(!t) return;
    const newStatus = t.status==='Complete' ? 'To Do' : 'Complete';
    t.status=newStatus;
    try{ await sb.from('task_manager_tasks').update({status:newStatus}).eq('id', id); }catch(e){}
    renderAll();
  }
  async function addComment(taskId, text){
    const t=tmTasks.find(x=>x.id===taskId); if(!t) return;
    t.comments = [...t.comments, { id:uid(), authorId:tmCurrentUserId, text, createdAt:new Date().toISOString() }];
    try{ await sb.from('task_manager_tasks').update({comments:t.comments}).eq('id', taskId); }catch(e){}
    renderCommentsSection(t);
  }

  function avatarHtml(member, size){
    if(!member) return '';
    const cls = size==='sm'?'tm-avatar-sm':size==='lg'?'tm-avatar-lg':'tm-avatar-md';
    return `<div class="tm-avatar ${cls}" style="background:${colorForId(member.id)}" title="${escA(member.name)}">${esc((member.name||'?').trim().charAt(0).toUpperCase())}</div>`;
  }
  function avatarStackHtml(members, size){
    if(!members.length) return '';
    let html = `<div class="tm-avatar-stack">`;
    members.slice(0,4).forEach(m=> html += avatarHtml(m, size||'sm'));
    html += `</div>`;
    if(members.length>4) html += `<div class="tm-avatar-more">+${members.length-4}</div>`;
    return html;
  }

  /* ── EDIT DRAWER (tabbed, auto-saving) ── */
  function daysToDeadlineLabel(deadline, status){
    if(!deadline) return 'No deadline';
    if(status==='Complete') return 'Done';
    const diffDays = Math.ceil((new Date(deadline)-new Date())/86400000);
    if(diffDays<0) return Math.abs(diffDays)+'d overdue';
    if(diffDays===0) return 'Due today';
    return diffDays+'d left';
  }

      <div class="tm-drawer-owners">${owners.length?avatarStackHtml(owners,'sm'):''}<span>${owners.length?esc(owners.map(o=>firstName(o.name)).join(', ')):'No owners assigned'}</span></div>
      <div class="tm-drawer-kpis">
        <div class="tm-kpi"><div class="tm-kpi-label">Created</div><div class="tm-kpi-val">${esc(formatFull(t.createdAt))}</div></div>
        <div class="tm-kpi"><div class="tm-kpi-label">Deadline</div><div class="tm-kpi-val">${esc(daysToDeadlineLabel(t.deadline, t.status))}</div></div>
      </div>`;
  }
  function refreshDrawerHero(t){
    const host = document.getElementById('tmDrawerHeroHost');
    if(host) host.innerHTML = drawerHeroHtml(t);
  }
  function drawerHtml(t){
    const d = t.deadline ? new Date(t.deadline) : null;
    const dateVal = d ? d.toISOString().slice(0,10) : '';
    const timeVal = d ? d.toTimeString().slice(0,5) : '17:00';
    return `<div class="tm-form-box">
      <div class="tm-drawer-hero" id="tmDrawerHeroHost">${drawerHeroHtml(t)}</div>
      <div class="tm-drawer-tabs">
        <button class="tm-drawer-tab ${tmDrawerTab==='details'?'active':''}" onclick="window.tmSetDrawerTab('details')">Details</button>
        <button class="tm-drawer-tab ${tmDrawerTab==='comments'?'active':''}" onclick="window.tmSetDrawerTab('comments')">Comments</button>
        <button class="tm-drawer-tab ${tmDrawerTab==='activity'?'active':''}" onclick="window.tmSetDrawerTab('activity')">Activity</button>
      </div>
      <div class="tm-drawer-tabbody" id="tmDrawerTabBody">
        <div id="tmTabDetails" style="display:${tmDrawerTab==='details'?'block':'none'};">
          <div style="display:flex;flex-direction:column;gap:17px;">
            <div>
              <label class="tm-flabel">Title</label>
              <input id="tmFTitle" class="tm-finput" value="${escA(t.title)}" onblur="window.tmAutoSaveTitle('${t.id}')">
            </div>
            <div>
              <label class="tm-flabel">Description</label>
              <textarea id="tmFDesc" class="tm-ftextarea" rows="2" placeholder="Optional details" onblur="window.tmAutoSaveDesc('${t.id}')">${esc(t.description)}</textarea>
            </div>
            <div>
              <label class="tm-flabel">Priority</label>
              <div class="tm-seg" id="tmPrioritySeg">${PRIORITY_LIST.map(p=>`<button type="button" class="tm-seg-btn ${t.priority===p?'active':''}" style="${t.priority===p? segBg(p):''}" onclick="window.tmAutoSavePriority('${t.id}','${p}')">${p}</button>`).join('')}</div>
            </div>
            <div>
              <label class="tm-flabel">Status</label>
              <div class="tm-seg" id="tmStatusSeg">${STATUS_LIST.map(s=>`<button type="button" class="tm-seg-btn ${t.status===s?'active':''}" style="${t.status===s? segBgStatus(s):''}" onclick="window.tmAutoSaveStatus('${t.id}','${escA(s)}')">${s}</button>`).join('')}</div>
            </div>
            <div>
              <label class="tm-flabel">Deadline</label>
              <div class="tm-date-row">
                <input type="date" id="tmFDate" class="tm-finput" value="${dateVal}" onchange="window.tmAutoSaveDeadline('${t.id}')">
                <input type="time" id="tmFTime" class="tm-finput" value="${timeVal}" onchange="window.tmAutoSaveDeadline('${t.id}')">
              </div>
            </div>
            <div>
              <label class="tm-flabel">Owner(s)</label>
              <div id="tmOwnerPickerHost" style="position:relative;"></div>
            </div>
          </div>
        </div>
        <div id="tmTabComments" style="display:${tmDrawerTab==='comments'?'block':'none'};">
          <div class="tm-comments-list" id="tmCommentsList"></div>
          <div class="tm-add-row"><input id="tmFCommentInput" placeholder="Write a comment"><button onclick="window.tmSubmitComment('${t.id}')">Post</button></div>
        </div>
        <div id="tmTabActivity" style="display:${tmDrawerTab==='activity'?'block':'none'};">
          <div id="tmActivityList"></div>
        </div>
      </div>
      <div class="tm-form-ftr">
        <button class="tm-btn tm-btn-ghost" style="color:#ef4444;display:flex;align-items:center;gap:6px;" onclick="window.tmRequestDelete('${t.id}')"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>Delete</button>
        <span></span>
      </div>
    </div>`;
  }
  window.tmSetDrawerTab = (tab)=>{
    tmDrawerTab=tab;
    document.querySelectorAll('.tm-drawer-tab').forEach(b=>b.classList.toggle('active', b.textContent.trim()===({details:'Details',comments:'Comments',activity:'Activity'}[tab])));
    document.getElementById('tmTabDetails').style.display = tab==='details'?'block':'none';
    document.getElementById('tmTabComments').style.display = tab==='comments'?'block':'none';
    document.getElementById('tmTabActivity').style.display = tab==='activity'?'block':'none';
    const t = tmTasks.find(x=>x.id===tmFormEditingId);
    if(!t) return;
    if(tab==='activity') renderActivitySection(t);
    if(tab==='comments') renderCommentsSection(t);
  };

  /* ── AUTO-SAVE + ACTIVITY LOG ── */
  async function logActivity(taskId, changeText){
    try{ await sb.from('task_manager_activity').insert({ task_id:String(taskId), actor_name:tmCurrentUserName, change_text:changeText }); }catch(e){}
  }
  async function autoSave(taskId, patch, activityText){
    try{
      await sb.from('task_manager_tasks').update(patch).eq('id', taskId);
      if(activityText) await logActivity(taskId, activityText);
    }catch(e){ toast('Failed to save change','error'); }
  }
  window.tmAutoSaveTitle = async (id)=>{
    const t=tmTasks.find(x=>x.id===id); if(!t) return;
    const val=(document.getElementById('tmFTitle').value||'').trim();
    if(!val || val===t.title) return;
    const old=t.title; t.title=val; refreshDrawerHero(t); renderBoard();
    await autoSave(id, {title:val}, `changed title from "${old}" to "${val}"`);
    if(tmDrawerTab==='activity') renderActivitySection(t);
  };
  window.tmAutoSaveDesc = async (id)=>{
    const t=tmTasks.find(x=>x.id===id); if(!t) return;
    const val=(document.getElementById('tmFDesc').value||'').trim();
    if(val===t.description) return;
    t.description=val; renderBoard();
    await autoSave(id, {description:val}, 'updated the description');
    if(tmDrawerTab==='activity') renderActivitySection(t);
  };
  window.tmAutoSavePriority = async (id,p)=>{
    const t=tmTasks.find(x=>x.id===id); if(!t) return;
    if(t.priority===p) return;
    const old=t.priority; t.priority=p; tmFormPriority=p;
    document.querySelectorAll('#tmPrioritySeg .tm-seg-btn').forEach(b=>{ const on=b.textContent===p; b.classList.toggle('active',on); b.setAttribute('style', on?segBg(p):''); });
    refreshDrawerHero(t); renderBoard();
    await autoSave(id, {priority:p}, `changed priority from ${old} to ${p}`);
    if(tmDrawerTab==='activity') renderActivitySection(t);
  };
  window.tmAutoSaveStatus = async (id,s)=>{
    const t=tmTasks.find(x=>x.id===id); if(!t) return;
    if(t.status===s) return;
    const old=t.status; t.status=s; tmFormStatus=s;
    document.querySelectorAll('#tmStatusSeg .tm-seg-btn').forEach(b=>{ const on=b.textContent===s; b.classList.toggle('active',on); b.setAttribute('style', on?segBgStatus(s):''); });
    refreshDrawerHero(t); renderBoard();
    await autoSave(id, {status:s}, `changed status from ${old} to ${s}`);
    if(tmDrawerTab==='activity') renderActivitySection(t);
  };
  window.tmAutoSaveDeadline = async (id)=>{
    const t=tmTasks.find(x=>x.id===id); if(!t) return;
    const date=document.getElementById('tmFDate').value;
    const time=document.getElementById('tmFTime').value;
    const deadline = date ? new Date(`${date}T${time||'17:00'}:00`).toISOString() : null;
    if(deadline===t.deadline) return;
    t.deadline=deadline; refreshDrawerHero(t); renderBoard();
    await autoSave(id, {deadline}, `changed the deadline to ${deadline?formatFull(deadline):'none'}`);
    if(tmDrawerTab==='activity') renderActivitySection(t);
  };
  
  function renderOwnerPicker(){
    const host=document.getElementById('tmOwnerPickerHost'); if(!host) return;
    const selected = tmWarehouseUsers.filter(m=>tmFormOwnerIds.includes(m.id));
    host.innerHTML = `
      <button type="button" class="tm-owner-trigger" onclick="window.tmToggleOwnerPicker(event)">
        ${selected.length===0? `<span class="tm-owner-placeholder">Select owner or owners</span>`:''}
        ${selected.map(m=>`<span class="tm-owner-chip">${avatarHtml(m,'sm')}<span>${esc(firstName(m.name))}</span></span>`).join('')}
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-left:auto;color:#9ca3af;"><polyline points="6 9 12 15 18 9"/></svg>
      </button>
      <div class="tm-popover ${tmOwnerPickerOpen?'open':''}" style="width:230px;" id="tmOwnerPop">
        <div class="tm-owner-list">
          ${tmWarehouseUsers.length? tmWarehouseUsers.map(m=>`<button type="button" class="tm-owner-item" onclick="window.tmToggleOwner('${escA(m.id)}')">${avatarHtml(m,'sm')}<span>${esc(firstName(m.name))}</span>${tmFormOwnerIds.includes(m.id)?'<span style="margin-left:auto;color:#2563eb;">&#10003;</span>':''}</button>`).join('') : `<div class="tm-popover-item tiny">No warehouse users found</div>`}
        </div>
      </div>`;
  }
  window.tmToggleOwnerPicker = (e)=>{ e.stopPropagation(); tmOwnerPickerOpen=!tmOwnerPickerOpen; renderOwnerPicker(); };

    window.tmToggleOwner = async (id)=>{
    const wasIn = tmFormOwnerIds.includes(id);
    tmFormOwnerIds = wasIn ? tmFormOwnerIds.filter(x=>x!==id) : [...tmFormOwnerIds, id];
    renderOwnerPicker();
    if(tmFormMode!=='edit' || !tmFormEditingId) return;
    const t=tmTasks.find(x=>x.id===tmFormEditingId); if(!t) return;
    t.ownerIds=[...tmFormOwnerIds];
    const person = tmWarehouseUsers.find(m=>m.id===id);
    refreshDrawerHero(t); renderBoard();
    const personName = person?firstName(person.name):'a user';
    await autoSave(t.id, {owner_ids:t.ownerIds}, wasIn ? `removed ${personName} as an owner` : `added ${personName} as an owner`);
    if(tmDrawerTab==='activity') renderActivitySection(t);
  };
  
  document.addEventListener('click', (e)=>{
    const pop=document.getElementById('tmOwnerPop');
    if(pop && tmOwnerPickerOpen && !pop.contains(e.target) && !e.target.closest('.tm-owner-trigger')){ tmOwnerPickerOpen=false; renderOwnerPicker(); }
  });

  window.tmSubmitForm = async ()=>{
    const title=(document.getElementById('tmFTitle').value||'').trim();
    if(!title){ document.getElementById('tmFErr').textContent='Give this task a title first.'; return; }
    const description=(document.getElementById('tmFDesc').value||'').trim();
    const date=document.getElementById('tmFDate').value;
    const time=document.getElementById('tmFTime').value;
    const deadline = date ? new Date(`${date}T${time||'17:00'}:00`).toISOString() : null;
    const ownerIds = tmFormOwnerIds.length ? tmFormOwnerIds : [tmCurrentUserId];
    const data = { title, description, category:'Warehouse', priority:tmFormPriority, status:tmFormStatus, deadline, ownerIds };
    await createTask(data);
    document.getElementById('tmFormOverlay').classList.remove('open');
    renderAll();
  };

  function renderCommentsSection(t){
    const host=document.getElementById('tmCommentsList'); if(!host) return;
    host.innerHTML = t.comments.length ? t.comments.map(c=>{
      const author=tmMembers.find(m=>m.id===c.authorId);
      return `<div class="tm-comment">${author?avatarHtml(author,'sm'):''}<div><p>${author?esc(author.name):'Unknown'}</p><p>${esc(c.text)}</p></div></div>`;
    }).join('') : `<p style="font-size:11.5px;color:#d1d5db;">No comments yet.</p>`;
  }
  window.tmSubmitComment = async (taskId)=>{
    const inp=document.getElementById('tmFCommentInput'); const text=(inp.value||'').trim();
    if(!text) return;
    await addComment(taskId, text);
    inp.value='';
  };

  function renderActivitySection(t){
    const host=document.getElementById('tmActivityList'); if(!host) return;
    host.innerHTML = `<p style="font-size:11.5px;color:#d1d5db;">Loading…</p>`;
    sb.from('task_manager_activity').select('*').eq('task_id', String(t.id)).order('created_at',{ascending:false}).then(({data})=>{
      const el=document.getElementById('tmActivityList'); if(!el) return;
      const rows = data||[];
      el.innerHTML = rows.length ? rows.map(a=>`
        <div class="tm-activity-item">
          ${avatarHtml({id:a.actor_name,name:a.actor_name},'sm')}
          <div><p><b>${esc(a.actor_name)}</b> ${esc(a.change_text)}</p><p>${esc(formatFull(a.created_at))}</p></div>
        </div>`).join('') : `<p style="font-size:11.5px;color:#d1d5db;">No activity yet.</p>`;
    });
  }

  /* ── DELETE CONFIRM ── */
  window.tmRequestDelete = (id)=>{ tmConfirmDeleteId=id; document.getElementById('tmConfirmOverlay').classList.add('open'); };
  window.tmCloseConfirm = ()=>{ tmConfirmDeleteId=null; document.getElementById('tmConfirmOverlay').classList.remove('open'); };
  window.tmConfirmDelete = async ()=>{
    if(!tmConfirmDeleteId) return;
    await deleteTask(tmConfirmDeleteId);
    tmConfirmDeleteId=null;
    document.getElementById('tmConfirmOverlay').classList.remove('open');
    document.getElementById('tmFormOverlay').classList.remove('open');
    renderAll();
  };

  /* ── INIT ── */
  loadAll();
})();
</script>
