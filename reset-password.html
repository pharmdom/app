<!DOCTYPE html>
<html lang="en"> 
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | Pharm & Dom</title>
  <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/pharmdom/app/refs/heads/main/assets/logo_pharm_and_domestic.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --ink: #060912; --text: #f0f4ff; --text-dim: rgba(240,244,255,0.55);
      --text-muted: rgba(240,244,255,0.3); --blue: #3b6ef8;
      --border: rgba(255,255,255,0.08); --border-hover: rgba(255,255,255,0.16);
      --surface: rgba(255,255,255,0.04); --surface-hover: rgba(255,255,255,0.07);
      --success: #22c55e; --error: #f87171;
    }
    html, body { height: 100%; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background-color: var(--ink); color: var(--text);
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; padding: 24px;
    }
    .form-area { width: 100%; max-width: 380px; opacity: 0; transform: translateY(24px); animation: riseIn 0.9s cubic-bezier(0.16,1,0.3,1) 0.15s forwards; }
    @keyframes riseIn { to { opacity: 1; transform: translateY(0); } }
    .mobile-brand { display: flex; flex-direction: column; align-items: center; margin-bottom: 40px; }
    .mobile-brand img { width: 60px; height: 60px; object-fit: contain; margin-bottom: 12px; }
    .mobile-brand h2 { font-size: 20px; font-weight: 600; letter-spacing: -0.3px; }
    .form-header { margin-bottom: 36px; text-align: center; }
    .form-title { font-size: 28px; font-weight: 700; letter-spacing: -0.8px; line-height: 1.2; color: #fff; }
    .form-subtitle { font-size: 14px; color: var(--text-dim); margin-top: 8px; line-height: 1.6; }
    .field { margin-bottom: 20px; }
    .field-label { margin-bottom: 8px; }
    .field-label label { font-size: 13px; font-weight: 500; color: rgba(240,244,255,0.75); letter-spacing: 0.2px; }
    .input-wrap { position: relative; }
    .input-wrap svg.icon-left { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--text-muted); pointer-events: none; transition: color 0.3s ease; }
    .field:focus-within .input-wrap svg.icon-left { color: var(--blue); }
    input[type="password"] {
      width: 100%; padding: 15px 46px; background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; color: var(--text); font-size: 14px; font-family: inherit;
      transition: all 0.3s cubic-bezier(0.4,0,0.2,1); -webkit-appearance: none;
    }
    input::placeholder { color: var(--text-muted); }
    input:hover { border-color: var(--border-hover); background: var(--surface-hover); }
    input:focus { outline: none; background: rgba(59,110,248,0.06); border-color: rgba(59,110,248,0.5); box-shadow: 0 0 0 3px rgba(59,110,248,0.1), inset 0 1px 2px rgba(0,0,0,0.2); }
    .eye-btn { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: var(--text-muted); padding: 4px; display: flex; align-items: center; border-radius: 6px; }
    .eye-btn:hover { color: var(--text-dim); background: rgba(255,255,255,0.05); }
    .field.has-error input { border-color: rgba(248,113,113,0.5); animation: shake 0.45s ease; }
    @keyframes shake { 0%, 100% { transform: translateX(0); } 15%, 45%, 75% { transform: translateX(-5px); } 30%, 60%, 90% { transform: translateX(5px); } }
    .field-error-msg { display: none; font-size: 12px; color: var(--error); margin-top: 6px; padding-left: 4px; }
    .field.has-error .field-error-msg { display: block; }
    .btn-submit { width: 100%; margin-top: 8px; padding: 17px; border: none; border-radius: 12px; background: var(--blue); color: #fff; font-size: 15px; font-weight: 600; font-family: inherit; letter-spacing: -0.2px; cursor: pointer; position: relative; overflow: hidden; transition: all 0.35s cubic-bezier(0.4,0,0.2,1); box-shadow: 0 4px 20px rgba(59,110,248,0.28); }
    .btn-submit:hover { background: #4c7df9; transform: translateY(-2px); box-shadow: 0 8px 30px rgba(59,110,248,0.42); }
    .btn-inner { position: relative; z-index: 2; display: flex; align-items: center; justify-content: center; gap: 8px; height: 22px; }
    .btn-label { transition: all 0.3s ease; }
    .btn-loader { position: absolute; width: 20px; height: 20px; border: 2.5px solid rgba(255,255,255,0.25); border-top-color: #fff; border-radius: 50%; opacity: 0; transform: scale(0.6); transition: all 0.3s ease; }
    .btn-check { position: absolute; opacity: 0; transform: scale(0.5); transition: all 0.4s cubic-bezier(0.34,1.56,0.64,1); }
    .btn-submit.is-loading { pointer-events: none; background: rgba(59,110,248,0.7); }
    .btn-submit.is-loading .btn-label { opacity: 0; transform: scale(0.8); }
    .btn-submit.is-loading .btn-loader { opacity: 1; transform: scale(1); animation: spin 0.75s linear infinite; }
    .btn-submit.is-success { background: var(--success); pointer-events: none; }
    .btn-submit.is-success .btn-label, .btn-submit.is-success .btn-loader { opacity: 0; transform: scale(0.5); }
    .btn-submit.is-success .btn-check { opacity: 1; transform: scale(1); }
    @keyframes spin { to { transform: rotate(360deg); } }
    #statusMsg { text-align: center; font-size: 14px; color: var(--text-dim); padding: 20px 0; }
    .toast-stack { position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column-reverse; align-items: center; gap: 10px; z-index: 9999; pointer-events: none; }
    .toast { display: flex; align-items: center; gap: 12px; padding: 14px 20px; border-radius: 14px; font-size: 14px; font-weight: 500; white-space: nowrap; pointer-events: auto; opacity: 0; transform: translateY(12px) scale(0.96); transition: all 0.45s cubic-bezier(0.34,1.56,0.64,1); backdrop-filter: blur(20px); max-width: 380px; }
    .toast.is-visible { opacity: 1; transform: translateY(0) scale(1); }
    .toast.is-hiding { opacity: 0; transform: translateY(8px) scale(0.94); transition: all 0.35s ease; }
    .toast-error { background: rgba(30,10,10,0.92); border: 1px solid rgba(248,113,113,0.25); color: #fecaca; }
    .toast-success { background: rgba(5,25,15,0.92); border: 1px solid rgba(34,197,94,0.25); color: #bbf7d0; }
    .toast-icon-wrap { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .toast-error .toast-icon-wrap { background: rgba(248,113,113,0.15); }
    .toast-success .toast-icon-wrap { background: rgba(34,197,94,0.15); }
  </style>
</head>
<body>
  <div class="form-area">
    <div class="mobile-brand">
      <img src="https://raw.githubusercontent.com/pharmdom/app/refs/heads/main/assets/logo_pharm_and_domestic.png" alt="Pharm & Dom">
      <h2>Pharm & Dom</h2>
    </div>
    <div class="form-header">
      <h1 class="form-title">Set a new password</h1>
      <p class="form-subtitle">Choose a strong password for your account.</p>
    </div>

        <p id="statusMsg">Verifying your reset link…</p>
    <p id="resetForEmail" style="display:none;text-align:center;font-size:12.5px;color:var(--text-dim);margin-bottom:16px;"></p>

    <form id="resetForm" onsubmit="handleReset(event)" novalidate style="display:none">
      
      <div class="field" id="fieldNewPassword">
        <div class="field-label"><label for="newPassword">New password</label></div>
        <div class="input-wrap">
          <svg class="icon-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <input type="password" id="newPassword" placeholder="At least 8 characters" autocomplete="new-password">
          <button type="button" class="eye-btn" onclick="togglePwd('newPassword','eyeIcon1')" aria-label="Show/hide password">
            <svg id="eyeIcon1" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <div class="field-error-msg" id="newPasswordErr">Password must be at least 8 characters</div>
      </div>
      <div class="field" id="fieldConfirmPassword">
        <div class="field-label"><label for="confirmPassword">Confirm password</label></div>
        <div class="input-wrap">
          <svg class="icon-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <input type="password" id="confirmPassword" placeholder="Re-enter your password" autocomplete="new-password">
          <button type="button" class="eye-btn" onclick="togglePwd('confirmPassword','eyeIcon2')" aria-label="Show/hide password">
            <svg id="eyeIcon2" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <div class="field-error-msg" id="confirmPasswordErr">Passwords do not match</div>
      </div>
      <button type="submit" class="btn-submit" id="resetBtn">
        <div class="btn-inner">
          <span class="btn-label">Update Password</span>
          <div class="btn-loader"></div>
          <svg class="btn-check" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        </div>
      </button>
    </form>
  </div>

  <div class="toast-stack" id="toastStack"></div>

  <script>
    const SUPABASE_URL  = 'https://mbmgcqknbajwndiveewf.supabase.co';
    const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1ibWdjcWtuYmFqd25kaXZlZXdmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk3MjM5NDYsImV4cCI6MjA5NTI5OTk0Nn0.PtMnPnh8FjfS9Qla-D17Jfk-0ArgtKLTRrE52edAVdU';
    const { createClient } = supabase;
    const sb = createClient(SUPABASE_URL, SUPABASE_ANON);

      let recoveryReady = false;

    function showResetForm(session) {
      recoveryReady = true;
      document.getElementById('statusMsg').style.display = 'none';
      document.getElementById('resetForm').style.display = 'block';
      const emailLabel = document.getElementById('resetForEmail');
      if (emailLabel && session && session.user) {
        emailLabel.textContent = 'Resetting password for ' + session.user.email;
        emailLabel.style.display = 'block';
      }
      console.log('[reset] recovery session confirmed for:', session && session.user && session.user.email);
    }

    // Supabase-js fires onAuthStateChange immediately with the current state
    // upon subscription — so this reliably catches PASSWORD_RECOVERY even if
    // the URL's token was processed before this listener attached.
    // Deliberately no fallback to any pre-existing session: an already-logged-in
    // browser must NEVER be treated as proof of a valid recovery link.
    sb.auth.onAuthStateChange((event, session) => {
      console.log('[reset] auth event:', event);
      if (event === 'PASSWORD_RECOVERY') {
        showResetForm(session);
      }
    });

    setTimeout(() => {
      if (!recoveryReady) {
        document.getElementById('statusMsg').textContent = 'This reset link is invalid, expired, or was already used. Please request a new one from the sign-in page.';
      }
    }, 3000);

    function togglePwd(inputId, iconId) {
      const inp = document.getElementById(inputId);
      const icon = document.getElementById(iconId);
      const hide = inp.type === 'password';
      inp.type = hide ? 'text' : 'password';
      icon.innerHTML = hide
        ? `<path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/>`
        : `<path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>`;
    }

    function toast(msg, type = 'error') {
      const stack = document.getElementById('toastStack');
      const el = document.createElement('div');
      const isErr = type === 'error';
      el.className = `toast toast-${type}`;
      el.innerHTML = `
        <div class="toast-icon-wrap">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            ${isErr ? '<circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/>' : '<polyline points="20 6 9 17 4 12"/>'}
          </svg>
        </div>
        <span>${msg}</span>`;
      stack.appendChild(el);
      requestAnimationFrame(() => el.classList.add('is-visible'));
      setTimeout(() => { el.classList.add('is-hiding'); setTimeout(() => el.remove(), 350); }, 4200);
    }

    function setError(fieldId, errId, message) {
      const f = document.getElementById(fieldId);
      const e = document.getElementById(errId);
      f.classList.add('has-error');
      if (message) e.textContent = message;
      f.querySelector('input').addEventListener('input', () => f.classList.remove('has-error'), { once: true });
    }

    async function handleReset(e) {
      e.preventDefault();
      const pwd = document.getElementById('newPassword').value;
      const pwd2 = document.getElementById('confirmPassword').value;
      const btn = document.getElementById('resetBtn');
      ['fieldNewPassword', 'fieldConfirmPassword'].forEach(id => document.getElementById(id).classList.remove('has-error'));

      if (!pwd || pwd.length < 8) { setError('fieldNewPassword', 'newPasswordErr', 'Password must be at least 8 characters'); return; }
      if (pwd !== pwd2) { setError('fieldConfirmPassword', 'confirmPasswordErr', 'Passwords do not match'); return; }

      btn.classList.add('is-loading');
      try {
        const { data, error } = await sb.auth.updateUser({ password: pwd });
        console.log('[reset] updateUser result:', data, error);
        btn.classList.remove('is-loading');
        if (error) { toast(error.message || 'Could not update password. Please try again.'); return; }
        btn.classList.add('is-success');
        toast('Password updated. Redirecting to sign in…', 'success');
        await sb.auth.signOut();
        setTimeout(() => { window.location.href = 'index.html'; }, 1600);
      } catch (err) {
        btn.classList.remove('is-loading');
        toast('Connection error. Please try again.');
      }
    }
  </script>
</body>
</html>
