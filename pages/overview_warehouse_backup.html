<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#eef1f8;--surface:#ffffff;--surface2:#f5f7fc;--surface3:#e8edf7;
  --border:#e2e8f5;--border2:#ecf0f9;
  --text:#0c1526;--text2:#2a3a54;--text3:#64748b;--text4:#98a7bc;
  --accent:#1847d4;--accent-l:#2a5eed;--accent-bg:#eef2fd;--accent-bd:#c4d3f9;
  --green:#0c7a42;--green-bg:#ecfdf5;--green-bd:#86efac;
  --red:#b91c1c;--red-bg:#fef2f2;--red-bd:#fecaca;
  --amber:#92400e;--amber-bg:#fffbeb;--amber-bd:#fde68a;
  --cyan:#0369a1;--cyan-bg:#eff6ff;--cyan-bd:#bfdbfe;
  --purple:#6d28d9;--purple-bg:#f3f0ff;--purple-bd:#c4b5fd;
  --navy:#0c1526;--navy2:#141d2e;
  --r:10px;--r-sm:7px;--r-lg:14px;--r-xl:18px;
  --font:'Plus Jakarta Sans',system-ui,sans-serif;
  --mono:'JetBrains Mono',monospace;
  --sh-sm:0 1px 3px rgba(12,21,38,.06),0 1px 2px rgba(12,21,38,.04);
  --sh:0 4px 16px rgba(12,21,38,.08),0 2px 6px rgba(12,21,38,.04);
  --sh-lg:0 20px 50px rgba(12,21,38,.14),0 6px 16px rgba(12,21,38,.07);
}
html,body{font-family:var(--font);font-size:14px;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden;}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:6px}
::-webkit-scrollbar-thumb:hover{background:var(--text4)}

.pbar{position:fixed;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--amber),#f59e0b);z-index:9999;transform:scaleX(0);transform-origin:left;transition:transform .3s ease;opacity:0;}
.pbar.active{opacity:1;}

.ov-page{background:radial-gradient(ellipse at 20% 0%,rgba(146,64,14,.03) 0%,transparent 60%),radial-gradient(ellipse at 80% 100%,rgba(24,71,212,.03) 0%,transparent 60%),var(--bg);min-height:100vh;}

/* TOPBAR */
.ov-topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 20px;height:50px;background:rgba(255,255,255,.94);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;}
.ov-topbar-left{display:flex;align-items:center;gap:10px;}
.ov-greeting{font-size:13px;font-weight:800;color:var(--text);}
.ov-date{font-size:11px;color:var(--text3);font-weight:500;}
.ov-topbar-right{display:flex;align-items:center;gap:8px;}
.live-pill{display:flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;background:var(--amber-bg);border:1px solid var(--amber-bd);font-size:11px;font-weight:700;color:var(--amber);}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--amber);animation:livePulse 2s ease infinite;}
@keyframes livePulse{0%,100%{opacity:1}50%{opacity:.4}}
.ov-clock{font-family:var(--mono);font-size:11.5px;color:var(--text4);}
.ov-refresh-btn{display:flex;align-items:center;gap:5px;padding:5px 11px;border-radius:var(--r-sm);border:1px solid var(--border);background:var(--surface2);color:var(--text3);font-size:11.5px;font-weight:700;font-family:var(--font);cursor:pointer;transition:all .15s;white-space:nowrap;}
.ov-refresh-btn:hover{border-color:var(--amber-bd);color:var(--amber);background:var(--amber-bg);}
.ov-refresh-btn svg{width:12px;height:12px;flex-shrink:0;}
.ov-refresh-btn.spinning svg{animation:whSpin .7s linear infinite;}
@keyframes whSpin{to{transform:rotate(360deg)}}

/* MAIN */
.ov-main{padding:18px 20px 40px;}
.ov-sec{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--text4);margin-bottom:12px;display:flex;align-items:center;gap:10px;}
.ov-sec::after{content:'';flex:1;height:1px;background:var(--border);}

/* HERO STRIP — 5 cards */
.ov-hero{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:24px;}
.ov-sc{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:14px 16px 13px;position:relative;overflow:hidden;box-shadow:var(--sh-sm);cursor:pointer;transition:transform .18s,box-shadow .18s,border-color .18s;animation:ovFadeUp .3s ease both;}
.ov-sc:hover{transform:translateY(-2px);box-shadow:var(--sh);}
.ov-sc::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;border-radius:var(--r-lg) var(--r-lg) 0 0;background:var(--sc-accent,var(--amber));}
@keyframes ovFadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.ov-sc-icon{position:absolute;top:12px;right:12px;width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:var(--sc-icon-bg,var(--amber-bg));}
.ov-sc-icon svg{width:14px;height:14px;color:var(--sc-icon-col,var(--amber));}
.ov-sc-lbl{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-bottom:7px;}
.ov-sc-val{font-size:28px;font-weight:800;letter-spacing:-1px;color:var(--text);line-height:1;font-family:var(--mono);margin-bottom:4px;}
.ov-sc-val.in{animation:ovNumIn .4s cubic-bezier(.34,1.56,.64,1) both;}
@keyframes ovNumIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.ov-sc-footer{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:6px;}
.ov-sc-footer .ov-sc-sub{margin:0;flex:1;font-size:10.5px;color:var(--text3);}
.ov-sc-badge{display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:20px;font-size:9.5px;font-weight:700;flex-shrink:0;}
.sc-green{--sc-accent:var(--green);--sc-icon-bg:var(--green-bg);--sc-icon-col:var(--green);}
.sc-blue{--sc-accent:var(--accent);--sc-icon-bg:var(--accent-bg);--sc-icon-col:var(--accent-l);}
.sc-amber{--sc-accent:var(--amber);--sc-icon-bg:var(--amber-bg);--sc-icon-col:var(--amber);}
.sc-red{--sc-accent:var(--red);--sc-icon-bg:var(--red-bg);--sc-icon-col:var(--red);}
.sc-purple{--sc-accent:var(--purple);--sc-icon-bg:var(--purple-bg);--sc-icon-col:var(--purple);}
.sc-cyan{--sc-accent:var(--cyan);--sc-icon-bg:var(--cyan-bg);--sc-icon-col:var(--cyan);}
.bg-good{background:var(--green-bg);color:var(--green);border:1px solid var(--green-bd);}
.bg-warn{background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber-bd);}
.bg-crit{background:var(--red-bg);color:var(--red);border:1px solid var(--red-bd);}
.bg-neutral{background:var(--surface2);color:var(--text3);border:1px solid var(--border);}
.bg-info{background:var(--accent-bg);color:var(--accent);border:1px solid var(--accent-bd);}

/* MAIN GRID */
.wh-grid{display:grid;grid-template-columns:360px 1fr;gap:14px;margin-bottom:24px;}

/* QUEUE PANEL */
.queue-panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--sh-sm);display:flex;flex-direction:column;overflow:hidden;animation:ovFadeUp .35s .05s ease both;}
.queue-hdr{padding:13px 16px 11px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.queue-title{font-size:13px;font-weight:800;color:var(--text);}
.queue-badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;}
.queue-scroll{flex:1;overflow-y:auto;max-height:480px;}
.queue-scroll::-webkit-scrollbar{width:3px}
.queue-scroll::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
.queue-item{display:flex;align-items:flex-start;gap:10px;padding:11px 16px;border-bottom:1px solid var(--border2);cursor:pointer;transition:background .12s;}
.queue-item:last-child{border-bottom:none;}
.queue-item:hover{background:var(--amber-bg);}
.queue-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:4px;}
.dot-crit{background:var(--red);}
.dot-warn{background:var(--amber);}
.dot-info{background:var(--accent);}
.queue-body{flex:1;min-width:0;}
.queue-t{font-size:12.5px;font-weight:700;color:var(--text);margin-bottom:2px;line-height:1.3;}
.queue-s{font-size:11px;color:var(--text3);line-height:1.45;}
.queue-meta{font-size:10px;color:var(--text4);margin-top:3px;}
.queue-right{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0;}
.queue-tag{font-size:9.5px;font-weight:700;padding:2px 7px;border-radius:20px;}
.queue-chev svg{width:11px;height:11px;color:var(--text4);}
.queue-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;gap:8px;text-align:center;}
.queue-empty p{font-size:13px;font-weight:700;color:var(--green);}
.queue-empty span{font-size:11px;color:var(--text4);}

/* WORK COLUMN */
.work-col{display:flex;flex-direction:column;gap:12px;}
.work-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:14px 16px;box-shadow:var(--sh-sm);animation:ovFadeUp .35s .08s ease both;cursor:pointer;transition:box-shadow .18s,border-color .18s;}
.work-card:hover{box-shadow:var(--sh);border-color:var(--amber-bd);}
.work-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.work-title{font-size:12.5px;font-weight:700;color:var(--text);}
.work-sub{font-size:11px;color:var(--text3);margin-top:1px;}
.work-link{font-size:11px;font-weight:700;color:var(--text4);display:flex;align-items:center;gap:3px;transition:color .12s;}
.work-card:hover .work-link{color:var(--amber);}
.work-link svg{width:10px;height:10px;}
.sub-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}

/* Mini KPIs */
.mkpi-row{display:flex;gap:8px;}
.mkpi{flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:var(--r);padding:9px 11px;}
.mkpi-lbl{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text4);margin-bottom:4px;}
.mkpi-val{font-size:18px;font-weight:800;color:var(--text);font-family:var(--mono);line-height:1;}
.mkpi-val.green{color:var(--green);}
.mkpi-val.amber{color:var(--amber);}
.mkpi-val.red{color:var(--red);}
.mkpi-val.blue{color:var(--accent);}

/* Progress / stage bars */
.stage-bar{margin-bottom:7px;}
.stage-bar-hdr{display:flex;justify-content:space-between;font-size:10.5px;margin-bottom:3px;}
.stage-bar-lbl{color:var(--text3);font-weight:600;}
.stage-bar-n{font-family:var(--mono);font-weight:700;color:var(--text);}
.stage-track{height:5px;background:var(--surface3);border-radius:99px;overflow:hidden;}
.stage-fill{height:100%;border-radius:99px;transition:width .7s cubic-bezier(.4,0,.2,1);}

/* Order list */
.order-list{display:flex;flex-direction:column;gap:5px;margin-top:4px;}
.order-row{display:flex;align-items:center;justify-content:space-between;padding:6px 10px;border-radius:var(--r-sm);background:var(--surface2);border:1px solid var(--border2);}
.order-row-l{display:flex;align-items:center;gap:7px;}
.order-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.order-lbl{font-size:11.5px;font-weight:600;color:var(--text2);}
.order-val{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--text);}

/* Bar chart */
.bar-chart{display:flex;align-items:flex-end;gap:4px;height:52px;}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;}
.bar-fill{width:100%;border-radius:3px 3px 0 0;min-height:2px;}
.bar-lbl{font-size:8px;color:var(--text4);font-family:var(--mono);}

/* Staff pills */
.staff-pills{display:flex;flex-wrap:wrap;gap:5px;}
.sp{display:flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;}
.sp-wh{background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber-bd);}
.sp-dg{background:var(--purple-bg);color:var(--purple);border:1px solid var(--purple-bd);}
.sp-ad{background:var(--cyan-bg);color:var(--cyan);border:1px solid var(--cyan-bd);}
.sp-av{width:17px;height:17px;border-radius:50%;background:rgba(0,0,0,.12);display:flex;align-items:center;justify-content:center;font-size:7.5px;font-weight:800;}

/* Receiving list */
.recv-list{display:flex;flex-direction:column;gap:6px;}
.recv-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r-sm);background:var(--surface2);border:1px solid var(--border2);}
.recv-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.recv-name{flex:1;font-size:12px;font-weight:700;color:var(--text2);}
.recv-meta{font-size:10px;color:var(--text4);}
.recv-badge{font-size:9.5px;font-weight:700;padding:2px 7px;border-radius:20px;flex-shrink:0;}

/* BOTTOM GRID */
.bottom-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:24px;}
.bottom-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:14px 16px;box-shadow:var(--sh-sm);animation:ovFadeUp .4s .1s ease both;cursor:pointer;transition:box-shadow .18s,border-color .18s;}
.bottom-card:hover{box-shadow:var(--sh);border-color:var(--amber-bd);}
.bottom-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.bottom-title{font-size:12.5px;font-weight:700;color:var(--text);}

/* Rota days */
.rota-days{display:flex;gap:4px;margin-bottom:10px;}
.rota-day{display:flex;flex-direction:column;align-items:center;gap:3px;flex:1;min-width:0;}
.rota-dlbl{font-size:9px;font-weight:700;color:var(--text4);}
.rota-dn{font-size:15px;font-weight:800;font-family:var(--mono);color:var(--text);}
.rota-dbar{width:26px;height:3px;border-radius:2px;background:var(--border);}
.rota-dbar.today{background:var(--amber);}

/* SHIMMER */
.shimmer{position:relative;overflow:hidden;background:var(--surface2);border-radius:var(--r);}
.shimmer::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.7),transparent);animation:shim 1.5s infinite;transform:translateX(-100%);}
@keyframes shim{to{transform:translateX(100%)}}

/* DRAWER */
.ov-drw-overlay{position:fixed;inset:0;background:rgba(12,21,38,.35);z-index:1250;opacity:0;pointer-events:none;transition:opacity .25s;backdrop-filter:blur(2px);}
.ov-drw-overlay.open{opacity:1;pointer-events:all;}
.ov-drw{position:fixed;top:0;right:0;width:520px;max-width:97vw;height:100vh;background:var(--surface);box-shadow:var(--sh-lg);z-index:1300;display:flex;flex-direction:column;transform:translateX(110%);transition:transform .3s cubic-bezier(.4,0,.2,1);overflow:hidden;}
.ov-drw.open{transform:translateX(0);}
.ov-drw-hero{padding:18px 20px 16px;background:linear-gradient(140deg,var(--navy2) 0%,#0d1631 100%);position:relative;overflow:hidden;flex-shrink:0;}
.ov-drw-hero::before{content:'';position:absolute;top:-50px;right:-50px;width:160px;height:160px;border-radius:50%;background:rgba(146,64,14,.12);}
.ov-drw-hero::after{content:'';position:absolute;bottom:-30px;left:30px;width:90px;height:90px;border-radius:50%;background:rgba(255,255,255,.03);}
.ov-drw-close{position:absolute;top:13px;right:13px;width:28px;height:28px;border:none;border-radius:7px;background:rgba(255,255,255,.1);cursor:pointer;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.6);transition:all .15s;z-index:2;}
.ov-drw-close:hover{background:rgba(255,255,255,.2);color:#fff;}
.ov-drw-close svg{width:12px;height:12px;}
.ov-drw-eyebrow{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:rgba(255,255,255,.35);margin-bottom:5px;position:relative;z-index:1;}
.ov-drw-title{font-size:16px;font-weight:800;color:#fff;margin-bottom:3px;padding-right:40px;position:relative;z-index:1;line-height:1.25;}
.ov-drw-sub{font-size:12px;color:rgba(255,255,255,.4);position:relative;z-index:1;}
.ov-drw-body{flex:1;overflow-y:auto;padding:18px 20px;}
.ov-drw-body::-webkit-scrollbar{width:4px;}
.ov-drw-body::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}
.drw-sec-lbl{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--text4);margin-bottom:10px;margin-top:18px;display:flex;align-items:center;gap:8px;}
.drw-sec-lbl:first-child{margin-top:0;}
.drw-sec-lbl::after{content:'';flex:1;height:1px;background:var(--border2);}
.drw-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border2);font-size:12.5px;}
.drw-row:last-child{border-bottom:none;}
.drw-row-k{color:var(--text3);}
.drw-row-v{font-weight:700;color:var(--text2);}
.drw-card{background:var(--surface2);border:1px solid var(--border);border-radius:var(--r);padding:10px 13px;margin-bottom:7px;transition:border-color .12s,background .12s;}
.drw-card:hover{border-color:var(--amber-bd);background:var(--amber-bg);}
.drw-card-t{font-size:12.5px;font-weight:700;color:var(--text);margin-bottom:3px;}
.drw-card-s{font-size:11px;color:var(--text3);}
.drw-nav{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:9px;border:1.5px solid var(--amber-bd);border-radius:var(--r-sm);background:var(--amber-bg);color:var(--amber);font-size:12px;font-weight:700;font-family:var(--font);cursor:pointer;transition:all .15s;margin-top:14px;}
.drw-nav:hover{background:var(--amber);color:#fff;}
.drw-nav svg{width:12px;height:12px;}

/* TOAST */
.ov-toasts{position:fixed;top:16px;right:18px;z-index:9999;display:flex;flex-direction:column;gap:7px;pointer-events:none;}
.ov-toast{display:flex;align-items:center;gap:9px;padding:10px 14px;color:#fff;border-radius:var(--r);font-size:12.5px;font-weight:600;box-shadow:var(--sh-lg);animation:ovToastIn .22s ease;max-width:300px;border-left:3px solid rgba(255,255,255,.15);}
.ov-toast.success{background:#14532d;border-left-color:var(--green);}
.ov-toast.error{background:#7f1d1d;border-left-color:var(--red);}
.ov-toast.info{background:var(--navy2);border-left-color:var(--amber);}
@keyframes ovToastIn{from{opacity:0;transform:translateY(-8px) scale(.95)}to{opacity:1;transform:none}}

/* STATUS BADGES */
.sbadge{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:20px;font-size:10.5px;font-weight:700;white-space:nowrap;}
.sb-green{background:var(--green-bg);color:var(--green);border:1px solid var(--green-bd);}
.sb-amber{background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber-bd);}
.sb-red{background:var(--red-bg);color:var(--red);border:1px solid var(--red-bd);}
.sb-blue{background:var(--accent-bg);color:var(--accent);border:1px solid var(--accent-bd);}
.sb-neutral{background:var(--surface2);color:var(--text3);border:1px solid var(--border);}
.sb-purple{background:var(--purple-bg);color:var(--purple);border:1px solid var(--purple-bd);}

@media(max-width:1200px){.ov-hero{grid-template-columns:repeat(3,1fr);}.bottom-grid{grid-template-columns:1fr 1fr;}}
@media(max-width:960px){.wh-grid{grid-template-columns:1fr;}.ov-hero{grid-template-columns:repeat(2,1fr);}.bottom-grid{grid-template-columns:1fr;}}
@media(max-width:600px){.ov-main{padding:12px 12px 32px;}.ov-hero{grid-template-columns:1fr 1fr;}.sub-grid{grid-template-columns:1fr;}}
</style>

<div class="ov-toasts" id="whToasts"></div>
<div class="pbar" id="whPbar"></div>

<!-- DRAWER -->
<div class="ov-drw-overlay" id="whDrwOverlay" onclick="whCloseDrawer()"></div>
<div class="ov-drw" id="whDrawer">
  <div class="ov-drw-hero">
    <button class="ov-drw-close" onclick="whCloseDrawer()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
    <div class="ov-drw-eyebrow" id="whDrwEyebrow">Warehouse</div>

function ukMidnight(){
  const now=new Date();
  const fmt=new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/London',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
  const parts=fmt.formatToParts(now);const p={};
  parts.forEach(x=>{p[x.type]=x.value;});
  const str=p.year+'-'+p.month+'-'+p.day+'T00:00:00';
  const naiveUTC=new Date(str+'Z');
  const testFmt=new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/London',hour:'2-digit',minute:'2-digit',hour12:false});
  const tp={};testFmt.formatToParts(naiveUTC).forEach(x=>{tp[x.type]=x.value;});
  return new Date(naiveUTC.getTime()-parseInt(tp.hour)*3600000);
}

/* ── ACTION QUEUE ── */
function buildQueueItems(){
  const items=[];
  const today=D.ordersToday||[];
  const faults=D.faults||[];
  const prods=D.fbaProds||[];
  const replen=D.replen||[];

  const pending=today.filter(o=>o.status==='awaiting_fulfillment');
  const prime=pending.filter(o=>o.is_amazon_prime);
  if(prime.length) items.push({
    sev:'crit',
    t:`${prime.length} Prime order${prime.length!==1?'s':''} need picking now`,
    s:'Amazon Prime orders — fulfil before non-Prime to protect metrics',
    meta:'Today',tag:{cls:'sb-amber',txt:'Prime'},fn:'whOpenOrdersDrawer()'
  });
  if(pending.length&&!prime.length) items.push({
    sev:'warn',
    t:`${pending.length} order${pending.length!==1?'s':''} awaiting fulfilment`,
    s:'Pick, pack and dispatch before cutoff',
    meta:'Today',tag:{cls:'sb-amber',txt:'Orders'},fn:'whOpenOrdersDrawer()'
  });

  const blocked=today.filter(o=>['awaiting_payment','payment_pending'].includes((o.status||'').toLowerCase()));
  if(blocked.length) items.push({
    sev:'crit',
    t:`${blocked.length} order${blocked.length!==1?'s':''} blocked — payment pending`,
    s:'Cannot be fulfilled — flag to admin',
    meta:'Today',tag:{cls:'sb-red',txt:'Blocked'},fn:'whOpenOrdersDrawer()'
  });

  const awaitingUPS=prods.filter(p=>p.collection_booked==='Yes'&&p.ups_collected!=='Yes');
  if(awaitingUPS.length) items.push({
    sev:'warn',
    t:`${awaitingUPS.length} FBA shipment${awaitingUPS.length!==1?'s':''} awaiting UPS collection`,
    s:'Collection booked — ensure boxes are ready and labelled',
    meta:'FBA',tag:{cls:'sb-purple',txt:'UPS Due'},fn:'whOpenUPSDrawer()'
  });

  const openFaults=faults.filter(f=>!f.resolved);
  if(openFaults.length) items.push({
    sev:openFaults.length>3?'crit':'warn',
    t:`${openFaults.length} packaging fault${openFaults.length!==1?'s':''} unresolved`,
    s:'Log resolution or escalate to avoid repeat issues',
    meta:'30-day window',tag:{cls:'sb-red',txt:'Faults'},fn:'whOpenFaultsDrawer()'
  });

  const critReplen=replen.filter(r=>r.urgency==='C'&&!r.action);
  if(critReplen.length) items.push({
    sev:'info',
    t:`${critReplen.length} SKU${critReplen.length!==1?'s':''} critically low on stock`,
    s:'Expect incoming deliveries — prepare receiving area',
    meta:'Stock',tag:{cls:'sb-neutral',txt:'Receiving'},fn:'whOpenReceivingDrawer()'
  });

  const fbaNotStarted=prods.filter(p=>!p.units_completed||p.units_completed===0);
  if(fbaNotStarted.length) items.push({
    sev:'info',
    t:`${fbaNotStarted.length} FBA product${fbaNotStarted.length!==1?'s':''} not yet started`,
    s:'Begin prep when orders are clear',
    meta:'FBA',tag:{cls:'sb-purple',txt:'FBA Prep'},fn:'whOpenFBADrawer()'
  });

  const order={crit:0,warn:1,info:2};
  return items.sort((a,b)=>order[a.sev]-order[b.sev]);
}

function renderQueue(){
  const items=buildQueueItems();
  const badge=document.getElementById('whQueueBadge');
  const body=document.getElementById('whQueueBody');

  if(!items.length){
    badge.textContent='All clear';badge.className='queue-badge bg-good';

      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="var(--green)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="opacity:.5"><polyline points="20 6 9 17 4 12"/></svg>
      <p>Queue clear</p><span>All tasks actioned — nothing pending</span></div>`;
    return;
  }
  badge.textContent=crit?`${crit} Critical, ${items.length} Total`:`${items.length} Items`;
  badge.className='queue-badge '+(crit?'bg-crit':'bg-warn');
  body.innerHTML=items.map(item=>`
    <div class="queue-item" onclick="${item.fn}">
      <div class="queue-dot dot-${item.sev}"></div>
      <div class="queue-body">
        <div class="queue-t">${esc(item.t)}</div>
        <div class="queue-s">${esc(item.s)}</div>
        <div class="queue-meta">${esc(item.meta)}</div>
      </div>
      <div class="queue-right">
        <span class="queue-tag ${item.tag.cls}">${esc(item.tag.txt)}</span>
        <div class="queue-chev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></div>
      </div>
    </div>`).join('');
}

/* ── FAULTS WIDGET ── */
function renderFaults(){
  const faults=D.faults||[];

  const totalVal=faults.filter(f=>!f.resolved).reduce((s,f)=>s+parseFloat(f.order_value||0),0);
  const bars=[];
  for(let i=6;i>=0;i--){
    const d=new Date();d.setDate(d.getDate()-i);
    const ds=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');

/* ── TEAM WIDGET ── */
function renderTeam(){
  const sched=D.rotaSched||[];
  const users=D.rotaUsers||[];
  const today=new Date();
  const todayStr=today.getFullYear()+'-'+String(today.getMonth()+1).padStart(2,'0')+'-'+String(today.getDate()).padStart(2,'0');
  const dow=today.getDay();
  const off=dow===0?-6:1-dow;
  const weekStart=new Date(today);weekStart.setDate(today.getDate()+off);
  const days=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const dayCounts=days.map((_,i)=>{
    const d=new Date(weekStart);d.setDate(weekStart.getDate()+i);
    const ds=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    const count=new Set(sched.filter(s=>s.date===ds).map(s=>s.employee_id)).size;
    return{lbl:days[i],count,isToday:ds===todayStr};
  });
  const todayEmpIds=new Set(sched.filter(s=>s.date===todayStr).map(s=>s.employee_id));
  const todayStaff=users.filter(u=>todayEmpIds.has(u.user_id));
  const DEPT={Warehouse:'sp-wh',Digital:'sp-dg','Digital Ops':'sp-dg',Admins:'sp-ad',Admin:'sp-ad'};
  const pills=todayStaff.slice(0,8).map(u=>`<div class="sp ${DEPT[u.role]||'sp-wh'}"><div class="sp-av">${esc(initials((u.first_name||'')+' '+(u.last_name||'')))}</div>${esc((u.first_name||'').split(' ')[0])}</div>`).join('');

  document.getElementById('whTeamWidget').innerHTML=`
    <div class="rota-days" style="margin-bottom:10px">
      ${dayCounts.map(d=>`<div class="rota-day">
        <div class="rota-dlbl" style="${d.isToday?'color:var(--amber);font-weight:800':''}">${d.lbl}</div>
        <div class="rota-dn" style="${d.isToday?'color:var(--amber)':''}">${d.count||'—'}</div>
        <div class="rota-dbar${d.isToday?' today':''}"></div>
      </div>`).join('')}
    </div>

    <div class="staff-pills">${pills||'<span style="font-size:11px;color:var(--text4)">No shifts scheduled today</span>'}</div>`;
}

/* ── RECEIVING WIDGET ── */
function renderReceiving(){
  const replen=D.replen||[];
  // Use critical/urgent replen items as proxy for incoming deliveries
  const crit=replen.filter(r=>r.urgency==='C'&&!r.action);
  const ord=replen.filter(r=>r.urgency==='R'&&!r.action);
  const incoming=[...crit,...ord].slice(0,5);

  // Group by supplier
  const bySup={};
  incoming.forEach(r=>{
    const k=r.supplier_name||'Unknown Supplier';
    if(!bySup[k])bySup[k]={name:k,items:0,crit:0};
    bySup[k].items++;
    if(r.urgency==='C')bySup[k].crit++;
  });
  const supList=Object.values(bySup).sort((a,b)=>b.crit-a.crit);

  document.getElementById('whRecvWidget').innerHTML=supList.length===0?
    `<div style="font-size:12px;color:var(--text4);padding:8px 0">No urgent stock expected — replenishments up to date</div>`:
    `<div style="font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text4);margin-bottom:8px">${crit.length+ord.length} SKUs awaiting restock</div>
    <div class="recv-list">
      ${supList.map(s=>`
        <div class="recv-row">
          <div class="recv-dot" style="background:${s.crit>0?'var(--red)':'var(--amber)'}"></div>
          <div>
            <div class="recv-name">${esc(s.name)}</div>
            <div class="recv-meta">${s.items} SKU${s.items!==1?'s':''} needed</div>
          </div>
          <div class="recv-badge ${s.crit>0?'sb-red':'sb-amber'}">${s.crit>0?'Critical':'Order'}</div>
        </div>`).join('')}
    </div>`;
}

/* ── OUTPUT WIDGET ── */
function renderOutput(){
  const orders7=D.orders7||[];
  const faults=D.faults||[];
  const prods=D.fbaProds||[];

  // This week
  const now=new Date();
  const weekAgo=new Date(now);weekAgo.setDate(now.getDate()-7);
  const weekAgoStr=weekAgo.toISOString();

  const shippedWeek=orders7.filter(o=>['shipped','dispatched'].includes((o.status||'').toLowerCase())).length;
  const fbaCompleted=prods.filter(p=>p.units_completed>0&&p.units_completed>=(p.units_required||1)).length;
  const faultsLogged=faults.filter(f=>f.order_date&&f.order_date>=weekAgoStr.split('T')[0]).length;

  // Daily shipped bar — last 7 days
  const midnight=ukMidnight();
  const bars=[];
  for(let i=6;i>=0;i--){
    const d=new Date(midnight);d.setUTCDate(d.getUTCDate()-i);
    const ds=d.toISOString().split('T')[0];
    const n=orders7.filter(o=>o.created_at&&o.created_at.startsWith(ds)&&['shipped','dispatched'].includes((o.status||'').toLowerCase())).length;
    bars.push({lbl:['S','M','T','W','T','F','S'][d.getUTCDay()],n});
  }
  const maxB=Math.max(...bars.map(b=>b.n),1);

  document.getElementById('whOutputWidget').innerHTML=`
    <div class="mkpi-row" style="margin-bottom:10px">
      <div class="mkpi"><div class="mkpi-lbl">Shipped</div><div class="mkpi-val green">${shippedWeek}</div></div>
      <div class="mkpi"><div class="mkpi-lbl">FBA Done</div><div class="mkpi-val blue">${fbaCompleted}</div></div>
      <div class="mkpi"><div class="mkpi-lbl">Faults</div><div class="mkpi-val ${faultsLogged>0?'amber':''}">${faultsLogged}</div></div>
    </div>
    <div class="bar-chart">
      ${bars.map(b=>`<div class="bar-col"><div class="bar-fill" style="height:${Math.max(2,b.n/maxB*44)}px;background:var(--green)"></div><div class="bar-lbl">${b.lbl}</div></div>`).join('')}
    </div>`;
}

          <div class="drw-card-t">${esc(r.name||r.sku||'—')}</div>
          <span class="sbadge sb-amber">Order</span>
        </div>
        <div class="drw-card-s">${r.supplier_name?esc(r.supplier_name)+' · ':''} ${r.days_left!=null?r.days_left+' days left':'—'}</div>
      </div>`).join(''):'<div style="padding:8px 0;font-size:12px;color:var(--text4)">None</div>'}
    <button class="drw-nav" onclick="whCloseDrawer();window.loadModule&&loadModule('replenishments')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
      Open Replenishments
    </button>`);
}

function whOpenOutputDrawer(){
  const orders7=D.orders7||[];
  const prods=D.fbaProds||[];
  const faults=D.faults||[];
  const shipped=orders7.filter(o=>['shipped','dispatched'].includes((o.status||'').toLowerCase())).length;
  const fbaCompleted=prods.filter(p=>p.units_completed>0&&p.units_completed>=(p.units_required||1)).length;
  const fbaUnits=prods.reduce((s,p)=>s+(p.units_completed||0),0);
  whOpenDrawer('Weekly Output','Last 7 Days','Team performance',`
    <div class="drw-sec-lbl">Orders</div>
    <div class="drw-row"><div class="drw-row-k">Shipped</div><div class="drw-row-v" style="color:var(--green)">${shipped}</div></div>
    <div class="drw-row"><div class="drw-row-k">Total Processed</div><div class="drw-row-v">${orders7.length}</div></div>
    <div class="drw-sec-lbl">FBA Prep</div>
    <div class="drw-row"><div class="drw-row-k">Products Completed</div><div class="drw-row-v" style="color:var(--green)">${fbaCompleted}</div></div>
    <div class="drw-row"><div class="drw-row-k">Total Units Completed</div><div class="drw-row-v">${fbaUnits.toLocaleString()}</div></div>
    <div class="drw-sec-lbl">Quality</div>
    <div class="drw-row"><div class="drw-row-k">Faults Logged (30d)</div><div class="drw-row-v" style="color:${faults.length>5?'var(--red)':'var(--text2)'}">${faults.length}</div></div>
    <div class="drw-row"><div class="drw-row-k">Open Faults</div><div class="drw-row-v" style="color:var(--red)">${faults.filter(f=>!f.resolved).length}</div></div>
    <button class="drw-nav" onclick="whCloseDrawer();window.loadModule&&loadModule('reports')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
      Open Reports
    </button>`);
}

/* ── SILENT REFRESH ── */
async function silentRefresh(){
  if(!sb)return;
  try{
    await Promise.all([loadOrders(),loadFBA(),loadFaults(),loadRota(),loadReplen()]);
    renderHero();
    renderQueue();
    renderOrders();
    renderFBA();
    renderFaults();
    renderUPS();
    renderTeam();
    renderReceiving();
    renderOutput();
  }catch(e){console.error('[WH silent refresh]',e);}
}

/* ── REFRESH ── */
async function whRefresh(){
  const btn=document.getElementById('whRefreshBtn');
  btn.classList.add('spinning');
  await init();
  btn.classList.remove('spinning');
  toast('Refreshed','success');
}

/* ── KEYBOARD ── */
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&document.getElementById('whDrawer').classList.contains('open'))whCloseDrawer();
});

/* ── EXPOSE GLOBALS ── */
window.whCloseDrawer=whCloseDrawer;
window.whRefresh=whRefresh;
window.whOpenOrdersDrawer=whOpenOrdersDrawer;
window.whOpenFBADrawer=whOpenFBADrawer;
window.whOpenFaultsDrawer=whOpenFaultsDrawer;
window.whOpenUPSDrawer=whOpenUPSDrawer;
window.whOpenTeamDrawer=whOpenTeamDrawer;
window.whOpenReceivingDrawer=whOpenReceivingDrawer;
window.whOpenOutputDrawer=whOpenOutputDrawer;

/* ── AUTO REFRESH every 60s ── */
_refreshTimer=setInterval(()=>silentRefresh(),60000);

})();
</script>
