<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#eef1f8;--surface:#ffffff;--surface2:#f5f7fc;--surface3:#e8edf7;
  --border:#e2e8f5;--border2:#ecf0f9;
  --text:#0c1526;--text2:#2a3a54;--text3:#64748b;--text4:#98a7bc;
  --accent:#1847d4;--accent-l:#2a5eed;--accent-bg:#eef2fd;--accent-bd:#c4d3f9;
  --green:#0c7a42;--green-bg:#ecfdf5;--green-bd:#86efac;
  --red:#b91c1c;--red-bg:#fef2f2;--red-bd:#fecaca;
  --amber:#92400e;--amber-bg:#fffbeb;--amber-bd:#fde68a;
  --cyan:#0369a1;--cyan-bg:#eff6ff;--cyan-bd:#bfdbfe;
  --purple:#6d28d9;--purple-bg:#f3f0ff;--purple-bd:#c4b5fd;
  --navy:#0c1526;--navy2:#141d2e;
  --r:10px;--r-sm:7px;--r-lg:14px;--r-xl:18px;
  --font:'Plus Jakarta Sans',system-ui,sans-serif;
  --mono:'JetBrains Mono',monospace;
  --sh-sm:0 1px 3px rgba(12,21,38,.06),0 1px 2px rgba(12,21,38,.04);
  --sh:0 4px 16px rgba(12,21,38,.08),0 2px 6px rgba(12,21,38,.04);
  --sh-lg:0 20px 50px rgba(12,21,38,.14),0 6px 16px rgba(12,21,38,.07);
}

html,body{font-family:var(--font);font-size:14px;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden;}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:6px}
::-webkit-scrollbar-thumb:hover{background:var(--text4)}

.pbar{position:fixed;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--accent),#4f80f7);z-index:9999;transform:scaleX(0);transform-origin:left;transition:transform .3s ease;opacity:0;}
.pbar.active{opacity:1;}

.ov-page{background:radial-gradient(ellipse at 20% 0%,rgba(24,71,212,.04) 0%,transparent 60%),radial-gradient(ellipse at 80% 100%,rgba(24,71,212,.03) 0%,transparent 60%),var(--bg);min-height:100vh;}

/* TOPBAR */
.ov-topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 20px;height:50px;background:rgba(255,255,255,.94);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;}
.ov-topbar-left{display:flex;align-items:center;gap:10px;}
.ov-greeting{font-size:13px;font-weight:800;color:var(--text);}
.ov-date{font-size:11px;color:var(--text3);font-weight:500;}
.ov-topbar-right{display:flex;align-items:center;gap:8px;}
.live-pill{display:flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;background:var(--accent-bg);border:1px solid var(--accent-bd);font-size:11px;font-weight:700;color:var(--accent);}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:livePulse 2s ease infinite;}
@keyframes livePulse{0%,100%{opacity:1}50%{opacity:.4}}
.ov-clock{font-family:var(--mono);font-size:11.5px;color:var(--text4);}
.ov-refresh-btn{display:flex;align-items:center;gap:5px;padding:5px 11px;border-radius:var(--r-sm);border:1px solid var(--border);background:var(--surface2);color:var(--text3);font-size:11.5px;font-weight:700;font-family:var(--font);cursor:pointer;transition:all .15s;white-space:nowrap;}
.ov-refresh-btn:hover{border-color:var(--accent-bd);color:var(--accent);background:var(--accent-bg);}
.ov-refresh-btn svg{width:12px;height:12px;flex-shrink:0;}
.ov-refresh-btn.spinning svg{animation:doSpin .7s linear infinite;}
@keyframes doSpin{to{transform:rotate(360deg)}}

/* USER BADGE */
.user-badge{display:flex;align-items:center;gap:7px;padding:4px 10px 4px 5px;border-radius:20px;background:var(--surface2);border:1px solid var(--border);}
.user-av{width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,var(--accent) 0%,var(--purple) 100%);display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;color:#fff;flex-shrink:0;}
.user-name{font-size:11.5px;font-weight:700;color:var(--text2);}

/* MAIN */
.ov-main{padding:18px 20px 40px;}

/* SECTION LABELS */
.ov-sec{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--text4);margin-bottom:12px;display:flex;align-items:center;gap:10px;}
.ov-sec::after{content:'';flex:1;height:1px;background:var(--border);}

/* HERO STRIP */
.ov-hero{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:24px;}
.ov-sc{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:14px 16px 13px;position:relative;overflow:hidden;box-shadow:var(--sh-sm);cursor:pointer;transition:transform .18s,box-shadow .18s,border-color .18s;animation:ovFadeUp .3s ease both;}
.ov-sc:hover{transform:translateY(-2px);box-shadow:var(--sh);}
.ov-sc::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;border-radius:var(--r-lg) var(--r-lg) 0 0;background:var(--sc-accent,var(--accent));}
@keyframes ovFadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.ov-sc-icon{position:absolute;top:12px;right:12px;width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:var(--sc-icon-bg,var(--accent-bg));}
.ov-sc-icon svg{width:14px;height:14px;color:var(--sc-icon-col,var(--accent-l));}
.ov-sc-lbl{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-bottom:7px;}
.ov-sc-val{font-size:28px;font-weight:800;letter-spacing:-1px;color:var(--text);line-height:1;font-family:var(--mono);margin-bottom:4px;}
.ov-sc-val.in{animation:ovNumIn .4s cubic-bezier(.34,1.56,.64,1) both;}
@keyframes ovNumIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.ov-sc-footer{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:6px;}
.ov-sc-footer .ov-sc-sub{margin:0;flex:1;font-size:10.5px;color:var(--text3);}
.ov-sc-badge{display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:20px;font-size:9.5px;font-weight:700;flex-shrink:0;}
.sc-green{--sc-accent:var(--green);--sc-icon-bg:var(--green-bg);--sc-icon-col:var(--green);}
.sc-blue{--sc-accent:var(--accent);--sc-icon-bg:var(--accent-bg);--sc-icon-col:var(--accent-l);}
.sc-amber{--sc-accent:var(--amber);--sc-icon-bg:var(--amber-bg);--sc-icon-col:var(--amber);}
.sc-red{--sc-accent:var(--red);--sc-icon-bg:var(--red-bg);--sc-icon-col:var(--red);}
.sc-purple{--sc-accent:var(--purple);--sc-icon-bg:var(--purple-bg);--sc-icon-col:var(--purple);}
.sc-cyan{--sc-accent:var(--cyan);--sc-icon-bg:var(--cyan-bg);--sc-icon-col:var(--cyan);}
.bg-good{background:var(--green-bg);color:var(--green);border:1px solid var(--green-bd);}
.bg-warn{background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber-bd);}
.bg-crit{background:var(--red-bg);color:var(--red);border:1px solid var(--red-bd);}
.bg-neutral{background:var(--surface2);color:var(--text3);border:1px solid var(--border);}
.bg-info{background:var(--accent-bg);color:var(--accent);border:1px solid var(--accent-bd);}

/* MAIN GRID */
.do-grid{display:grid;grid-template-columns:360px 1fr;gap:14px;margin-bottom:24px;}

/* QUEUE PANEL */
.queue-panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--sh-sm);display:flex;flex-direction:column;overflow:hidden;animation:ovFadeUp .35s .05s ease both;}
.queue-hdr{padding:13px 16px 11px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.queue-title{font-size:13px;font-weight:800;color:var(--text);}
.queue-badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;}
.queue-scroll{flex:1;overflow-y:auto;max-height:460px;}
.queue-scroll::-webkit-scrollbar{width:3px}
.queue-scroll::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
.queue-item{display:flex;align-items:flex-start;gap:10px;padding:11px 16px;border-bottom:1px solid var(--border2);cursor:pointer;transition:background .12s;}
.queue-item:last-child{border-bottom:none;}
.queue-item:hover{background:var(--accent-bg);}
.queue-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:4px;}
.dot-crit{background:var(--red);}
.dot-warn{background:var(--amber);}
.dot-info{background:var(--accent);}
.dot-done{background:var(--green);}
.queue-body{flex:1;min-width:0;}
.queue-t{font-size:12.5px;font-weight:700;color:var(--text);margin-bottom:2px;line-height:1.3;}
.queue-s{font-size:11px;color:var(--text3);line-height:1.45;}
.queue-meta{font-size:10px;color:var(--text4);margin-top:3px;}
.queue-right{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0;}
.queue-tag{font-size:9.5px;font-weight:700;padding:2px 7px;border-radius:20px;}
.queue-chev{color:var(--text4);}
.queue-chev svg{width:11px;height:11px;}
.queue-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;gap:8px;text-align:center;}
.queue-empty p{font-size:13px;font-weight:700;color:var(--green);}
.queue-empty span{font-size:11px;color:var(--text4);}

/* WORK COLUMN */
.work-col{display:flex;flex-direction:column;gap:12px;}
.work-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:14px 16px;box-shadow:var(--sh-sm);animation:ovFadeUp .35s .08s ease both;cursor:pointer;transition:box-shadow .18s,border-color .18s;}
.work-card:hover{box-shadow:var(--sh);border-color:var(--accent-bd);}
.work-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.work-title{font-size:12.5px;font-weight:700;color:var(--text);}
.work-sub{font-size:11px;color:var(--text3);margin-top:1px;}
.work-link{font-size:11px;font-weight:700;color:var(--text4);display:flex;align-items:center;gap:3px;transition:color .12s;}
.work-card:hover .work-link{color:var(--accent);}
.work-link svg{width:10px;height:10px;}

/* Mini KPIs */
.mkpi-row{display:flex;gap:8px;}
.mkpi{flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:var(--r);padding:9px 11px;}
.mkpi-lbl{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text4);margin-bottom:4px;}
.mkpi-val{font-size:18px;font-weight:800;color:var(--text);font-family:var(--mono);line-height:1;}
.mkpi-val.green{color:var(--green);}
.mkpi-val.amber{color:var(--amber);}
.mkpi-val.red{color:var(--red);}
.mkpi-val.blue{color:var(--accent);}

/* Sub-grid */
.sub-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}

/* Progress list */
.prog-list{display:flex;flex-direction:column;gap:8px;}
.prog-item{display:flex;align-items:center;gap:10px;}
.prog-lbl{font-size:11px;font-weight:600;color:var(--text2);width:90px;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.prog-track{flex:1;height:6px;background:var(--surface3);border-radius:99px;overflow:hidden;}
.prog-fill{height:100%;border-radius:99px;transition:width .7s cubic-bezier(.4,0,.2,1);}
.prog-n{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--text);min-width:28px;text-align:right;}

/* Status list */
.status-list{display:flex;flex-direction:column;gap:6px;margin-top:4px;}
.status-row{display:flex;align-items:center;justify-content:space-between;padding:7px 10px;border-radius:var(--r-sm);background:var(--surface2);border:1px solid var(--border2);}
.status-row-l{display:flex;align-items:center;gap:7px;}
.status-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.status-lbl{font-size:11.5px;font-weight:600;color:var(--text2);}
.status-val{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--text);}

/* Calendar strip */
.cal-strip{display:flex;gap:4px;margin-bottom:10px;}
.cal-day{flex:1;border-radius:var(--r-sm);padding:8px 6px;background:var(--surface2);border:1px solid var(--border);text-align:center;cursor:pointer;transition:all .15s;}
.cal-day.today{background:var(--accent-bg);border-color:var(--accent-bd);}
.cal-day.today .cal-dlbl{color:var(--accent);}
.cal-day.today .cal-dn{color:var(--accent);}
.cal-dlbl{font-size:9px;font-weight:700;color:var(--text4);text-transform:uppercase;}
.cal-dn{font-size:13px;font-weight:800;font-family:var(--mono);color:var(--text);margin:2px 0;}
.cal-dtask{font-size:8px;color:var(--text4);font-weight:600;}

/* Task chips */
.task-chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;}
.task-chip{display:flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600;border:1px solid;}
.chip-sourcing{background:var(--cyan-bg);color:var(--cyan);border-color:var(--cyan-bd);}
.chip-catalog{background:var(--purple-bg);color:var(--purple);border-color:var(--purple-bd);}
.chip-listing{background:var(--accent-bg);color:var(--accent);border-color:var(--accent-bd);}
.chip-replen{background:var(--amber-bg);color:var(--amber);border-color:var(--amber-bd);}
.chip-fba{background:var(--green-bg);color:var(--green);border-color:var(--green-bd);}
.chip-dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex-shrink:0;}

/* Output stats */
.output-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px;}
.output-stat{background:var(--surface2);border:1px solid var(--border);border-radius:var(--r);padding:10px 12px;text-align:center;}
.output-stat-val{font-size:22px;font-weight:800;font-family:var(--mono);color:var(--text);line-height:1;margin-bottom:3px;}
.output-stat-lbl{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text4);}
.output-stat-delta{font-size:10px;font-weight:700;margin-top:3px;}
.delta-up{color:var(--green);}
.delta-dn{color:var(--red);}
.delta-flat{color:var(--text4);}

/* Sparkline */
.spark-wrap{height:48px;margin-top:8px;}

/* BOTTOM GRID */
.bottom-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:24px;}
.bottom-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:14px 16px;box-shadow:var(--sh-sm);animation:ovFadeUp .4s .1s ease both;cursor:pointer;transition:box-shadow .18s,border-color .18s;}
.bottom-card:hover{box-shadow:var(--sh);border-color:var(--accent-bd);}
.bottom-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.bottom-title{font-size:12.5px;font-weight:700;color:var(--text);}

/* Supplier focus */
.sup-list{display:flex;flex-direction:column;gap:6px;}
.sup-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r-sm);background:var(--surface2);border:1px solid var(--border2);}
.sup-rank{font-size:10px;font-weight:800;font-family:var(--mono);color:var(--text4);width:16px;flex-shrink:0;}
.sup-name{flex:1;font-size:12px;font-weight:700;color:var(--text2);}
.sup-cat{font-size:10px;color:var(--text4);font-weight:500;}
.sup-count{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--text);flex-shrink:0;}

/* FBA stage bars */
.stage-bar{margin-bottom:7px;}
.stage-bar-hdr{display:flex;justify-content:space-between;font-size:10.5px;margin-bottom:3px;}
.stage-bar-lbl{color:var(--text3);font-weight:600;}
.stage-bar-n{font-family:var(--mono);font-weight:700;color:var(--text);}
.stage-track{height:4px;background:var(--surface3);border-radius:99px;overflow:hidden;}
.stage-fill{height:100%;border-radius:99px;transition:width .7s cubic-bezier(.4,0,.2,1);}

/* SHIMMER */
.shimmer{position:relative;overflow:hidden;background:var(--surface2);border-radius:var(--r);}
.shimmer::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.7),transparent);animation:shim 1.5s infinite;transform:translateX(-100%);}
@keyframes shim{to{transform:translateX(100%)}}

/* DRAWER */
.ov-drw-overlay{position:fixed;inset:0;background:rgba(12,21,38,.35);z-index:1250;opacity:0;pointer-events:none;transition:opacity .25s;backdrop-filter:blur(2px);}
.ov-drw-overlay.open{opacity:1;pointer-events:all;}
.ov-drw{position:fixed;top:0;right:0;width:520px;max-width:97vw;height:100vh;background:var(--surface);box-shadow:var(--sh-lg);z-index:1300;display:flex;flex-direction:column;transform:translateX(110%);transition:transform .3s cubic-bezier(.4,0,.2,1);overflow:hidden;}
.ov-drw.open{transform:translateX(0);}
.ov-drw-hero{padding:18px 20px 16px;background:linear-gradient(140deg,var(--navy2) 0%,#0d1631 100%);position:relative;overflow:hidden;flex-shrink:0;}
.ov-drw-hero::before{content:'';position:absolute;top:-50px;right:-50px;width:160px;height:160px;border-radius:50%;background:rgba(24,71,212,.12);}
.ov-drw-hero::after{content:'';position:absolute;bottom:-30px;left:30px;width:90px;height:90px;border-radius:50%;background:rgba(255,255,255,.03);}
.ov-drw-close{position:absolute;top:13px;right:13px;width:28px;height:28px;border:none;border-radius:7px;background:rgba(255,255,255,.1);cursor:pointer;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.6);transition:all .15s;z-index:2;}
.ov-drw-close:hover{background:rgba(255,255,255,.2);color:#fff;}
.ov-drw-close svg{width:12px;height:12px;}
.ov-drw-eyebrow{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:rgba(255,255,255,.35);margin-bottom:5px;position:relative;z-index:1;}
.ov-drw-title{font-size:16px;font-weight:800;color:#fff;margin-bottom:3px;padding-right:40px;position:relative;z-index:1;line-height:1.25;}
.ov-drw-sub{font-size:12px;color:rgba(255,255,255,.4);position:relative;z-index:1;}
.ov-drw-body{flex:1;overflow-y:auto;padding:18px 20px;}
.ov-drw-body::-webkit-scrollbar{width:4px;}
.ov-drw-body::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}
.drw-sec-lbl{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--text4);margin-bottom:10px;margin-top:18px;display:flex;align-items:center;gap:8px;}
.drw-sec-lbl:first-child{margin-top:0;}
.drw-sec-lbl::after{content:'';flex:1;height:1px;background:var(--border2);}
.drw-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border2);font-size:12.5px;}
.drw-row:last-child{border-bottom:none;}
.drw-row-k{color:var(--text3);}
.drw-row-v{font-weight:700;color:var(--text2);}
.drw-card{background:var(--surface2);border:1px solid var(--border);border-radius:var(--r);padding:10px 13px;margin-bottom:7px;transition:border-color .12s,background .12s;}
.drw-card:hover{border-color:var(--accent-bd);background:var(--accent-bg);}
.drw-card-t{font-size:12.5px;font-weight:700;color:var(--text);margin-bottom:3px;}
.drw-card-s{font-size:11px;color:var(--text3);}
.drw-nav{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:9px;border:1.5px solid var(--accent-bd);border-radius:var(--r-sm);background:var(--accent-bg);color:var(--accent);font-size:12px;font-weight:700;font-family:var(--font);cursor:pointer;transition:all .15s;margin-top:14px;}
.drw-nav:hover{background:var(--accent);color:#fff;}
.drw-nav svg{width:12px;height:12px;}

/* TOAST */
.ov-toasts{position:fixed;top:16px;right:18px;z-index:9999;display:flex;flex-direction:column;gap:7px;pointer-events:none;}
.ov-toast{display:flex;align-items:center;gap:9px;padding:10px 14px;color:#fff;border-radius:var(--r);font-size:12.5px;font-weight:600;box-shadow:var(--sh-lg);animation:ovToastIn .22s ease;max-width:300px;border-left:3px solid rgba(255,255,255,.15);}
.ov-toast.success{background:#14532d;border-left-color:var(--green);}
.ov-toast.error{background:#7f1d1d;border-left-color:var(--red);}
.ov-toast.info{background:var(--navy2);border-left-color:var(--accent);}
@keyframes ovToastIn{from{opacity:0;transform:translateY(-8px) scale(.95)}to{opacity:1;transform:none}}

/* STATUS BADGES */
.sbadge{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:20px;font-size:10.5px;font-weight:700;white-space:nowrap;}
.sb-green{background:var(--green-bg);color:var(--green);border:1px solid var(--green-bd);}
.sb-amber{background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber-bd);}
.sb-red{background:var(--red-bg);color:var(--red);border:1px solid var(--red-bd);}
.sb-blue{background:var(--accent-bg);color:var(--accent);border:1px solid var(--accent-bd);}
.sb-neutral{background:var(--surface2);color:var(--text3);border:1px solid var(--border);}
.sb-purple{background:var(--purple-bg);color:var(--purple);border:1px solid var(--purple-bd);}

/* MINI TABLE */
.mini-tbl{width:100%;border-collapse:collapse;font-size:12px;}
.mini-tbl th{padding:6px 8px;text-align:left;font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text4);border-bottom:1px solid var(--border);}
.mini-tbl td{padding:7px 8px;border-bottom:1px solid var(--border2);color:var(--text2);vertical-align:middle;}
.mini-tbl tbody tr:last-child td{border-bottom:none;}
.mini-tbl tbody tr:hover td{background:var(--accent-bg);}

@media(max-width:1200px){.ov-hero{grid-template-columns:repeat(3,1fr);}.bottom-grid{grid-template-columns:1fr 1fr;}}
@media(max-width:960px){.do-grid{grid-template-columns:1fr;}.ov-hero{grid-template-columns:repeat(2,1fr);}.bottom-grid{grid-template-columns:1fr;}}
@media(max-width:600px){.ov-main{padding:12px 12px 32px;}.ov-hero{grid-template-columns:1fr 1fr;}.sub-grid{grid-template-columns:1fr;}}

/* ── UK DATE HELPERS (same pattern used on Warehouse/Admin overview) ── */
function ukTodayStr(){
  const parts=new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/London',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());
  const p={};parts.forEach(x=>p[x.type]=x.value);
  return `${p.year}-${p.month}-${p.day}`;
}
function addDaysToDateStr(dateStr,days){
  const[y,m,d]=dateStr.split('-').map(Number);
  const dt=new Date(Date.UTC(y,m-1,d));
  dt.setUTCDate(dt.getUTCDate()+days);
  return `${dt.getUTCFullYear()}-${String(dt.getUTCMonth()+1).padStart(2,'0')}-${String(dt.getUTCDate()).padStart(2,'0')}`;
}
function dowOfDateStr(dateStr){
  const[y,m,d]=dateStr.split('-').map(Number);
  return new Date(Date.UTC(y,m-1,d)).getUTCDay();
}
function weekBounds(){
  const todayStr=ukTodayStr();
  const dow=dowOfDateStr(todayStr);
  const off=dow===0?-6:1-dow;
  const startStr=addDaysToDateStr(todayStr,off);
  const endStr=addDaysToDateStr(startStr,7);
  return{startStr,endStr};
}
/* ── TIERED NAME MATCH (same precision-first pattern as Warehouse overview) ── */
function tieredNameMatch(rows,nameField,first,last){
  if(!first&&!last)return rows;
  const norm=s=>String(s||'').toLowerCase().trim();
  const f=norm(first),l=norm(last);
  let matched=rows.filter(r=>{const n=norm(r[nameField]);return f&&l&&n.includes(f)&&n.includes(l);});
  if(matched.length)return matched;
  matched=rows.filter(r=>{const n=norm(r[nameField]);return (f&&l&&n.includes(f)&&n.includes(l[0]))||(f&&l&&n.includes(f[0])&&n.includes(l));});
  if(matched.length)return matched;
  matched=rows.filter(r=>{const n=norm(r[nameField]);return (f&&n.includes(f))||(l&&n.includes(l));});
  return matched;
}

/* ── LOADERS ── */
async function loadSourcing(){
  let q=sb.from('sourcing').select('opportunity_id,product_name,supplier_name,agent,approved,purchased,created_at,sourcing_approvals(status)').order('created_at',{ascending:false}).limit(500);
  const{data}=await q;
  D.sourcingAll=data||[];
  D.sourcingMine=(ME?.first_name||ME?.last_name)
    ?tieredNameMatch(D.sourcingAll,'agent',ME.first_name,ME.last_name)
    :D.sourcingAll;
}

async function loadCatalog(){
  const[r1,r2,r3]=await Promise.all([
    sb.from('catalog').select('*',{count:'exact',head:true}),
    sb.from('catalog').select('id,product_name,supplier_name,status,created_at,reviewed_by').eq('status','Pending').order('created_at',{ascending:false}).limit(200),
    sb.from('catalog').select('id,product_name,status,created_at').eq('status','Approved').order('created_at',{ascending:false}).limit(200),
  ]);
  D.catTotal=r1.count||0;
  D.catPending=r2.data||[];
  D.catApproved=r3.data||[];
}

async function loadReplen(){
  const{data}=await sb.from('replenishment_skus').select('sku,name,action,days_left,order_qty,urgency').limit(2000);
  D.replen=data||[];
}

async function loadFBA(){
  const{data:prods}=await sb.from('fba_products').select('id,brand,product_line,units_required,units_completed,ups_collected,collection_booked,assigned_to').limit(500);
  const all=prods||[];
  // "Mine" = assigned to me by name, OR unassigned (open for anyone to pick up)
  const mine=(ME?.first_name||ME?.last_name)
    ?all.filter(p=>!p.assigned_to||tieredNameMatch([p],'assigned_to',ME.first_name,ME.last_name).length>0)
    :all;
  D.fbaProds=mine;
  D.fbaOpps=mine.filter(p=>!p.units_completed||p.units_completed===0);
}

async function loadRota(){
  if(!ME?.user_id){D.rotaToday=[];D.rotaWeek=[];return;}
  const todayStr=ukTodayStr();
  const{startStr,endStr}=weekBounds();
  const wEndInclusive=addDaysToDateStr(endStr,-1);
  const[r1,r2]=await Promise.all([
    sb.from('rota_schedule').select('id,employee_id,date,start_time,end_time,notes,type').eq('employee_id',ME.user_id).eq('date',todayStr),
    sb.from('rota_schedule').select('id,employee_id,date,start_time,end_time,notes,type').eq('employee_id',ME.user_id).gte('date',startStr).lte('date',wEndInclusive).order('date',{ascending:true}),
  ]);
  D.rotaToday=r1.data||[];
  D.rotaWeek=r2.data||[];
}

async function loadListings(){

/* ── QUEUE ── */
function buildQueueItems(){
  const items=[];
  const catPending=D.catPending||[];
  const replen=D.replen||[];
  const fbaOpps=D.fbaOpps||[];
  const listings=D.listings||[];

  // Catalog items pending review
  if(catPending.length){
    const oldest=catPending[catPending.length-1];
    const days=oldest?.created_at?Math.floor((Date.now()-new Date(oldest.created_at))/86400000):0;
    items.push({
      sev:days>3?'crit':'warn',
      t:`${catPending.length} catalog item${catPending.length!==1?'s':''} need review`,
      s:`Oldest waiting ${days} day${days!==1?'s':''} — approve or reject to clear queue`,
      meta:'Catalog',tag:{cls:'sb-purple',txt:'Catalog'},fn:'doOpenCatalogDrawer()'
    });
  }

  // Critical replen
  const critReplen=replen.filter(r=>r.urgency==='C'&&!r.action);
  if(critReplen.length) items.push({
    sev:'crit',
    t:`${critReplen.length} SKU${critReplen.length!==1?'s':''} critically low — action now`,
    s:'Out of stock or under 7 days cover — order or mark N/A',
    meta:'Replenishments',tag:{cls:'sb-amber',txt:'Stock Alert'},fn:'doOpenReplenDrawer()'
  });

  // Sourcing leads pending approval (my leads only)
  const myPendingApproval=(D.sourcingMine||[]).filter(p=>!p.approved&&!(p.sourcing_approvals||[]).some(a=>a.status==='rejected'));
  if(myPendingApproval.length) items.push({
    sev:'info',
    t:`${myPendingApproval.length} of your leads awaiting approval`,
    s:'Submitted and in review — no action needed unless asked',
    meta:'Sourcing',tag:{cls:'sb-blue',txt:'Sourcing'},fn:'doOpenSourcingDrawer()'
  });

  // Listings in draft
  if(listings.length) items.push({
    sev:'warn',
    t:`${listings.length} listing${listings.length!==1?'s':''} not yet live`,
    s:'Products ready to be listed on channel — complete and publish',
    meta:'Listings',tag:{cls:'sb-blue',txt:'Listings'},fn:'doOpenListingsDrawer()'
  });

  // FBA opps
  if(fbaOpps.length) items.push({
    sev:'info',
    t:`${fbaOpps.length} FBA product${fbaOpps.length!==1?'s':''} not yet started`,
    s:'Review FBA prep pipeline and begin units where possible',
    meta:'FBA',tag:{cls:'sb-neutral',txt:'FBA Prep'},fn:'doOpenFBADrawer()'
  });

  const order={crit:0,warn:1,info:2};
  return items.sort((a,b)=>order[a.sev]-order[b.sev]);
}

function renderQueue(){
  const items=buildQueueItems();
  const badge=document.getElementById('doQueueBadge');
  const body=document.getElementById('doQueueBody');
  const crit=items.filter(i=>i.sev==='crit').length;

  if(!items.length){
    badge.textContent='All clear';badge.className='queue-badge bg-good';
    body.innerHTML=`<div class="queue-empty">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="var(--green)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="opacity:.5"><polyline points="20 6 9 17 4 12"/></svg>
      <p>Queue clear</p><span>Nothing needs your attention right now</span></div>`;
    return;
  }
  badge.textContent=crit?`${crit} Critical, ${items.length} Total`:`${items.length} Items`;
  badge.className='queue-badge '+(crit?'bg-crit':'bg-warn');
  body.innerHTML=items.map(item=>`
    <div class="queue-item" onclick="${item.fn}">
      <div class="queue-dot dot-${item.sev}"></div>
      <div class="queue-body">
        <div class="queue-t">${esc(item.t)}</div>
        <div class="queue-s">${esc(item.s)}</div>
        <div class="queue-meta">${esc(item.meta)}</div>
      </div>
      <div class="queue-right">
        <span class="queue-tag ${item.tag.cls}">${esc(item.tag.txt)}</span>
        <div class="queue-chev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></div>
      </div>
    </div>`).join('');
}

/* ── OUTPUT WIDGET ── */
function renderOutput(){
  const mine=D.sourcingMine||[];

  const weekAgoStr=weekAgo.toISOString();

  const catApprovedThisWeek=(D.catApproved||[]).filter(p=>p.created_at>=weekAgoStr).length;

      return`<div class="drw-card">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <div class="drw-card-t">${esc(p.brand||'—')}${p.product_line?' — '+esc(p.product_line):''}</div>
          <span style="font-size:10px;font-weight:700;color:${col}">${stage}</span>
        </div>
        <div style="display:flex;align-items:center;gap:8px;margin-top:6px">
          <div style="flex:1;height:4px;background:var(--surface3);border-radius:99px;overflow:hidden">
            <div style="height:100%;width:${pct.toFixed(1)}%;background:${col};border-radius:99px"></div>
          </div>
          <span style="font-size:10.5px;font-weight:700;color:var(--text3);white-space:nowrap">${done}/${req}</span>
        </div>
        ${p.collection_booked==='Yes'?`<div style="margin-top:4px;font-size:10px;color:var(--purple);font-weight:600">📦 Collection booked${p.ups_collected==='Yes'?' · ✓ Collected':''}</div>`:''}
      </div>`;
    }).join('')||'<div style="padding:8px 0;font-size:12px;color:var(--text4)">No FBA products in pipeline</div>'}
    <button class="drw-nav" onclick="doCloseDrawer();window.loadModule&&loadModule('fba')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      Open FBA Module
    </button>`);
}

function doOpenCalendarDrawer(){
  const week=D.rotaWeek||[];
  doOpenDrawer('Calendar','This Week',`${week.length} shift${week.length!==1?'s':''}`,`
    <div class="drw-sec-lbl">My Schedule</div>
    ${week.length?week.map(s=>`
      <div class="drw-card">
        <div class="drw-card-t">${fmtDate(s.date)} · ${(s.start_time||'').slice(0,5)} – ${(s.end_time||'').slice(0,5)}</div>
        ${s.notes?`<div class="drw-card-s">${esc(s.notes)}</div>`:''}
        ${s.type?`<div style="margin-top:4px"><span class="sbadge sb-blue">${esc(s.type)}</span></div>`:''}
      </div>`).join('')
      :'<div style="padding:8px 0;font-size:12px;color:var(--text4)">No shifts scheduled this week</div>'}
    <button class="drw-nav" onclick="doCloseDrawer();window.loadModule&&loadModule('rota')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      Open Rota Module
    </button>`);
}

function doOpenSuppliersDrawer(){
  const mine=D.sourcingMine||[];
  const bySup={};
  mine.forEach(p=>{
    const k=p.supplier_name||'Unknown';
    if(!bySup[k])bySup[k]={name:k,total:0,approved:0,purchased:0};
    bySup[k].total++;
    if(p.approved)bySup[k].approved++;
    if(p.purchased)bySup[k].purchased++;
  });
  const top=Object.values(bySup).sort((a,b)=>b.total-a.total);

  doOpenDrawer('Supplier Focus','My Performance',`${top.length} supplier${top.length!==1?'s':''} sourced from`,`
    <div class="drw-sec-lbl">By Leads Submitted</div>
    ${top.map((s,i)=>`
      <div class="drw-row">
        <div class="drw-row-k">${i+1}. ${esc(s.name)}</div>
        <div style="display:flex;gap:6px;align-items:center">
          <span class="sbadge sb-neutral">${s.total} leads</span>
          <span class="sbadge sb-green">${s.approved} approved</span>
        </div>
      </div>`).join('')||'<div style="padding:8px 0;font-size:12px;color:var(--text4)">No sourcing data yet</div>'}
    <button class="drw-nav" onclick="doCloseDrawer();window.loadModule&&loadModule('suppliers')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
      Open Suppliers Module
    </button>`);
}

function doOpenOutputDrawer(){
  const mine=D.sourcingMine||[];
  const cat=D.catApproved||[];

  doOpenDrawer('My Output','All Time','Personal performance',`
    <div class="drw-sec-lbl">Sourcing</div>
    <div class="drw-row"><div class="drw-row-k">Total Submitted</div><div class="drw-row-v">${mine.length}</div></div>
    <div class="drw-row"><div class="drw-row-k">Approved</div><div class="drw-row-v" style="color:var(--green)">${mine.filter(p=>p.approved).length}</div></div>
    <div class="drw-row"><div class="drw-row-k">Purchased</div><div class="drw-row-v" style="color:var(--cyan)">${mine.filter(p=>p.purchased).length}</div></div>
    <div class="drw-row"><div class="drw-row-k">Rejected</div><div class="drw-row-v" style="color:var(--red)">${mine.filter(p=>(p.sourcing_approvals||[]).some(a=>a.status==='rejected')&&!p.approved).length}</div></div>
    <div class="drw-row"><div class="drw-row-k">Approval Rate</div><div class="drw-row-v">${mine.length?Math.round(mine.filter(p=>p.approved).length/mine.length*100):0}%</div></div>
    <div class="drw-sec-lbl">Catalog</div>
    <div class="drw-row"><div class="drw-row-k">Items Reviewed</div><div class="drw-row-v">${cat.length}</div></div>
    <button class="drw-nav" onclick="doCloseDrawer();window.loadModule&&loadModule('sourcing')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
      Open Sourcing Module
    </button>`);
}

/* ── SILENT REFRESH ── */
async function silentRefresh(){
  if(!sb)return;
  try{
    await Promise.all([loadSourcing(),loadCatalog(),loadReplen(),loadFBA(),loadRota(),loadListings()]);
    renderHero();
    renderQueue();
    renderSourcing();
    renderCatalogWidget();
    renderListings();
    renderReplen();
    renderOutput();
    renderCalendar();
    renderFBA();
    renderSuppliers();
  }catch(e){console.error('[DO silent refresh error]',e);}
}

/* ── REFRESH ── */
async function doRefresh(){
  const btn=document.getElementById('doRefreshBtn');
  btn.classList.add('spinning');
  await init();
  btn.classList.remove('spinning');
  toast('Refreshed','success');
}

/* ── KEYBOARD ── */
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&document.getElementById('doDrawer').classList.contains('open'))doCloseDrawer();
});

/* ── EXPOSE GLOBALS ── */
window.doCloseDrawer=doCloseDrawer;
window.doRefresh=doRefresh;
window.doOpenSourcingDrawer=doOpenSourcingDrawer;
window.doOpenCatalogDrawer=doOpenCatalogDrawer;
window.doOpenReplenDrawer=doOpenReplenDrawer;
window.doOpenListingsDrawer=doOpenListingsDrawer;
window.doOpenFBADrawer=doOpenFBADrawer;
window.doOpenCalendarDrawer=doOpenCalendarDrawer;
window.doOpenSuppliersDrawer=doOpenSuppliersDrawer;
window.doOpenOutputDrawer=doOpenOutputDrawer;

/* ── AUTO REFRESH every 90s ── */

})();
</script>
