<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#eef1f8;--surface:#fff;--surface2:#f5f7fc;--border:#e2e8f5;--border2:#ecf0f9;
  --text:#0c1526;--text2:#2a3a54;--text3:#64748b;--text4:#98a7bc;
  --accent:#1847d4;--accent-l:#2a5eed;--accent-bg:#eef2fd;--accent-bd:#c4d3f9;
  --green:#0c7a42;--green-bg:#ecfdf5;--green-bd:#86efac;
  --red:#b91c1c;--red-bg:#fef2f2;--red-bd:#fecaca;
  --amber:#92400e;--amber-bg:#fffbeb;--amber-bd:#fcd34d;
  --navy:#0c1526;--navy2:#141d2e;
  --r:10px;--r-sm:7px;--r-lg:14px;
  --font:'Plus Jakarta Sans',system-ui,sans-serif;--mono:'JetBrains Mono',monospace;
  --sh-sm:0 1px 3px rgba(12,21,38,.06),0 1px 2px rgba(12,21,38,.04);
  --sh:0 4px 16px rgba(12,21,38,.08),0 2px 6px rgba(12,21,38,.04);
  --sh-lg:0 20px 50px rgba(12,21,38,.14),0 6px 16px rgba(12,21,38,.07);
}
html,body{font-family:var(--font);font-size:14px;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased;height:100%;}
body{overflow:hidden}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:6px}
::-webkit-scrollbar-thumb:hover{background:var(--text4)}

/* ── LAYOUT ── */
.app{display:flex;flex-direction:column;height:100vh;overflow:hidden;background:radial-gradient(ellipse at 20% 0%,rgba(24,71,212,.04) 0%,transparent 60%),var(--bg);}
.topnav{display:flex;align-items:center;gap:10px;padding:8px 18px;background:rgba(255,255,255,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);flex-shrink:0;z-index:10;}
.tnav-title{font-size:13px;font-weight:800;color:var(--text);letter-spacing:-.2px}
.tnav-sep{width:1px;height:16px;background:var(--border);flex-shrink:0}
.tnav-actions{display:flex;align-items:center;gap:6px;margin-left:auto}
.nav-btn{display:flex;align-items:center;gap:5px;padding:6px 13px;border-radius:var(--r-sm);background:var(--surface2);border:1px solid var(--border);color:var(--text2);font-size:12px;font-weight:600;font-family:var(--font);cursor:pointer;transition:all .15s;white-space:nowrap;}
.nav-btn svg{width:13px;height:13px;flex-shrink:0}
.nav-btn:hover{background:var(--border);color:var(--text)}
.nav-btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
.nav-btn.primary:hover{background:var(--accent-l)}
.nav-btn:disabled{opacity:.5;cursor:default}

.body{display:flex;flex:1;min-height:0;overflow:hidden;}

/* ── LEFT PANEL ── */
.left-panel{width:300px;flex-shrink:0;display:flex;flex-direction:column;border-right:1px solid var(--border);background:var(--surface);overflow:hidden;}
.sup-search-wrap{padding:10px 12px;border-bottom:1px solid var(--border);flex-shrink:0;}
.sup-search{position:relative}
.sup-search svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--text4);width:13px;height:13px;pointer-events:none}
.sup-search input{width:100%;padding:7px 9px 7px 29px;border:1.5px solid var(--border);border-radius:var(--r-sm);font-size:12.5px;font-family:var(--font);background:var(--surface2);color:var(--text);outline:none;transition:all .15s;}
.sup-search input:focus{border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px rgba(24,71,212,.07)}
.sup-list{flex:1;overflow-y:auto;padding:8px}
.sup-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--r);cursor:pointer;transition:all .15s;border:1.5px solid transparent;margin-bottom:3px;}
.sup-item:hover{background:var(--surface2)}
.sup-item.active{background:var(--accent-bg);border-color:var(--accent-bd);}
.sup-avatar{width:34px;height:34px;border-radius:9px;background:var(--accent-bg);border:1px solid var(--accent-bd);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:var(--accent);flex-shrink:0;letter-spacing:-.3px;}
.sup-item-name{font-size:12.5px;font-weight:700;color:var(--text);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sup-item-count{font-size:10px;font-weight:700;color:var(--text4);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:1px 7px;flex-shrink:0;}
.sup-item.active .sup-item-count{background:var(--accent-bg);border-color:var(--accent-bd);color:var(--accent)}

/* ── MAIN PANEL ── */
.main-panel{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden;}

/* Supplier detail header */
.sup-detail{flex-shrink:0;background:var(--surface);border-bottom:1px solid var(--border);}
.sup-detail-hero{padding:14px 18px 0;background:linear-gradient(140deg,var(--navy2) 0%,#0d1631 100%);position:relative;overflow:hidden;}
.sup-detail-hero::before{content:'';position:absolute;top:-60px;right:-60px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.025);}
.sup-detail-hero::after{content:'';position:absolute;bottom:-30px;left:40px;width:120px;height:120px;border-radius:50%;background:rgba(24,71,212,.08);}
.sup-hero-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:10px;position:relative;z-index:1;}
.sup-hero-name{font-size:18px;font-weight:800;color:#fff;line-height:1.25;flex:1;min-width:0;padding-right:12px;}
.sup-hero-edit-btn{width:28px;height:28px;border:none;border-radius:7px;background:rgba(255,255,255,.1);cursor:pointer;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.6);transition:all .15s;flex-shrink:0;}
.sup-hero-edit-btn:hover{background:rgba(255,255,255,.2);color:#fff}
.sup-hero-edit-btn svg{width:13px;height:13px}
.sup-hero-meta{display:flex;align-items:center;gap:10px;margin-bottom:12px;position:relative;z-index:1;flex-wrap:wrap}
.sup-hero-meta-item{display:flex;align-items:center;gap:5px;font-size:11px;color:rgba(255,255,255,.55);}
.sup-hero-meta-item svg{width:11px;height:11px;flex-shrink:0;opacity:.7}
.sup-hero-meta-item a{color:rgba(255,255,255,.55);text-decoration:none;}
.sup-hero-meta-item a:hover{color:#fff}
.sup-kpis{display:flex;gap:8px;position:relative;z-index:1;padding-bottom:14px;flex-wrap:wrap}
.sup-kpi{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);border-radius:9px;padding:8px 12px;min-width:80px;}
.sup-kpi-lbl{font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:rgba(255,255,255,.38);margin-bottom:3px}
.sup-kpi-val{font-size:15px;font-weight:800;color:#fff;white-space:nowrap}
.sup-stats-bar{display:flex;gap:0;border-top:1px solid var(--border);background:var(--surface);}
.sup-stat{flex:1;padding:8px 14px;border-right:1px solid var(--border);display:flex;flex-direction:column;gap:1px;}
.sup-stat:last-child{border-right:none}
.sup-stat-lbl{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text4)}
.sup-stat-val{font-size:14px;font-weight:800;color:var(--text2)}
.sup-stat-val.green{color:var(--green)}
.sup-stat-val.amber{color:var(--amber)}

/* empty state */
.no-supplier{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;gap:12px;color:var(--text4);padding:40px}
.no-supplier svg{width:40px;height:40px;opacity:.35}
.no-supplier p{font-size:14px;font-weight:700;color:var(--text3)}
.no-supplier span{font-size:12px;color:var(--text4)}

/* ── CATALOG TOOLBAR ── */
.cat-toolbar{display:flex;align-items:center;gap:8px;padding:9px 18px;background:rgba(255,255,255,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);flex-shrink:0;flex-wrap:wrap;}
.cat-tb-left{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.cat-tb-right{display:flex;align-items:center;gap:6px;flex-shrink:0}
.search-box{position:relative;min-width:140px;max-width:240px;flex:1}
.search-box svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--text4);width:13px;height:13px;pointer-events:none}
.search-box input{width:100%;padding:7px 9px 7px 28px;border:1.5px solid var(--border);border-radius:var(--r-sm);font-size:12.5px;font-family:var(--font);background:var(--surface2);color:var(--text);outline:none;transition:all .15s;}
.search-box input:focus{border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px rgba(24,71,212,.07)}
.cat-count{font-size:11px;font-weight:600;color:var(--text4);white-space:nowrap}

/* filter pill */
.filter-pill{display:flex;align-items:center;gap:5px;padding:5px 10px;border-radius:20px;background:var(--surface2);border:1.5px solid var(--border);font-size:11.5px;font-weight:600;color:var(--text3);cursor:pointer;transition:all .15s;white-space:nowrap;}
.filter-pill:hover{border-color:var(--accent-bd);color:var(--accent)}
.filter-pill select{border:none;background:none;font-family:var(--font);font-size:11.5px;font-weight:600;color:var(--text3);cursor:pointer;outline:none;padding:0;-webkit-appearance:none;appearance:none;}
.filter-pill select:focus{outline:none}
.filter-pill.active{background:var(--accent-bg);border-color:var(--accent-bd);color:var(--accent)}
.filter-pill.active select{color:var(--accent)}

/* ── CATALOG TABLE ── */
.cat-wrap{flex:1;overflow:auto;min-height:0;}
.cat-table{width:100%;border-collapse:collapse;}
.cat-table th{position:sticky;top:0;background:var(--surface2);border-bottom:1.5px solid var(--border);padding:8px 14px;text-align:left;font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--text4);white-space:nowrap;z-index:2;}
.cat-table td{padding:9px 14px;border-bottom:1px solid var(--border2);font-size:12.5px;color:var(--text2);vertical-align:middle;}
.cat-table tr:hover td{background:var(--surface2)}
.cat-table tr:last-child td{border-bottom:none}
.td-name{max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;}
.td-ean{font-family:var(--mono);font-size:11px;color:var(--text4)}
.td-code{font-family:var(--mono);font-size:11px;color:var(--text3)}
.td-cost{font-weight:700;color:var(--text2)}
.td-case{color:var(--text3)}
.td-cat{font-size:11px}
.status-pill{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:700;}
.status-pill.approved{background:var(--green-bg);color:var(--green);border:1px solid var(--green-bd)}
.status-pill.pending{background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber-bd)}
.status-pill.other{background:var(--surface2);color:var(--text3);border:1px solid var(--border)}
.agent-chip{display:inline-flex;align-items:center;font-size:11px;font-weight:600;color:var(--text3)}
.del-btn{width:26px;height:26px;border:none;border-radius:6px;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text4);transition:all .15s;}
.del-btn:hover{background:var(--red-bg);color:var(--red)}
.del-btn svg{width:13px;height:13px}
.img-thumb{width:30px;height:30px;border-radius:6px;object-fit:cover;border:1px solid var(--border);background:var(--surface2);}
.img-placeholder{width:30px;height:30px;border-radius:6px;background:var(--surface2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--text4);}
.img-placeholder svg{width:13px;height:13px}

/* pager */
.cat-pager{display:flex;align-items:center;gap:8px;padding:8px 18px;border-top:1px solid var(--border);background:var(--surface);flex-shrink:0;}
.pager-info{font-size:12px;color:var(--text4);font-weight:600;flex:1}
.pager-btn{display:flex;align-items:center;gap:4px;padding:5px 11px;border-radius:var(--r-sm);background:var(--surface2);border:1px solid var(--border);color:var(--text3);font-size:12px;font-weight:600;font-family:var(--font);cursor:pointer;transition:all .15s;}
.pager-btn:hover{background:var(--border);color:var(--text)}
.pager-btn:disabled{opacity:.4;cursor:default}
.pager-btn svg{width:12px;height:12px}

/* empty table */
.table-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:50px 20px;gap:10px;text-align:center;}
.table-empty svg{width:36px;height:36px;color:var(--text4);opacity:.5}
.table-empty p{font-size:13px;font-weight:700;color:var(--text3)}
.table-empty span{font-size:12px;color:var(--text4)}

/* ── ALL CATALOG OVERLAY ── */
.overlay{position:fixed;inset:0;background:rgba(12,21,38,.4);z-index:1200;opacity:0;pointer-events:none;transition:opacity .25s;backdrop-filter:blur(3px);}
.overlay.open{opacity:1;pointer-events:all}
.overlay-panel{position:fixed;top:0;right:0;width:900px;max-width:100vw;height:100vh;background:var(--surface);box-shadow:-12px 0 50px rgba(12,21,38,.15);z-index:1300;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);}
.overlay.open .overlay-panel{transform:translateX(0)}
.overlay-head{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--border);flex-shrink:0;}
.overlay-title{font-size:14px;font-weight:800;color:var(--text);flex:1}
.overlay-close{width:28px;height:28px;border:none;border-radius:7px;background:var(--surface2);border:1px solid var(--border);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text3);transition:all .15s;}
.overlay-close:hover{background:var(--border);color:var(--text)}
.overlay-close svg{width:13px;height:13px}
.overlay-toolbar{display:flex;align-items:center;gap:8px;padding:9px 18px;border-bottom:1px solid var(--border);flex-shrink:0;flex-wrap:wrap;}
.overlay-count{font-size:11px;color:var(--text4);font-weight:600;margin-left:auto}
.overlay-body{flex:1;overflow:auto;min-height:0;}

/* ── EDIT DRAWER ── */
.drawer-overlay{position:fixed;inset:0;background:rgba(12,21,38,.35);z-index:1400;opacity:0;pointer-events:none;transition:opacity .25s;backdrop-filter:blur(2px);}
.drawer-overlay.open{opacity:1;pointer-events:all}
.edit-drawer{position:fixed;top:0;right:0;width:440px;max-width:100vw;height:100vh;background:var(--surface);box-shadow:-12px 0 50px rgba(12,21,38,.18);z-index:1500;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .28s cubic-bezier(.4,0,.2,1);}
.edit-drawer.open{transform:translateX(0)}
.edit-drawer-head{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;flex-shrink:0;}
.edit-drawer-title{font-size:14px;font-weight:800;color:var(--text);flex:1}
.edit-drawer-body{flex:1;overflow-y:auto;padding:18px}
.edit-drawer-foot{padding:12px 18px;border-top:1px solid var(--border);display:flex;gap:8px;align-items:center;justify-content:flex-end;background:var(--surface2);flex-shrink:0;}

/* form */
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--text4);margin-bottom:5px}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:8px 11px;border:1.5px solid var(--border);border-radius:var(--r-sm);font-size:13px;font-weight:600;font-family:var(--font);background:var(--surface2);color:var(--text2);outline:none;transition:all .15s;}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px rgba(24,71,212,.07)}
.form-group textarea{resize:vertical;min-height:70px}
.form-grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-section{margin-bottom:20px}
.form-section-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--text4);margin-bottom:12px;display:flex;align-items:center;gap:8px;}
.form-section-title::after{content:'';flex:1;height:1px;background:var(--border2)}

/* ── PROGRESS BAR ── */
.pbar{position:fixed;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--accent),#4f80f7);z-index:9999;transform:scaleX(0);transform-origin:left;transition:transform .3s ease;opacity:0;}
.pbar.active{opacity:1}

/* ── SPINNER ── */
.spinner{display:inline-block;border:2.5px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .65s linear infinite;}
.spin-sm{width:14px;height:14px}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── TOAST ── */
.toasts{position:fixed;top:16px;right:18px;z-index:9999;display:flex;flex-direction:column;gap:7px;pointer-events:none;}
.toast{display:flex;align-items:center;gap:9px;padding:11px 15px;background:var(--navy2);color:#fff;border-radius:var(--r);font-size:13px;font-weight:600;box-shadow:var(--sh-lg);animation:toastIn .22s ease;max-width:320px;pointer-events:auto;border-left:3px solid rgba(255,255,255,.15);}
.toast.success{background:#14532d;border-left-color:var(--green)}
.toast.error{background:#7f1d1d;border-left-color:var(--red)}
.toast.info{background:#1e3a8a;border-left-color:var(--accent)}
@keyframes toastIn{from{opacity:0;transform:translateY(-8px) scale(.95)}to{opacity:1;transform:translateY(0) scale(1)}}

/* del confirm inline */
.del-confirm-row{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--red-bg);border-top:1px solid var(--red-bd);flex-shrink:0;}
.del-confirm-row span{font-size:12px;color:var(--red);font-weight:600;flex:1}
.btn-yes{padding:5px 12px;border-radius:6px;background:var(--red);color:#fff;border:none;font-size:12px;font-weight:700;font-family:var(--font);cursor:pointer;}
.btn-yes:hover{background:#991b1b}
.btn-no{padding:5px 12px;border-radius:6px;background:var(--surface);color:var(--text3);border:1.5px solid var(--border);font-size:12px;font-weight:700;font-family:var(--font);cursor:pointer;}
.btn-no:hover{background:var(--border2)}

@media(max-width:900px){.left-panel{width:240px}.overlay-panel{width:100vw}}
@media(max-width:600px){.body{flex-direction:column}.left-panel{width:100%;height:200px;border-right:none;border-bottom:1px solid var(--border)}}
</style>

<div class="pbar" id="pbar"></div>
<div class="toasts" id="toasts"></div>

<!-- All Catalog Overlay -->
<div class="overlay" id="allCatalogOverlay">
  <div class="overlay-panel">
    <div class="overlay-head">
      <div class="overlay-title">All Catalog</div>
      <span id="allCatCount" class="overlay-count"></span>
      <button class="overlay-close" onclick="closeAllCatalog()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="overlay-toolbar">
      <div class="search-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="allCatSearch" placeholder="Search all catalog…" oninput="renderAllCatalog()">
      </div>
    </div>
    <div class="overlay-body">
      <table class="cat-table" id="allCatTable">
        <thead><tr>
          <th>Image</th><th>Product Name</th><th>EAN</th><th>Code</th>
          <th>Supplier</th><th>Cost</th><th>Case</th><th>Category</th><th>Status</th>
        </tr></thead>
        <tbody id="allCatBody"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- Edit Supplier Drawer -->
<div class="drawer-overlay" id="editDrawerOverlay" onclick="closeEditDrawer()"></div>
<div class="edit-drawer" id="editDrawer">
  <div class="edit-drawer-head">
    <div class="edit-drawer-title" id="editDrawerTitle">Edit Supplier</div>
    <button class="overlay-close" onclick="closeEditDrawer()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>
  <div class="edit-drawer-body" id="editDrawerBody"></div>
  <div class="edit-drawer-foot">
    <button class="nav-btn" onclick="closeEditDrawer()">Cancel</button>
    <button class="nav-btn primary" id="editSaveBtn" onclick="saveSupplier()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
      Save
    </button>
  </div>
</div>

<!-- Add Catalog Drawer -->
<div class="drawer-overlay" id="addCatOverlay" onclick="closeAddCatalog()"></div>
<div class="edit-drawer" id="addCatDrawer" style="width:500px">
  <div class="edit-drawer-head">
    <div class="edit-drawer-title">Add Catalog Item</div>
    <button class="overlay-close" onclick="closeAddCatalog()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>
  <div class="edit-drawer-body" id="addCatBody"></div>
  <div class="edit-drawer-foot">
    <button class="nav-btn" onclick="closeAddCatalog()">Cancel</button>
    <button class="nav-btn primary" id="addCatSaveBtn" onclick="saveCatalogItem()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
      Add Item
    </button>
  </div>
</div>

<div class="app">
  <nav class="topnav">
    <div class="tnav-title">Suppliers & Catalog</div>
    <div class="tnav-sep"></div>
    <div class="tnav-actions">
      <button class="nav-btn" onclick="openAllCatalog()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
        All Catalog
      </button>
      <button class="nav-btn primary" onclick="openAddSupplier()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Add Supplier
      </button>
    </div>
  </nav>

  <div class="body">
    <!-- LEFT: Supplier list -->
    <div class="left-panel">
      <div class="sup-search-wrap">
        <div class="sup-search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" id="supSearch" placeholder="Search suppliers…" oninput="renderSupplierList()">
        </div>
      </div>
      <div class="sup-list" id="supList">
        <div style="display:flex;align-items:center;justify-content:center;padding:30px;gap:8px;color:var(--text4)">
          <span class="spinner spin-sm"></span>
          <span style="font-size:12px">Loading…</span>
        </div>
      </div>
    </div>

    <!-- RIGHT: Main -->
    <div class="main-panel" id="mainPanel">
      <div class="no-supplier" id="noSupplier">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        <p>Select a supplier</p>
        <span>Choose a supplier from the left to view their catalog</span>
      </div>

      <!-- Supplier detail + catalog (hidden until supplier selected) -->
      <div id="supplierView" style="display:none;flex-direction:column;flex:1;min-height:0;overflow:hidden;">
        <div class="sup-detail">
          <div class="sup-detail-hero">
            <div class="sup-hero-top">
              <div class="sup-hero-name" id="heroName">—</div>
              <button class="sup-hero-edit-btn" onclick="openEditSupplier()" title="Edit supplier">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
              </button>
            </div>
            <div class="sup-hero-meta" id="heroMeta"></div>
            <div class="sup-kpis" id="heroKpis"></div>
          </div>
          <div class="sup-stats-bar" id="heroStats"></div>
        </div>

        <!-- Catalog toolbar -->
        <div class="cat-toolbar">
          <div class="cat-tb-left">
            <div class="search-box">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
              <input type="text" id="catSearch" placeholder="Search catalog…" oninput="applyFilters()">
            </div>
            <div class="filter-pill" id="fStatusPill">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:11px;height:11px"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
              <select id="fStatus" onchange="applyFilters();this.closest('.filter-pill').classList.toggle('active',!!this.value)">
                <option value="">All Status</option>
                <option value="Approved">Approved</option>
                <option value="Pending">Pending</option>
              </select>
            </div>
            <div class="filter-pill" id="fCatPill">
              <select id="fCat" onchange="applyFilters();this.closest('.filter-pill').classList.toggle('active',!!this.value)">
                <option value="">All Categories</option>
              </select>
            </div>
          </div>
          <div class="cat-tb-right">
            <span class="cat-count" id="catCount"></span>
            <button class="nav-btn primary" onclick="openAddCatalog()">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
              Add Item
            </button>
          </div>
        </div>

        <div class="cat-wrap">
          <table class="cat-table">
            <thead><tr>
              <th>Image</th>
              <th>Product Name</th>
              <th>EAN</th>
              <th>Code</th>
              <th>Cost</th>
              <th>Case</th>
              <th>Category</th>
              <th>Status</th>
              <th>Agent</th>
              <th></th>
            </tr></thead>
            <tbody id="catBody"></tbody>
          </table>
        </div>
        <div class="cat-pager" id="catPager" style="display:none">
          <span class="pager-info" id="pagerInfo"></span>
          <button class="pager-btn" id="btnPrev" onclick="prevPage()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
            Prev
          </button>
          <button class="pager-btn" id="btnNext" onclick="nextPage()">
            Next
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
'use strict';
const sb = window.sb;

/* ── STATE ── */
let suppliers = [], allCatalog = [], supCatalog = [], filteredCatalog = [];
let currentSup = null, currentPage = 1;
const PER_PAGE = 50;
let sourcingStats = {}; // supplier_id -> { approved, purchased }
let delConfirmId = null;
let editMode = null; // 'supplier' | 'add-supplier'

/* ── PROGRESS BAR ── */
let _pv=0,_pt=null;
function pStart(){const b=document.getElementById('pbar');clearInterval(_pt);_pv=0.1;b.style.transform='scaleX(0.1)';b.classList.add('active');_pt=setInterval(()=>{_pv=Math.min(_pv+(1-_pv)*0.07,0.92);b.style.transform=`scaleX(${_pv})`;},250);}
function pDone(){clearInterval(_pt);const b=document.getElementById('pbar');b.style.transform='scaleX(1)';setTimeout(()=>{b.classList.remove('active');b.style.transform='scaleX(0)';},380);}

/* ── HELPERS ── */
function esc(s){return String(s!=null?s:'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function initials(name){return (name||'?').split(/\s+/).map(w=>w[0]).join('').toUpperCase().slice(0,2);}
function fmtCost(v){const n=parseFloat(v);return isNaN(n)?'—':'£'+n.toFixed(2);}

/* ── INIT ── */
async function init(){
  pStart();
  try{
    const [supRes, catRes, srcRes] = await Promise.all([
      sb.from('suppliers').select('*').order('name'),
      sb.from('catalog').select('*').order('product_name'),
      sb.from('sourcing').select('supplier_name,approved,purchased')
    ]);
    if(supRes.error) throw supRes.error;
    if(catRes.error) throw catRes.error;
    suppliers = supRes.data || [];
    allCatalog = catRes.data || [];
    // Build sourcing stats per supplier name
    const raw = srcRes.data || [];
    const byName = {};
    raw.forEach(r=>{
      const n = (r.supplier_name||'').trim().toLowerCase();
      if(!n) return;
      if(!byName[n]) byName[n]={total:0,approved:0,purchased:0};
      byName[n].total++;
      if(r.approved) byName[n].approved++;
      if(r.purchased) byName[n].purchased++;
    });
    sourcingStats = byName;
    renderSupplierList();
  }catch(e){
    toast('Failed to load data: '+e.message,'error');
  }finally{pDone();}
}

/* ── SUPPLIER LIST ── */
function renderSupplierList(){
  const q=(document.getElementById('supSearch').value||'').toLowerCase().trim();
  const list = document.getElementById('supList');
  const filtered = suppliers.filter(s=>!q||(s.name||'').toLowerCase().includes(q));
  if(!filtered.length){
    list.innerHTML='<div style="padding:20px;text-align:center;font-size:12px;color:var(--text4)">No suppliers found</div>';
    return;
  }
  list.innerHTML = filtered.map(s=>{
    const count = allCatalog.filter(c=>c.supplier_id===s.supplier_id).length;
    const active = currentSup && currentSup.supplier_id === s.supplier_id;
    return `<div class="sup-item${active?' active':''}" onclick="selectSupplier('${esc(s.supplier_id)}')">
      <div class="sup-avatar">${esc(initials(s.name))}</div>
      <div class="sup-item-name" title="${esc(s.name)}">${esc(s.name)}</div>
      <div class="sup-item-count">${count}</div>
    </div>`;
  }).join('');
}

/* ── SELECT SUPPLIER ── */
async function selectSupplier(id){
  currentSup = suppliers.find(s=>s.supplier_id===id);
  if(!currentSup) return;
  currentPage = 1;
  delConfirmId = null;
  renderSupplierList();
  renderSupplierDetail();
  supCatalog = allCatalog.filter(c=>c.supplier_id===id);
  applyFilters(true);
  document.getElementById('noSupplier').style.display='none';
  const sv = document.getElementById('supplierView');
  sv.style.display='flex';
}

function renderSupplierDetail(){
  if(!currentSup) return;
  const s = currentSup;
  const name = s.name||'—';
  document.getElementById('heroName').textContent = name;

  // Meta row
  const metaItems = [];
  if(s.email) metaItems.push(`<div class="sup-hero-meta-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg><a href="mailto:${esc(s.email)}">${esc(s.email)}</a></div>`);
  if(s.phone) metaItems.push(`<div class="sup-hero-meta-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 13a19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 3.77 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l.91-.91a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 17.92z"/></svg>${esc(s.phone)}</div>`);
  if(s.website) metaItems.push(`<div class="sup-hero-meta-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg><a href="${esc(s.website)}" target="_blank">${esc(s.website)}</a></div>`);
  document.getElementById('heroMeta').innerHTML = metaItems.join('') || '<div class="sup-hero-meta-item">No contact info</div>';

  // KPIs
  const kpis = [
    {lbl:'MOQ', val: s.moq||'—'},
    {lbl:'Cash Back', val: s.cash_back ? s.cash_back+'%' : '—'},
    {lbl:'Account Limit', val: s.account_limit ? '£'+s.account_limit : '—'},
    {lbl:'Payment', val: s.payment_terms||'—'},
  ];
  document.getElementById('heroKpis').innerHTML = kpis.map(k=>`
    <div class="sup-kpi">
      <div class="sup-kpi-lbl">${esc(k.lbl)}</div>
      <div class="sup-kpi-val">${esc(String(k.val))}</div>
    </div>`).join('');

  // Stats from sourcing
  const sname = (s.name||'').trim().toLowerCase();
  const st = sourcingStats[sname] || {total:0,approved:0,purchased:0};
  const catCount = allCatalog.filter(c=>c.supplier_id===s.supplier_id).length;
  document.getElementById('heroStats').innerHTML = `
    <div class="sup-stat"><div class="sup-stat-lbl">Catalog Items</div><div class="sup-stat-val">${catCount}</div></div>
    <div class="sup-stat"><div class="sup-stat-lbl">Sourcing Opps</div><div class="sup-stat-val">${st.total}</div></div>
    <div class="sup-stat"><div class="sup-stat-lbl">Approved</div><div class="sup-stat-val green">${st.approved}</div></div>
    <div class="sup-stat"><div class="sup-stat-lbl">Purchased</div><div class="sup-stat-val amber">${st.purchased}</div></div>
  `;

  // Populate category filter
  const cats = [...new Set(supCatalog.map(c=>c.category||'').filter(Boolean))].sort();
  const catSel = document.getElementById('fCat');
  const prev = catSel.value;
  catSel.innerHTML = '<option value="">All Categories</option>' + cats.map(c=>`<option value="${esc(c)}"${c===prev?' selected':''}>${esc(c)}</option>`).join('');
}

/* ── CATALOG FILTER & RENDER ── */
function applyFilters(reset){
  if(reset) currentPage=1;
  const q=(document.getElementById('catSearch').value||'').toLowerCase().trim();
  const fSt=document.getElementById('fStatus').value;
  const fCat=document.getElementById('fCat').value;
  filteredCatalog = supCatalog.filter(c=>{
    if(q && !((c.product_name||'').toLowerCase().includes(q)||(c.ean||'').toLowerCase().includes(q)||(c.code||'').toLowerCase().includes(q))) return false;
    if(fSt && (c.status||'')!==fSt) return false;
    if(fCat && (c.category||'')!==fCat) return false;
    return true;
  });
  renderCatalogTable();
}

function renderCatalogTable(){
  const tbody = document.getElementById('catBody');
  const total = filteredCatalog.length;
  const pages = Math.ceil(total/PER_PAGE)||1;
  if(currentPage>pages) currentPage=pages;
  const start=(currentPage-1)*PER_PAGE;
  const slice=filteredCatalog.slice(start,start+PER_PAGE);

  document.getElementById('catCount').textContent = total ? `${total} item${total===1?'':'s'}` : '';

  const pager=document.getElementById('catPager');
  if(total>PER_PAGE){
    pager.style.display='flex';
    document.getElementById('pagerInfo').textContent=`Showing ${start+1}–${Math.min(start+PER_PAGE,total)} of ${total}`;
    document.getElementById('btnPrev').disabled=currentPage===1;
    document.getElementById('btnNext').disabled=currentPage>=pages;
  }else{pager.style.display='none';}

  if(!slice.length){
    tbody.innerHTML=`<tr><td colspan="10"><div class="table-empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><p>No items found</p><span>Try adjusting your search or filters</span></div></td></tr>`;
    return;
  }

  tbody.innerHTML = slice.map(c=>{
    const statusCls = (c.status||'').toLowerCase()==='approved'?'approved':(c.status||'').toLowerCase()==='pending'?'pending':'other';
    const imgHtml = c.product_image
      ? `<img class="img-thumb" src="${esc(c.product_image)}" alt="" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`
      + `<div class="img-placeholder" style="display:none"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg></div>`
      : `<div class="img-placeholder"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg></div>`;

    const isDelConf = delConfirmId === c.id;
    return `<tr data-id="${esc(c.id)}">
      <td>${imgHtml}</td>
      <td class="td-name" title="${esc(c.product_name||'')}">${esc(c.product_name||'—')}</td>
      <td class="td-ean">${esc(c.ean||'—')}</td>
      <td class="td-code">${esc(c.code||'—')}</td>
      <td class="td-cost">${fmtCost(c.cost)}</td>
      <td class="td-case">${esc(String(c.case_size||'—'))}</td>
      <td class="td-cat">${esc(c.category||'—')}</td>
      <td><span class="status-pill ${statusCls}">${esc(c.status||'—')}</span></td>
      <td class="agent-chip">${esc((c.agent||'—').split(' ')[0])}</td>
      <td style="white-space:nowrap">
        ${isDelConf
          ? `<span style="font-size:11px;color:var(--red);font-weight:600;margin-right:4px">Delete?</span>
             <button class="pager-btn" style="padding:3px 8px;font-size:11px;background:var(--red);color:#fff;border-color:var(--red)" onclick="confirmDelete('${esc(c.id)}')">Yes</button>
             <button class="pager-btn" style="padding:3px 8px;font-size:11px;margin-left:3px" onclick="cancelDelete()">No</button>`
          : `<button class="del-btn" onclick="startDelete('${esc(c.id)}')" title="Delete"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg></button>`
        }
      </td>
    </tr>`;
  }).join('');
}

function nextPage(){currentPage++;renderCatalogTable();}
function prevPage(){currentPage--;renderCatalogTable();}

/* ── DELETE CATALOG ── */
function startDelete(id){delConfirmId=id;renderCatalogTable();}
function cancelDelete(){delConfirmId=null;renderCatalogTable();}

async function confirmDelete(id){
  delConfirmId=null;
  const {error}=await sb.from('catalog').delete().eq('id',id);
  if(error){toast('Failed to delete: '+error.message,'error');return;}
  allCatalog=allCatalog.filter(c=>c.id!==id);
  supCatalog=supCatalog.filter(c=>c.id!==id);
  applyFilters();
  renderSupplierDetail();
  renderSupplierList();
  toast('Item deleted','success');
}

/* ── EDIT SUPPLIER ── */
function openEditSupplier(){
  if(!currentSup) return;
  editMode='supplier';
  document.getElementById('editDrawerTitle').textContent='Edit Supplier';
  buildSupplierForm(currentSup);
  document.getElementById('editDrawerOverlay').classList.add('open');
  document.getElementById('editDrawer').classList.add('open');
}

function openAddSupplier(){
  editMode='add-supplier';
  document.getElementById('editDrawerTitle').textContent='Add Supplier';
  buildSupplierForm(null);
  document.getElementById('editDrawerOverlay').classList.add('open');
  document.getElementById('editDrawer').classList.add('open');
}

function buildSupplierForm(s){
  const body=document.getElementById('editDrawerBody');
  const v=(f)=>s?esc(String(s[f]||'')):'';
  body.innerHTML=`
    <div class="form-section">
      <div class="form-section-title">Basic Info</div>
      <div class="form-group"><label>Supplier Name *</label><input type="text" id="ef_name" value="${v('name')}" placeholder="e.g. Wholesave Trading Supplies"></div>
      <div class="form-grid2">
        <div class="form-group"><label>Code</label><input type="text" id="ef_code" value="${v('code')}" placeholder="e.g. WST"></div>
        <div class="form-group"><label>Account No.</label><input type="text" id="ef_account_no" value="${v('account_no')}" placeholder="e.g. 12345"></div>
      </div>
    </div>
    <div class="form-section">
      <div class="form-section-title">Contact</div>
      <div class="form-group"><label>Email</label><input type="email" id="ef_email" value="${v('email')}" placeholder="contact@supplier.com"></div>
      <div class="form-grid2">
        <div class="form-group"><label>Phone</label><input type="text" id="ef_phone" value="${v('phone')}" placeholder="+44..."></div>
        <div class="form-group"><label>WhatsApp</label><input type="text" id="ef_whatsapp" value="${v('whatsapp')}" placeholder="+44..."></div>
      </div>
      <div class="form-group"><label>Website</label><input type="text" id="ef_website" value="${v('website')}" placeholder="https://"></div>
      <div class="form-group"><label>Contact Name</label><input type="text" id="ef_contact_name" value="${v('contact_name')}" placeholder="Account manager name"></div>
    </div>
    <div class="form-section">
      <div class="form-section-title">Terms</div>
      <div class="form-grid2">
        <div class="form-group"><label>MOQ</label><input type="text" id="ef_moq" value="${v('moq')}" placeholder="e.g. £100"></div>
        <div class="form-group"><label>Cash Back %</label><input type="number" id="ef_cash_back" value="${v('cash_back')}" placeholder="e.g. 2.5" step="0.1"></div>
        <div class="form-group"><label>Account Limit (£)</label><input type="number" id="ef_account_limit" value="${v('account_limit')}" placeholder="e.g. 5000" step="1"></div>
        <div class="form-group"><label>Payment Terms</label><input type="text" id="ef_payment_terms" value="${v('payment_terms')}" placeholder="e.g. 30 days, Card"></div>
      </div>
    </div>
    <div class="form-section">
      <div class="form-section-title">Notes</div>
      <div class="form-group"><label>Notes</label><textarea id="ef_notes" placeholder="Any extra info…">${s?esc(s.notes||''):''}</textarea></div>
    </div>`;
}

function closeEditDrawer(){
  document.getElementById('editDrawerOverlay').classList.remove('open');
  document.getElementById('editDrawer').classList.remove('open');
  editMode=null;
}

async function saveSupplier(){
  const nameEl=document.getElementById('ef_name');
  const name=nameEl.value.trim();
  if(!name){nameEl.focus();toast('Supplier name is required','error');return;}
  const btn=document.getElementById('editSaveBtn');
  btn.disabled=true;
  const data={
    name,
    code: document.getElementById('ef_code').value.trim()||null,
    account_no: document.getElementById('ef_account_no').value.trim()||null,
    email: document.getElementById('ef_email').value.trim()||null,
    phone: document.getElementById('ef_phone').value.trim()||null,
    whatsapp: document.getElementById('ef_whatsapp').value.trim()||null,
    website: document.getElementById('ef_website').value.trim()||null,
    contact_name: document.getElementById('ef_contact_name').value.trim()||null,
    moq: document.getElementById('ef_moq').value.trim()||null,
    cash_back: parseFloat(document.getElementById('ef_cash_back').value)||null,
    account_limit: parseFloat(document.getElementById('ef_account_limit').value)||null,
    payment_terms: document.getElementById('ef_payment_terms').value.trim()||null,
    notes: document.getElementById('ef_notes').value.trim()||null,
  };
  try{
    if(editMode==='add-supplier'){
      // Generate new supplier_id
      const maxId=suppliers.reduce((mx,s)=>{const n=parseInt((s.supplier_id||'').replace('SUP-',''));return isNaN(n)?mx:Math.max(mx,n);},0);
      data.supplier_id='SUP-'+String(maxId+1).padStart(4,'0');
      const {data:newSup,error}=await sb.from('suppliers').insert(data).select().single();
      if(error) throw error;
      suppliers.push(newSup);
      suppliers.sort((a,b)=>(a.name||'').localeCompare(b.name||''));
    }else{
      const {error}=await sb.from('suppliers').update(data).eq('supplier_id',currentSup.supplier_id);
      if(error) throw error;
      Object.assign(currentSup,data);
      const idx=suppliers.findIndex(s=>s.supplier_id===currentSup.supplier_id);
      if(idx>-1) suppliers[idx]=currentSup;
    }
    closeEditDrawer();
    renderSupplierList();
    if(currentSup) renderSupplierDetail();
    toast('Supplier saved','success');
  }catch(e){
    toast('Failed to save: '+e.message,'error');
  }finally{btn.disabled=false;}
}

async function saveCatalogItem(){
  const nameEl=document.getElementById('ac_name');
  const name=nameEl.value.trim();
  if(!name){nameEl.focus();toast('Product name required','error');return;}
  const btn=document.getElementById('addCatSaveBtn');
  btn.disabled=true;
  // Generate new catalog ID
  const maxNum = allCatalog.reduce((mx,c)=>{
    const n=parseInt((c.id||'').replace(/[^0-9]/g,''));
    return isNaN(n)?mx:Math.max(mx,n);
  },0);
  const newId='CAT-'+String(maxNum+1).padStart(4,'0');
  const today=new Date();
  const dateStr=`${String(today.getDate()).padStart(2,'0')}/${String(today.getMonth()+1).padStart(2,'0')}/${today.getFullYear()}`;
  const data={
    id: newId,
    product_name: name,
    ean: document.getElementById('ac_ean').value.trim()||null,
    code: document.getElementById('ac_code').value.trim()||null,
    cost: parseFloat(document.getElementById('ac_cost').value)||null,
    case_size: document.getElementById('ac_case').value.trim()||null,
    barcode: document.getElementById('ac_barcode').value.trim()||null,
    category: document.getElementById('ac_category').value.trim()||null,
    status: document.getElementById('ac_status').value,
    agent: document.getElementById('ac_agent').value.trim()||'System',
    product_image: document.getElementById('ac_image').value.trim()||null,
    email_subject: document.getElementById('ac_subject').value.trim()||null,
    supplier_id: currentSup.supplier_id,
    supplier_name: currentSup.name,
    supplier_email: currentSup.email||null,
    date: dateStr,
  };
  try{
    const {data:newItem,error}=await sb.from('catalog').insert(data).select().single();
    if(error) throw error;
    allCatalog.push(newItem);
    supCatalog.push(newItem);
    applyFilters();
    renderSupplierDetail();
    renderSupplierList();
    closeAddCatalog();
    toast('Item added','success');
  }catch(e){
    toast('Failed to add: '+e.message,'error');
  }finally{btn.disabled=false;}
}

/* ── ALL CATALOG OVERLAY ── */
async function openAllCatalog(){
  document.getElementById('allCatalogOverlay').classList.add('open');
  renderAllCatalog();
}

function closeAllCatalog(){
  document.getElementById('allCatalogOverlay').classList.remove('open');
}

function renderAllCatalog(){
  const q=(document.getElementById('allCatSearch').value||'').toLowerCase().trim();
  const filtered=allCatalog.filter(c=>{
    if(!q) return true;
    return (c.product_name||'').toLowerCase().includes(q)||(c.ean||'').toLowerCase().includes(q)||(c.supplier_name||'').toLowerCase().includes(q)||(c.code||'').toLowerCase().includes(q);
  });
  document.getElementById('allCatCount').textContent=`${filtered.length} items`;
  const tbody=document.getElementById('allCatBody');
  if(!filtered.length){
    tbody.innerHTML=`<tr><td colspan="9"><div class="table-empty"><p>No items found</p></div></td></tr>`;
    return;
  }
  tbody.innerHTML=filtered.slice(0,500).map(c=>{
    const statusCls=(c.status||'').toLowerCase()==='approved'?'approved':(c.status||'').toLowerCase()==='pending'?'pending':'other';
    const imgHtml=c.product_image
      ?`<img class="img-thumb" src="${esc(c.product_image)}" alt="" onerror="this.style.display='none'">`
      :`<div class="img-placeholder"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg></div>`;
    return `<tr>
      <td>${imgHtml}</td>
      <td class="td-name" title="${esc(c.product_name||'')}">${esc(c.product_name||'—')}</td>
      <td class="td-ean">${esc(c.ean||'—')}</td>
      <td class="td-code">${esc(c.code||'—')}</td>
      <td style="font-size:12px;color:var(--text3);max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(c.supplier_name||'—')}</td>
      <td class="td-cost">${fmtCost(c.cost)}</td>
      <td class="td-case">${esc(String(c.case_size||'—'))}</td>
      <td>${esc(c.category||'—')}</td>
      <td><span class="status-pill ${statusCls}">${esc(c.status||'—')}</span></td>
    </tr>`;
  }).join('');
  if(filtered.length>500){
    tbody.innerHTML+=`<tr><td colspan="9" style="text-align:center;padding:12px;font-size:12px;color:var(--text4)">Showing first 500 of ${filtered.length} results. Narrow your search.</td></tr>`;
  }
}

/* ── TOAST ── */
function toast(msg,type){
  const c=document.getElementById('toasts');
  const t=document.createElement('div');t.className='toast '+(type||'');
  const icons={success:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>',error:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>',info:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>'};
  t.innerHTML=(icons[type]||'')+esc(msg);c.appendChild(t);
  setTimeout(()=>{if(t.parentNode)t.remove();},3200);
}
