<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Page not found | Pharm & Dom</title>
  <link rel="icon" type="image/png" href="/assets/logo_pharm_and_domestic.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --ink: #060912; --text: #f0f4ff; --text-dim: rgba(240,244,255,0.55);
      --text-muted: rgba(240,244,255,0.32); --blue: #3b6ef8;
      --border: rgba(255,255,255,0.08); --surface: rgba(255,255,255,0.04);
    }
    html, body { height: 100%; }
    body {
      font-family: 'Inter', system-ui, sans-serif; background: var(--ink); color: var(--text);
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 24px 16px; position: relative; overflow: hidden;
    }
    body::before {
      content: ''; position: absolute; inset: 0; pointer-events: none;
      background:
        radial-gradient(ellipse 70% 55% at 20% 20%, rgba(59,110,248,0.18) 0%, transparent 70%),
        radial-gradient(ellipse 60% 70% at 85% 85%, rgba(99,60,240,0.12) 0%, transparent 70%),
        linear-gradient(160deg, #0b0f1e 0%, #060912 100%);
    }
    .mesh {
      position: absolute; inset: 0; opacity: 0.35; pointer-events: none;
      background-image:
        linear-gradient(rgba(59,110,248,0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(59,110,248,0.06) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: radial-gradient(ellipse 70% 70% at 50% 50%, black 30%, transparent 100%);
    }
    .card {
      position: relative; z-index: 1; width: 100%; max-width: 420px; text-align: center;
      opacity: 0; transform: translateY(16px); animation: riseIn .7s cubic-bezier(0.16,1,0.3,1) .1s forwards;
    }
    @keyframes riseIn { to { opacity: 1; transform: translateY(0); } }
    .brand { display: inline-flex; align-items: center; gap: 10px; margin-bottom: 36px; }
    .brand img { width: 36px; height: 36px; object-fit: contain; }
    .brand span { font-size: 15px; font-weight: 600; letter-spacing: -0.2px; }
    .code {
      font-size: 88px; font-weight: 700; letter-spacing: -4px; line-height: 1;
      background: linear-gradient(135deg, #fff 0%, rgba(59,110,248,0.9) 100%);
      -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
      margin-bottom: 14px;
    }
    h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.4px; margin-bottom: 10px; }
    p { font-size: 14px; color: var(--text-dim); line-height: 1.65; }
    .path {
      display: inline-block; max-width: 100%; margin: 14px 0 26px; padding: 6px 12px; border-radius: 8px;
      background: var(--surface); border: 1px solid var(--border); color: var(--text-muted);
      font-family: 'SF Mono','Fira Code',ui-monospace,monospace; font-size: 12px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%;
      padding: 15px; border-radius: 12px; border: none; background: var(--blue); color: #fff;
      font-size: 15px; font-weight: 600; font-family: inherit; text-decoration: none; cursor: pointer;
      box-shadow: 0 4px 20px rgba(59,110,248,0.28); transition: all .3s cubic-bezier(0.4,0,0.2,1);
    }
    .btn:hover { background: #4c7df9; transform: translateY(-2px); box-shadow: 0 8px 30px rgba(59,110,248,0.42); }
    .btn svg { width: 16px; height: 16px; }
  </style>
</head>
<body>
  <div class="mesh"></div>
  <main class="card">
    <div class="brand">
      <img src="/assets/logo_pharm_and_domestic.png" alt="Pharm & Dom">
      <span>Pharm &amp; Dom</span>
    </div>
    <div class="code">404</div>
    <h1>This page doesn't exist</h1>
    <p>The link may be broken or the page may have moved.</p>
    <div class="path" id="badPath"></div>
    <a class="btn" href="/login" id="goBtn">
      Back to login
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
    </a>
  </main>
  <script>
    // GitHub Pages serves this page for any address on app.pharmdomestic.com that doesn't exist.
    document.getElementById('badPath').textContent = window.location.host + window.location.pathname;
  </script>
</body>
</html>
