<div id="digitalOpsEmbed">Loading…</div>
<script>
(async function(){
  const container = document.getElementById('digitalOpsEmbed');
  try {
    const res = await fetch('../pages/overview_digitalops.html', { cache: 'no-store' });
    if (!res.ok) throw new Error(`Failed to load: ${res.status}`);
    const html = await res.text();
    container.innerHTML = html;

    // Re-execute any <script> tags from the injected page
    container.querySelectorAll('script').forEach(old => {
      const s = document.createElement('script');
      s.textContent = old.textContent;
      document.body.appendChild(s);
      document.body.removeChild(s);
    });
  } catch (err) {
    console.error('[operations.html → overview_digitalops embed]', err);
    container.innerHTML = `<div style="padding:20px;color:#b91c1c;">Failed to load Digital Ops Overview.</div>`;
  }
})();
</script>
